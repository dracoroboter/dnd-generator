#   La Profezia Autoavverante | La Frase Bomba |
#   Il Prezzo della Vittoria | L'Informazione che Nessuno Vuole |
#   Il Conto alla Rovescia Pubblico | La Paranoia Indotta
#
# PERSONAGGI (29):
#   L'Eletto | Il Signore Oscuro | Il Mentore | L'Eroe Riluttante |
#   Il Trickster | Il Companion Fedele | Il Mutaforma | La Talpa* |
#   Il Buon Diavolo | Il Dio Indifferente | Il Luogotenente |
#   L'Anti-Villain | Il Benefattore Misterioso | Il Redento |
#   Il Corruttore | Il Guardiano della Soglia | Il Collezionista |
#   L'Informatore | Il Veterano Spezzato* | L'Innocente |
#   La Carta Selvaggia | L'Ultimo della Sua Specie |
#   La Pedina del Destino* | Il Ladro Gentiluomo |
#   Il Servitore Enigmatico | Il Sopravvissuto |
#   Il Profeta Ignorato | Il Guardiano del Sapere | Il Mercante Ambiguo
#
# RELAZIONI (16):
#   L'Alleanza Oscillante | La Nemesi | Il Nemico Onorevole |
#   Lo Specchio | L'Alleato Scomodo | L'Amico Velenoso |
#   Il Debito di Vita | La Rivalità Amichevole* | Il Debito d'Onore |
#   Il Protetto Riluttante | Il Piedistallo Spezzato | Il Rivale Caduto |
