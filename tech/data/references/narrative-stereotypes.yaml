# Stereotipi Narrativi — Database per Adventure Design
# Catalogo strutturato di stereotipi ricorrenti nella narrativa, usabili come
# mattoni per costruire avventure D&D.
#
# Struttura campi:
#   tipo: personaggio | situazione | plot | relazione | tecnica
#   nome: etichetta breve italiana
#   nome_en: nome inglese standard (TV Tropes / letteratura critica)
#   descrizione: cos'è in 2-3 frasi
#   esempi: lista di opere note (film, libri, miti, serie TV, videogiochi)
#   uso_dnd: come applicarlo concretamente in un'avventura
#   rischio: cosa può andare storto se usato male (opzionale)
#   sottocaso_di: questo stereotipo è una variante specifica di un altro (opzionale)
#   usato_in: in quali plot/situazioni questo stereotipo ricorre tipicamente (opzionale)
#   vedi_anche: riferimenti ad altri stereotipi correlati (opzionale)
#
# Gerarchia:
#   - I PLOT sono strutture narrative complete (arco inizio-fine)
#   - Le SITUAZIONI sono eventi/dispositivi che si inseriscono in un plot
#   - I PERSONAGGI sono archetipi che popolano plot e situazioni
#   - Le RELAZIONI sono pattern dinamici tra personaggi nel tempo
#   - Le TECNICHE sono principi di costruzione narrativa / prerequisiti strutturali
#     (non "cosa succede" ma "come il DM prepara il terreno affinché qualcosa funzioni")
#   - sottocaso_di esprime che X è una variante specifica di Y
#   - usato_in esprime che X ricorre tipicamente dentro Y
#
# Fonti: Booker, Vogler, Propp, TV Tropes, S. John Ross, Hipsters & Dragons
# File companion: tech/rules/narrative-stereotypes.md (versione formale con cross-reference)

# ============================================================
# INDICE (169 voci)
# ============================================================
#
# PLOT (13):
#   Sconfiggere il Mostro | Da Povero a Ricco | La Cerca |
#   Viaggio e Ritorno | Commedia degli Errori | Tragedia | Rinascita |
#   La Vendetta | La Rivalità | La Tentazione (La Discesa) |
#   La Ribellione | Il Viaggio dell'Esilio | L'Indagine sulla Cospirazione
#
# SITUAZIONI (74):
#   Il Colpo di Scena | L'Agnizione* | Il Falso Antagonista* |
#   Il Tradimento dell'Alleato* | Il MacGuffin | La Profezia | L'Assedio |
#   La Fuga dalla Prigione | L'Infiltrazione / Il Colpo | Il Mistero |
#   La Scorta | Il Male Sigillato | La Corsa Contro il Tempo |
#   La Finta Minaccia | Spalle al Muro | Il Falso Finale* |
#   L'Alleanza col Nemico | La Vittoria di Pirro | I Rinforzi |
#   Il Piano Perfetto del Villain | Il Patto col Diavolo |
#   La Soglia di Godzilla | Lo Stallo | Il Branco di Disadattati |
#   Il Luogo Impossibile | Il Pesce fuor d'Acqua |
#   La Crisi di Successione | La Masquerade | Il Compito Impossibile |
#   L'Arena* | Il Mondo Capovolto | La Zona Proibita | La Pestilenza |
#   Il Loop Temporale | L'Identità Scambiata* | Il Salvataggio Impossibile* |
#   La Maledizione | La Festa Interrotta* | L'Apocalisse in Corso* |
#   Il Tesoro Maledetto* | La Separazione del Gruppo |
#   Il Dilemma del Prigioniero | La Casa Distrutta | Il Ritorno Sbagliato |
#   La Corte Decadente | Il Registro dell'Apocalisse | La Prova Segreta |
#   Il Cavallo di Troia | Il Nemico Interiore |
#   La Minaccia Esterna Incomprensibile | L'Arma Perduta* |
#   Il Rito di Passaggio | Il Segreto Inconfessabile |
#   La Pedina Inconsapevole | Il Sacrificio Volontario |
#   La Lealtà Divisa | La Morale Grigia | La Truffa* |
#   La Guerra | La Colonia Perduta |
#   Il Mostro è una Persona | La Grazia o il Colpo di Grazia |
#   Il Potere ha un Prezzo | Il Labirinto | Il Lieto Fine Guadagnato |
