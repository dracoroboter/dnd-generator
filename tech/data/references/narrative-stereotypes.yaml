#   La Pseudo-Scelta | L'Incontro Filler | La Promozione |
#   Il Piano Non Detto | Il Figurante di Čechov* | Plot Concatenati |
#   L'Assegnazione del Ruolo | Il Narratore Inaffidabile |
#   L'Orologio del Villain* | L'Operazione Sotto Falsa Bandiera |
#   L'Ora più Buia | Il Barlume di Speranza* | La Pausa |
#   Il Deus Ex Machina (anti-pattern) | Il Pacing |
#   Il Dilemma del Tram (Conseguenze Visibili) |
