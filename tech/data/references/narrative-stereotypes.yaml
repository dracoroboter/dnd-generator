# Stereotipi Narrativi — Database per Adventure Design
# Catalogo strutturato di stereotipi ricorrenti nella narrativa, usabili come
# mattoni per costruire avventure D&D.
#
# Struttura campi:
#   tipo: personaggio | situazione | plot | relazione | tecnica
#   nome: etichetta breve italiana
#   nome_en: nome inglese standard (TV Tropes / letteratura critica)
#   nomi_alt: 3-5 sinonimi italiani/inglesi per ricerca semantica e cross-reference
#   descrizione: cos'è in 2-3 frasi
#   esempi: lista di opere note (film, libri, miti, serie TV, videogiochi)
#   uso_dnd: come applicarlo concretamente in un'avventura
#   rischio: cosa può andare storto se usato male (opzionale)
#   sottocaso_di: questo stereotipo è una variante specifica di un altro (opzionale)
#   puo_aver_bisogno_di: stereotipi che devono essere stati applicati PRIMA affinché questo funzioni (opzionale)
#     Per Il Legame, specificare la variante tra parentesi:
#       Il Legame (affezione) = verso NPC/companion
#       Il Legame (odio) = verso villain (alias: La Costruzione dell'Odio)
#       Il Legame (luogo) = verso un posto (villaggio, base, gilda)
#       Il Legame (ideale) = verso una causa/promessa/valore
#       Il Legame (oggetto) = verso un artefatto/possesso significativo
#   usato_in: in quali plot/situazioni questo stereotipo ricorre tipicamente (opzionale)
#   vedi_anche: riferimenti ad altri stereotipi correlati (opzionale)
#
# Gerarchia:
#   - I PLOT sono strutture narrative complete (arco inizio-fine)
#   - Le SITUAZIONI sono eventi/dispositivi che si inseriscono in un plot
#   - I PERSONAGGI sono archetipi che popolano plot e situazioni
#   - Le RELAZIONI sono pattern dinamici tra personaggi nel tempo
#   - Le TECNICHE sono principi di costruzione narrativa / prerequisiti strutturali
#     (non "cosa succede" ma "come il DM prepara il terreno affinché qualcosa funzioni")
#   - sottocaso_di esprime che X è una variante specifica di Y
#   - usato_in esprime che X ricorre tipicamente dentro Y
#   - puo_aver_bisogno_di esprime che X funziona meglio se Y è stato applicato prima
#     (relazione causale: senza Y il payoff di X è debole o nullo)
#
# Fonti: Booker, Vogler, Propp, TV Tropes, S. John Ross, Hipsters & Dragons
# File companion: tech/rules/narrative-stereotypes.md (versione formale con cross-reference)

# INDICE: vedi narrative-stereotypes-index.md (230 voci)

stereotipi:

  - tipo: plot
    nome: Sconfiggere il Mostro
    nome_en: Overcoming the Monster (Booker)
    nomi_alt: [Kill the Dragon, Uccidere il Drago, The Big Bad, Ammazzare il Boss]
    descrizione: >
      L'eroe scopre un grande male, si prepara e parte per distruggerlo.
      Fasi: anticipazione → sogno → frustrazione → incubo → vittoria.
    esempi:
      - "Beowulf — epica anglosassone (Grendel, la madre, il drago)"
      - "Lo Hobbit — Tolkien (Smaug)"
      - "Dragon Age: Origins — videogioco (l'Arcidemone)"
      - "Alien — film (il mostro sulla nave)"
      - "Jaws — film (lo squalo)"
    uso_dnd: >
      La struttura più comune. I PG sentono della minaccia → si preparano →
      affrontano i luogotenenti → scoprono che è peggio del previsto →
      scontro finale. Funziona per one-shot (1 mostro) o campagne (il mostro
      è il BBEG con esercito).
    usato_in: []
    vedi_anche: [Il Signore Oscuro, L'Eletto, Il Mentore]

  - tipo: plot
    nome: Da Povero a Ricco
    nome_en: Rags to Riches (Booker)
    nomi_alt: [From Zero to Hero, Da Zero a Eroe, L'Ascesa, Cinderella Story]
    descrizione: >
      L'eroe inizia in miseria, attraversa prove, e raggiunge completezza
      (ricchezza, status, amore, potere). Una crisi centrale gli strappa
      il primo successo prima della prova finale.
    esempi:
      - "Aladino — Mille e Una Notte / Disney"
      - "Harry Potter — saga completa (orfano → eroe)"
      - "Rocky — film (pugile squattrinato → campione)"
      - "Cenerentola — fiaba"
      - "Oliver Twist — Dickens"
    uso_dnd: >
      L'arco naturale dei PG dal livello 1 al 20. Funziona come meta-trama
      della campagna: avventurieri al verde che costruiscono reputazione e
      ricchezza. La crisi è il momento in cui perdono tutto (tradimento,
      furto, esilio) e devono ricominciare più forti.
    usato_in: []
    vedi_anche: [L'Eroe Riluttante]

  - tipo: plot
    nome: La Cerca
    nome_en: The Quest (Booker)
    nomi_alt: [La Missione, Il Viaggio dell'Eroe, Fetch Quest, La Ricerca]
    descrizione: >
      L'eroe parte per trovare un oggetto/luogo vitale, spesso con compagni.
      Ostacoli episodici lungo il cammino. L'obiettivo finale è in vista
      ma sempre più prove lo separano dai PG.
    esempi:
      - "Il Signore degli Anelli — Tolkien (distruggere l'Anello)"
      - "Alla Ricerca di Nemo — Pixar"
      - "Jason e il Vello d'Oro — mitologia greca"
      - "La Ricerca del Graal — ciclo arturiano"
      - "The Odyssey — Omero (tornare a casa)"
    uso_dnd: >
      La struttura a moduli per eccellenza. Ogni modulo è una tappa del
      viaggio con il suo ostacolo. Il MacGuffin è alla fine. Funziona
      benissimo per saghe con 4+ moduli.
    usato_in: []
    vedi_anche: [Il MacGuffin, Il Companion Fedele, La Scorta]

  - tipo: plot
    nome: Viaggio e Ritorno
    nome_en: Voyage and Return (Booker)
    nomi_alt: [Il Portale, Fish out of Water, Isekai, Stranger in a Strange Land]
    descrizione: >
      I protagonisti finiscono in un mondo strano, devono sopravvivere e
      trovare la via del ritorno. Il mondo alieno ha regole proprie.
    esempi:
      - "Alice nel Paese delle Meraviglie — Carroll"
      - "Il Mago di Oz — Baum"
      - "Narnia — C.S. Lewis"
      - "Spirited Away — Miyazaki"
      - "Jumanji — film"
    uso_dnd: >
      I PG vengono trasportati in un altro piano (Feywild, Shadowfell,
      piano elementale). Le regole del mondo materiale non valgono.
      Devono trovare il portale di ritorno prima che il piano li cambi.
    usato_in: []
    vedi_anche: []

  - tipo: plot
    nome: Commedia degli Errori
    nome_en: Comedy (Booker)
    nomi_alt: [Commedia degli Equivoci, Farce, Farsa, Comedy of Errors]
    descrizione: >
      Malintesi, identità scambiate, situazioni che si complicano fino
      all'assurdo. Alla fine tutti i nodi si sciolgono. Il tono è leggero
      ma le conseguenze possono essere serie.
    esempi:
      - "Shakespeare — commedie (Molto Rumore per Nulla, La Dodicesima Notte)"
      - "The Big Lebowski — film (malinteso iniziale)"
      - "Asterix e Obelix — fumetto (situazioni assurde)"
      - "La Pantera Rosa — film"
    uso_dnd: >
      Sessione leggera tra archi narrativi pesanti. I PG vengono scambiati
      per qualcun altro, o devono gestire una serie di disastri a catena
      causati da un malinteso iniziale. Incontri sociali > combattimento.
    usato_in: []
    vedi_anche: []

  - tipo: plot
    nome: Tragedia
    nome_en: Tragedy (Booker)
    nomi_alt: [La Caduta, The Fall, Hubris, La Spirale Discendente, Downfall]
    descrizione: >
      Il protagonista ha un difetto fatale (hubris) che lo porta alla rovina
      nonostante il suo potere. La caduta è inevitabile e autoinflitta.
    esempi:
      - "Macbeth — Shakespeare"
      - "Death Note — anime (Light Yagami, la hubris del potere)"
      - "Breaking Bad — serie TV (Walter White)"
      - "Anakin Skywalker — Star Wars prequel (la paura lo porta al lato oscuro)"
      - "Arthas — Warcraft (paladino che diventa Lich King)"
    uso_dnd: >
      Arco di un NPC antagonista che i PG osservano cadere, o cercano di
      salvare senza riuscirci. Può essere applicato a un PG solo con
      consenso esplicito del giocatore. Funziona come backstory del villain.
    usato_in: []
    vedi_anche: [Il Signore Oscuro, Rinascita]

  - tipo: plot
    nome: Rinascita
    nome_en: Rebirth (Booker)
    nomi_alt: [Redenzione, Redemption Arc, La Resurrezione, Il Riscatto]
    descrizione: >
      Come la Tragedia, ma il protagonista si riscatta all'ultimo momento
      grazie a una figura redentrice (amore, bambino, amico). Caduta →
      morte simbolica → resurrezione.
    esempi:
      - "Canto di Natale — Dickens (Scrooge)"
      - "Star Wars saga completa — (Vader si redime salvando Luke)"
      - "La Bella e la Bestia — fiaba (l'amore spezza la maledizione)"
      - "Zuko — Avatar: The Last Airbender (arco completo di redenzione)"
    uso_dnd: >
      NPC caduto che i PG possono redimere o condannare. La scelta è dei PG.
      Funziona per villain secondari con motivazioni comprensibili. Se i PG
      scelgono di salvarlo, diventa alleato. Se no, muore tragicamente.
    usato_in: []
    vedi_anche: [Tragedia]

  - tipo: situazione
    nome: Il Colpo di Scena (La Rivelazione)
    nome_en: The Reveal / Plot Twist
    nomi_alt: [Il Ribaltone, The Twist, La Svolta, Twist Ending, Il Rovesciamento]
    descrizione: >
      Un'informazione nascosta viene rivelata e ribalta la comprensione della
      storia. Sottotipi: un personaggio si rivela qualcosa di completamente
      diverso (identità segreta), un personaggio amato muore improvvisamente,
      il vero nemico era un altro, il mondo non è quello che sembra. Funziona
      perché il pubblico/giocatori avevano costruito aspettative che vengono infrante.
    esempi:
      - "Darth Vader è il padre di Luke — Star Wars (rivelazione identità)"
      - "Ned Stark muore nel primo libro — Game of Thrones (morte shock)"
      - "Tyler Durden non esiste — Fight Club (il mondo non è quello che sembra)"
      - "Bruce Willis è morto dall'inizio — The Sixth Sense (rivelazione retroattiva)"
      - "Keyser Söze è il narratore — The Usual Suspects"
      - "Soylent Green is people — film 1973 (la verità sul mondo)"
      - "La morte di Gandalf — Il Signore degli Anelli (morte shock + ritorno)"
      - "Red Wedding — Game of Thrones (morte multipla shock)"
    uso_dnd: >
      Usare MAX 1-2 per avventura. Sottotipi utilizzabili: (1) NPC amato muore —
      il party perde una risorsa e guadagna motivazione emotiva; (2) Identità
      segreta — l'NPC era un drago/demone/parente del villain; (3) Il mondo non
      è quello che sembra — la missione era una trappola, il quest giver mentiva.
      Seminare indizi sottili nei moduli precedenti perché il twist sia
      "sorprendente ma inevitabile" a posteriori.
    rischio: >
      Se abusato perde potenza. Max 1 grande twist per arco narrativo. Se non
      seminato con indizi, sembra arbitrario e i giocatori si sentono ingannati,
      non sorpresi. La differenza tra un buon twist e un cattivo twist: a
      posteriori gli indizi erano lì.
    usato_in: []
    puo_aver_bisogno_di: [Il Legame]
    vedi_anche: [L'Agnizione, Il Falso Antagonista, Il Tradimento dell'Alleato, La Talpa]

  - tipo: situazione
    nome: L'Agnizione
    nome_en: Anagnorisis / The Recognition
    nomi_alt: [Il Riconoscimento, Discovery of Identity, La Rivelazione d'Identità]
    sottocaso_di: Il Colpo di Scena
    descrizione: >
      Un personaggio viene riconosciuto per quello che è realmente — di solito
      un legame di parentela, un'identità nascosta, o un ruolo segreto.
      L'informazione ribalta le relazioni tra i personaggi. Termine aristotelico
      (Poetica): il passaggio dall'ignoranza alla conoscenza.
    esempi:
      - "Io sono tuo padre — Darth Vader a Luke (Star Wars)"
      - "Edipo scopre di aver ucciso il padre e sposato la madre — Sofocle"
      - "Aragorn rivelato come erede di Isildur — Il Signore degli Anelli"
      - "Jon Snow è figlio di Rhaegar Targaryen — Game of Thrones"
      - "Ulisse riconosciuto dalla cicatrice dalla nutrice Euriclea — Odissea"
      - "Rapunzel scopre di essere la principessa rapita — Tangled"
      - "Keyser Söze è Verbal Kint — The Usual Suspects"
    uso_dnd: >
      Un PG o NPC scopre di essere legato al villain (figlio, fratello, creazione).
      Oppure un NPC apparentemente umile si rivela l'erede/re/dio in incognito.
      Funziona meglio se il legame ha conseguenze meccaniche: il villain non vuole
      uccidere il PG, o il PG eredita un potere/maledizione. Preparare con indizi
      nei moduli precedenti (oggetti di famiglia, somiglianze fisiche, reazioni
      inspiegabili di NPC).
    rischio: >
      Se riguarda un PG, concordare col giocatore in anticipo (session zero o in
      privato). Non imporre parentele non volute. Se riguarda un NPC, assicurarsi
      che i PG abbiano modo di scoprirlo prima del reveal finale (Three Clue Rule).
    usato_in: [La Profezia, Sconfiggere il Mostro]
    vedi_anche: [Il Colpo di Scena, L'Eletto, La Profezia]

  - tipo: situazione
    nome: Il Falso Antagonista
    nome_en: The Red Herring Villain
    nomi_alt: [Il Villain Fantoccio, Decoy Villain, False Lead, La Falsa Pista]
    sottocaso_di: Il Colpo di Scena
    descrizione: >
      Un personaggio sembra essere il villain ma non lo è. Devia l'attenzione
      dal vero nemico. La rivelazione ribalta la prospettiva del party.
    esempi:
      - "Snape — Harry Potter (sembra cattivo attraverso 6 libri)"
      - "Petyr Baelish — Game of Thrones (sembra un alleato debole, è il burattinaio)"
      - "Bucky Barnes — MCU (villain manipolato, in realtà vittima)"
      - "Il Maestro d'Armi — Il Trono di Spade (sembra brutale, protegge Arya)"
    uso_dnd: >
      NPC con comportamento sospetto che i PG indagano per sessioni intere.
      Al reveal, il vero villain era un altro NPC apparentemente innocuo.
      Funziona meglio se il falso antagonista ha motivi comprensibili per
      sembrare colpevole.
    usato_in: [Il Mistero]
    vedi_anche: [Il Colpo di Scena, Il Mutaforma, Il Mistero]

  - tipo: situazione
    nome: Il Tradimento dell'Alleato
    nome_en: Betrayal by Ally
    nomi_alt: [La Pugnalata alle Spalle, Backstab, Stab in the Back, Il Voltafaccia]
    sottocaso_di: Il Colpo di Scena
    descrizione: >
      Un compagno fidato rivela il suo vero scopo. Il tradimento funziona
      perché l'alleato era genuinamente utile prima. La fiducia costruita
      rende il colpo più duro.
    esempi:
      - "Saruman — Il Signore degli Anelli (mago bianco corrotto)"
      - "Lando Calrissian — L'Impero Colpisce Ancora (tradisce sotto costrizione)"
      - "Boromir — Il Signore degli Anelli (tentazione dell'Anello)"
      - "Cypher — The Matrix (tradisce per tornare nell'ignoranza)"
      - "Petyr Baelish — Game of Thrones (alleato utile con agenda propria)"
      - "Anakin Skywalker — Star Wars Ep. III (il tradimento definitivo)"
    uso_dnd: >
      NPC companion che tradisce. Regola: deve essere stato utile per almeno
      2-3 sessioni. Il tradimento deve avere una motivazione comprensibile
      (non gratuita). Lasciare indizi sottili che a posteriori si riconoscono.
    usato_in: [La Cerca, Sconfiggere il Mostro]
    puo_aver_bisogno_di: [Il Legame (affezione)]
    vedi_anche: [Il Colpo di Scena, Il Companion Fedele, La Talpa]

  - tipo: situazione
    nome: Il MacGuffin
    nome_en: MacGuffin
    nomi_alt: [L'Oggetto della Cerca, The Plot Device, Il Pretesto, Plot Coupon]
    descrizione: >
      Un oggetto che guida la trama ma non ha importanza in sé. I personaggi
      lo inseguono, il pubblico non si preoccupa di cosa sia realmente.
      Conta la caccia, non il premio.
    esempi:
      - "L'Arca dell'Alleanza — Indiana Jones"
      - "Il briefcase — Pulp Fiction (non sappiamo cosa contenga)"
      - "I piani della Morte Nera — Star Wars (Rogue One)"
      - "Il Graal — Indiana Jones e l'Ultima Crociata"
      - "Le Infinity Stones — MCU (prima di Infinity War)"
    uso_dnd: >
      Oggetto che i PG devono recuperare/proteggere/distruggere. Non serve
      spiegare in dettaglio cosa fa — serve che tutti lo vogliano. Funziona
      meglio se più fazioni lo cercano contemporaneamente.
    usato_in: [La Cerca]
    vedi_anche: [La Cerca]

  - tipo: situazione
    nome: La Profezia
    nome_en: The Prophecy
    nomi_alt: [L'Oracolo, The Oracle, Destino Scritto, Fated Event, La Predizione]
    descrizione: >
      Un evento futuro dichiarato certo. I personaggi agiscono per realizzarla
      o impedirla. Funziona come hook e come motore della tensione.
    esempi:
      - "La profezia del Prescelto — Matrix"
      - "La profezia di Trelawney — Harry Potter"
      - "Le Streghe — Macbeth (profezia autoavverante)"
      - "L'Oracolo di Delfi — mitologia greca (Edipo)"
      - "Profezia dei Jedi — Star Wars (il Prescelto porterà equilibrio)"
    uso_dnd: >
      Gancio per campagna intera. Formulare in modo ambiguo per lasciare
      spazio a interpretazioni. "Il sangue del drago spezzerà le catene" può
      significare molte cose. I PG scoprono il vero significato man mano.
    rischio: >
      Se troppo specifica, diventa railroad. Se troppo vaga, i giocatori la ignorano.
    usato_in: [Sconfiggere il Mostro, La Cerca]
    vedi_anche: [L'Eletto, L'Agnizione]

  - tipo: situazione
    nome: L'Assedio
    nome_en: The Siege
    nomi_alt: [La Difesa, Hold the Line, Last Stand, L'Ultima Resistenza, Defend the Fort]
    descrizione: >
      Un luogo viene attaccato e va difeso. Risorse limitate, tempo che scorre.
      La tensione cresce ad ogni ondata. I difensori devono fare scelte difficili.
    esempi:
      - "Helm's Deep — Il Signore degli Anelli (Le Due Torri)"
      - "Battle of Winterfell — Game of Thrones"
      - "L'Alamo — storia americana"
      - "Minas Tirith — Il Signore degli Anelli (Il Ritorno del Re)"
      - "Fort Triumph — tropo videoludico"
    uso_dnd: >
      Modulo con countdown: N ondate di nemici, risorse calanti. I PG
      decidono dove piazzare difese, chi sacrificare, quando usare risorse
      limitate. Alternare ondate di combattimento con momenti di respiro
      per decisioni tattiche.
    usato_in: [Sconfiggere il Mostro]
    vedi_anche: [La Corsa Contro il Tempo]

  - tipo: situazione
    nome: La Fuga dalla Prigione
    nome_en: The Prison Break
    nomi_alt: [Prison Escape, Jailbreak, La Grande Fuga, The Great Escape, Evasione]
    descrizione: >
      I protagonisti sono prigionieri e devono scappare con le proprie forze.
      Senza equipaggiamento, senza alleati. L'ingegno è l'unica risorsa.
    esempi:
      - "La Grande Fuga — film 1963"
      - "Escape from Shawshank — Le Ali della Libertà"
      - "Escape from Dol Guldur — Il Silmarillion"
      - "Il Conte di Montecristo — Dumas"
      - "Prison Break — serie TV"
      - "Escape from Butcher Bay — Riddick (videogioco)"
    uso_dnd: >
      Strong start in medias res: "Vi svegliate in una cella senza equipaggiamento."
      I PG devono improvvisare armi, trovare alleati tra i prigionieri, studiare
      le routine delle guardie. Modulo breve ma intenso.
    usato_in: [Viaggio e Ritorno]
    vedi_anche: []

  - tipo: situazione
    nome: L'Infiltrazione / Il Colpo
    nome_en: The Heist
    nomi_alt: [La Rapina, Ocean's Job, Il Furto, Infiltration Mission, Caper]
    descrizione: >
      Ottenere qualcosa da un luogo sicuro usando astuzia più che forza.
      Richiede pianificazione, travestimenti, timing, e un piano B quando
      tutto va storto.
    esempi:
      - "Ocean's Eleven — film (rapina al casinò)"
      - "La Banca di Gringotts — Harry Potter (i Doni della Morte)"
      - "Inception — Nolan (heist onirico)"
      - "Mission: Impossible — franchise"
      - "Il Colpo di Rififi — film 1955 (il capostipite del genere)"
    uso_dnd: >
      Modulo con fase di pianificazione (i PG studiano il bersaglio) e fase
      di esecuzione. Prevedere almeno 3 vie d'ingresso. Il piano dei PG
      DEVE funzionare a grandi linee — le complicazioni arrivano nei dettagli.
    rischio: >
      Se il DM invalida il piano dei PG, è frustrante. Lasciare che il piano
      funzioni, aggiungere complicazioni impreviste ma gestibili.
    usato_in: []
    vedi_anche: [La Talpa, Il Mistero]

  - tipo: situazione
    nome: Il Mistero / Whodunit
    nome_en: The Mystery / Whodunit
    nomi_alt: [L'Indagine, Murder Mystery, Giallo, Detective Story, "Chi è stato?"]
    descrizione: >
      Qualcosa è successo, i protagonisti devono scoprire cosa e chi.
      Indizi, sospetti, false piste. La soluzione è logica ma non ovvia.
    esempi:
      - "Il Nome della Rosa — Umberto Eco"
      - "Knives Out — film (Rian Johnson)"
      - "Sherlock Holmes — Conan Doyle"
      - "Murder on the Orient Express — Agatha Christie"
      - "L.A. Confidential — film"
    uso_dnd: >
      Applicare la Three Clue Rule: per ogni informazione critica, almeno 3
      indizi in 3 luoghi diversi. Almeno un sospettato innocente (red herring)
      e un colpevole insospettabile. I PG devono poter risolvere con
      deduzione, non con un singolo tiro di dado.
    rischio: >
      Se un indizio viene perso, il mistero si blocca. Per questo: 3 indizi
      per fatto, mai uno solo.
    usato_in: []
    vedi_anche: [Il Falso Antagonista, La Talpa]

  - tipo: situazione
    nome: La Scorta
    nome_en: The Escort
    nomi_alt: [Escort Mission, La Protezione, Bodyguard, Accompagnamento, Protect the VIP]
    descrizione: >
      Proteggere qualcuno/qualcosa durante un viaggio. Il pericolo viene
      dall'esterno (inseguitori, ambiente ostile, tempo) e dall'interno
      (lo scortato è difficile, ha segreti, tenta di scappare).
    esempi:
      - "The Mandalorian — serie TV (Grogu)"
      - "Children of Men — film (la donna incinta)"
      - "La Compagnia dell'Anello — Il Signore degli Anelli"
      - "The Last of Us — videogioco/serie (Joel ed Ellie)"
      - "Il Trono di Spade — Brienne scorta Jaime"
    uso_dnd: >
      NPC da scortare con complicazione: è malato, è un bambino, è un criminale
      prezioso, tenta di scappare, ha un segreto pericoloso. Alternare
      incontri da combattimento con incontri sociali/ambientali lungo il percorso.
    usato_in: [La Cerca]
    vedi_anche: [Il Companion Fedele]

  - tipo: situazione
    nome: Il Male Sigillato
    nome_en: The Sealed Evil
    nomi_alt: [Sealed Evil in a Can, Il Male Imprigionato, The Sleeping Evil, Il Risveglio]
    descrizione: >
      Un'antica minaccia è stata imprigionata e qualcuno l'ha liberata
      (o sta per farlo). Il conto alla rovescia prima della liberazione
      crea urgenza.
    esempi:
      - "Il Balrog di Moria — Il Signore degli Anelli (risvegliato dagli scavi)"
      - "Vecna — D&D (lich sigillato che ritorna)"
      - "Cthulhu — Lovecraft (dorme a R'lyeh)"
      - "Il Re della Notte — Game of Thrones (il Muro lo contiene)"
      - "Ganondorf — Zelda (sigillato, si libera ciclicamente)"
      - "Diablo — videogioco (sigillato sotto la cattedrale)"
    uso_dnd: >
      Hook di campagna: il sigillo si indebolisce. I PG devono trovare come
      rinforzarlo, o affrontare ciò che esce prima che sia troppo tardi.
      I moduli intermedi sono i segni del risveglio (mostri minori, cultisti).
    usato_in: [Sconfiggere il Mostro]
    vedi_anche: [Il Signore Oscuro, La Corsa Contro il Tempo]

  - tipo: situazione
    nome: La Corsa Contro il Tempo
    nome_en: Race Against Time
    nomi_alt: [Countdown, Ticking Clock, Il Conto alla Rovescia, Time Limit, La Bomba a Orologeria]
    descrizione: >
      I PG sanno cosa fare ma il tempo sta scadendo. La tensione viene
      dall'orologio, non dalla difficoltà del compito in sé.
    esempi:
      - "Disinnescare la bomba — qualsiasi film d'azione"
      - "La Compagnia al Monte Fato — Il Signore degli Anelli"
      - "Speed — film (bus che non può rallentare)"
      - "24 — serie TV (concept intero)"
      - "Majora's Mask — Zelda (3 giorni prima dell'impatto)"
    uso_dnd: >
      Dare un countdown esplicito: "Il rituale si completa tra 8 ore" o
      "La marea sommerge la grotta in 3 turni". I PG devono scegliere cosa
      fare e cosa saltare. Non tutto è risolvibile nel tempo dato.
    usato_in: [Sconfiggere il Mostro, La Cerca, L'Assedio]
    vedi_anche: [L'Assedio, Il Male Sigillato]

  - tipo: personaggio
    nome: L'Eletto (Il Predestinato)
    nome_en: The Chosen One
    nomi_alt: [Il Prescelto, Chosen by Destiny, Il Predestinato, The One, L'Unto]
    descrizione: >
      L'eroe è inconsapevole di essere il futuro salvatore del mondo e conduce
      una vita normale fino a un punto di svolta che rivela il suo destino.
      Una profezia, una nascita speciale o un segno lo distinguono dagli altri.
    esempi:
      - "Harry Potter — J.K. Rowling (orfano ignaro di essere mago)"
      - "Neo — The Matrix (programmatore che scopre di essere l'Eletto)"
      - "Mosè — Esodo (principe egizio che scopre le sue origini ebraiche)"
      - "Anakin Skywalker — Star Wars prequel (il prescelto della profezia Jedi)"
      - "Frodo — Il Signore degli Anelli (hobbit che eredita l'Unico Anello)"
      - "Paul Atreides — Dune (Kwisatz Haderach)"
      - "Rand al'Thor — La Ruota del Tempo (il Drago Rinato)"
    uso_dnd: >
      Il party (o un membro) scopre di essere legato a una profezia. Funziona
      come hook di campagna. Il punto di svolta è la call to adventure. In D&D
      è più efficace se TUTTI i PG hanno un ruolo nella profezia, non uno solo.
    rischio: >
      Toglie agency agli altri personaggi se uno solo è "speciale". Usare con
      cautela in party numerosi.
    usato_in: [Sconfiggere il Mostro, La Profezia]
    vedi_anche: [La Profezia, L'Agnizione]

  - tipo: personaggio
    nome: Il Signore Oscuro
    nome_en: Dark Lord
    nomi_alt: [BBEG, Big Bad, Il Villain Supremo, The Big Bad Evil Guy, L'Ombra, The Shadow]
    descrizione: >
      Il male incarnato, spesso distante e misterioso. Agisce tramite
      luogotenenti e raramente si confronta direttamente con gli eroi fino
      allo scontro finale. Potere enorme, motivazione antica.
    esempi:
      - "Sauron — Il Signore degli Anelli (presenza incombente, agisce tramite Nazgûl)"
      - "Voldemort — Harry Potter (mago oscuro con Horcrux)"
      - "L'Imperatore Palpatine — Star Wars (manipolatore dietro le quinte)"
      - "Ganondorf — The Legend of Zelda (male ricorrente, sigillato e liberato)"
      - "Thanos — MCU (villain con filosofia propria)"
      - "Vecna — D&D (lich asceso a semidio)"
    uso_dnd: >
      Il BBEG della campagna. Non appare fino al climax. I PG affrontano i
      suoi luogotenenti per moduli, poi lui alla fine. Deve avere un punto
      debole specifico (artefatto, rituale, profezia) che i PG scoprono gradualmente.
    rischio: >
      Se troppo distante diventa irrilevante. Mostrare gli effetti delle sue
      azioni nel mondo (villaggi bruciati, NPC corrotti) per mantenerlo presente.
    usato_in: [Sconfiggere il Mostro, Il Male Sigillato, Tragedia]
    vedi_anche: [Il Male Sigillato]

  - tipo: personaggio
    nome: Il Mentore / Vecchio Saggio
    nome_en: The Mentor / Wise Old Man
    nomi_alt: [Il Saggio, The Guide, Il Donatore, Obi-Wan, Gandalf Figure, Quest Giver]
    descrizione: >
      Guida l'eroe, gli dà doni e consigli, poi scompare o muore. Non può
      fare il viaggio al posto dell'eroe. La sua morte spesso segna il passaggio
      dell'eroe all'autonomia.
    esempi:
      - "Gandalf — Il Signore degli Anelli (guida, muore, ritorna trasformato)"
      - "Obi-Wan Kenobi — Star Wars (maestro che si sacrifica)"
      - "Dumbledore — Harry Potter (mentore con segreti propri)"
      - "Merlino — ciclo arturiano"
      - "Morpheus — The Matrix (introduce Neo alla verità)"
      - "Mr. Miyagi — Karate Kid"
      - "Iroh — Avatar: The Last Airbender"
    uso_dnd: >
      NPC quest-giver che accompagna il party all'inizio, fornisce informazioni
      cruciali, poi esce di scena (morte, rapimento, partenza). La sua assenza
      forza i PG a cavarsela da soli. Può lasciare un oggetto magico o un indizio finale.
    rischio: >
      Se troppo potente, i giocatori si chiedono "perché non lo fa lui?".
      Dargli un limite chiaro (vecchiaia, giuramento, maledizione).
    usato_in: [Sconfiggere il Mostro, La Cerca]
    vedi_anche: []

  - tipo: personaggio
    nome: L'Eroe Riluttante
    nome_en: The Reluctant Hero
    nomi_alt: [L'Eroe per Caso, Accidental Hero, The Everyman, L'Eroe Controvoglia, Refusal of the Call]
    descrizione: >
      Non vuole essere un eroe. Viene spinto all'azione dalla necessità o dalla
      perdita. Preferisce la routine, ha difetti evidenti. L'avventura lo cambia.
    esempi:
      - "Bilbo Baggins — Lo Hobbit (hobbit casalingo trascinato dai nani)"
      - "Luke Skywalker — Star Wars (contadino che vuole restare a casa)"
      - "Frodo — Il Signore degli Anelli (vorrebbe che l'Anello non fosse mai venuto a lui)"
      - "Jon Snow — Game of Thrones (non vuole il trono)"
      - "Geralt di Rivia — The Witcher (cerca di non essere coinvolto nella politica)"
      - "Peter Parker — Spider-Man (ragazzino con responsabilità non volute)"
    uso_dnd: >
      PG che accettano la missione per necessità (soldi, obbligo, vendetta)
      non per eroismo. Il primo modulo può presentare una perdita che li spinge
      all'azione. Funziona benissimo per party di livello 1-3.
    usato_in: [Da Povero a Ricco, La Cerca]
    vedi_anche: [L'Eletto]

  - tipo: personaggio
    nome: Il Trickster / Ingannatore
    nome_en: The Trickster
    nomi_alt: [Il Burlone, The Fool, Jester, Il Caos Incarnato, Loki Figure, L'Imbroglione]
    descrizione: >
      Imprevedibile, amorale, usa l'astuzia. Può essere alleato o nemico.
      Rompe le regole, introduce caos. Serve come comic relief e catalizzatore.
    esempi:
      - "Loki — mitologia norrena / MCU (dio dell'inganno)"
      - "Jack Sparrow — Pirati dei Caraibi (pirata inaffidabile)"
      - "Il Gatto con gli Stivali — fiabe europee"
      - "Tyrion Lannister — Game of Thrones (sopravvive con l'astuzia)"
      - "The Joker — Batman (caos incarnato, versione oscura)"
      - "Bugs Bunny — Looney Tunes (trickster archetipico)"
    uso_dnd: >
      NPC alleato inaffidabile che aiuta il party per motivi propri. Può tradire
      o salvare la situazione in modi inaspettati. Ideale come informatore,
      mercante losco, o companion temporaneo con agenda nascosta.
    rischio: >
      Se NPC, non deve rubare la scena ai PG. Se troppo furbo sembra
      un deus ex machina. Limitare i suoi "trucchi" a informazioni, non soluzioni.
    usato_in: [Commedia degli Errori, L'Infiltrazione]
    vedi_anche: [Il Mutaforma]

  - tipo: personaggio
    nome: Il Companion Fedele
    nome_en: The Loyal Companion
    nomi_alt: [La Spalla, Sidekick, Il Fido Compagno, The Faithful, Sam Gamgee Figure]
    descrizione: >
      L'amico leale che segue l'eroe ovunque. Il cuore emotivo del gruppo.
      Il suo eventuale tradimento (variante oscura) è devastante proprio perché
      era genuinamente utile e fidato.
    esempi:
      - "Samwise Gamgee — Il Signore degli Anelli (il vero eroe della storia)"
      - "Ron Weasley — Harry Potter"
      - "Han Solo — Star Wars (diventa il companion dopo aver iniziato come mercenario)"
      - "Chewbacca — Star Wars"
      - "Hermione Granger — Harry Potter (companion competente)"
      - "Brienne di Tarth — Game of Thrones"
    uso_dnd: >
      NPC companion che viaggia col party. Utile in combattimento o con skill
      complementari. Se previsto tradimento, deve essere stato genuinamente
      utile per almeno 2-3 sessioni prima. Il tradimento colpisce di più
      se i giocatori si erano affezionati.
    usato_in: [La Cerca, La Scorta]
    vedi_anche: [Il Tradimento dell'Alleato]

  - tipo: personaggio
    nome: Il Mutaforma
    nome_en: The Shapeshifter
    nomi_alt: [Il Voltagabbana, Wild Card, Il Doppiogiochista, The Chameleon, Doppia Faccia]
    descrizione: >
      Non si sa se sia alleato o nemico. Cambia lealtà o apparenza. Affascinante,
      inaffidabile. Tiene i PG in sospeso. Spesso interesse romantico O spia.
    esempi:
      - "Severus Snape — Harry Potter (sembra nemico, è alleato)"
      - "Gollum — Il Signore degli Anelli (alleato e nemico nello stesso corpo)"
      - "Catwoman — Batman (romantica e criminale)"
      - "Jaime Lannister — Game of Thrones (da villain a antieroe)"
      - "Mystique — X-Men (letteralmente mutaforma)"
    uso_dnd: >
      NPC che il party non riesce a classificare. Offrire informazioni vere
      mescolate a bugie. Mai rivelare l'allineamento vero fino al climax.
      Ideale per indagini e intrighi politici.
    usato_in: [Il Mistero, Il Colpo di Scena]
    vedi_anche: [La Talpa, Il Falso Antagonista]

  - tipo: personaggio
    nome: La Talpa
    nome_en: The Mole / Double Agent
    nomi_alt: [Il Traditore, L'Infiltrato, The Spy, The Insider, Doppio Agente]
    sottocaso_di: Il Mutaforma
    descrizione: >
      Un apparente alleato che lavora segretamente per l'avversario. A differenza
      del traditore (che decide di tradire), la talpa non è mai stata dalla parte
      dei PG — è stata infiltrata fin dall'inizio. Sabota progressivamente, passa
      informazioni al nemico, e devia le indagini. Nella versione positiva, è un
      alleato infiltrato nel campo nemico che aiuta i PG dall'interno.
    esempi:
      - "Severus Snape — Harry Potter (talpa positiva: finge di servire Voldemort per proteggere Harry)"
      - "Cypher — The Matrix (talpa negativa: comunica con gli Agenti per tradire la ciurma)"
      - "Aldrich Ames — storia reale (talpa CIA per i sovietici)"
      - "Infernal Affairs / The Departed — film (talpe incrociate: polizia nella mafia e mafia nella polizia)"
      - "Benedict Arnold — storia americana"
      - "Varys — Game of Thrones (serve segretamente un terzo schieramento)"
    uso_dnd: >
      NPC nel party o nel gruppo alleato che sabota sottilmente: guide che portano
      sulla strada sbagliata, informatori che avvisano il nemico degli spostamenti
      dei PG, guardie che "dormono" durante gli attacchi. Gli indizi devono essere
      piantati fin dall'inizio (Three Clue Rule al contrario). Versione positiva:
      NPC nella fortezza nemica che lascia porte aperte, fornisce mappe, o avvisa
      di trappole tramite messaggi cifrati.
    rischio: >
      Se i PG non hanno modo di scoprire la talpa, è frustrante. Seminare almeno
      3 indizi sottili nel corso dei moduli. Se la scoprono troppo presto, l'arco
      si accorcia — prevedere un piano B per la talpa (fuga, rivelazione parziale).
    usato_in: [L'Infiltrazione, Il Mistero, Il Tradimento dell'Alleato]
    vedi_anche: [Il Tradimento dell'Alleato, Il Mutaforma, Il Mistero]


  - tipo: situazione
    nome: La Finta Minaccia (Anticlimax)
    nome_en: The Anticlimax / Bait-and-Switch
    nomi_alt: [Red Herring, La Falsa Pista, The Fake-Out, Il Diversivo, Misdirection]
    descrizione: >
      Un avvenimento viene presentato con tutti i segnali di un pericolo grave
      o di un plot noto, ma si sgonfia e si rivela innocuo o irrilevante.
      L'aspettativa viene costruita e poi deliberatamente delusa. Può essere
      comico (comic relief tra scene tese), oppure servire a far abbassare la
      guardia ai PG prima del vero pericolo. È l'anti-Colpo di Scena: invece
      di rivelare qualcosa di peggio del previsto, rivela qualcosa di meglio
      (o di ridicolo).
    esempi:
      - "Il Coniglio Assassino — Monty Python e il Sacro Graal (sembra innocuo, è letale — versione invertita)"
      - "Scooby-Doo — il mostro è sempre un tizio in costume"
      - "Galaxy Quest — i nemici terrificanti sono bambini alieni"
      - "Indiana Jones spara al duellante — l'elaborata minaccia risolta in un secondo"
      - "Lo spaventapasseri che sembra un nemico — tropo horror/commedia"
    uso_dnd: >
      Usare con parsimonia (1-2 per avventura, mai consecutivi). Esempi: una
      stanza buia con rumori spettrali è completamente vuota (il rumore era il
      vento); un "attacco massiccio" è un'orda di mosche giganti CR 0; un pupazzo
      con la forma del villain in una stanza trappola; un messaggio cifrato
      minaccioso che è la lista della spesa di qualcuno. Funziona meglio PRIMA
      del vero pericolo: i PG ridono, abbassano la guardia, e il colpo vero
      arriva subito dopo.
    rischio: >
      Se abusato i giocatori smettono di prendere sul serio qualsiasi minaccia
      ("tanto sarà un'altra finta"). Max 1-2 per avventura. Non usare mai come
      risoluzione di un arco narrativo reale — solo come battuta di passaggio
      o setup per il pericolo vero.
    usato_in: [Commedia degli Errori]
    vedi_anche: [Il Colpo di Scena]

  - tipo: relazione
    nome: L'Alleanza Oscillante
    nome_en: Heel-Face Revolving Door / Shifting Allegiance
    nomi_alt: [Shifting Allegiance, On Again Off Again Ally, Il Voltagabbana Seriale, Wildcard Allegiance]
    descrizione: >
      Un personaggio cambia schieramento più di una volta nel corso della storia.
      Varianti principali: (1) Amico → nemico → si pente → si immola per redenzione;
      (2) Amico → nemico per ragioni morali segrete → il "buono" scopre di essere
      lui il vero problema → ri-alleanza. Il personaggio non è semplicemente
      ambiguo (quello è il Mutaforma): compie scelte definitive e visibili che
      lo collocano in un campo, poi cambia di nuovo. Ogni cambio deve avere una
      motivazione forte e comprensibile.
    esempi:
      - "Darth Vader — Star Wars (amico → nemico → si immola per salvare Luke)"
      - "Jaime Lannister — Game of Thrones (nemico → alleato → muore tornando da Cersei)"
      - "Boromir — Il Signore degli Anelli (alleato → tentazione → redenzione immediata con sacrificio)"
      - "Vegeta — Dragon Ball Z (nemico → rivale → alleato → si sacrifica)"
      - "Zuko — Avatar: The Last Airbender (nemico → alleato → tradisce → alleato definitivo)"
      - "Severus Snape — Harry Potter (alleato apparente → traditore apparente → alleato reale, rivelato post-mortem)"
    uso_dnd: >
      Arco NPC su più moduli: il companion tradisce (modulo 3), i PG lo affrontano
      come nemico (modulo 4), poi scoprono che aveva ragioni valide o lo vedono
      pentirsi (modulo finale). Oppure: i PG scoprono che il loro quest giver è
      malvagio, e l'NPC che li ostacolava era nel giusto. Ogni cambio deve essere
      giustificato da informazioni nuove che i PG scoprono.
    rischio: >
      Se i cambi sono troppo frequenti o immotivati, il personaggio perde
      credibilità e i giocatori smettono di fidarsi di qualsiasi NPC. Regola:
      max 1 oscillazione per NPC per avventura. Ogni cambio deve essere supportato
      da motivazioni comprensibili rivelate ai PG. Se i PG non capiscono il perché,
      sembra scrittura confusa, non profondità narrativa.
    usato_in: [Rinascita, Tragedia]
    vedi_anche: [Il Tradimento dell'Alleato, Il Mutaforma, Rinascita, Il Colpo di Scena]


  - tipo: situazione
    nome: Spalle al Muro (La Scelta Impossibile)
    nome_en: Sadistic Choice / Morton's Fork
    nomi_alt: [Il Dilemma, No-Win Scenario, Kobayashi Maru, Scelta di Sofia, Lose-Lose]
    descrizione: >
      Il personaggio si trova davanti a una scelta in cui fare la cosa giusta
      lo costringerà a perdere qualcosa a cui tiene moltissimo. Non esiste
      un'opzione "buona" — tutte hanno un costo. La tensione non viene dal
      pericolo fisico ma dal peso morale della decisione. Varianti: salvare
      uno o l'altro (non entrambi), completare la missione o salvare l'amico,
      dire la verità e perdere tutto o mentire e tradire i propri principi.
    esempi:
      - "Sophie's Choice — film (scegliere quale figlio salvare)"
      - "Spider-Man — film 2002 (Mary Jane o il tram pieno di bambini)"
      - "Il Cavaliere Oscuro — Batman (Harvey Dent o Rachel, non entrambi)"
      - "Frodo alla fine — Il Signore degli Anelli (distruggere l'Anello significa perdere una parte di sé)"
      - "Ned Stark — Game of Thrones (confessare il falso per salvare le figlie, o morire con l'onore)"
      - "Mass Effect — videogioco (Kaidan o Ashley su Virmire)"
      - "Trolley Problem — filosofia morale (il dilemma classico)"
    uso_dnd: >
      Presentare al party una scelta dove tutte le opzioni hanno costi reali e
      visibili. NON deve esistere una terza via nascosta che risolve tutto — se
      i PG la trovano con ingegno va bene, ma non prevederla come soluzione intesa.
      Esempi: salvare il villaggio o inseguire il villain (non c'è tempo per
      entrambi); consegnare l'artefatto al re corrotto (pace) o tenerlo (guerra
      ma libertà); sacrificare un NPC amato per chiudere il portale. La scelta
      deve avere conseguenze permanenti nel mondo di gioco.
    rischio: >
      Se una delle opzioni è chiaramente migliore dell'altra, non è un vero
      dilemma — è una trappola per giocatori disattenti. Le opzioni devono essere
      equivalenti in peso emotivo. Non abusare: max 1 per arco narrativo,
      altrimenti l'avventura diventa opprimente.
    usato_in: [Sconfiggere il Mostro, La Cerca, Tragedia]
    vedi_anche: [La Corsa Contro il Tempo, Il Tradimento dell'Alleato]

  - tipo: tecnica
    nome: Il Legame (Costruzione dell'Investimento Emotivo)
    nome_en: Emotional Investment / Player Buy-In / Make Them Care
    nomi_alt: [Player Buy-In, Attachment, La Connessione Emotiva, Make Them Care, Emotional Stakes]
    descrizione: >
      Il principio fondamentale di tutta la narrazione emotiva: affinché un
      evento (perdita, tradimento, scelta, vittoria) colpisca i giocatori,
      prima devono TENERE a ciò che è in gioco. L'investimento emotivo va
      costruito nel tempo — non basta dichiarare "questo è importante". Si
      applica a qualsiasi bersaglio: persone (NPC, companion), oggetti (la
      spada del padre, l'artefatto guadagnato con fatica), luoghi (il villaggio,
      la taverna, la gilda), cause astratte (la ribellione, la promessa, l'onore
      del clan). Il Legame è il prerequisito di quasi tutti gli altri dispositivi
      emotivi. Senza investimento → nessun impatto.
    esempi:
      - "Grogu — The Mandalorian (3 episodi di interazioni tenere → ogni pericolo colpisce)"
      - "La Contea — Il Signore degli Anelli (luogo costruito con amore → la sua minaccia è devastante)"
      - "Wilson il pallone — Cast Away (un OGGETTO a cui ci si affeziona davvero)"
      - "Hogwarts — Harry Potter (luogo-casa → la Battaglia di Hogwarts ha peso emotivo)"
      - "La spada Narsil/Andúril — Il Signore degli Anelli (oggetto con storia = investimento)"
      - "Aerith — Final Fantasy VII (companion utile e amata → morte shock)"
      - "La causa dei ribelli — Star Wars (costruita per un film intero → il sacrificio di Rogue One colpisce)"
      - "Dobby — Harry Potter (buffo e leale per libri interi → la sua morte devasta)"
    uso_dnd: >
      Per qualsiasi cosa che dovrà essere in pericolo, persa, o al centro di
      una scelta: investire tempo PRIMA perché i giocatori ci tengano.
      Tecniche per PERSONE: l'NPC salva un PG, fa ridere il tavolo, ha un
      tratto umano memorabile, offre qualcosa senza chiedere.
      Tecniche per OGGETTI: l'oggetto ha una storia (apparteneva a qualcuno),
      è stato guadagnato con fatica, ha un nome, ha salvato i PG in un momento
      critico.
      Tecniche per LUOGHI: i PG ci hanno passato tempo, ci hanno legami sociali,
      ci hanno investito risorse (La Gestione del Territorio), ci tornano tra
      le missioni.
      Tecniche per CAUSE: mostrare le conseguenze concrete (le persone che
      soffrono), dare un volto alla causa (un NPC che la incarna), far
      scegliere ai PG di aderire (non imporla).
      Solo DOPO aver costruito il legame, usare il dispositivo emotivo.
    rischio: >
      Se il DM mette in pericolo qualcosa prima che i giocatori ci tengano,
      l'impatto è zero. Se distrugge troppo spesso ciò che i giocatori amano,
      smettono di investire. Equilibrio: costruire con pazienza, minacciare
      con parsimonia, perdere raramente.
    usato_in: [Spalle al Muro, Il Tradimento dell'Alleato, Il Colpo di Scena, Rinascita]
    vedi_anche: [Il Companion Fedele, Spalle al Muro, Il Tradimento dell'Alleato, La Costruzione dell'Odio, La Resa dei Conti]

  - tipo: tecnica
    nome: La Costruzione dell'Odio (Il Villain Odiabile)
    nome_en: Hate Sink / Villain Build-Up / Make Them Hate
    nomi_alt: [Hate Sink, Villain Build-Up, Make Them Hate, Il Villain Odiabile, Kick the Dog]
    descrizione: >
      Lo specchio negativo del Legame applicato ai personaggi: affinché
      sconfiggere il villain sia
      soddisfacente, i giocatori devono ODIARLO prima. L'odio va costruito
      durante l'avventura con atti ripetuti di crudeltà, ingiustizia, e
      offese personali ai PG. Non basta dire "è cattivo" — il villain deve
      fare cose orribili ON SCREEN, a persone/cose a cui i PG tengono (costruite
      col Legame), e farla franca ripetutamente. Ogni volta che sfugge, l'odio
      cresce. Solo quando l'odio è al culmine, la Resa dei Conti è catartica.
    esempi:
      - "Joffrey Baratheon — Game of Thrones (orribile per 4 stagioni → la sua morte è una festa)"
      - "Dolores Umbridge — Harry Potter (più odiata di Voldemort perché fa cose piccole e crudeli)"
      - "Micah Bell — Red Dead Redemption 2 (traditore costruito per tutto il gioco)"
      - "Ramsey Bolton — Game of Thrones (crudeltà gratuita e ripetuta)"
      - "Dio Brando — JoJo (uccide il cane nel primo episodio — 'kick the dog' letterale)"
      - "Il Conte di Montecristo — Dumas (i traditori prosperano per anni prima della vendetta)"
    uso_dnd: >
      Tecniche per costruire l'odio: (1) Kick the Dog — il villain fa qualcosa
      di gratuito e crudele alla prima apparizione (uccide un animale, umilia
      un debole); (2) Tocca ciò che ami — distrugge/danneggia qualcosa costruito
      col Legame (il village, l'NPC amato, la base); (3) Sfugge alla giustizia
      — i PG lo affrontano presto e PERDONO, o non possono toccarlo (immunità,
      potere, fuga); (4) È personale — insulta i PG, li umilia pubblicamente,
      li usa. Ogni modulo aggiunge un motivo. La Resa dei Conti è il payoff.
    rischio: >
      Se il villain è odioso ma incompetente, diventa comico. Se è solo
      potente ma non personalmente crudele, i PG lo rispettano invece di
      odiarlo. L'odio richiede CRUDELTÀ PERSONALE + IMPUNITÀ. Se il villain
      viene ucciso troppo presto (i PG forzano lo scontro), non c'è buildup.
      Proteggerlo narrativamente (fuga, sottoposti, distanza) fino al climax.
    usato_in: [Sconfiggere il Mostro, La Vendetta, La Resa dei Conti]
    vedi_anche: [Il Legame, La Resa dei Conti, Il Signore Oscuro, L'Ora più Buia, La Nemesi]

  - tipo: tecnica
    nome: Il Fucile di Čechov
    nome_en: Chekhov's Gun
    nomi_alt: [La Pistola di Čechov, Setup and Payoff, Plant and Payoff, Brick Joke]
    descrizione: >
      "Se nel primo atto mostri un fucile appeso al muro, nel terzo atto deve
      sparare." Ogni elemento introdotto nella narrazione deve avere una funzione
      più avanti. Inversamente: se un elemento sarà importante dopo, deve essere
      stato introdotto prima (non apparire dal nulla). È il principio di
      setup/payoff: niente è gratuito, tutto torna.
    esempi:
      - "L'Anello trovato da Bilbo — Lo Hobbit (oggetto apparentemente innocuo → centro della trama successiva)"
      - "La bacchetta gemella — Harry Potter (menzionata nel libro 1, cruciale nel libro 4 e 7)"
      - "Il pugnale di Arya — Game of Thrones (introdotto S1, usato per uccidere il Night King S8)"
      - "La criptonite — Superman (introdotta come minerale, usata come arma)"
      - "Il flauto del Pied Piper — fiabe (lo strumento mostrato prima è la soluzione)"
    uso_dnd: >
      Ogni oggetto, NPC o dettaglio inserito nei primi moduli deve tornare utile
      dopo. Se descrivi una spada arrugginita sul muro della taverna, qualcuno
      dovrà usarla. Se un NPC menziona un passaggio segreto, i PG lo troveranno.
      Il DM può anche usarlo al contrario: se sa che nel modulo 4 servirà una
      chiave, la piazza nel modulo 2 come dettaglio apparentemente insignificante.
    rischio: >
      Non sovraccaricare la scena di "fucili" — i giocatori diventano paranoici
      e trattano ogni dettaglio come un indizio. Bilanciare elementi significativi
      con colore ambientale che è solo colore.
    usato_in: [Il Mistero, La Profezia, Il Colpo di Scena]
    vedi_anche: [Il Presagio, La Regola dei Tre Indizi]

  - tipo: tecnica
    nome: La Regola dei Tre Indizi
    nome_en: Three Clue Rule (Alexandrian)
    nomi_alt: [Three Clue Rule, Node-Based Design, La Ridondanza degli Indizi]
    descrizione: >
      Per ogni informazione critica che i PG devono scoprire per far progredire
      la trama, prevedere almeno 3 indizi in 3 luoghi/fonti diversi. Se un indizio
      viene perso (tiro fallito, stanza non esplorata, NPC ucciso), gli altri due
      garantiscono che il mistero si possa comunque risolvere. Regola coniata da
      Justin Alexander (The Alexandrian).
    esempi:
      - "The Alexandrian — articolo originale (ogni nodo della trama ha 3+ vie d'accesso)"
      - "Sherlock Holmes — Conan Doyle (Holmes trova indizi multipli che convergono)"
      - "L.A. Noire — videogioco (sistema di indizi ridondanti per ogni caso)"
    uso_dnd: >
      Per ogni fatto chiave: 3 indizi. Esempio — "il mercante è stato avvelenato
      dal figlio": (1) un testimone vede il figlio comprare veleno, (2) il diario
      del mercante menziona timori, (3) una lettera del figlio a un complice.
      Se i PG saltano il testimone, hanno ancora il diario e la lettera. MAI un
      singolo punto di fallimento in un'indagine.
    rischio: >
      Se gli indizi sono troppo ovvi il mistero diventa banale. Dosare: un indizio
      diretto, uno indiretto, uno che richiede un collegamento deduttivo. I PG
      devono sentirsi intelligenti, non guidati per mano.
    usato_in: [Il Mistero, Il Colpo di Scena, L'Agnizione]
    vedi_anche: [Il Fucile di Čechov, Il Presagio]

  - tipo: tecnica
    nome: Il Presagio (Foreshadowing)
    nome_en: Foreshadowing
    nomi_alt: [L'Anticipazione, Hint, Premonizione, Semina, Planting Seeds]
    descrizione: >
      Seminare indizi, immagini o eventi minori che anticipano ciò che accadrà
      in futuro. Non sono indizi per un mistero (quelli sono per i PG da risolvere) —
      sono segnali per il giocatore/lettore che creano tensione e rendono il
      payoff finale soddisfacente ("ah, era quello!"). A differenza del Fucile di
      Čechov (che riguarda oggetti/elementi), il foreshadowing riguarda toni,
      atmosfere, eventi paralleli.
    esempi:
      - "I sogni di Frodo — Il Signore degli Anelli (sogna Gandalf prigioniero prima di saperlo)"
      - "La cicatrice che brucia — Harry Potter (segnala la presenza di Voldemort)"
      - "Il motto 'Winter is Coming' — Game of Thrones (stagioni intere di presagio)"
      - "Il colore rosso nei film di M. Night Shyamalan (anticipa la rivelazione)"
      - "Le visioni della Forza — Star Wars (Luke vede il futuro nella caverna su Dagobah)"
    uso_dnd: >
      Sogni profetici di un PG, cattivi presagi (stormi di corvi, latte che
      inacidisce, statue che piangono), NPC che alludono a eventi futuri senza
      spiegarli. Funziona meglio se il DM sa già cosa succederà nei moduli
      successivi. Inserire 1-2 presagi per modulo che puntano al climax.
    rischio: >
      Se troppo criptico, i giocatori non lo notano e il payoff è perso.
      Se troppo esplicito, è spoiler. Il presagio ideale è riconoscibile solo
      a posteriori.
    usato_in: [Il Colpo di Scena, La Profezia, Il Male Sigillato]
    vedi_anche: [Il Fucile di Čechov, La Regola dei Tre Indizi]

  - tipo: tecnica
    nome: L'Ironia Drammatica
    nome_en: Dramatic Irony
    nomi_alt: [Ironia Tragica, Il Pubblico Sa, Suspense Hitchcockiana, The Audience Knows]
    descrizione: >
      Il pubblico (o i giocatori) sa qualcosa che i personaggi non sanno. La
      tensione nasce dal guardare i personaggi agire in base a informazioni
      incomplete mentre noi conosciamo la verità. Funziona sia in tragedia
      (sappiamo che sta andando verso la rovina) sia in commedia (sappiamo
      che il malinteso si risolverà).
    esempi:
      - "Edipo Re — Sofocle (il pubblico sa chi è l'assassino; Edipo no)"
      - "Romeo e Giulietta — Shakespeare (sappiamo che Giulietta non è morta; Romeo no)"
      - "Il pubblico sa che Snape è buono — Harry Potter (per chi rilegge)"
      - "Noi sappiamo chi è il killer — Columbo (tutta la serie si basa su questo)"
      - "Il Truman Show — film (il pubblico sa, Truman no)"
    uso_dnd: >
      Dare ai giocatori (non ai PG) informazioni che i loro personaggi non hanno.
      Esempio: i giocatori sanno che l'NPC è la talpa, ma i PG no — la tensione
      viene dal vedere l'NPC agire. Oppure: il DM rivela in un cut-scene cosa fa
      il villain mentre i PG sono altrove. Usare con cautela: i giocatori devono
      separare conoscenza del giocatore da conoscenza del PG (metagaming positivo).
    rischio: >
      Richiede giocatori maturi che non usino le informazioni extra per guidare
      le azioni dei PG. Funziona meglio con gruppi che amano il roleplay e
      accettano di "soffrire" consapevolmente.
    usato_in: [Tragedia, Commedia degli Errori, Il Mistero]
    vedi_anche: [La Talpa, Il Presagio]

  - tipo: tecnica
    nome: In Medias Res
    nome_en: In Medias Res
    nomi_alt: [Strong Start, Cold Open, Apertura a Freddo, Nel Mezzo dell'Azione, Action Opening]
    descrizione: >
      Iniziare la storia nel mezzo dell'azione, senza introduzione. Il contesto
      viene ricostruito dopo (flashback, dialoghi, scoperte). Cattura l'attenzione
      immediatamente e crea domande che spingono a continuare. È il "strong start"
      portato all'estremo.
    esempi:
      - "L'Iliade — Omero (inizia al nono anno della guerra di Troia)"
      - "Breaking Bad S1E1 — serie TV (Walter in mutande nel deserto con una pistola)"
      - "Memento — Nolan (il film inizia dalla fine)"
      - "Il Signore degli Anelli — (non inizia dalla creazione degli Anelli ma da una festa di compleanno)"
      - "Uncharted — videogioco (ogni capitolo inizia con il protagonista in pericolo mortale)"
      - "Mad Max: Fury Road — film (azione immediata, zero esposizione)"
    uso_dnd: >
      "Vi svegliate in una cella", "Siete in fuga", "Il drago è già qui".
      La sessione inizia con un problema immediato. Il contesto (come ci siamo
      arrivati) emerge durante il gioco tramite flashback narrativi o dialoghi.
      Ideale per one-shot e per sessioni che devono partire veloci. Il Lazy DM
      lo chiama "strong start" — iniziare sempre vicini all'azione.
    rischio: >
      Se il contesto non viene mai chiarito, i giocatori si sentono persi.
      Bilanciare: in medias res per la prima scena, poi chiarire il contesto
      entro i primi 20 minuti di gioco.
    usato_in: [La Fuga dalla Prigione, La Corsa Contro il Tempo]
    vedi_anche: [La Fuga dalla Prigione]


  - tipo: tecnica
    nome: Il Contatore
    nome_en: Progress Clock / Tracker / Karma System
    nomi_alt: [Clock, Orologio, Doom Track, Corruption Meter, Tracker, Tension Pool]
    descrizione: >
      Le azioni dei personaggi modificano un "contatore" nascosto o visibile che
      a sua volta influenza il modo in cui il mondo interagisce con loro. Il
      contatore può essere tempo che scorre, portali chiusi su N totali,
      reputazione accumulata, corruzione di un artefatto, fiducia di una fazione.
      Quando il contatore raggiunge una soglia, qualcosa cambia nel mondo (un
      evento scatta, un NPC cambia atteggiamento, una porta si apre/chiude). Dà
      peso cumulativo alle scelte — ogni azione conta, anche quelle piccole.
    esempi:
      - "Progress Clocks — Blades in the Dark (orologi che avanzano verso un evento)"
      - "Reputazione — Mass Effect (Paragon/Renegade cambia come gli NPC reagiscono)"
      - "Il Corruption tracker — Shadow of Mordor (Sauron's Army reagisce alle azioni del giocatore)"
      - "Honor system — Red Dead Redemption 2 (il mondo reagisce al karma)"
      - "I 7 sigilli — narrativa apocalittica (ogni sigillo spezzato peggiora il mondo)"
      - "Majora's Mask — Zelda (il tempo scorre, il mondo decade)"
      - "Darkest Dungeon — stress come contatore cumulativo"
    uso_dnd: >
      Definire un tracker con N tacche (es. 6). Ogni azione significativa dei PG
      lo fa avanzare o retrocedere. Esempi: (1) Tempo — "il rituale avanza di 1
      ogni volta che i PG perdono tempo"; (2) Fiducia — "la gilda aiuterà solo se
      il contatore fiducia è ≥ 4"; (3) Corruzione — "ogni uso dell'artefatto
      aggiunge 1, a 5 il PG perde il controllo"; (4) Fronts — "l'esercito nemico
      avanza di 1 per ogni modulo in cui i PG non lo ostacolano". Può essere
      visibile ai PG (tensione consapevole) o nascosto (sorpresa al raggiungimento
      della soglia).
    rischio: >
      Se il contatore è troppo punitivo i PG si sentono su un railroad mascherato.
      Se è troppo lento diventa irrilevante. Regola: il contatore deve poter essere
      influenzato in entrambe le direzioni (i PG possono farlo salire E scendere),
      e le soglie devono produrre effetti visibili e concreti.
    usato_in: [La Corsa Contro il Tempo, L'Assedio, Il Male Sigillato, Sconfiggere il Mostro]
    vedi_anche: [La Corsa Contro il Tempo, Il Male Sigillato, Spalle al Muro]

  - tipo: tecnica
    nome: L'Incontro Filler (Random Monster)
    nome_en: Random Encounter / Filler Combat
    nomi_alt: [Random Encounter, Wandering Monster, Trash Mob, Incontro Casuale]
    descrizione: >
      Un combattimento inserito per ragioni di pacing, consumo risorse, o
      divertimento tattico, senza correlazione diretta con la trama principale.
      Il mostro è debolmente correlato al contesto (coerente con l'ambiente:
      lupi nella foresta, ratti nelle fogne) ma non è mandato dal villain né
      ha rilevanza narrativa. Serve a: spezzare lunghe sequenze di roleplay,
      consumare slot/HP prima del boss, dare ai giocatori il piacere del
      combattimento puro, far sentire il mondo vivo e pericoloso.
    esempi:
      - "Random encounter tables — D&D classico (tradizione dal 1974)"
      - "Lupi nella foresta — qualsiasi avventura fantasy"
      - "Mostri erranti nei dungeon — Gygax, DMG originale"
      - "Nemici generici nei videogiochi — tra un boss e l'altro"
      - "Le Miniere di Moria — Il Signore degli Anelli (goblin e troll non correlati al Balrog)"
    uso_dnd: >
      Inserire quando: (1) i PG hanno troppe risorse e il boss sarebbe troppo
      facile; (2) la sessione ha bisogno di azione dopo troppo dialogo; (3) si
      vuole mostrare che il mondo è pericoloso anche fuori dalla trama. Il mostro
      deve essere coerente con l'ambiente (non un drago random in una cantina) ma
      non serve che sia collegato al villain. Può essere un'opportunità per loot
      minore o per introdurre un Fucile di Čechov (il nido vuoto che segnala
      qualcosa di più grande nelle vicinanze).
    rischio: >
      Se troppo frequenti i giocatori si annoiano ("un altro combattimento
      inutile"). Se completamente scollegati dal contesto sembrano arbitrari.
      Regola: max 1 filler per sessione, e dargli almeno un dettaglio che
      colori il mondo (il lupo ha un collare — era di qualcuno? i ratti
      scappano da qualcosa di più grosso).
    usato_in: [La Cerca, Sconfiggere il Mostro]
    vedi_anche: [Il Fucile di Čechov, La Corsa Contro il Tempo]

  - tipo: situazione
    nome: Il Falso Finale
    nome_en: Disc-One Final Boss / The Man Behind the Man
    nomi_alt: [False Climax, Il Boss Dietro il Boss, Not the Final Boss, Il Burattinaio]
    sottocaso_di: Il Colpo di Scena
    descrizione: >
      Tutto è costruito perché la battaglia o l'evento venga vissuto come quello
      finale, ma dopo la vittoria si scopre che: (1) il nemico sconfitto non era
      il vero villain — qualcun altro tira le fila; (2) il nemico era in realtà
      innocente o manipolato; (3) per un ribaltamento dei fronti i PG scoprono
      che aveva ragione lui e scelgono di sposare la sua causa. Il "finale" era
      solo la fine del primo atto. L'avventura continua con posta più alta e
      prospettiva ribaltata.
    esempi:
      - "Ganondorf → Zant → Ganondorf — Zelda: Twilight Princess (il primo boss non è l'ultimo)"
      - "Darth Vader → L'Imperatore — Star Wars (il vero nemico è dietro)"
      - "Sephiroth prima apparizione — Final Fantasy VII (lo sconfiggi, ma non era la forma finale)"
      - "I Sei Compagni → Strahd — Curse of Strahd (il dungeon boss non è il villain della campagna)"
      - "Ozymandias — Watchmen (il villain ha già vinto quando lo scopri)"
      - "Il Mandarino — Iron Man 3 (il villain pubblico è un attore, il vero è un altro)"
    uso_dnd: >
      Strutturare l'avventura in due archi: il primo culmina con un boss che
      sembra finale (tono epico, posta alta, vittoria soddisfacente). Poi il
      colpo: il vero villain si rivela, o i PG scoprono che il "mostro" era una
      vittima. Il secondo arco ha posta emotiva più alta perché i PG hanno
      investito nel primo. Funziona per saghe (il modulo 2 su 4 ha il falso
      finale) o per campagne con twist a metà.
    rischio: >
      Se il primo "finale" non è soddisfacente come combattimento, i PG si
      sentono fregati. Il falso boss deve essere un vero fight, appagante da
      vincere. La rivelazione dopo deve alzare la posta, non frustrare ("allora
      non serviva a niente?"). Regola: il primo arco ha valore anche da solo —
      il secondo lo arricchisce, non lo invalida.
    usato_in: [Sconfiggere il Mostro, La Cerca]
    vedi_anche: [Il Colpo di Scena, Il Falso Antagonista, Spalle al Muro]


  - tipo: situazione
    nome: L'Alleanza col Nemico
    nome_en: Enemy Mine / Teeth-Clenched Teamwork
    nomi_alt: [Il Nemico del Mio Nemico, Forced Alliance, Tregua Forzata, Uneasy Alliance]
    descrizione: >
      I PG sono costretti ad allearsi temporaneamente con un nemico noto per
      affrontare una minaccia più grande. L'alleanza è fragile, la fiducia è
      zero, ma la sopravvivenza lo richiede. Finita la minaccia comune,
      l'alleanza si dissolve e il nemico torna nemico — oppure l'esperienza
      condivisa cambia la relazione per sempre.
    esempi:
      - "Legolas e Gimli — Il Signore degli Anelli (razze nemiche che diventano amici)"
      - "Magneto e X-Men — Marvel (si alleano contro minacce maggiori)"
      - "Enemy Mine — film 1985 (umano e alieno naufraghi insieme)"
      - "Zuko si unisce a Team Avatar — Avatar: The Last Airbender"
      - "Goku e Vegeta vs Freezer — Dragon Ball"
      - "Tyrion con Daenerys — Game of Thrones"
    uso_dnd: >
      Il villain secondario o un nemico ricorrente si presenta: "Ho bisogno del
      vostro aiuto." La minaccia comune deve essere abbastanza grave da
      giustificare l'alleanza. Durante la cooperazione: tensione, sospetti,
      tentativi di tradimento sventati. Alla fine il DM lascia aperto: il nemico
      è cambiato, o tornerà a colpire?
    rischio: >
      Se il nemico è troppo odioso i PG rifiuteranno. Se è troppo simpatico
      perde il mordente come nemico futuro. Bilanciare: il nemico è pragmatico,
      non malvagio gratuito.
    usato_in: [Sconfiggere il Mostro, L'Assedio]
    vedi_anche: [L'Alleanza Oscillante, Il Mutaforma]

  - tipo: situazione
    nome: La Vittoria di Pirro
    nome_en: Pyrrhic Victory
    nomi_alt: [Hollow Victory, La Vittoria Amara, Vittoria a Caro Prezzo, Won the Battle Lost the War]
    descrizione: >
      I PG vincono, ma il costo è così alto che la vittoria ha il sapore della
      sconfitta. Perdite irreparabili, distruzioni, sacrifici che cambiano tutto.
      Si vince la battaglia ma il mondo è peggiore di prima. È l'opposto del
      lieto fine: tecnicamente è un successo, emotivamente è una devastazione.
    esempi:
      - "La battaglia di Pirro — storia (il re vince ma perde l'esercito)"
      - "Il Signore degli Anelli — la Contea devastata al ritorno"
      - "Infinity War/Endgame — MCU (si vince, ma Tony e Natasha muoiono)"
      - "The Last of Us Parte II — videogioco (Ellie vince ma perde tutto)"
      - "Rogue One — Star Wars (la missione ha successo, tutti muoiono)"
      - "Hamlet — Shakespeare (il villain muore, ma anche tutti gli altri)"
    uso_dnd: >
      Il boss è sconfitto ma: il villaggio che dovevano salvare è distrutto, un
      NPC amato è morto, il mondo è cambiato irreversibilmente. Usare come finale
      di un arco per dare peso alle scelte fatte. I PG devono sentire che
      avrebbero potuto fare meglio — magari se avessero agito prima (legare al
      Contatore).
    rischio: >
      Se ogni vittoria è amara i giocatori si demoralizzano. Usare una volta per
      campagna, mai come pattern costante. Dopo una vittoria di Pirro, far seguire
      una vittoria pulita per compensare.
    usato_in: [Sconfiggere il Mostro, Tragedia, L'Assedio]
    puo_aver_bisogno_di: [Il Legame]
    vedi_anche: [Spalle al Muro, Il Contatore, Il Legame]

  - tipo: situazione
    nome: I Rinforzi (La Cavalleria)
    nome_en: The Cavalry / Big Damn Heroes
    nomi_alt: [La Cavalleria, Cavalry Arrives, Just in Time, Il Salvataggio all'Ultimo Secondo]
    descrizione: >
      Nel momento più buio, quando tutto sembra perduto, arrivano alleati
      inaspettati a ribaltare la situazione. L'aiuto deve essere stato guadagnato
      prima (azioni passate dei PG) oppure è un NPC che ripaga un debito. Non è
      un deus ex machina se è stato preparato — è il payoff di un setup precedente.
    esempi:
      - "I Rohirrim a Helm's Deep — Il Signore degli Anelli (arrivano all'alba del quinto giorno)"
      - "Han Solo torna alla Morte Nera — Star Wars"
      - "Le Aquile — Il Signore degli Anelli (il salvataggio finale)"
      - "Gandalf al Fosso di Helm — Le Due Torri (prima luce del quinto giorno)"
      - "Avengers Assemble — Endgame (tutti i portali si aprono)"
    uso_dnd: >
      I PG stanno perdendo la battaglia dell'Assedio. Arrivano alleati — MA solo
      se i PG hanno fatto qualcosa nei moduli precedenti per guadagnarsi quel
      supporto (salvato un villaggio, convinto una fazione, liberato prigionieri).
      Se non lo hanno fatto, i rinforzi non arrivano. Legare al Contatore: soglia
      fiducia raggiunta → rinforzi. È il payoff dell'investimento relazionale.
    rischio: >
      Se arrivano "gratis" è un deus ex machina e i giocatori si sentono
      irrilevanti. Regola: i rinforzi devono essere stati GUADAGNATI. Il DM deve
      poter dire "ricordate quando avete aiutato il clan dei nani? Eccoli."
    usato_in: [L'Assedio, Sconfiggere il Mostro, La Corsa Contro il Tempo]
    vedi_anche: [Il Contatore, Il Legame, L'Alleanza col Nemico]


  - tipo: situazione
    nome: Il Piano Perfetto del Villain
    nome_en: Xanatos Gambit
    nomi_alt: [Xanatos Gambit, Il Piano Win-Win, Checkmate Plan, Piano Infallibile]
    descrizione: >
      Il villain ha un piano in cui tutti gli esiti prevedibili lo avvantaggiano —
      inclusi quelli che sembrano una sconfitta. Se i PG lo fermano, guadagna
      comunque qualcosa. Se non lo fermano, vince alla grande. L'unico modo per
      batterlo è trovare un corso d'azione che non aveva previsto. Rende il villain
      terrificante perché sembra sempre un passo avanti.
    esempi:
      - "David Xanatos — Gargoyles (il tropo prende il suo nome)"
      - "Palpatine — Star Wars prequel (che i Jedi vincano o perdano la guerra, lui vince)"
      - "Ozymandias — Watchmen (il piano è già completato quando gli eroi lo scoprono)"
      - "Petyr Baelish — Game of Thrones (chaos is a ladder)"
      - "Il Joker — The Dark Knight (ogni esito della scelta delle due barche lo avvantaggia)"
      - "Light Yagami — Death Note (piani a cascata con fallback)"
    uso_dnd: >
      Il villain ha un piano che funziona sia se i PG intervengono sia se non lo
      fanno. Esempio: il villain lancia un attacco al villaggio (se i PG difendono
      il villaggio, lui ruba l'artefatto incustodito; se i PG vanno all'artefatto,
      il villaggio cade e lui recluta i sopravvissuti). I PG devono trovare una
      soluzione creativa non prevista. Richiede un villain intelligente — documentare
      il piano nelle note DM.
    rischio: >
      Se il villain vince SEMPRE i giocatori si frustreranno. Regola: il piano deve
      avere una falla che i PG possono scoprire con ingegno o indizi (Three Clue
      Rule). Il piano è "perfetto" solo finché i PG non trovano la variabile imprevista.
    usato_in: [Sconfiggere il Mostro, Il Mistero]
    vedi_anche: [Il Signore Oscuro, Spalle al Muro, La Regola dei Tre Indizi]

  - tipo: tecnica
    nome: Il Piano Non Detto
    nome_en: Unspoken Plan Guarantee
    nomi_alt: [The Secret Plan, Piano Segreto, Trust the Party, Il Piano che Funziona]
    descrizione: >
      Principio narrativo: se i personaggi spiegano il piano in dettaglio al
      pubblico, fallirà. Se dicono solo "ho un'idea" senza spiegare, funzionerà.
      In D&D: se i giocatori pianificano a lungo, il DM conosce il piano e può
      (involontariamente) preparare contromisure. Come tecnica di scrittura per
      i villain: non far monologare il villain sui suoi piani — farlo agire.
    esempi:
      - "Ocean's Eleven — film (il piano non viene mostrato, funziona)"
      - "Mission: Impossible — franchise (il piano dettagliato fallisce sempre al primo contatto)"
      - "I villain monologanti — qualsiasi film (spiegano il piano → vengono fermati)"
      - "Ogni heist movie — il piano mostrato = fallimento garantito"
    uso_dnd: >
      Due applicazioni: (1) Per i PG: se pianificano, premiare la pianificazione,
      non punirla. Non invalidare ogni dettaglio del piano. (2) Per il villain:
      NON far monologare il villain sui suoi piani. Far scoprire il piano ai PG
      pezzo per pezzo tramite indizi. Un villain che spiega tutto è un villain
      che sta per perdere.
    rischio: >
      Non usare come scusa per non preparare i piani del villain. Il piano deve
      esistere nelle note DM — semplicemente non viene esposto ai PG in un
      monologone.
    usato_in: [L'Infiltrazione, Il Piano Perfetto del Villain]
    vedi_anche: [Il Piano Perfetto del Villain, L'Infiltrazione]

  - tipo: tecnica
    nome: Il Figurante di Čechov
    nome_en: Chekhov's Gunman
    nomi_alt: [Chekhov's Gunman, L'Extra che Ritorna, Il Comparsa Importante]
    sottocaso_di: Il Fucile di Čechov
    descrizione: >
      Un personaggio apparentemente insignificante introdotto all'inizio (il
      mercante al tavolo, la guardia alla porta, il mendicante all'angolo) si
      rivela cruciale più avanti — come il villain, la chiave per risolvere il
      mistero, o l'unico testimone. È il Fucile di Čechov applicato alle persone.
      Combina setup/payoff con il piacere della rilettura ("era lì dall'inizio!").
    esempi:
      - "Neville Longbottom — Harry Potter (sembra un figurante, uccide l'ultimo Horcrux)"
      - "Il mendicante all'inizio — innumerevoli film noir (era il detective/villain)"
      - "Arya e il Dio dai Mille Volti — Game of Thrones (addestramento → uccide il Night King)"
      - "Alfred Borden — The Prestige (il gemello era in scena dall'inizio)"
      - "Il prigioniero nella cella accanto — tropo D&D classico"
    uso_dnd: >
      Introdurre un NPC minore nei primi moduli (il taverniere, il mercante, il
      prigioniero liberato) che si rivelerà importante dopo. Il DM sa già chi è —
      i PG no. Lasciare 1-2 dettagli sottili che a posteriori erano indizi (un
      anello insolito, una conoscenza fuori posto, una reazione strana a un nome).
      Funziona benissimo col Mistero e col Falso Antagonista.
    rischio: >
      Se l'NPC è troppo insignificante i PG non lo ricorderanno al momento del
      reveal. Dargli almeno un tratto memorabile (nome buffo, tic, battuta) per
      fissarlo in memoria senza renderlo sospetto.
    usato_in: [Il Mistero, Il Colpo di Scena, L'Agnizione]
    vedi_anche: [Il Fucile di Čechov, La Promozione, Il Falso Antagonista]


  - tipo: tecnica
    nome: Plot Concatenati (Quest Intrecciate)
    nome_en: Quest Chain / Interlocking Plots / Braided Narrative
    nomi_alt: [Quest Chain, Side Quest Intrecciate, Trama a Treccia, Converging Plotlines]
    descrizione: >
      La soluzione di una quest porta a un'altra quest, che a sua volta fornisce
      informazioni o risorse per risolvere la prima o la principale. I fili
      narrativi si intrecciano anziché procedere in sequenza lineare. Pattern
      comuni: (1) Lineare A→B→C — ogni quest sblocca la successiva; (2) Intreccio
      ABAB — la quest A porta alla B, che risolve un pezzo di A, che porta a B
      più a fondo; (3) Anello ABBA — si parte da A, si devia in B che risolve B
      e poi completa A; (4) Convergente ABC→D — tre fili apparentemente
      indipendenti convergono nel climax. Le side quest non sono "filler" ma
      pezzi del puzzle principale visti da angolazioni diverse.
    esempi:
      - "Il Signore degli Anelli — la Compagnia si divide in tre fili che convergono"
      - "The Witcher 3 — videogioco (le quest secondarie influenzano il finale)"
      - "Breaking Bad — ogni sub-plot alimenta il main plot"
      - "Game of Thrones — decine di fili che si intrecciano e convergono"
      - "Baldur's Gate 3 — quest dei companion intrecciate con la main quest"
      - "Node-based design — The Alexandrian (ogni nodo raggiungibile da più percorsi)"
    uso_dnd: >
      Schemi pratici per saga 4 moduli: (A→B→A→B) il modulo 1 introduce il
      problema A, il modulo 2 introduce B che sembra indipendente, il modulo 3
      mostra che A e B sono collegati, il modulo 4 li risolve entrambi. Oppure
      (ABC→D): tre fazioni/quest nei primi 3 moduli convergono nel climax del 4°.
      La chiave: ogni quest deve avere valore autonomo (soddisfacente anche da
      sola) MA aggiungere un pezzo al puzzle complessivo. Documentare i
      collegamenti in una mappa dei nodi nel PlanBook.
    rischio: >
      Se troppo intricato i giocatori perdono il filo. Regola: max 2-3 fili
      contemporanei. Ogni sessione deve avere UN obiettivo chiaro anche se
      contribuisce a più fili. Se i PG sono confusi, un NPC può riassumere.
    usato_in: [La Cerca, Sconfiggere il Mostro]
    vedi_anche: [Il Fucile di Čechov, Il Contatore, La Regola dei Tre Indizi]


  - tipo: situazione
    nome: Il Patto col Diavolo
    nome_en: Deal with the Devil / Faustian Bargain
    nomi_alt: [Faustian Bargain, Patto Faustiano, Il Prezzo da Pagare, The Devil's Offer]
    descrizione: >
      Un personaggio ottiene qualcosa che desidera disperatamente (potere,
      conoscenza, salvezza di qualcuno) in cambio di un prezzo terribile — la
      propria anima, un servizio futuro, un sacrificio. Il patto sembra
      vantaggioso al momento ma il costo si rivela devastante. L'entità con cui
      si patta è sempre più furba del contraente.
    esempi:
      - "Faust — Goethe/Marlowe (il patto originale: conoscenza in cambio dell'anima)"
      - "Anakin e Palpatine — Star Wars (potere per salvare Padmé, costo: diventare Vader)"
      - "Ursula e Ariel — La Sirenetta (voce in cambio di gambe)"
      - "Rumplestiltskin — fiabe (aiuto in cambio del primogenito)"
      - "Warlock patron — D&D (il patto è una meccanica di classe)"
      - "Robert Johnson al crocevia — leggenda blues (talento in cambio dell'anima)"
    uso_dnd: >
      Un'entità (demone, fey, patrono) offre ai PG qualcosa di cui hanno
      disperatamente bisogno. Il prezzo sembra gestibile ("solo un piccolo favore
      futuro") ma si rivela progressivamente orribile. Funziona come hook per
      interi archi: il PG accetta ora, paga 3 moduli dopo. Il contratto può avere
      clausole nascoste o interpretazioni letterali devastanti.
    rischio: >
      Se il patto non ha via d'uscita è frustrante. Regola: deve esistere un modo
      (difficile, costoso) per spezzare il patto — un'altra quest. Non togliere
      mai agency al PG senza il consenso del giocatore.
    usato_in: [Tragedia, Sconfiggere il Mostro]
    vedi_anche: [Spalle al Muro, La Soglia di Godzilla, Il Contatore]

  - tipo: situazione
    nome: La Soglia di Godzilla (Il Male Minore)
    nome_en: Godzilla Threshold / Lesser Evil
    nomi_alt: [Lesser of Two Evils, Male Minore, Desperate Measures, Nuclear Option]
    descrizione: >
      La situazione è talmente disperata che l'unica soluzione è ricorrere a
      qualcosa di normalmente impensabile: liberare un mostro imprigionato per
      combatterne uno peggiore, usare un artefatto maledetto, allearsi col secondo
      villain più pericoloso per fermare il primo. È il momento in cui la cura è
      quasi peggio della malattia, ma non c'è alternativa.
    esempi:
      - "Liberare Godzilla per combattere i MUTO — film 2014 (il tropo prende il nome)"
      - "Usare l'Unico Anello — Il Signore degli Anelli (tentazione costante, rifiutata)"
      - "Liberare i criminali per difendere la città — Suicide Squad"
      - "Usare la Bomba Atomica — storia (Hiroshima: male minore?)"
      - "Aprire il portale per il Feywild per scappare dal Shadowfell — tropo D&D"
    uso_dnd: >
      I PG hanno esaurito le opzioni sicure. Il DM presenta LA soluzione, ma con
      un costo enorme e chiaro: "Potete spezzare il sigillo del Balor per usarlo
      contro l'esercito. Ma poi dovrete gestire il Balor." La scelta deve essere
      dei PG — mai forzata. Se accettano, le conseguenze diventano il prossimo
      arco narrativo. Lega bene con Il Contatore (soglia critica raggiunta →
      opzione estrema disponibile).
    rischio: >
      Se l'opzione "estrema" non ha conseguenze reali, è un deus ex machina
      mascherato. Il male minore DEVE avere effetti collaterali visibili e duraturi.
    usato_in: [Sconfiggere il Mostro, L'Assedio, Il Male Sigillato]
    vedi_anche: [Spalle al Muro, Il Patto col Diavolo, L'Alleanza col Nemico, Il Contatore]

  - tipo: situazione
    nome: Lo Stallo
    nome_en: Mexican Standoff / Standoff
    nomi_alt: [Mexican Standoff, L'Impasse, Stallo alla Messicana, Deadlock, Situazione di Stallo]
    descrizione: >
      Tre o più parti si fronteggiano, ognuna con il potere di distruggere le
      altre ma anche la certezza di essere distrutta se agisce per prima. Nessuno
      può muoversi senza scatenare il caos. La tensione è massima, la soluzione
      richiede diplomazia, inganno, o il coraggio di essere il primo a riporre
      l'arma. A differenza di Spalle al Muro (scelta binaria), qui ci sono 3+
      parti con interessi incrociati.
    esempi:
      - "Il Buono, il Brutto e il Cattivo — finale al cimitero (il triello)"
      - "Reservoir Dogs — Tarantino (tutti puntano le pistole a tutti)"
      - "Game of Thrones — le grandi case in equilibrio di potere"
      - "La Guerra Fredda — storia (MAD: mutua distruzione assicurata)"
      - "Il Consiglio di Elrond — Il Signore degli Anelli (chi porta l'Anello?)"
    uso_dnd: >
      I PG arrivano in una situazione dove 3 fazioni (inclusi loro) si
      fronteggiano. Tutti vogliono lo stesso oggetto/posizione. Se qualcuno
      attacca, gli altri due reagiscono — nessuno vince. I PG devono risolvere
      diplomaticamente, ingannare una fazione, o trovare un compromesso. Ideale
      per moduli di intrigo politico. Il combattimento è l'opzione peggiore — il
      gioco è nella negoziazione.
    rischio: >
      Se i giocatori si annoiano nella negoziazione e decidono di "menare", lo
      stallo si rompe e diventa un combat caotico. Prevedere anche quell'esito
      (con conseguenze: la terza fazione fugge col MacGuffin, o tutti perdono).
    usato_in: [Il Mistero, La Cerca]
    vedi_anche: [Spalle al Muro, L'Alleanza col Nemico, Il Piano Perfetto del Villain]


  - tipo: plot
    nome: La Vendetta
    nome_en: Revenge (Tobias)
    nomi_alt: [Vengeance, La Resa dei Conti, Payback, Blood Feud, Faida]
    descrizione: >
      Il protagonista subisce un torto terribile (morte di una persona amata,
      distruzione della casa, tradimento) e dedica la sua esistenza a punire il
      responsabile. Il viaggio verso la vendetta lo trasforma — alla fine deve
      decidere se il prezzo pagato ne valeva la pena. La vendetta consumata
      spesso lascia vuoto, non soddisfazione.
    esempi:
      - "Il Conte di Montecristo — Dumas (la vendetta perfetta, pianificata per anni)"
      - "Inigo Montoya — The Princess Bride ('Hello, my name is Inigo Montoya...')"
      - "Kill Bill — Tarantino (lista di persone da eliminare)"
      - "John Wick — film (vendetta per un cane)"
      - "Hamlet — Shakespeare (vendetta per il padre, esitazione fatale)"
      - "Gladiator — film (Maximus contro Commodo)"
      - "The Last of Us Part II — Ellie insegue vendetta e paga tutto"
    uso_dnd: >
      Il hook dell'avventura è il torto iniziale (il villain brucia il villaggio
      dei PG, uccide un NPC amato). Ogni modulo avvicina i PG al villain. La
      domanda morale: quando lo raggiungono, la vendetta è ancora giustificata?
      Il villain ha ragioni proprie? I PG sono diventati peggio di lui nel
      perseguirlo? Funziona per campagne con arco personale forte.
    rischio: >
      Se la vendetta è l'unica motivazione, diventa monodimensionale. Aggiungere
      complicazioni: il villain ha una famiglia, il torto iniziale era un
      malinteso, qualcun altro soffre per la caccia dei PG.
    usato_in: []
    puo_aver_bisogno_di: [La Costruzione dell'Odio]
    vedi_anche: [Tragedia, Spalle al Muro, Il Legame]

  - tipo: plot
    nome: La Rivalità
    nome_en: Rivalry (Tobias)
    nomi_alt: [La Competizione, The Contest, Il Duello, Nemesis Simmetrica]
    descrizione: >
      Due personaggi (o gruppi) di pari forza competono per lo stesso obiettivo:
      un trono, un amore, un titolo, un artefatto. Non è bene contro male —
      entrambi hanno ragioni valide. Il conflitto scala finché uno dei due perde
      tutto, oppure trovano un modo per coesistere. La tensione viene dalla
      simmetria: il rivale è uno specchio del protagonista.
    esempi:
      - "Amadeus — film (Mozart vs Salieri)"
      - "Rocky vs Apollo Creed — film (rivalità che diventa rispetto)"
      - "Sherlock Holmes vs Moriarty — Conan Doyle (intelletti pari)"
      - "Achille vs Ettore — Iliade"
      - "Captain America vs Iron Man — Civil War (entrambi hanno ragione)"
      - "Naruto vs Sasuke — anime (rivali che si completano)"
    uso_dnd: >
      Un altro gruppo di avventurieri compete per lo stesso obiettivo. Oppure un
      NPC è il rivale diretto di un PG (stesso maestro, stessa guild, stessa
      amata). Il rivale non è il villain — è un antagonista con cui si può
      dialogare, fare tregua, o perdere con dignità. Può diventare alleato contro
      il vero villain (vedi Alleanza col Nemico). Ideale per tornei, gare, corse.
    rischio: >
      Se il rivale è troppo forte è un villain. Se è troppo debole è irrilevante.
      Deve essere esattamente alla pari dei PG — e crescere con loro.
    usato_in: []
    vedi_anche: [L'Alleanza col Nemico, Lo Stallo]

  - tipo: plot
    nome: La Tentazione (La Discesa)
    nome_en: Temptation / Descent into Darkness
    nomi_alt: [La Corruzione, Corruption Arc, Slippery Slope, La Caduta Graduale]
    descrizione: >
      Il protagonista è attratto da qualcosa di proibito — potere, conoscenza,
      immortalità, un oggetto maledetto. Non è un patto offerto dall'esterno
      (quello è il Patto col Diavolo): qui la tentazione viene da dentro. Ogni
      passo verso l'obiettivo proibito corrompe un po' di più, ma il personaggio
      si convince che "ancora un po' non fa male". La discesa è graduale e
      autoinflitta.
    esempi:
      - "Gollum/Sméagol — Il Signore degli Anelli (l'Anello lo consuma gradualmente)"
      - "Walter White — Breaking Bad (ogni scelta lo porta più in basso)"
      - "Anakin Skywalker — Star Wars (il lato oscuro come droga)"
      - "Dorian Gray — Wilde (la bellezza eterna ha un prezzo)"
      - "Arthas/Lich King — Warcraft (prende Frostmourne 'per proteggere il suo popolo')"
      - "Dr. Jekyll — Stevenson (la formula libera il male interiore)"
    uso_dnd: >
      Un artefatto maledetto che dà potere crescente ma corrompe (legare al
      Contatore: ogni uso aggiunge 1 corruzione). Un NPC che scende gradualmente
      verso il male e i PG possono salvare o condannare. Oppure un PG stesso
      (con consenso del giocatore) è tentato da un potere. La domanda: a che
      punto ti fermi?
    rischio: >
      Non togliere mai il controllo a un PG senza il consenso esplicito del
      giocatore. La corruzione deve essere una scelta consapevole, non
      un'imposizione. Funziona meglio su NPC o come offerta facoltativa ai PG.
    usato_in: []
    vedi_anche: [Tragedia, Il Patto col Diavolo, Il Contatore, Rinascita]


  - tipo: situazione
    nome: Il Branco di Disadattati
    nome_en: Ragtag Bunch of Misfits
    nomi_alt: [Motley Crew, The Unlikely Heroes, Band of Misfits, La Squadra Improbabile]
    descrizione: >
      Un gruppo di persone che non hanno nulla in comune (e spesso si detestano)
      è costretto a collaborare per un obiettivo. Nessuno di loro è l'eroe
      ideale — sono reietti, criminali, incompetenti, o semplicemente nel posto
      sbagliato al momento sbagliato. La forza del gruppo emerge dalle differenze.
      È la situazione di partenza di quasi ogni party D&D.
    esempi:
      - "Guardiani della Galassia — MCU (criminali, un albero e un procione salvano la galassia)"
      - "The Dirty Dozen — film (condannati a morte mandati in missione)"
      - "La Compagnia dell'Anello — Il Signore degli Anelli (razze in conflitto unite)"
      - "Suicide Squad — DC (villain costretti a cooperare)"
      - "Firefly/Serenity — serie TV (disertori e fuorilegge nello spazio)"
      - "Ocean's Eleven — film (specialisti improbabili)"
    uso_dnd: >
      È la situazione standard di D&D: un nano, un elfo, un tiefling e un halfling
      entrano in una taverna. Usare consapevolmente: il primo modulo dovrebbe
      costringere personaggi diversi a collaborare (prigione condivisa, nave che
      affonda, nemico comune). Le tensioni interne sono carburante per il roleplay.
    rischio: >
      Se le tensioni non si risolvono mai, il gruppo si sfascia. Prevedere un
      momento nel modulo 1-2 dove la collaborazione produce un successo che
      nessuno avrebbe ottenuto da solo.
    usato_in: [La Cerca, Sconfiggere il Mostro, Da Povero a Ricco]
    vedi_anche: [L'Alleanza col Nemico, Il Companion Fedele]

  - tipo: situazione
    nome: Il Luogo Impossibile
    nome_en: Eldritch Location / Alien Geometry
    nomi_alt: [Geometria Non Euclidea, Non-Euclidean Space, Il Luogo Alieno, Lovecraftian Space]
    descrizione: >
      I PG entrano in un luogo che non obbedisce alle leggi normali della realtà.
      La geometria è sbagliata, il tempo scorre diversamente, le regole fisiche
      cambiano stanza per stanza. Non è un dungeon difficile — è un posto
      *sbagliato*. L'orrore viene dall'incomprensibilità, non dalla potenza dei
      nemici. La vera sfida è mantenere la sanità e trovare l'uscita.
    esempi:
      - "La Casa di Carcosa — Lovecraft/Chambers (geometrie impossibili)"
      - "La Zona — Stalker di Tarkovsky (le regole cambiano)"
      - "Il Sottosopra — Stranger Things (mondo specchio corrotto)"
      - "La Casa di Foglie — Danielewski (la casa è più grande dentro che fuori)"
      - "Il Far Realm — D&D (piano di follia aliena)"
      - "Il Labirinto — film 1986 (spazio illogico)"
    uso_dnd: >
      Un dungeon dove le mappe non funzionano: le stanze si spostano, i corridoi
      tornano su sé stessi, il tempo nella stanza A scorre 10x rispetto alla
      stanza B. Meccaniche: tiri Saggezza per non perdere la direzione, Stress
      Effects per esposizione prolungata. Usare con parsimonia — un modulo intero,
      non di più. Ideale per Feywild, Far Realm, domini di Ravenloft.
    rischio: >
      Se i giocatori si sentono persi senza possibilità di orientarsi, è
      frustrante. Dare regole interne scopribili: "le porte blu vanno avanti, le
      rosse tornano indietro" — il luogo è alieno ma ha una logica.
    usato_in: [Viaggio e Ritorno, La Cerca]
    vedi_anche: [Il Male Sigillato, La Fuga dalla Prigione]

  - tipo: situazione
    nome: Il Pesce fuor d'Acqua
    nome_en: Fish out of Water
    nomi_alt: [Stranger in a Strange Land, L'Estraneo, Culture Clash, Lo Spaesato]
    descrizione: >
      Un personaggio si ritrova in un ambiente completamente estraneo dove le sue
      competenze non servono e le regole sociali sono incomprensibili. Il barbaro
      alla corte del re, il mago nella giungla senza componenti, il contadino in
      una città di intrighi. L'umorismo e la tensione nascono dall'inadeguatezza —
      ma anche dalla prospettiva fresca che il "pesce" porta nell'ambiente.
    esempi:
      - "Thor sulla Terra — MCU (dio nordico al supermercato)"
      - "Crocodile Dundee — film (australiano a New York)"
      - "Elf — film (Will Ferrell nel mondo reale)"
      - "Captain America al risveglio — MCU (uomo del 1940 nel 2012)"
      - "Un americano a Parigi — qualsiasi film di viaggio"
      - "Legolas conta i nemici — Il Signore degli Anelli (elfo tra umani)"
    uso_dnd: >
      I PG abituati al dungeon crawl si trovano a un ballo di corte dove l'arma
      è l'etichetta. O viceversa: nobili mandati nella foresta selvaggia. Funziona
      come cambio di ritmo — un modulo dove le skill utili sono completamente
      diverse dal solito. Costringe i giocatori a uscire dalla comfort zone.
    rischio: >
      Se un PG è completamente escluso per un intero modulo, non è divertente.
      Prevedere almeno un momento dove ogni PG brilla nel contesto alieno ("il
      barbaro risolve la disputa diplomatica... con un braccio di ferro").
    usato_in: [Viaggio e Ritorno, Commedia degli Errori]
    vedi_anche: [Il Branco di Disadattati, Commedia degli Errori]


  - tipo: relazione
    nome: La Nemesi
    nome_en: The Nemesis / Arch-Enemy
    nomi_alt: [L'Arcinemico, Arch-Nemesis, Il Rivale Mortale, Nemesi Personale]
    descrizione: >
      Il nemico personale e ricorrente di un PG o del party. Non è il BBEG della
      campagna — è un avversario alla pari che torna, cresce, e ha un legame
      specifico col protagonista. Si conoscono, si rispettano (a modo loro), e il
      conflitto è personale. Può essere un ex-alleato, un rivale di scuola, o
      qualcuno che il PG ha danneggiato in passato.
    esempi:
      - "Sherlock Holmes e Moriarty — Conan Doyle (intelletti speculari)"
      - "Batman e Joker — DC (interdipendenti)"
      - "Harry Potter e Draco Malfoy — HP (nemesi scolastica, non il BBEG)"
      - "Vegeta per Goku — Dragon Ball (nemesi che diventa alleato)"
      - "Javert per Jean Valjean — Les Misérables"
      - "Il T-1000 — Terminator 2 (nemesi implacabile)"
    uso_dnd: >
      NPC nemico ricorrente che fugge alla fine di ogni modulo, cresce di potere
      come i PG, e ha una ragione personale per odiarli. Sopravvive almeno 2-3
      incontri prima dello scontro finale. Può evolversi in alleato o morire in
      modo significativo.
    rischio: >
      Se scappa troppe volte i giocatori si frustreranno. Dare piccole vittorie
      contro la nemesi prima dello scontro finale. Max 3 fughe poi deve cadere.
    usato_in: [La Vendetta, La Rivalità, Sconfiggere il Mostro]
    vedi_anche: [La Rivalità, Il Signore Oscuro, L'Alleanza col Nemico]

  - tipo: personaggio
    nome: Il Buon Diavolo (L'Antagonista Innocuo)
    nome_en: Harmless Villain / Ineffectual Sympathetic Villain
    nomi_alt: [Il Cattivo Simpatico, Comic Villain, Lovable Rogue, Il Nemico Buffo]
    descrizione: >
      Un "nemico" sostanzialmente innocuo che, volente o nolente, finisce per
      aiutare i PG. Può essere un villain incompetente i cui piani falliscono
      sempre (e i fallimenti producono effetti collaterali utili), un avversario
      burocratico che ostacola per forma ma non per malvagità, o un mostro
      spaventoso nell'aspetto ma bonario nella sostanza.
    esempi:
      - "Team Rocket — Pokémon (villain incompetenti che occasionalmente aiutano)"
      - "Zenigata — Lupin III (poliziotto nemico che a volte salva Lupin)"
      - "Draco Malfoy — Harry Potter (nemico che non riesce mai a fare davvero del male)"
      - "Il Principe Zuko (prima metà) — Avatar (insegue l'Avatar ma fallisce sempre)"
      - "Wile E. Coyote — Looney Tunes (il villain che non vince mai)"
      - "Gollum guida Frodo — Il Signore degli Anelli (nemico che serve involontariamente)"
    uso_dnd: >
      NPC che ostacola il party per ragioni burocratiche/personali/comiche ma non
      è mai una vera minaccia. Può fornire informazioni involontariamente, creare
      diversioni utili, o diventare alleato se trattato con gentilezza. Ideale come
      comic relief in avventure tese. Può evolversi in vero alleato o vero nemico.
    rischio: >
      Se troppo ridicolo perde ogni funzione narrativa. Dargli almeno un momento
      di competenza o dignità per sessione.
    usato_in: [Commedia degli Errori, La Cerca]
    vedi_anche: [Il Trickster, La Promozione, La Nemesi]

  - tipo: personaggio
    nome: Il Dio Indifferente (La Forza Cosmica)
    nome_en: Cosmic Indifference / Eldritch Abomination / Above Good and Evil
    nomi_alt: [Lovecraftian Horror, Il Cosmo Indifferente, Blue and Orange Morality, Entità Cosmica]
    descrizione: >
      Un'entità di potere immenso che non è né buona né cattiva — semplicemente
      non si cura dei mortali. Non è un villain perché non agisce per malvagità;
      è un ostacolo perché la sua semplice esistenza o i suoi movimenti causano
      devastazione. Non può essere sconfitta con la forza — solo evitata,
      reindirizzata, o placata.
    esempi:
      - "Cthulhu — Lovecraft (dorme, e il suo sogno devasta)"
      - "Shai-Hulud — Dune (i vermi delle sabbie non sono cattivi, sono ecologia)"
      - "Galactus — Marvel (mangia pianeti per necessità, non per crudeltà)"
      - "Il Tarrasque — D&D (forza della natura, non un villain)"
      - "La Tempesta — narrativa marinara (il mare non ti odia, è indifferente)"
      - "HAL 9000 — 2001 (segue la sua logica, non è malvagio)"
    uso_dnd: >
      La minaccia non ha una motivazione comprensibile né può essere "sconfitta".
      I PG devono trovare un modo per sopravvivere, deviare, o sigillare l'entità.
      Funziona per avventure lovecraftiane o per creare insignificanza cosmica.
      Il combattimento diretto non è un'opzione.
    rischio: >
      Se i PG non possono interagire in nessun modo, si sentono impotenti. Dare
      sempre un'azione possibile (rituale, via di fuga, sacrificio che la placa).
    usato_in: [Il Male Sigillato, Sconfiggere il Mostro]
    vedi_anche: [Il Signore Oscuro, Il Male Sigillato, Il Luogo Impossibile]

  - tipo: personaggio
    nome: Il Luogotenente (Il Braccio Destro)
    nome_en: The Dragon / Lieutenant / Right-Hand Man
    nomi_alt: [The Dragon, Il Secondo, Right-Hand Man, Il Primo della Guardia, Il Braccio Destro]
    descrizione: >
      Il braccio destro del Signore Oscuro — il nemico che i PG affrontano davvero
      per la maggior parte dell'avventura. Più presente, più personale, più "fisico"
      del boss finale. Può essere leale fino alla morte, ambizioso e pronto a
      tradire il suo padrone, o riluttante e servire per paura.
    esempi:
      - "Darth Vader — Star Wars (luogotenente dell'Imperatore, più iconico del boss)"
      - "Saruman — Il Signore degli Anelli (luogotenente di Sauron, antagonista diretto)"
      - "Bellatrix Lestrange — Harry Potter (fanatica di Voldemort)"
      - "Il Nazgûl Re Stregone — Il Signore degli Anelli"
      - "Azula — Avatar (luogotenente del Fire Lord, più pericolosa di lui)"
      - "Oddjob — James Bond (braccio destro del villain)"
    uso_dnd: >
      Il nemico dei moduli intermedi. I PG lo affrontano prima di arrivare al BBEG.
      Varianti: (1) leale — muore per il padrone; (2) ambizioso — può tradire il
      BBEG; (3) riluttante — serve per paura, i PG possono liberarlo. Ogni variante
      cambia il finale.
    rischio: >
      Se il luogotenente è più interessante del BBEG, il finale sarà deludente.
      Bilanciare: il luogotenente è il nemico fisico, il BBEG è la mente.
    usato_in: [Sconfiggere il Mostro, La Cerca, Il Falso Finale]
    vedi_anche: [Il Signore Oscuro, La Nemesi, Il Tradimento dell'Alleato]


  - tipo: relazione
    nome: Il Nemico Onorevole (L'Avversario Degno)
    nome_en: Worthy Opponent / Noble Demon / Friendly Enemy
    nomi_alt: [Noble Demon, L'Avversario con Onore, Friendly Enemy, Il Cavaliere Nemico]
    descrizione: >
      Un nemico che rispetta i PG e combatte con un codice d'onore. Non tradisce,
      non colpisce alle spalle, non uccide gli innocenti (o almeno non volentieri).
      Potrebbe essere un alleato in circostanze diverse. Il conflitto non è
      personale: è ideologico, politico, o di dovere. Entrambe le parti
      riconoscono il valore dell'altro.
    esempi:
      - "Hector — Iliade (difende Troia per dovere, non per odio)"
      - "Reinhard von Lohengramm — Legend of the Galactic Heroes"
      - "Magneto — X-Men (vuole proteggere i mutanti, non distruggere il mondo)"
      - "Zuko (seconda metà) — Avatar (nemico con onore che diventa alleato)"
      - "Char Aznable — Gundam (nemico affascinante con motivazioni comprensibili)"
    uso_dnd: >
      NPC antagonista che segue un codice: non attacca chi si arrende, rispetta i
      duelli, mantiene la parola data. I PG possono negoziare, sfidarlo a duello
      formale, o trovare un accordo. Se i PG si comportano in modo disonorevole,
      perde il rispetto e diventa più pericoloso.
    rischio: >
      Se troppo simpatico i giocatori non vorranno combatterlo. Dargli un
      obiettivo incompatibile con quello dei PG anche se ammirabile — il conflitto
      deve essere inevitabile.
    usato_in: [La Rivalità, Sconfiggere il Mostro, L'Alleanza col Nemico]
    vedi_anche: [La Nemesi, L'Anti-Villain, L'Alleanza col Nemico]

  - tipo: personaggio
    nome: L'Anti-Villain (Il Cattivo con Buone Ragioni)
    nome_en: Anti-Villain
    nomi_alt: [Well-Intentioned Extremist, Il Villain Comprensibile, Sympathetic Villain, Villain con una Causa]
    descrizione: >
      Un antagonista con obiettivi buoni o comprensibili ma metodi cattivi. O
      viceversa: obiettivi discutibili ma metodi onorevoli. I PG possono
      simpatizzare con le sue ragioni pur opponendosi alle sue azioni. È il
      villain che ti fa pensare "ha ragione, ma non così". Il suo scopo non è
      malvagio — è il modo di perseguirlo che lo rende antagonista.
    esempi:
      - "Thanos — MCU (vuole salvare l'universo, il metodo è il genocidio)"
      - "Magneto — X-Men (protegge i mutanti, opprime gli umani)"
      - "Il Conte di Montecristo — Dumas (vendetta giustificata, metodi spietati)"
      - "Killmonger — Black Panther (ha ragione sulla giustizia, torto sui metodi)"
      - "Ozymandias — Watchmen (uccide milioni per salvare miliardi)"
      - "Javert — Les Misérables (segue la legge senza pietà, ma è onesto)"
    uso_dnd: >
      Il villain ha una motivazione con cui i PG possono empatizzare. I PG
      possono scegliere di aiutarlo (cambiando i suoi metodi) anziché fermarlo.
      Oppure fermarlo e poi risolvere il problema alla radice che lo ha creato.
      Ideale per avventure moralmente grigie.
    rischio: >
      Se troppo simpatico i PG non lo affronteranno. Se troppo malvagio nei
      metodi perde la sfumatura. I metodi devono produrre vittime innocenti visibili.
    usato_in: [Sconfiggere il Mostro, La Vendetta, Spalle al Muro]
    vedi_anche: [Il Nemico Onorevole, Il Signore Oscuro, L'Alleanza col Nemico]

  - tipo: relazione
    nome: Lo Specchio (Il Doppio Oscuro)
    nome_en: Shadow Archetype / Evil Counterpart / Foil
    nomi_alt: [Evil Twin, Il Doppio, Dark Mirror, Il Riflesso Oscuro, Doppelgänger, Foil]
    descrizione: >
      Il nemico è una versione alternativa del protagonista — ciò che sarebbe
      diventato se avesse fatto scelte diverse. Stesse capacità, stessa origine,
      ma scelte opposte. Il confronto costringe il protagonista a chiedersi "cosa
      mi rende diverso da lui?". È lo specchio deformante che mostra il lato
      oscuro dell'eroe. In Vogler è l'Ombra (Shadow).
    esempi:
      - "Darth Vader per Luke — Star Wars (il padre è ciò che Luke potrebbe diventare)"
      - "Moriarty per Holmes — Conan Doyle (stesso intelletto, morale opposta)"
      - "Venom per Spider-Man — Marvel (stesso potere, nessun freno morale)"
      - "Dark Link — Zelda (letteralmente il doppio oscuro)"
      - "Walter White per Hank — Breaking Bad (cognato-specchio)"
      - "Andrew Ryan per Jack — Bioshock (padre/creatore come nemesi)"
    uso_dnd: >
      L'antagonista ha la stessa classe, background o origine di un PG — ma ha
      fatto la scelta sbagliata. Ex-compagno di accademia, ex-membro dello stesso
      ordine, gemello separato. Il confronto è filosofico: il villain mostra cosa
      succede se si cede alla tentazione. Il PG deve sconfiggere il suo "io possibile".
    rischio: >
      Se è troppo simile al PG rischia di sembrare un clone. Differenziare in un
      aspetto chiave. La somiglianza deve essere disturbante, non noiosa.
    usato_in: [La Vendetta, La Tentazione, La Rivalità]
    vedi_anche: [La Nemesi, La Tentazione, L'Eletto]


  - tipo: personaggio
    nome: Il Benefattore Misterioso
    nome_en: Mysterious Backer / Chessmaster Patron
    nomi_alt: [Il Patron Ombra, Secret Patron, The Chessmaster, Il Burattinaio Benevolo]
    descrizione: >
      Un potente alleato che aiuta i PG ma le cui motivazioni restano oscure.
      Fornisce risorse, informazioni, missioni — ma non spiega mai davvero
      perché. Sembra troppo generoso per non avere un'agenda nascosta. I PG
      beneficiano del suo aiuto ma non possono fidarsi completamente. Potrebbe
      rivelarsi il vero villain, un dio in incognito, o semplicemente qualcuno
      con un piano più grande in cui i PG sono pedine.
    esempi:
      - "Gandalf (visto dal punto di vista degli Hobbit) — Il Signore degli Anelli"
      - "Dumbledore — Harry Potter (manipola Harry per il 'bene superiore')"
      - "Nick Fury — MCU (recluta eroi senza dire tutto)"
      - "Mr. Wednesday — American Gods (dio che usa il protagonista)"
      - "Il Duca Leto — Dune (patron benevolo con agenda politica)"
      - "G-Man — Half-Life (aiuta per ragioni incomprensibili)"
    uso_dnd: >
      Il quest giver dell'avventura sa più di quanto dice. I PG ricevono missioni
      che sembrano disconnesse ma convergono verso un piano più grande. A metà
      campagna: la rivelazione delle vere motivazioni. Può essere genuinamente
      buono (il Mentore che protegge nascondendo la verità) o moralmente grigio
      (usa i PG come pedine sacrificabili). Ideale come patron di campagna.
    rischio: >
      Se non rivela mai niente i giocatori si frustreranno. Dare breadcrumb
      regolari. Al climax le motivazioni devono essere chiare — anche se ambigue.
    usato_in: [La Cerca, Sconfiggere il Mostro, Il Mistero]
    vedi_anche: [Il Mentore, La Talpa, Il Mutaforma]

  - tipo: relazione
    nome: L'Alleato Scomodo
    nome_en: Token Evil Teammate / Teeth-Clenched Teamwork
    nomi_alt: [Il Compagno Indesiderato, Uneasy Ally, Forced Companion, Il Male Necessario nel Gruppo]
    descrizione: >
      Un membro del gruppo che è chiaramente dalla parte sbagliata della morale
      ma utile alla causa. Tutti sanno che è pericoloso, nessuno si fida, ma le
      sue capacità sono indispensabili. La tensione viene dalla domanda costante:
      "quando ci tradirà?". A differenza della Talpa, non è infiltrato — è
      apertamente sgradevole ma tollerato per necessità.
    esempi:
      - "Jaime Lannister nella scorta di Brienne — Game of Thrones (nemico incatenato ma necessario)"
      - "Vegeta alleato dei buoni — Dragon Ball Z (aiuta ma potrebbe tradire in ogni momento)"
      - "Severus Snape come insegnante — Harry Potter (aiuta ma è odioso)"
      - "Riddick — Chronicles of Riddick (criminale utile in situazione disperata)"
      - "Loki negli Avengers — MCU (alleato di convenienza, zero fiducia)"
      - "Gollum come guida — Il Signore degli Anelli"
    uso_dnd: >
      NPC che il party è costretto a portare con sé: il prigioniero che conosce
      la strada, il criminale graziato in cambio di servizio, l'ex-nemico che ha
      le competenze necessarie. I PG devono sorvegliarlo, negoziare con lui, e
      decidere se fidarsi. Ogni riposo lungo è un momento di tensione ("è ancora lì?").
    rischio: >
      Se tradisce subito è banale. Se non tradisce mai è un companion normale.
      Il bello è l'ambiguità mantenuta — può redimersi O tradire, e i PG non
      sanno quale fino alla fine.
    usato_in: [L'Alleanza col Nemico, La Cerca, La Scorta]
    vedi_anche: [L'Alleanza col Nemico, Il Mutaforma, La Talpa, Il Companion Fedele]

  - tipo: relazione
    nome: L'Amico Velenoso
    nome_en: Poisonous Friend / Toxic Enabler
    nomi_alt: [Toxic Friend, L'Amico Dannoso, The Enabler, Il Protettore Soffocante]
    descrizione: >
      Un alleato genuino che vuole sinceramente il bene del protagonista ma i
      cui "aiuti" sono tossici, eccessivi, o moralmente ripugnanti. Uccide per
      proteggere, tortura per ottenere informazioni utili, elimina "ostacoli"
      senza chiedere. Le sue azioni sono sempre "per il tuo bene" ma creano
      problemi crescenti. Non è un traditore — è peggio: è un amico che fa
      cose orribili in tuo nome.
    esempi:
      - "Samwise Gamgee (versione estrema mai realizzata) — se avesse ucciso Gollum 'per proteggere Frodo'"
      - "Melisandre per Stannis — Game of Thrones (consigliera leale che lo porta a bruciare la figlia)"
      - "Walter White per Jesse — Breaking Bad (lo 'protegge' distruggendogli la vita)"
      - "Dolores Umbridge per il Ministero — Harry Potter (agisce per l'ordine, con metodi orribili)"
      - "Rasputin per la famiglia reale — storia russa (aiuto spirituale tossico)"
    uso_dnd: >
      NPC alleato che compie atrocità in nome del party senza chiedere permesso:
      avvelena il prigioniero che i PG stavano interrogando, brucia il villaggio
      "infetto" per proteggere la regione, uccide il testimone "per la vostra
      sicurezza". I PG devono decidere: tollerare l'efficienza brutale o fermarlo
      e perdere un alleato potente. Crea dilemmi morali senza richiedere un villain.
    rischio: >
      Se le azioni dell'amico velenoso non hanno conseguenze sui PG (reputazione,
      karma, reazioni NPC), perde mordente. Il mondo deve reagire: "siete voi
      che avete mandato quello che ha bruciato il villaggio?"
    usato_in: [Spalle al Muro, Tragedia, La Tentazione]
    vedi_anche: [Il Companion Fedele, Il Tradimento dell'Alleato, L'Alleato Scomodo]


  - tipo: personaggio
    nome: Il Redento (L'Espiatore)
    nome_en: The Atoner
    nomi_alt: [The Penitent, L'Ex-Villain, Il Riscattato, Redemption Seeker, L'Espiatore]
    descrizione: >
      Un personaggio che ha commesso atti terribili in passato e ora cerca di
      ripagare il suo debito. La redenzione non è garantita — deve essere
      guadagnata con azioni, sacrificio, e la consapevolezza che il danno fatto
      non può essere cancellato. Il suo passato lo insegue e altri potrebbero
      non perdonarlo mai.
    esempi:
      - "Zuko — Avatar: The Last Airbender (da villain a eroe, espiando)"
      - "Jaime Lannister — Game of Thrones (cerca di essere diverso dal Kingslayer)"
      - "Angel — Buffy/Angel (vampiro con anima che cerca redenzione)"
      - "Severus Snape — Harry Potter (tutta la vita come espiazione)"
      - "Jean Valjean — Les Misérables (ex-galeotto che si ricostruisce)"
      - "Darth Vader — Star Wars (redenzione finale con sacrificio)"
    uso_dnd: >
      NPC ex-villain che offre i suoi servizi al party per espiare. I PG devono
      decidere se fidarsi. Il passato torna sotto forma di vittime che chiedono
      giustizia, ex-alleati che lo cercano, o tentazioni di ricadere. Può essere
      anche il background di un PG (con consenso del giocatore).
    rischio: >
      Se la redenzione è troppo facile, perde peso. Il personaggio deve soffrire
      e il perdono non deve essere automatico. Almeno un NPC deve rifiutare di
      perdonarlo — sempre.
    usato_in: [Rinascita, La Vendetta, La Tentazione]
    vedi_anche: [L'Alleanza Oscillante, Rinascita, L'Anti-Villain]

  - tipo: personaggio
    nome: Il Corruttore
    nome_en: The Corrupter / Tempter
    nomi_alt: [Il Tentatore, The Devil on Your Shoulder, Mefistofele, Il Seduttore, The Whisperer]
    descrizione: >
      Un personaggio il cui ruolo è tentare, sedurre o corrompere altri —
      specialmente i PG o i loro alleati. Non combatte direttamente: offre, lusinga,
      instilla dubbi. Può essere un demone, un politico, un mercante, o
      semplicemente qualcuno con le parole giuste al momento sbagliato. È
      l'agente della Tentazione incarnato in un NPC.
    esempi:
      - "Sauron come Annatar — Il Silmarillion (si presenta come amico degli Elfi)"
      - "Palpatine per Anakin — Star Wars ('il lato oscuro è una via verso poteri...')"
      - "Iago — Otello (instilla gelosia con parole)"
      - "Wormtongue — Il Signore degli Anelli (sussurra al re corrompendolo)"
      - "Il serpente nel Giardino dell'Eden — Genesi"
      - "Mefistofele — Faust (offre tutto in cambio dell'anima)"
    uso_dnd: >
      NPC che offre scorciatoie ai PG: potere facile, informazioni gratuite, alleanze
      comode. Tutto ha un prezzo nascosto. Non è un combattimento — è un test di
      volontà. Se i PG accettano, le conseguenze arrivano gradualmente (legare al
      Contatore corruzione). Funziona bene come servitore del Signore Oscuro o come
      NPC indipendente con agenda propria.
    usato_in: [La Tentazione, Il Patto col Diavolo, Tragedia]
    vedi_anche: [Il Patto col Diavolo, La Tentazione, L'Amico Velenoso]

  - tipo: personaggio
    nome: Il Guardiano della Soglia
    nome_en: Threshold Guardian
    nomi_alt: [Gatekeeper, Il Portinaio, The Bouncer, Guardiano del Passaggio, Vogler Stage 5]
    descrizione: >
      Un personaggio (o creatura, o ostacolo) che blocca l'accesso al prossimo
      stadio dell'avventura. Non è necessariamente un nemico — può essere un test,
      un enigma, un burocrate, un guardiano che deve essere convinto. Superarlo
      dimostra che i PG sono pronti per ciò che viene dopo. In Vogler è uno stadio
      specifico del Viaggio dell'Eroe.
    esempi:
      - "La Sfinge — mitologia greca (enigma come prezzo del passaggio)"
      - "Il Balrog — Il Signore degli Anelli ('You shall not pass!')"
      - "Cerbero — mitologia (guardiano dell'Ade)"
      - "Il Guardiano del Ponte — Monty Python (domande per passare)"
      - "Hagrid — Harry Potter (introduce Harry al mondo magico, prima soglia)"
      - "Il buttafuori del club — qualsiasi film (devi dimostrare di appartenere)"
    uso_dnd: >
      All'ingresso di ogni dungeon/area importante: qualcosa che blocca. Non deve
      essere per forza un combattimento — può essere un enigma, una prova di
      coraggio, una negoziazione, un pagamento (in oro, sangue, o informazioni).
      Il superamento del guardiano è il "livello di preparazione" che i PG devono
      avere per l'area successiva.
    usato_in: [La Cerca, Sconfiggere il Mostro, Viaggio e Ritorno]
    vedi_anche: [Il Mentore, Il Luogo Impossibile]

  - tipo: situazione
    nome: La Crisi di Successione
    nome_en: Succession Crisis / Power Vacuum
    nomi_alt: [Vuoto di Potere, Game of Thrones, War of Succession, Il Trono Vacante]
    descrizione: >
      Un leader muore o scompare e il vuoto di potere scatena il caos. Più
      fazioni reclamano il trono/ruolo. I PG sono trascinati dentro come pedine,
      arbitri, o pretendenti. Nessun candidato è perfetto — ognuno ha vantaggi e
      difetti. La scelta dei PG determina chi governerà (e come).
    esempi:
      - "La Guerra delle Rose — storia inglese"
      - "Game of Thrones — l'intera serie (chi siede sul Trono di Spade?)"
      - "House of the Dragon — la Danza dei Draghi"
      - "Il Re Leone — Disney (Scar usurpa il trono)"
      - "Hamlet — Shakespeare (lo zio prende il trono)"
      - "Final Fantasy Tactics — guerra di successione tra nobili"
    uso_dnd: >
      Il re muore, 3 pretendenti si contendono il trono. Ogni fazione cerca di
      reclutare i PG. Le missioni cambiano in base a chi supportano. Nessun
      candidato è il "buono" assoluto. Le conseguenze della scelta si vedono per
      il resto della campagna. Ideale per avventure di intrigo politico.
    rischio: >
      Se i PG non si interessano alla politica, la crisi di successione li annoia.
      Dare un aggancio personale: un NPC amato è minacciato, uno dei pretendenti
      ha qualcosa che i PG vogliono.
    usato_in: [Tragedia, La Rivalità]
    vedi_anche: [Lo Stallo, Spalle al Muro, Il Contatore]

  - tipo: situazione
    nome: La Masquerade (Il Segreto del Mondo)
    nome_en: The Masquerade / Hidden World
    nomi_alt: [Il Mondo Nascosto, Secret World, Veil of Secrecy, Il Mondo Dietro il Mondo]
    descrizione: >
      Esiste un mondo segreto nascosto dietro quello visibile — magia, mostri,
      società segrete — e la popolazione comune non ne sa nulla. I PG sono tra i
      pochi a conoscere la verità. Devono agire mantenendo il segreto, oppure la
      rivelazione avrebbe conseguenze catastrofiche (panico, caccia alle streghe,
      crollo dell'ordine sociale).
    esempi:
      - "Il Mondo Magico — Harry Potter (nascosto ai Babbani)"
      - "The Matrix — il mondo reale vs la simulazione"
      - "Vampire: The Masquerade — GDR (vampiri nascosti tra gli umani)"
      - "Men in Black — film (alieni tra noi, la gente non sa)"
      - "Il Mondo Sotterraneo — Stranger Things (il Sottosopra)"
    uso_dnd: >
      I PG scoprono che dietro la facciata normale della città c'è una rete di
      cultisti/vampiri/fey. Agire apertamente causerebbe il panico. Devono operare
      in segreto, infiltrarsi, risolvere senza che la popolazione sappia. Combina
      bene con l'Infiltrazione e il Mistero.
    usato_in: [Il Mistero, L'Infiltrazione]
    vedi_anche: [L'Infiltrazione, Il Mistero, La Talpa]

  - tipo: situazione
    nome: Il Compito Impossibile
    nome_en: Impossible Task / Engagement Challenge
    nomi_alt: [Le 12 Fatiche, Herculean Task, Mission Impossible, La Prova di Ercole]
    descrizione: >
      I PG devono compiere un'impresa dichiaratamente impossibile — spesso come
      condizione per ottenere qualcosa (libertà, un alleato, accesso a un luogo).
      Chi assegna il compito pensa che falliranno. La soluzione richiede pensiero
      laterale, non forza bruta — oppure il compito va reinterpretato.
    esempi:
      - "Le 12 fatiche di Ercole — mitologia greca"
      - "Rumplestiltskin — filare la paglia in oro"
      - "Le prove di Turandot — opera (3 enigmi o morte)"
      - "La prova del Triwizard — Harry Potter (compiti 'impossibili')"
      - "Svuotare il mare con un secchio — fiabe (risolto con astuzia)"
    uso_dnd: >
      Un NPC potente pone una condizione: "Portatemi X in 3 giorni" dove X sembra
      impossibile. La soluzione non è quella ovvia — richiede creatività. Premiare
      interpretazioni laterali ("hai detto 'uccidi il drago' — non hai detto che
      doveva essere QUEL drago"). Ideale per sessioni puzzle-oriented.
    rischio: >
      Se la soluzione è una sola e i PG non la trovano, si blocca tutto. Prevedere
      almeno 2 soluzioni possibili, di cui una non ovvia.
    usato_in: [La Cerca, Da Povero a Ricco]
    vedi_anche: [Spalle al Muro, Il Patto col Diavolo]

  - tipo: situazione
    nome: L'Arena (Il Combattimento Forzato)
    nome_en: Forced Prize Fight / Gladiator Games
    nomi_alt: [Il Gladiatore, Thunderdome, Fight Pit, Il Torneo, Gladiator Arena]
    sottocaso_di: La Fuga dalla Prigione
    descrizione: >
      I PG sono costretti a combattere in un'arena — per intrattenimento,
      come punizione, come prova, o per vincere qualcosa di vitale. Le regole del
      combattimento sono imposte dall'esterno (armi limitate, nessuna magia, a
      morte o a primo sangue). Il pubblico reagisce. La vera sfida non è solo
      vincere il combattimento ma trovare come uscire dal sistema.
    esempi:
      - "Il Colosseo — storia romana / Gladiator (film)"
      - "Hunger Games — Collins (arena come spettacolo)"
      - "Fight Club — film (combattimento come rito)"
      - "L'Arena di Rajaat — Dark Sun (D&D)"
      - "Pod Racing — Star Wars (variante: gara forzata)"
      - "Squid Game — serie TV (giochi mortali forzati)"
    uso_dnd: >
      I PG vengono catturati e messi in un'arena, o devono partecipare a un
      torneo per ottenere un oggetto/informazione/alleato. Regole speciali:
      no magia, armi fornite dall'arena, combattimento non letale. Il vero
      obiettivo è evadere, sabotare dall'interno, o vincere e poi chiedere un
      favore al padrone dell'arena.
    usato_in: [La Fuga dalla Prigione, Da Povero a Ricco, La Rivalità]
    vedi_anche: [La Fuga dalla Prigione, La Rivalità, Il Branco di Disadattati]

  - tipo: situazione
    nome: Il Mondo Capovolto
    nome_en: Bizarro World / Opposite Day / Mirror Universe
    nomi_alt: [Mirror Universe, Upside Down, Il Mondo Rovesciato, Through the Looking Glass]
    descrizione: >
      I PG si ritrovano in una versione distorta del mondo che conoscono — dove
      le gerarchie sono invertite, gli alleati sono nemici, le regole morali sono
      ribaltate, o le leggi fisiche funzionano al contrario. Non è un piano
      alieno (quello è il Luogo Impossibile) — è il LORO mondo, ma sbagliato.
      Devono capire le nuove regole per sopravvivere e tornare.
    esempi:
      - "Mirror Universe — Star Trek (la Federazione è un impero malvagio)"
      - "Il Mondo al Contrario — Alice (le regole della logica non valgono)"
      - "Flashpoint — DC Comics (un cambio nel passato ha creato un presente distorto)"
      - "Earth-3 — DC (gli eroi sono i villain e viceversa)"
      - "It's a Wonderful Life — film (il mondo senza il protagonista)"
    uso_dnd: >
      I PG attraversano un portale e si ritrovano in una versione alternativa del
      loro mondo: il re benevolo è un tiranno, il loro alleato è il braccio destro
      del villain, e i criminali che avevano sconfitto sono gli eroi della
      resistenza. Devono navigare un mondo dove tutto ciò che sanno è sbagliato.
      Modulo one-shot ideale come "what if".
    usato_in: [Viaggio e Ritorno]
    vedi_anche: [Il Luogo Impossibile, Il Pesce fuor d'Acqua, Viaggio e Ritorno]

  - tipo: situazione
    nome: La Zona Proibita
    nome_en: Forbidden Zone / Here Be Dragons
    nomi_alt: [Here Be Dragons, Terra Incognita, Il Luogo Maledetto, The Dark Forest, Off-Limits]
    descrizione: >
      Un luogo dove nessuno va — per legge, tradizione, paura, o pericolo reale.
      I PG devono entrarci. La proibizione stessa è il gancio: cosa c'è di così
      pericoloso/importante da richiedere un divieto assoluto? La risposta può
      essere un tesoro, un segreto, un mostro, o tutti e tre.
    esempi:
      - "La Foresta Proibita — Harry Potter"
      - "Mordor — Il Signore degli Anelli ('One does not simply walk into...')"
      - "La Zona — Stalker/Roadside Picnic"
      - "Chernobyl — storia reale (zona di esclusione)"
      - "L'Isola Proibita — qualsiasi narrativa piratesca"
      - "Il piano di sotto — qualsiasi horror domestico"
    uso_dnd: >
      Una zona sulla mappa segnata "qui non andare" — il party ovviamente ci
      andrà. Il divieto deve essere motivato: (1) legale (il re lo proibisce),
      (2) sociale (tabù religioso), (3) pratico (tutti quelli che ci sono andati
      sono morti). La rivelazione di cosa c'è dentro è il cuore del modulo.
    usato_in: [La Cerca, Il Male Sigillato, Viaggio e Ritorno]
    vedi_anche: [Il Luogo Impossibile, Il Male Sigillato, Il Compito Impossibile]

  - tipo: relazione
    nome: Il Debito di Vita
    nome_en: Life Debt / I Owe You My Life
    nomi_alt: [Life Debt, Debito di Sangue, Blood Debt, Il Giuramento di Lealtà]
    descrizione: >
      Un personaggio deve la vita a un altro e si sente obbligato a ripagare il
      debito — anche a costo della propria vita o contro i propri interessi.
      Il debito può legare un ex-nemico ai PG, o un PG a un NPC scomodo. È una
      catena morale, non magica — ma altrettanto vincolante. Il debitore può
      essere leale per obbligo anziché per affetto.
    esempi:
      - "Chewbacca e Han Solo — Star Wars (debito di vita wookiee)"
      - "Gollum guida Frodo — Il Signore degli Anelli ('il padrone ci ha risparmiato')"
      - "Snape protegge Harry — Harry Potter (debito verso James Potter)"
      - "Zuko salva Iroh — Avatar (ripaga l'amore dello zio)"
      - "Brienne e Jaime — Game of Thrones (debito reciproco)"
    uso_dnd: >
      Un NPC (magari ex-nemico) deve la vita ai PG dopo essere stato risparmiato.
      Torna per ripagare il debito in un momento critico (Rinforzi guadagnati).
      Oppure: un PG deve la vita a un NPC moralmente dubbio e questi chiede un
      favore scomodo in cambio. Il debito è una leva narrativa potente.
    usato_in: [I Rinforzi, L'Alleanza col Nemico, La Scorta]
    vedi_anche: [I Rinforzi, L'Alleanza col Nemico, Il Companion Fedele, Il Legame]

  - tipo: situazione
    nome: La Pestilenza
    nome_en: The Plague / Spreading Doom
    nomi_alt: [L'Epidemia, The Contagion, Il Morbo, The Blight, Pandemic]
    descrizione: >
      Una malattia, maledizione, o corruzione si diffonde inesorabilmente. Non è
      un nemico da combattere con la spada — è un problema sistemico che richiede
      una cura, una fonte da trovare e bloccare, o un sacrificio per fermarlo.
      Il tempo stringe perché la diffusione è esponenziale. Le quarantene creano
      tensione sociale.
    esempi:
      - "La Peste — Camus (il morbo come metafora)"
      - "The Blight — Dragon Age (corruzione che avanza)"
      - "La Peste Grigia — Warhammer (piaga non-morta)"
      - "Contagion — film (pandemia realistica)"
      - "The Last of Us — il fungo Cordyceps"
      - "Il Sonno — qualsiasi fiaba (una maledizione che si diffonde)"
    uso_dnd: >
      Una malattia si diffonde nel villaggio/regno. I PG devono: (1) trovare la
      fonte (dungeon), (2) ottenere la cura (quest), (3) gestire il panico sociale
      (roleplay). Il Contatore: ogni giorno che passa, più NPC cadono. Se i PG
      perdono tempo col filler, la peste avanza. Urgenza senza combattimento diretto.
    usato_in: [La Corsa Contro il Tempo, Sconfiggere il Mostro, Il Mistero]
    vedi_anche: [Il Contatore, La Corsa Contro il Tempo, Il Male Sigillato]


  - tipo: tecnica
    nome: L'Assegnazione del Ruolo
    nome_en: Role Assignment / Narrative Function Binding
    nomi_alt: [Character Arc Setup, Narrative Role, Il Destino Assegnato, PC Spotlight]
    descrizione: >
      Attribuire una funzione narrativa specifica (l'Eletto, il Redento, il
      Corrotto, la Nemesi di qualcuno) a un PG. Può avvenire in due modi:
      (1) All'inizio — in session zero o come richiesta al gruppo ("chi vuole
      essere il predestinato? chi ha un passato oscuro da espiare?");
      (2) Durante l'avventura — tramite un evento che assegna il ruolo ("il
      gioiello maledetto si lega a te", "la profezia nomina il tuo sangue").
      Il secondo modo è più drammatico ma più rischioso.
    esempi:
      - "Frodo accetta l'Anello — Il Signore degli Anelli (ruolo assegnato in-game: portatore)"
      - "Harry marchiato dalla cicatrice — Harry Potter (ruolo assegnato dalla nascita, rivelato dopo)"
      - "Arya e l'elenco di nomi — Game of Thrones (il PG si auto-assegna il ruolo di vendicatrice)"
      - "Atton Rand eredita la spada laser — Knights of the Old Republic II (evento che cambia il ruolo)"
      - "Il Patto del Warlock — D&D (scelta del giocatore in session zero)"
    uso_dnd: >
      Metodo 1 (session zero): chiedere ai giocatori quale funzione vogliono per
      il loro PG. "Chi vuole avere un segreto legato al villain? Chi vuole essere
      quello tentato dal potere? Chi vuole essere il leader riluttante?" Consenso
      esplicito.
      Metodo 2 (in-game): un evento assegna il ruolo — ma con opt-out. "Il
      medaglione si illumina al tuo tocco. Vuoi prenderlo?" Se il PG rifiuta,
      il ruolo passa a un NPC o a un altro PG volontario. MAI imporre.
    rischio: >
      Se il ruolo viene imposto senza consenso, il giocatore si sente railroad-ato.
      Regola d'oro: i ruoli narrativi richiedono SEMPRE il consenso del giocatore.
      Metodo 1 è più sicuro (consenso preventivo). Metodo 2 è più drammatico ma
      deve sempre offrire una via d'uscita. Se un giocatore non vuole il ruolo
      di "corrotto" o "predestinato", rispettare la scelta senza penalizzarlo.
    usato_in: [L'Eletto, La Tentazione, La Vendetta, Il Redento]
    vedi_anche: [L'Eletto, La Tentazione, Il Contatore, Il Legame]


  - tipo: situazione
    nome: Il Loop Temporale
    nome_en: Time Loop / Groundhog Day
    nomi_alt: [Groundhog Day, Il Giorno della Marmotta, Giorno senza Fine, Roguelike Narrativo]
    descrizione: >
      I PG rivivono lo stesso periodo di tempo (un giorno, un'ora, un evento)
      ripetutamente. Ogni ciclo conservano la memoria ma il mondo si resetta.
      Devono capire perché il loop esiste e cosa fare di diverso per spezzarlo.
      Ogni ripetizione permette di esplorare nuove strategie.
    esempi:
      - "Ricomincio da Capo — film (Groundhog Day)"
      - "Majora's Mask — Zelda (3 giorni in loop)"
      - "Edge of Tomorrow — film (loop in battaglia)"
      - "Russian Doll — serie TV"
      - "Re:Zero — anime (morte = reset)"
    uso_dnd: >
      One-shot ideale: i PG rivivono la stessa giornata. Ad ogni loop scoprono un
      pezzo di informazione in più. La soluzione richiede combinare conoscenze da
      loop diversi. Meccanica: alla "morte" o alla mezzanotte si resetta. I PG
      mantengono le conoscenze ma non gli oggetti. Max 3-5 loop poi deve risolversi.
    rischio: >
      Se troppi loop diventa ripetitivo. Ogni ciclo deve offrire qualcosa di nuovo
      da scoprire. Se i PG non capiscono come uscirne, dare indizi crescenti.
    usato_in: [Il Mistero, La Corsa Contro il Tempo]
    vedi_anche: [La Corsa Contro il Tempo, Il Mistero, Viaggio e Ritorno]

  - tipo: situazione
    nome: L'Identità Scambiata
    nome_en: Mistaken Identity / Identity Swap
    nomi_alt: [Scambio di Persona, Wrong Man, Mistaken for Someone, Il Sosia]
    sottocaso_di: Commedia degli Errori
    descrizione: >
      Un PG o il party viene scambiato per qualcun altro — un eroe famoso, un
      criminale ricercato, un nobile, un emissario atteso. Devono decidere se
      sfruttare lo scambio (rischiando di essere smascherati) o chiarire subito
      (perdendo i vantaggi della falsa identità).
    esempi:
      - "Il Principe e il Povero — Mark Twain (scambio di identità)"
      - "Galaxy Quest — film (attori scambiati per veri eroi spaziali)"
      - "La Maschera di Ferro — Dumas"
      - "North by Northwest — Hitchcock (scambiato per una spia)"
      - "Total Recall — film (chi sono davvero?)"
    uso_dnd: >
      I PG arrivano in città e vengono scambiati per gli emissari attesi dal re.
      Possono sfruttare la situazione (accesso al palazzo, risorse gratuite) ma se
      scoperti saranno trattati da impostori. Oppure: un PG è il sosia esatto di
      un criminale ricercato. Combina bene con Commedia degli Errori.
    usato_in: [Commedia degli Errori, Il Mistero, L'Infiltrazione]
    vedi_anche: [Commedia degli Errori, Il Pesce fuor d'Acqua, L'Infiltrazione]

  - tipo: personaggio
    nome: L'Informatore (Il Broker)
    nome_en: Knowledge Broker / Information Dealer
    nomi_alt: [Il Broker, The Fixer, L'Intermediario, Information Broker, Il Sussurratore]
    descrizione: >
      Un personaggio che sa tutto su tutti e vende informazioni al miglior
      offerente. Non è un alleato né un nemico — è un mercante di segreti.
      Le sue informazioni sono sempre accurate ma mai gratuite, e il prezzo può
      essere denaro, un favore, o un'informazione in cambio.
    esempi:
      - "Varys — Game of Thrones (rete di spie ovunque)"
      - "Il Merovingiano — The Matrix (traffica informazioni)"
      - "Huginn e Muninn — mitologia norrena (i corvi che riferiscono a Odino)"
      - "Daredevil's informants — Marvel (rete di strada)"
      - "Il bibliotecario onnisciente — tropo fantasy"
    uso_dnd: >
      NPC che i PG possono consultare per informazioni su qualsiasi argomento —
      ma a un prezzo. Il prezzo scala con l'importanza dell'informazione: da
      monete per gossip a "un favore futuro" per segreti del villain. Può avere
      informazioni sbagliate se qualcuno lo ha pagato per mentire. Mai gratuito.
    usato_in: [Il Mistero, La Cerca, L'Infiltrazione]
    vedi_anche: [Il Benefattore Misterioso, Il Trickster, La Talpa]

  - tipo: personaggio
    nome: Il Collezionista
    nome_en: The Collector / Hoarder
    nomi_alt: [The Hoarder, L'Accumulatore, Il Maniaco, Obsessive Collector, Il Catalogatore]
    descrizione: >
      Un personaggio ossessionato dal raccogliere oggetti specifici — artefatti,
      anime, mostri rari, conoscenza proibita. Non è necessariamente malvagio ma
      la sua ossessione lo rende pericoloso e imprevedibile. Ha quasi certamente
      qualcosa che i PG cercano — ma ottenerglielo sarà una prova.
    esempi:
      - "Il Collezionista — MCU/Guardiani della Galassia"
      - "Smaug — Lo Hobbit (drago che accumula tesori)"
      - "Davy Jones — Pirati dei Caraibi (colleziona anime)"
      - "Caliban — La Tempesta (accumula conoscenza)"
      - "Il Museo di Oggetti Maledetti — qualsiasi horror"
    uso_dnd: >
      NPC che possiede il MacGuffin. Non lo darà gratis — vuole qualcosa in
      cambio (un pezzo per la sua collezione, un servizio, o una sfida). Può
      essere un dungeon intero: la sua collezione è il dungeon, piena di
      creature/oggetti pericolosi mal custoditi. Variante: i PG devono
      rubarglielo (Heist).
    usato_in: [La Cerca, L'Infiltrazione, Il Compito Impossibile]
    vedi_anche: [Il Guardiano della Soglia, L'Infiltrazione, Il Patto col Diavolo]

  - tipo: plot
    nome: La Ribellione
    nome_en: Rebellion / Revolution
    nomi_alt: [La Rivolta, Uprising, Resistance, La Resistenza, Insurrection]
    descrizione: >
      Un gruppo di oppressi si solleva contro un potere tirannico. I PG possono
      essere i ribelli, i loro aiutanti, o trovarsi in mezzo. Il tiranno non è
      necessariamente il Signore Oscuro — può essere un governo legittimo ma
      ingiusto. La domanda morale: la rivoluzione giustifica la violenza? E cosa
      viene dopo?
    esempi:
      - "Star Wars — la Ribellione contro l'Impero"
      - "Les Misérables — Hugo (la barricata)"
      - "Hunger Games — Collins (rivolta dei distretti)"
      - "V for Vendetta — Moore (anarchia contro fascismo)"
      - "Robin Hood — leggenda (resistenza contro il potere)"
      - "Spartacus — storia (rivolta degli schiavi)"
    uso_dnd: >
      I PG aiutano una resistenza contro un tiranno locale. Moduli: reclutare
      alleati, sabotare le difese, raccogliere prove dei crimini, e il grande
      assalto finale. La complicazione: il tiranno caduto crea un vuoto di potere
      (Crisi di Successione). O i ribelli non sono migliori del tiranno.
    usato_in: []
    puo_aver_bisogno_di: [Il Legame (ideale)]
    vedi_anche: [La Crisi di Successione, L'Assedio, Sconfiggere il Mostro]

  - tipo: plot
    nome: Il Viaggio dell'Esilio
    nome_en: Exile / Road Story / Odyssey
    nomi_alt: [L'Esodo, The Wandering, Il Bando, Il Pellegrinaggio Forzato, Road Movie]
    descrizione: >
      I protagonisti sono stati cacciati dalla loro casa (esilio, fuga, bando)
      e devono attraversare terre sconosciute per trovare un nuovo posto nel
      mondo o tornare a casa dopo aver risolto il problema che li ha cacciati.
      Ogni tappa del viaggio è un'avventura a sé. Il ritorno è l'obiettivo
      finale ma il viaggio li trasforma.
    esempi:
      - "L'Odissea — Omero (Ulisse tenta di tornare a casa)"
      - "L'Esodo — Bibbia (Mosè guida il popolo fuori dall'Egitto)"
      - "Il Signore degli Anelli — la Compagnia in viaggio"
      - "Mad Max: Fury Road — film (fuga e ritorno)"
      - "Battlestar Galactica — serie TV (flotta in cerca di una nuova casa)"
      - "The Mandalorian — serie TV (nomade con bambino)"
    uso_dnd: >
      I PG sono banditi/fuggiti dalla loro città di origine. Ogni modulo è una
      tappa: un villaggio ostile, un deserto, una montagna, una città straniera.
      Il filo conduttore è tornare a casa o trovare un rifugio definitivo. Ideale
      per campagne sandbox: il DM prepara le tappe, i PG scelgono la direzione.
    usato_in: []
    vedi_anche: [La Cerca, Viaggio e Ritorno, Il Pesce fuor d'Acqua]

  - tipo: personaggio
    nome: Il Veterano Spezzato
    nome_en: Old Soldier / Shell-Shocked Veteran
    nomi_alt: [Il Reduce, PTSD Warrior, The Broken Hero, Il Soldato Stanco, Retired Badass]
    sottocaso_di: L'Eroe Riluttante
    descrizione: >
      Un combattente esperto e capace ma segnato dalla guerra. Ha perso qualcosa
      (la fede, gli amici, la gioventù) e non è più l'eroe che era. Può essere
      un mentore cinico, un alleato riluttante, o un nemico che ha perso ogni
      freno morale. La sua esperienza è preziosa ma il suo cinismo è contagioso.
    esempi:
      - "Aragorn (prima del ritorno) — Il Signore degli Anelli (Ramingo esiliato)"
      - "Witcher/Geralt — The Witcher (stanco di tutto)"
      - "Logan/Wolverine — X-Men (troppi anni, troppo dolore)"
      - "Sandor Clegane (Il Mastino) — Game of Thrones"
      - "Joel — The Last of Us (padre distrutto dalla perdita)"
      - "Capitano Ahab — Moby Dick (ossessione post-trauma)"
    uso_dnd: >
      NPC esperto che i PG incontrano: sa tutto sul territorio/nemico ma ha smesso
      di combattere. Deve essere convinto a tornare in campo (Il Compito Impossibile
      o Il Legame). Oppure: il PG stesso è un veterano (background). La sua
      conoscenza è l'asset, il suo trauma è la complicazione.
    usato_in: [Sconfiggere il Mostro, La Vendetta, La Cerca]
    vedi_anche: [Il Mentore, L'Eroe Riluttante, Il Redento]

  - tipo: personaggio
    nome: L'Innocente (La Vittima da Proteggere)
    nome_en: The Innocent / Morality Pet / Living MacGuffin
    nomi_alt: [Morality Pet, Damsel in Distress, Il Bambino, Living MacGuffin, La Vittima]
    descrizione: >
      Un personaggio vulnerabile, spesso un bambino o qualcuno di puro, che non
      può proteggersi da solo. La sua esistenza dà motivazione morale ai PG e
      umanizza il mondo. Il suo essere in pericolo alza la posta emotiva. Se muore,
      il colpo è devastante (Il Legame). Se viene corrotto, è una tragedia.
    esempi:
      - "Grogu — The Mandalorian (baby Yoda)"
      - "Ellie — The Last of Us (bambina da scortare)"
      - "Newt — Aliens (bambina sopravvissuta)"
      - "Cosette — Les Misérables (bambina da salvare)"
      - "Il bambino nella lista di Schindler — Schindler's List"
      - "Tali — Mass Effect (innocente in un mondo duro)"
    uso_dnd: >
      NPC vulnerabile affidato alla cura dei PG: un bambino, un anziano, un
      animale intelligente, un prigioniero innocente. La sua presenza limita le
      opzioni violente (non si può lanciare fireball col bambino in stanza) e crea
      momenti di tenerezza tra le battaglie. Ideale per costruire Il Legame.
    usato_in: [La Scorta, Il Legame, Spalle al Muro]
    vedi_anche: [Il Legame, La Scorta, Il Companion Fedele]

  - tipo: relazione
    nome: La Rivalità Amichevole
    nome_en: Friendly Rivalry / Vitriolic Best Buds
    nomi_alt: [Vitriolic Best Buds, Bromance Competitiva, Frenemies, Rivali-Amici]
    sottocaso_di: La Rivalità
    descrizione: >
      Due personaggi che si pungolano costantemente, competono su tutto, e
      sembrano non sopportarsi — ma in realtà si rispettano profondamente e si
      proteggerebbero a vicenda con la vita. La competizione li rende entrambi
      migliori. Non è una vera inimicizia — è affetto espresso attraverso lo sfottò.
    esempi:
      - "Legolas e Gimli — Il Signore degli Anelli (contano le uccisioni)"
      - "Han Solo e Leia — Star Wars (litigano ma si amano)"
      - "Sherlock e Watson — versioni moderne (si insultano per affetto)"
      - "Zoro e Sanji — One Piece (competono su tutto)"
      - "Thor e Loki (momenti positivi) — MCU"
    uso_dnd: >
      Relazione tra PG (da session zero) o tra un PG e un NPC companion. La
      competizione genera momenti comici e spinge entrambi a dare il meglio.
      In D&D: "scommetto che ne ammazzo più di te" è una rivalità amichevole
      perfetta. Funziona come comic relief e come motore di roleplay leggero.
    usato_in: [La Cerca, Il Branco di Disadattati]
    vedi_anche: [Il Companion Fedele, La Rivalità, Il Branco di Disadattati]

  - tipo: situazione
    nome: Il Salvataggio Impossibile
    nome_en: Rescue from the Underworld / Impossible Rescue
    nomi_alt: [La Discesa agli Inferi, Orpheus Quest, Rescue Mission, Saving Private Ryan]
    sottocaso_di: La Cerca
    descrizione: >
      Qualcuno di caro ai PG è stato portato in un luogo da cui nessuno è mai
      tornato — l'aldilà, il piano dei demoni, la fortezza inespugnabile, il
      cuore del territorio nemico. I PG devono andarci, trovarlo, e tornare.
      Non è una semplice scorta: prima bisogna ARRIVARCI, poi uscirne vivi.
    esempi:
      - "Orfeo scende nell'Ade per Euridice — mitologia greca"
      - "La discesa di Inanna — mitologia sumera"
      - "Salvare la Principessa dalla fortezza — qualsiasi fiaba"
      - "Rescue Han Solo da Jabba — Star Wars"
      - "Salvare Sirius dal Ministero — Harry Potter (Ordine della Fenice)"
      - "Inception — entrare nel sogno per piantare un'idea"
    uso_dnd: >
      Un NPC amato viene rapito/ucciso/imprigionato in un luogo inaccessibile.
      L'avventura è il viaggio per raggiungerlo: trovare l'ingresso, superare i
      guardiani, navigare il luogo impossibile, trovare la persona, e uscire (spesso
      più difficile dell'entrata). Funziona come arco di 2-3 moduli.
    usato_in: [La Cerca, Viaggio e Ritorno, Il Male Sigillato]
    vedi_anche: [La Fuga dalla Prigione, Il Luogo Impossibile, La Zona Proibita, Il Legame]

  - tipo: situazione
    nome: La Maledizione
    nome_en: The Curse / Spreading Affliction
    nomi_alt: [The Curse, Il Maleficio, Cursed, L'Incantesimo Spezzato, Affliction]
    descrizione: >
      Un PG, un NPC, o un luogo è sotto una maledizione che peggiora nel tempo.
      La rimozione richiede una quest specifica (trovare chi l'ha lanciata,
      ottenere un ingrediente raro, compiere un atto specifico). A differenza
      della Pestilenza (che è collettiva), la maledizione è personale e mirata.
    esempi:
      - "La Bestia — La Bella e la Bestia (maledizione spezzata dall'amore)"
      - "L'Anello — Il Signore degli Anelli (corrompe chi lo porta)"
      - "La maledizione dei Pirati — Pirati dei Caraibi (non-morti alla luce della luna)"
      - "Sleeping Beauty — fiabe (maledizione dormiente che si attiva)"
      - "Ladyhawke — film (amanti mai insieme: lui di notte, lei di giorno)"
    uso_dnd: >
      Un PG tocca qualcosa e viene maledetto (con consenso). La maledizione ha
      effetti meccanici crescenti (legare al Contatore). La cura è una side quest:
      trovare la strega, ottenere il fiore che cresce solo al chiaro di luna,
      sacrificare qualcosa. Dà motivazione personale a un PG per l'intera avventura.
    usato_in: [La Cerca, La Tentazione, La Corsa Contro il Tempo]
    vedi_anche: [La Pestilenza, Il Contatore, Il Patto col Diavolo, L'Assegnazione del Ruolo]

  - tipo: situazione
    nome: La Festa Interrotta
    nome_en: Disrupted Celebration / Attack at the Wedding
    nomi_alt: [Red Wedding, La Cerimonia Rovinata, Party Crasher, Crashed Celebration]
    sottocaso_di: In Medias Res
    descrizione: >
      Un momento di gioia, celebrazione o sicurezza viene violentemente interrotto
      da un attacco, una rivelazione, o una catastrofe. Il contrasto tra la festa
      e l'orrore amplifica l'impatto emotivo. Funziona come strong start devastante
      o come punto di svolta a metà avventura.
    esempi:
      - "Red Wedding — Game of Thrones (massacro durante le nozze)"
      - "L'attacco al villaggio durante la festa — qualsiasi film fantasy"
      - "Il ballo di Yule interrotto — Harry Potter (il Torneo)"
      - "La festa di Bilbo interrotta da Gandalf — Lo Hobbit"
      - "L'attacco alla festa di Stark — Iron Man 3"
      - "La distruzione di Alderaan — Star Wars (pace → devastazione)"
    uso_dnd: >
      Strong start perfetto: la sessione inizia con una festa (matrimonio,
      cerimonia, fiera). I PG si rilassano, interagiscono socialmente. Poi
      l'attacco. Il contrasto rende il momento memorabile. Funziona anche a metà
      avventura: i PG tornano vittoriosi, festeggiano, e BAM — il colpo arriva.
    usato_in: [Sconfiggere il Mostro, Il Colpo di Scena, L'Assedio]
    vedi_anche: [In Medias Res, Il Colpo di Scena, Il Legame]

  - tipo: tecnica
    nome: Il Narratore Inaffidabile
    nome_en: Unreliable Narrator
    nomi_alt: [Unreliable Source, La Fonte Inaffidabile, L'NPC Bugiardo, Rashomon Effect]
    descrizione: >
      Le informazioni fornite ai PG da una fonte (NPC, documento, visione) sono
      distorte, parziali, o deliberatamente false — ma presentate come verità.
      I PG devono scoprire da soli che la fonte mente o si sbaglia. La realtà è
      diversa da come è stata raccontata. In D&D il "narratore" è spesso un NPC
      quest giver.
    esempi:
      - "Fight Club — il narratore è inaffidabile"
      - "The Usual Suspects — il racconto di Verbal è falso"
      - "Gone Girl — la protagonista manipola la narrazione"
      - "Rashomon — Kurosawa (versioni contraddittorie dello stesso evento)"
      - "Memento — il protagonista non può fidarsi della propria memoria"
    uso_dnd: >
      Il quest giver ha mentito (non per cattiveria — per vergogna, paura, o
      agenda). Le informazioni sul dungeon sono sbagliate. La mappa è vecchia.
      Il "mostro" descritto non corrisponde a quello reale. I PG lo scoprono
      in gioco e devono adattarsi. Funziona come twist leggero senza tradimento.
    rischio: >
      Se i PG non hanno modo di verificare le informazioni prima di agire su di
      esse, si sentono ingannati dal DM, non dall'NPC. Dare almeno un segnale che
      qualcosa non torna PRIMA del punto di non ritorno.
    usato_in: [Il Mistero, Il Colpo di Scena, Il Falso Antagonista]
    vedi_anche: [Il Colpo di Scena, Il Falso Antagonista, La Regola dei Tre Indizi]

  - tipo: situazione
    nome: L'Apocalisse in Corso
    nome_en: Apocalypse How / The World is Ending
    nomi_alt: [Endgame, La Fine del Mondo, World Ending, Ragnarök, The End Times]
    sottocaso_di: Il Male Sigillato
    descrizione: >
      Il mondo sta finendo — non come minaccia futura (quello è Il Male Sigillato)
      ma ADESSO. L'apocalisse è già in corso e i PG operano in un mondo che
      crolla attorno a loro. Le regole sociali si dissolvono, le risorse scarseggiano,
      e ogni giorno è peggio del precedente. L'obiettivo non è prevenire — è
      sopravvivere o invertire ciò che è già cominciato.
    esempi:
      - "Mad Max — franchise (post-apocalisse in corso)"
      - "The Walking Dead — serie (il mondo è già caduto)"
      - "Dark Souls — videogioco (il mondo sta morendo lentamente)"
      - "Ragnarok — mitologia norrena (la fine degli dei)"
      - "La Guerra dell'Anello — Il Signore degli Anelli (Sauron sta vincendo)"
    uso_dnd: >
      L'avventura inizia dopo che il Male Sigillato si è liberato. Il mondo è
      già in rovina. I PG non prevengono — tentano di invertire o di salvare ciò
      che resta. Tono disperato, risorse scarse, ogni decisione ha peso. Ideale
      per campagne grimdark o per gli ultimi moduli di una saga.
    usato_in: [Sconfiggere il Mostro, Il Male Sigillato]
    vedi_anche: [Il Male Sigillato, La Pestilenza, La Corsa Contro il Tempo, La Vittoria di Pirro]

  - tipo: situazione
    nome: Il Tesoro Maledetto
    nome_en: Cursed Treasure / Artifact of Doom
    nomi_alt: [Artifact of Doom, Il Bottino Avvelenato, Monkey's Paw, Il Dono Maledetto]
    sottocaso_di: La Maledizione
    descrizione: >
      La ricompensa stessa è il pericolo. Il tesoro trovato è maledetto,
      l'artefatto desiderato corrompe, l'oro rubato porta sfortuna. Ottenere
      ciò che si cercava è l'inizio dei problemi, non la fine. La domanda:
      tenerlo (e pagarne il prezzo) o liberarsene (e perdere il potere)?
    esempi:
      - "L'Unico Anello — Il Signore degli Anelli (il tesoro È il problema)"
      - "L'oro azteco — Pirati dei Caraibi (maledetto)"
      - "L'Arca dell'Alleanza — Indiana Jones (uccide chi la apre)"
      - "Il Monkey's Paw — racconto (i desideri si avverano in modo orribile)"
      - "La maschera di Majora — Zelda"
      - "Frostmourne — Warcraft (la spada che consuma l'anima)"
    uso_dnd: >
      I PG trovano l'artefatto/tesoro — quest completata! Ma ora l'oggetto li
      corrompe, attira nemici, o è richiesto da un'entità potente. La seconda
      metà dell'avventura è liberarsene o imparare a controllarlo. Lega bene
      con Il Contatore (ogni uso aggiunge corruzione) e La Tentazione.
    usato_in: [La Cerca, La Tentazione, Sconfiggere il Mostro]
    puo_aver_bisogno_di: [Il Legame (oggetto)]
    vedi_anche: [La Tentazione, Il Contatore, La Maledizione, Il MacGuffin]

  - tipo: relazione
    nome: Il Debito d'Onore (La Promessa)
    nome_en: Sworn Oath / Unbreakable Vow
    nomi_alt: [Il Giuramento, Unbreakable Vow, Promessa Solenne, The Oath, Il Voto]
    descrizione: >
      Un personaggio ha fatto una promessa solenne — a un morente, a un dio, a
      sé stesso — e deve mantenerla anche quando le circostanze la rendono
      terribilmente scomoda. Il conflitto nasce quando la promessa entra in
      contrasto con la situazione attuale o con i desideri del personaggio.
    esempi:
      - "Brienne giura di proteggere le figlie Stark — Game of Thrones"
      - "Frodo promette di portare l'Anello — Il Signore degli Anelli"
      - "Il Giuramento Infrangibile — Harry Potter (magia che lega)"
      - "Ned Stark promette a Lyanna — Game of Thrones (segreto tenuto per decenni)"
      - "I Paladini e il loro giuramento — D&D (meccanica di classe)"
    uso_dnd: >
      Un PG o NPC ha giurato qualcosa che ora complica la missione: ha promesso
      di non uccidere, di proteggere qualcuno che ora è nemico, di tornare entro
      una data. La promessa non può essere spezzata senza conseguenze (sociali,
      divine, o magiche). Crea tensione costante con decisioni significative.
    usato_in: [Spalle al Muro, La Cerca, La Vendetta]
    puo_aver_bisogno_di: [Il Legame (ideale)]
    vedi_anche: [Spalle al Muro, Il Patto col Diavolo, Il Debito di Vita]

  - tipo: tecnica
    nome: La Separazione del Gruppo
    nome_en: Split Party / Divided We Fall
    nomi_alt: [Split Party, Never Split the Party, Divide and Conquer, Party Diviso]
    descrizione: >
      Il party viene diviso — per scelta o per forza — in due o più sottogruppi
      che devono operare simultaneamente in luoghi diversi. Ogni sottogruppo ha
      meno risorse e deve cavarsela con ciò che ha. La tensione viene dal sapere
      che l'altro gruppo potrebbe essere in pericolo.
    esempi:
      - "La Compagnia si spezza — Il Signore degli Anelli (3 gruppi separati)"
      - "I ribelli su Scarif e nello spazio — Rogue One"
      - "Due missioni simultanee — qualsiasi film di guerra"
      - "A e B team — The A-Team (dividere per coprire più terreno)"
    uso_dnd: >
      In un modulo specifico: un evento forza la separazione (crollo, teletrasporto,
      scelta tattica). Ogni sotto-party gioca una mini-scena. Richiede gestione
      attenta del tempo al tavolo (alternare scene brevi). Funziona meglio in
      sessioni con 5+ giocatori. La riunione alla fine è un payoff emotivo.
    rischio: >
      Alcuni giocatori resteranno inattivi mentre l'altro gruppo gioca. Scene
      brevissime (5 minuti) alternate rapidamente. Mai più di 20 minuti senza
      far agire un sotto-gruppo.
    usato_in: [L'Assedio, La Corsa Contro il Tempo, La Cerca]
    vedi_anche: [La Corsa Contro il Tempo, Plot Concatenati, Il Branco di Disadattati]

  - tipo: situazione
    nome: Il Dilemma del Prigioniero
    nome_en: Prisoner's Dilemma / Trust Game
    nomi_alt: [Trust Game, Cooperate or Defect, Game Theory Scenario, La Scelta della Fiducia]
    descrizione: >
      Due parti devono decidere simultaneamente se cooperare o tradire senza
      sapere la scelta dell'altro. La cooperazione reciproca dà il risultato
      migliore per tutti, ma il tradimento unilaterale dà il risultato migliore
      per chi tradisce. Il rischio di essere l'unico a cooperare crea paranoia.
    esempi:
      - "Il Dilemma del Prigioniero — teoria dei giochi (il modello originale)"
      - "The Dark Knight — Batman (le due barche con il detonatore dell'altra)"
      - "Squid Game — serie (fiducia o tradimento tra concorrenti)"
      - "Among Us — videogioco (chi è l'impostore?)"
      - "Nuclear deterrence — Guerra Fredda (MAD)"
    uso_dnd: >
      Due fazioni (una include i PG) devono collaborare ma ciascuna ha la
      possibilità di tradire per un vantaggio immediato. Esempio: "ci
      scambiamo simultaneamente ostaggio per artefatto — chi sgancia prima
      rischia". I PG devono decidere: fidarsi o preparare un piano B?
      Meccanica: azioni simultanee, rivelazione simultanea.
    usato_in: [Lo Stallo, L'Alleanza col Nemico, Spalle al Muro]
    vedi_anche: [Lo Stallo, L'Alleanza col Nemico, Spalle al Muro, Il Tradimento dell'Alleato]

  - tipo: situazione
    nome: La Casa Distrutta (Il Punto di Non Ritorno)
    nome_en: Doomed Hometown / Crossing the Threshold
    nomi_alt: [Doomed Hometown, Burning Bridges, Il Villaggio Bruciato, Point of No Return]
    descrizione: >
      La casa, il villaggio, la gilda, o il rifugio dei PG viene distrutto o
      reso inaccessibile. Non possono tornare indietro. Questo evento forza
      l'avventura: prima erano liberi di restare, ora DEVONO andare avanti.
      La distruzione della casa è il motore emotivo che spinge all'azione e
      impedisce la ritirata.
    esempi:
      - "L'incendio della fattoria di Luke — Star Wars (zio e zia uccisi)"
      - "La distruzione della Contea — Il Signore degli Anelli (ritorno amaro)"
      - "Distruzione di Krypton — Superman (non si può tornare)"
      - "L'attacco a Shiganshina — Attack on Titan"
      - "Midgar distrutta — Final Fantasy VII"
      - "Il villaggio bruciato — qualsiasi D&D, modulo 1"
    uso_dnd: >
      Modulo 1 classico: il villaggio dei PG viene attaccato/bruciato/maledetto.
      I PG perdono la "base sicura" e sono costretti all'avventura. Dà motivazione
      emotiva immediata (vendetta + sopravvivenza) senza bisogno di un quest giver.
      Può essere il primo evento dell'avventura o un colpo di scena a metà.
    usato_in: [Sconfiggere il Mostro, La Vendetta, Il Viaggio dell'Esilio]
    puo_aver_bisogno_di: [Il Legame (luogo)]
    vedi_anche: [La Vendetta, In Medias Res, Il Legame, La Festa Interrotta]

  - tipo: situazione
    nome: Il Ritorno Sbagliato
    nome_en: Came Back Wrong / Resurrection Gone Bad
    nomi_alt: [Came Back Wrong, Pet Sematary, Il Redivivo Sbagliato, Uncanny Resurrection]
    descrizione: >
      Qualcuno (o qualcosa) torna dalla morte, dall'esilio, o dalla prigionia —
      ma non è più lo stesso. È cambiato, corrotto, posseduto, o semplicemente
      rotto. Il ritorno che doveva essere una gioia diventa un orrore. I PG
      devono decidere: accettare la versione cambiata, tentare di "ripararlo",
      o distruggerlo.
    esempi:
      - "Pet Sematary — Stephen King (i morti tornano sbagliati)"
      - "Gandalf il Bianco — Il Signore degli Anelli (ritorno positivo — eccezione)"
      - "Buffy dopo la resurrezione — Buffy (torna ma è spenta)"
      - "Jon Snow resuscitato — Game of Thrones (torna cambiato)"
      - "Alien Resurrection — film (clone difettoso)"
      - "Il re resuscitato come non-morto — tropo D&D classico"
    uso_dnd: >
      Un NPC amato muore e qualcuno (o i PG stessi) tenta di resuscitarlo. Il
      ritorno è imperfetto: è posseduto, ha perso la memoria, è aggressivo, o
      è controllato dal villain. I PG devono scegliere: tenerlo com'è, cercare
      una cura (quest), o lasciarlo andare. Combina Il Legame + La Maledizione.
    rischio: >
      Se applicato a un PG senza consenso esplicito del giocatore, è inaccettabile.
      Funziona su NPC o con PG consenzienti che vogliono esplorare l'arco.
    usato_in: [Il Male Sigillato, Rinascita, La Maledizione]
    vedi_anche: [La Maledizione, Il Legame, Rinascita, Il Colpo di Scena]

  - tipo: personaggio
    nome: L'Ultimo della Sua Specie
    nome_en: Last of His Kind
    nomi_alt: [Last Survivor, L'Ultimo Sopravvissuto, Sole Survivor, The Last One]
    descrizione: >
      Un personaggio è l'ultimo sopravvissuto della sua razza, ordine, famiglia,
      o civiltà. Porta il peso di un'eredità intera sulle spalle. La sua morte
      significherebbe la fine definitiva di qualcosa. Questo gli dà gravità
      narrativa enorme e lo rende sia prezioso che tragico.
    esempi:
      - "Superman — DC (ultimo kryptoniano)"
      - "Aang — Avatar: The Last Airbender (ultimo maestro dell'aria)"
      - "Aragorn — Il Signore degli Anelli (ultimo erede di Isildur)"
      - "Yoda e poi Luke — Star Wars (ultimi Jedi)"
      - "Geralt — The Witcher (uno degli ultimi witcher)"
      - "Il drago in Dragonheart — film (ultimo drago)"
    uso_dnd: >
      NPC (o PG con consenso) che è l'ultimo di un ordine/razza. La sua
      protezione diventa una motivazione. La sua conoscenza è irrecuperabile.
      Se muore, qualcosa si perde per sempre dal mondo. Può essere Il MacGuffin
      vivente — tutti lo vogliono (per ucciderlo o sfruttarlo).
    usato_in: [La Scorta, La Cerca, La Vendetta]
    vedi_anche: [L'Innocente, Il Veterano Spezzato, L'Eletto]

  - tipo: personaggio
    nome: La Carta Selvaggia
    nome_en: The Wild Card / Chaotic Neutral Incarnate
    nomi_alt: [Chaotic Neutral, Il Jolly, L'Imponderabile, Loose Cannon, The X Factor]
    descrizione: >
      Un personaggio genuinamente imprevedibile che non sta con nessuno in modo
      permanente. Non è il Trickster (che ha un lato comico) né il Mutaforma (che
      nasconde la sua vera natura). La Carta Selvaggia è apertamente caotica:
      tutti sanno che potrebbe fare qualsiasi cosa in qualsiasi momento. La sua
      imprevedibilità è l'unica costante.
    esempi:
      - "Jack Sparrow — Pirati dei Caraibi (nessuno sa cosa farà)"
      - "Il Joker — The Dark Knight (caos puro senza piano finale)"
      - "Deadpool — Marvel (rompe le regole del genere stesso)"
      - "Q — Star Trek (entità onnipotente capricciosa)"
      - "Hisoka — Hunter x Hunter (nemico/alleato a capriccio)"
    uso_dnd: >
      NPC che appare in momenti chiave e agisce in modo imprevedibile. Può aiutare
      o ostacolare i PG in base al suo umore/interesse del momento. Funziona come
      wild card letterale: il DM lancia un dado per decidere se l'NPC aiuta o
      tradisce questa volta. Dà al DM uno strumento di improvvisazione pura.
    rischio: >
      Se troppo frequente o troppo potente, ruba la scena e toglie agency ai PG.
      Usare in apparizioni brevi e decisive, poi scompare.
    usato_in: [Commedia degli Errori, Il Mistero, Lo Stallo]
    vedi_anche: [Il Trickster, Il Mutaforma, Il Buon Diavolo]

  - tipo: situazione
    nome: La Corte Decadente
    nome_en: Decadent Court / Political Intrigue
    nomi_alt: [Political Intrigue, Il Nido di Vipere, Court Intrigue, Game of Thrones, Il Gioco del Potere]
    descrizione: >
      I PG entrano in un ambiente di intrighi politici dove nessuno dice ciò che
      pensa, tutti hanno agende nascoste, e una parola sbagliata può essere fatale
      quanto una spada. Le armi sono il veleno, la calunnia, il ricatto, e
      l'etichetta. Il combattimento fisico è l'ultima risorsa — e spesso un
      fallimento.
    esempi:
      - "King's Landing — Game of Thrones (corte letale)"
      - "Dune — il Landsraad e le Grandi Case"
      - "La corte di Versailles — storia (intrighi infiniti)"
      - "La corte degli Elfi — qualsiasi fantasy (fey courts)"
      - "Il Senato Galattico — Star Wars prequel"
      - "Baldur's Gate 3 — intrighi tra le fazioni"
    uso_dnd: >
      Modulo interamente sociale: i PG devono navigare una corte per ottenere
      favori, smascherare un complotto, o influenzare una decisione politica.
      Le "armi" sono Persuasione, Inganno, Intuizione. Il combattimento è
      possibile ma ha conseguenze devastanti (arresto, guerra, esilio).
    usato_in: [Il Mistero, La Crisi di Successione, L'Infiltrazione]
    vedi_anche: [La Crisi di Successione, Lo Stallo, La Masquerade, Il Pesce fuor d'Acqua]

  - tipo: situazione
    nome: Il Registro dell'Apocalisse
    nome_en: Apocalyptic Log / Found Footage
    nomi_alt: [Found Footage, Il Diario Ritrovato, Captain's Log, Audio Log, Dead Man's Journal]
    descrizione: >
      I PG trovano un diario, un messaggio inciso, o una registrazione lasciata
      da qualcuno che è morto o scomparso. Il documento racconta gradualmente
      cosa è successo in quel luogo — e implica che la stessa cosa potrebbe
      succedere ai PG. La tensione cresce man mano che si legge/ascolta.
    esempi:
      - "Il diario di Bilbo — Lo Hobbit / Il Signore degli Anelli"
      - "I log di Alien — film (la nave è vuota, i registri raccontano cosa è successo)"
      - "Le note nei dungeon — Dark Souls/Elden Ring"
      - "Il diario della spedizione scomparsa — tropo Lovecraft"
      - "Found footage — Blair Witch Project (i video ritrovati)"
      - "Le lettere nel dungeon — qualsiasi avventura D&D"
    uso_dnd: >
      Sparsi per il dungeon, i PG trovano frammenti di un diario/messaggio. Ogni
      frammento rivela un pezzo della storia (cosa è successo al gruppo precedente)
      e funziona come avvertimento (il mostro nella stanza successiva, la trappola,
      il tradimento). È un modo elegante per dare backstory senza esposizione
      forzata. I PG lo leggono quando vogliono.
    usato_in: [Il Mistero, La Zona Proibita, Il Luogo Impossibile]
    vedi_anche: [Il Presagio, La Regola dei Tre Indizi, Il Fucile di Čechov]

  - tipo: tecnica
    nome: L'Orologio del Villain
    nome_en: Villain Clock / Fronts / Offscreen Progress
    nomi_alt: [Fronts, Doom Clock, Countdown del Villain, Offscreen Advancement, L'Agenda del Villain]
    descrizione: >
      Mentre i PG agiscono, il villain non sta fermo — il suo piano avanza
      indipendentemente. Se i PG perdono tempo, il mondo peggiora. Se agiscono
      in fretta, possono prevenire fasi successive del piano. Il DM tiene un
      "orologio" del villain che avanza di un passo per ogni giorno/modulo/evento
      in cui i PG non interferiscono direttamente. È il Contatore visto dal lato
      del villain.
    esempi:
      - "Fronts — Dungeon World / Apocalypse World (il mondo avanza)"
      - "Sauron prepara l'esercito — Il Signore degli Anelli (il tempo gioca contro)"
      - "Thanos raccoglie le gemme — MCU (ogni film = una gemma in più)"
      - "Il rituale avanza — qualsiasi avventura D&D con countdown"
      - "Progression clocks — Blades in the Dark"
    uso_dnd: >
      Nel PlanBook: documentare cosa fa il villain se i PG NON intervengono.
      Giorno 1: recluta mercenari. Giorno 3: attacca il primo villaggio. Giorno 7:
      completa il rituale. I PG possono interferire in qualsiasi punto — prima
      intervengono, più facile è. Se tardano, trovano il mondo cambiato in peggio.
      È lo strumento che dà urgenza senza railroad.
    sottocaso_di: Il Contatore
    usato_in: [Sconfiggere il Mostro, La Corsa Contro il Tempo, Il Male Sigillato]
    vedi_anche: [Il Contatore, La Corsa Contro il Tempo, Il Piano Perfetto del Villain]

  - tipo: relazione
    nome: Il Protetto Riluttante
    nome_en: Reluctant Guardian / I Work Alone
    nomi_alt: [The Mandalorian Pattern, Reluctant Bodyguard, Il Lupo Solitario col Cucciolo]
    descrizione: >
      Un personaggio forte e solitario viene incaricato di proteggere qualcuno
      che non vuole proteggere. All'inizio resiste, tratta male il protetto, e
      cerca di liberarsene. Col tempo il legame cresce — ma non lo ammetterà mai.
      La morte o il pericolo del protetto è ciò che alla fine rivela quanto
      il guardiano si è affezionato.
    esempi:
      - "The Mandalorian e Grogu — serie TV (il cacciatore che si affeziona al bambino)"
      - "Joel ed Ellie — The Last of Us (inizia come missione, diventa paternità)"
      - "Logan e X-23 — Logan (Wolverine protegge la bambina suo malgrado)"
      - "Witcher e Ciri — The Witcher (destino imposto, affetto guadagnato)"
      - "Han Solo e Luke/Leia — Star Wars (non mi interessa... poi torna)"
      - "Shrek e Ciuchino — Shrek (versione comica)"
    uso_dnd: >
      Un PG o NPC riceve l'incarico di scortare/proteggere qualcuno che non
      sopporta. La relazione parte male (l'NPC è fastidioso, inutile, o scomodo)
      ma evolve verso affetto. Combina La Scorta + Il Legame con un arco emotivo
      incorporato. La minaccia al protetto nel climax è il payoff dell'affetto
      costruito.
    usato_in: [La Scorta, Il Legame, Da Povero a Ricco]
    vedi_anche: [La Scorta, L'Innocente, Il Legame, L'Eroe Riluttante]


  - tipo: situazione
    nome: La Prova Segreta
    nome_en: Secret Test of Character
    nomi_alt: [Test of Character, La Prova Nascosta, Il Test Segreto, Secret Challenge]
    descrizione: >
      Una situazione apparentemente normale è in realtà un test orchestrato da
      qualcuno (un dio, un mentore, un'organizzazione). La vera sfida non è
      quella ovvia — è una prova di carattere morale. Come i PG reagiscono alla
      situazione determina se "passano" il test, spesso senza sapere di essere
      valutati fino alla fine.
    esempi:
      - "Il test Kobayashi Maru — Star Trek (test imbattibile che misura il carattere)"
      - "Le prove della Sfinge — mitologia (l'enigma come test)"
      - "Il Graal e il Cavaliere puro — ciclo arturiano (solo il degno beve)"
      - "Willy Wonka e la fabbrica — Dahl (ogni stanza è un test di virtù)"
      - "I tre doni della Morte — Harry Potter (chi sceglie il mantello è il degno)"
    uso_dnd: >
      Un modulo intero è una prova mascherata. Un NPC potente (patrono, dio, fey)
      osserva come i PG reagiscono: sono generosi con gli sconosciuti? Resistono
      alla tentazione? Proteggono i deboli? Il risultato determina la ricompensa
      (o la punizione). Funziona bene come ingresso a un'organizzazione o per
      ottenere un dono divino.
    rischio: >
      Se i PG si sentono "giocati" dopo la rivelazione, è frustrante. La
      rivelazione deve dare senso a tutto retroattivamente e la ricompensa deve
      valere la prova.
    usato_in: [Il Guardiano della Soglia, Il Compito Impossibile, La Cerca]
    vedi_anche: [Il Guardiano della Soglia, Il Compito Impossibile, La Pseudo-Scelta]

  - tipo: situazione
    nome: Il Cavallo di Troia
    nome_en: Trojan Horse / Inside Job
    nomi_alt: [Trojan Horse, Inside Job, Il Dono Avvelenato, Infiltration by Gift]
    descrizione: >
      Un inganno in cui qualcosa di apparentemente innocuo o desiderabile viene
      introdotto nelle difese del nemico — e contiene una minaccia nascosta.
      Può essere usato DAI PG (infiltrano un agente in un dono) o CONTRO i PG
      (ricevono un regalo che nasconde un pericolo).
    esempi:
      - "Il Cavallo di Troia — Iliade/Virgilio (l'originale)"
      - "Gandalf nascosto nel carro — Lo Hobbit (infiltrazione nel campo nemico)"
      - "Il virus nel sistema — qualsiasi film hacker"
      - "Il regalo avvelenato — fiabe (la mela di Biancaneve)"
      - "R2-D2 con i piani — Star Wars (innocuo portatore di segreti)"
    uso_dnd: >
      I PG devono introdurre qualcosa (un esplosivo, un alleato nascosto, una
      spia) nelle difese nemiche mascherandolo da dono, merce, prigioniero.
      Oppure il villain lo usa contro i PG: un rifugiato accolto nel campo è un
      agente dormiente. Combina bene con L'Infiltrazione e La Talpa.
    usato_in: [L'Infiltrazione, L'Assedio, Sconfiggere il Mostro]
    vedi_anche: [L'Infiltrazione, La Talpa, Il Piano Perfetto del Villain]

  - tipo: situazione
    nome: Il Nemico Interiore
    nome_en: Enemy Within / Internal Conflict
    nomi_alt: [Il Demone Interiore, Inner Demon, Jekyll and Hyde, La Lotta Interiore, Split Personality]
    descrizione: >
      La minaccia non viene dall'esterno ma dall'interno del personaggio stesso —
      una possessione, una personalità alternativa, una maledizione che prende il
      controllo, o semplicemente i propri impulsi peggiori. Il PG deve combattere
      sé stesso. Il nemico non può essere ucciso con una spada perché vive dentro.
    esempi:
      - "Gollum/Sméagol — Il Signore degli Anelli (due personalità in lotta)"
      - "L'Hulk — Marvel (Banner vs la bestia interiore)"
      - "Naruto e la Volpe — anime (demone sigillato dentro)"
      - "Venom — Marvel (simbionte che influenza il comportamento)"
      - "Il lato oscuro di Anakin — Star Wars (la tentazione interna)"
      - "Dr. Jekyll e Mr. Hyde — Stevenson"
    uso_dnd: >
      Un PG (con consenso) è posseduto/maledetto/influenzato da un'entità interna.
      In certi momenti (stress, rabbia, luna piena) l'entità prende il sopravvento.
      Meccanica: tiri salvezza per mantenere il controllo, Il Contatore che sale
      verso la perdita totale. La quest è trovare come liberarsene — o imparare
      a convivere.
    rischio: >
      MAI togliere il controllo a un PG senza consenso. Il giocatore deve sapere
      in session zero che questo arco è possibile e accettarlo. Le scene di
      "perdita di controllo" devono essere brevi e con uscita chiara.
    usato_in: [La Tentazione, La Maledizione, Tragedia]
    vedi_anche: [La Tentazione, La Maledizione, Lo Specchio, L'Assegnazione del Ruolo]

  - tipo: situazione
    nome: La Minaccia Esterna Incomprensibile
    nome_en: Outside Context Problem
    nomi_alt: [Outside Context Problem, L'Ignoto, The Unknowable, Beyond Comprehension, Cosmic Horror]
    descrizione: >
      Una minaccia completamente aliena ed estranea al mondo conosciuto irrompe
      senza preavviso. Nessuno ha un quadro di riferimento per capirla — non
      esiste nella storia, nella magia, nella scienza del mondo. Le difese
      esistenti non funzionano. I PG devono prima CAPIRE cosa sia, poi trovare
      un modo di affrontarla partendo da zero.
    esempi:
      - "L'arrivo degli Europei in America — storia (outside context per i nativi)"
      - "I Borg — Star Trek (tecnologia così aliena da essere incomprensibile)"
      - "Il Monolite — 2001: Odissea nello Spazio (oggetto senza spiegazione)"
      - "La Zona — Roadside Picnic/Stalker (gli alieni sono passati, non li vediamo)"
      - "Il Far Realm — D&D (entità al di fuori della cosmologia conosciuta)"
      - "La Nebbia — Stephen King (creature da un altro piano)"
    uso_dnd: >
      Una minaccia appare che nessun saggio, nessun libro, nessuna profezia aveva
      previsto. I PG non possono cercare informazioni pregresse — devono
      investigare da zero. Nessun NPC li può aiutare perché nessuno ha mai visto
      niente di simile. Ideale per avventure horror/mistero dove l'ignoto è il
      vero nemico.
    usato_in: [Il Mistero, Il Luogo Impossibile, Sconfiggere il Mostro]
    vedi_anche: [Il Dio Indifferente, Il Luogo Impossibile, Il Male Sigillato]

  - tipo: situazione
    nome: L'Arma Perduta (La Superarma Antica)
    nome_en: Lost Superweapon / Ancient Artifact of Power
    nomi_alt: [La Superarma, Ancient Superweapon, L'Artefatto Dimenticato, The Lost Weapon, Doomsday Device]
    descrizione: >
      Esiste un'arma/artefatto di enorme potere costruito in un'era passata e
      ora perduto. Più fazioni lo cercano. Chi lo trova avrà un vantaggio
      devastante. Il dilemma: usarlo (rischiando di diventare come il nemico),
      distruggerlo (perdendo il vantaggio), o nasconderlo (rischiando che altri
      lo trovino).
    esempi:
      - "L'Unico Anello — Il Signore degli Anelli (la scelta è distruggerlo)"
      - "L'Arca dell'Alleanza — Indiana Jones (arma divina)"
      - "La Morte Nera — Star Wars (arma da distruggere)"
      - "Il Martello di Narsil/Andúril — Il Signore degli Anelli (riforgiato per la battaglia finale)"
      - "Le Reliquie della Morte — Harry Potter"
      - "Frostmourne — Warcraft (l'arma che corrompe chi la impugna)"
    uso_dnd: >
      La quest è trovare l'arma prima del villain. Una volta trovata: il dilemma.
      Usarla dà potere enorme ma ha un costo (corruzione, effetti collaterali,
      attira nemici). Distruggerla è una quest a sé (dove? come?). Combina Il
      MacGuffin + Il Tesoro Maledetto + Spalle al Muro.
    sottocaso_di: Il MacGuffin
    usato_in: [La Cerca, Sconfiggere il Mostro]
    vedi_anche: [Il MacGuffin, Il Tesoro Maledetto, La Soglia di Godzilla, Spalle al Muro]

  - tipo: situazione
    nome: La Pergamena (Il Portatore di Informazioni)
    nome_en: The Clue Object / Plot Coupon / Information MacGuffin
    nomi_alt: [Plot Coupon, Il Documento Chiave, Information MacGuffin, La Mappa del Tesoro, Il Diario]
    descrizione: >
      Un oggetto il cui valore non è nel possesso ma nell'INFORMAZIONE che
      contiene. La mappa, il diario, la lettera cifrata, l'iscrizione, il
      codice, il frammento di profezia. Trovarlo non risolve la quest — la
      fa avanzare di un passo. È il veicolo diegetico per dare informazioni
      ai PG senza ricorrere a esposizione diretta. A differenza del MacGuffin
      (tutti lo vogliono, non importa cosa sia), la Pergamena ha valore
      specifico e il suo contenuto CONTA — i PG devono decifrarlo, interpretarlo,
      seguirlo.
    esempi:
      - "La mappa di Thorin — Lo Hobbit (mostra la porta segreta)"
      - "Il diario di Tom Riddle — Harry Potter (rivela il passato e porta nel ricordo)"
      - "I piani della Morte Nera — Star Wars (sono l'informazione, non il MacGuffin)"
      - "La Mappa del Malandrino — Harry Potter (oggetto-informazione ricorrente)"
      - "Il Necronomicon — Lovecraft (il libro che contiene la verità proibita)"
      - "Il codice Da Vinci — Dan Brown (ogni indizio porta al prossimo)"
      - "I terminali di Fallout — videogioco (frammenti di storia da ricostruire)"
    uso_dnd: >
      I PG trovano un oggetto-informazione che li indirizza verso il passo
      successivo: mappa che rivela l'ingresso segreto, diario che spiega come
      sconfiggere il mostro, lettera che svela l'identità del traditore,
      formula per chiudere il portale. Usi: (1) come ricompensa di un modulo
      — non oro ma informazione; (2) come innesco — trovare la pergamena È
      la quest del modulo; (3) frammentata — servono 3 frammenti, ogni modulo
      ne trova uno. Il contenuto può essere cifrato (richiede decodifica),
      incompleto (richiede ricerca), o ambiguo (richiede interpretazione).
    rischio: >
      Se l'informazione è troppo chiara, non c'è gioco. Se è troppo criptica,
      i PG si bloccano. Dare sempre almeno 2 livelli: il significato ovvio
      (direziona) + il significato profondo (richiede un tiro o una connessione).
      Se i PG hanno la Pergamena ma non sanno cosa farne, servono NPC-decodificatori.
    usato_in: [Il Mistero, La Cerca, L'Indagine sulla Cospirazione]
    vedi_anche: [Il MacGuffin, Il Flashback, La Rivelazione Ambientale, Il Registro dell'Apocalisse, Il Fucile di Čechov]

  - tipo: situazione
    nome: L'Artefatto (L'Oggetto Chiave)
    nome_en: The Key Item / Quest Object / Amulet of Yendor
    nomi_alt: [Quest Item, Key Item, Amulet of Yendor, L'Oggetto della Vittoria, Plot Device Object]
    descrizione: >
      L'oggetto concreto necessario per completare la quest — non un pretesto
      (MacGuffin) ma uno strumento FUNZIONALE. Senza di esso la vittoria è
      impossibile: è la chiave che apre la porta, l'arma che uccide il
      demone, il sigillo che chiude il portale, l'antidoto che salva il re.
      A differenza del MacGuffin (potrebbe essere qualsiasi cosa), l'Artefatto
      è specifico e la sua natura conta. A differenza dell'Arma Perduta
      (artefatto di potere distruttivo), può essere qualsiasi oggetto la cui
      funzione è risolvere il problema centrale.
    esempi:
      - "L'Amulet of Yendor — Rogue/NetHack (l'oggetto che completa il gioco)"
      - "Le chiavi del tempio — Zelda (servono per aprire il dungeon finale)"
      - "La spada vorpal — D&D (l'unica arma che taglia la testa dell'idra)"
      - "L'antidoto — qualsiasi quest medica (senza di esso il re muore)"
      - "Il Santo Graal — Indiana Jones (cura le ferite, è l'obiettivo E la soluzione)"
      - "La pietra filosofale — Harry Potter (Voldemort la vuole per tornare)"
      - "Il flauto magico — Mozart/fiabe (lo strumento che risolve)"
    uso_dnd: >
      Struttura classica: modulo 1 = scoprire che l'Artefatto esiste e serve;
      modulo 2 = trovare dove si trova; modulo 3 = raggiungerlo e ottenerlo;
      modulo 4 = usarlo nel confronto finale. L'Artefatto deve avere: (1) una
      ragione per cui è difficile da ottenere (custodito, perduto, in pezzi);
      (2) una condizione d'uso (solo il puro, solo al solstizio, solo nel
      luogo X); (3) opzionalmente un costo (si consuma, richiede un
      sacrificio, ha effetti collaterali). Senza condizioni, è troppo facile.
    rischio: >
      Se l'Artefatto è l'unica soluzione possibile, i PG sono su un binario.
      Dare almeno un'alternativa (meno efficace ma possibile) per chi non
      trova l'oggetto o sceglie di non usarlo. Se l'Artefatto è ottenuto
      troppo presto, la tensione crolla — proteggerlo con quest progressive.
    usato_in: [La Cerca, Sconfiggere il Mostro, La Corsa Contro il Tempo]
    vedi_anche: [Il MacGuffin, L'Arma Perduta, L'Anello al Dito, Il Tesoro Maledetto, La Pergamena]

  - tipo: tecnica
    nome: L'Operazione Sotto Falsa Bandiera
    nome_en: False Flag Operation
    nomi_alt: [False Flag, Frame Job, L'Incastro, Framing the Innocent, La Provocazione]
    descrizione: >
      Un'azione viene compiuta mascherandola come opera di qualcun altro — per
      incastrare una fazione, provocare una guerra, o deviare i sospetti. Il
      villain attacca il villaggio vestito da soldati del re per scatenare una
      rivolta contro il trono. I PG devono smascherare l'inganno prima che
      le conseguenze diventino irreversibili.
    esempi:
      - "L'incendio del Reichstag — storia (falsa bandiera per giustificare repressione)"
      - "Palpatine orchestra la guerra dei cloni — Star Wars (entrambi i lati sono lui)"
      - "Littlefinger incastra gli Stark — Game of Thrones"
      - "Operation Mincemeat — WWII (cadavere con documenti falsi)"
      - "Il falso attacco orchesco — qualsiasi avventura D&D di intrigo"
    uso_dnd: >
      I PG arrivano sulla scena di un crimine e le prove puntano alla fazione
      sbagliata. Se non indagano, scoppia una guerra tra innocenti. Applicare la
      Three Clue Rule: almeno 3 indizi che la scena è stata "costruita".
      Funziona come motore di un intero arco: smascherare il burattinaio.
    usato_in: [Il Mistero, La Crisi di Successione, La Ribellione]
    vedi_anche: [Il Falso Antagonista, La Regola dei Tre Indizi, Il Piano Perfetto del Villain]

  - tipo: plot
    nome: L'Indagine sulla Cospirazione
    nome_en: Conspiracy Thriller / Unraveling the Web
    nomi_alt: [Il Complotto, The Conspiracy, Paranoia Thriller, Deep State, La Ragnatela]
    descrizione: >
      I PG scoprono che dietro eventi apparentemente scollegati c'è un'unica
      mente (o organizzazione) che tira i fili. L'avventura è sbrogliare la
      matassa: chi c'è dietro, cosa vuole, e come fermarlo prima che il piano
      si compia. Ogni indizio rivela un pezzo di un quadro più grande.
    esempi:
      - "All the President's Men — film (Watergate)"
      - "The X-Files — serie (la cospirazione governativa)"
      - "Game of Thrones — le macchinazioni di Littlefinger"
      - "Captain America: The Winter Soldier — MCU (HYDRA dentro SHIELD)"
      - "Eyes Wide Shut — Kubrick (società segreta)"
      - "Deus Ex — videogioco (complotti sovrapposti)"
    uso_dnd: >
      I primi moduli sembrano avventure scollegate (banditi, mostri, politica).
      Poi un indizio collega tutto: la stessa organizzazione era dietro. I moduli
      successivi svelano la rete. Il climax è raggiungere il vertice. Richiede
      Plot Concatenati + Three Clue Rule + Figurante di Čechov.
    usato_in: []
    vedi_anche: [Plot Concatenati, Il Mistero, La Masquerade, Il Piano Perfetto del Villain]

  - tipo: relazione
    nome: Il Rivale Caduto
    nome_en: Rival Turned Evil / Fallen Friend
    nomi_alt: [Fallen Friend, L'Amico Perduto, The Corrupted Ally, L'Ex-Compagno]
    descrizione: >
      Un ex-compagno, amico d'infanzia, o collega dei PG che è passato al lato
      oscuro. A differenza del Tradimento dell'Alleato (che accade durante
      l'avventura), qui la caduta è avvenuta PRIMA — i PG ritrovano qualcuno che
      conoscevano buono e lo scoprono cambiato. La domanda: è recuperabile?
    esempi:
      - "Saruman — Il Signore degli Anelli (ex-alleato del Consiglio Bianco)"
      - "Anakin/Vader — Star Wars (amico di Obi-Wan, ora nemico)"
      - "Harvey Dent/Due Facce — Batman (l'amico diventato villain)"
      - "Arthas — Warcraft (compagno d'armi caduto)"
      - "Sasuke — Naruto (compagno di squadra passato al nemico)"
      - "Cyrus — Pokémon (ex-brillante ricercatore diventato leader criminale)"
    uso_dnd: >
      I PG vengono mandati a fermare un villain e scoprono che è qualcuno che il
      loro PG (o un NPC mentore) conosceva da prima dell'avventura. Il background
      del PG si intreccia con la trama presente. La scelta: provare a redimere il
      rivale caduto (difficile) o accettare che è perduto e combatterlo.
    usato_in: [La Vendetta, Sconfiggere il Mostro, Rinascita]
    vedi_anche: [Lo Specchio, Il Tradimento dell'Alleato, L'Alleanza Oscillante, La Nemesi]

  - tipo: situazione
    nome: Il Rito di Passaggio
    nome_en: Rite of Passage / Coming of Age
    nomi_alt: [Coming of Age, Iniziazione, La Prova di Maturità, Il Battesimo del Fuoco, Trial by Fire]
    descrizione: >
      Una prova formalizzata che segna il passaggio da uno stato a un altro —
      da apprendista a maestro, da bambino ad adulto, da estraneo a membro.
      La prova è pubblica, codificata, e il fallimento ha conseguenze sociali
      reali. Non è un combattimento casuale — è un evento con regole precise
      e significato culturale.
    esempi:
      - "Le prove Jedi — Star Wars (padawan → cavaliere)"
      - "Il Sorting Hat — Harry Potter (assegnazione alla casa)"
      - "La prova del fuoco — riti tribali reali"
      - "Il primo dungeon — tropo D&D (i novellini dimostrano il loro valore)"
      - "Il Rumspringa — Amish (uscire per scegliere se restare)"
      - "La Caccia — tropo fantasy (uccidere il primo mostro per diventare adulto)"
    uso_dnd: >
      Modulo introduttivo perfetto: i PG sono apprendisti/novizi che devono
      superare una prova per essere riconosciuti come avventurieri, entrare in
      una gilda, o accedere a un luogo sacro. Le regole della prova sono fisse
      (no magia, solo certe armi, entro un tempo). Il successo dà status e
      accesso al mondo dell'avventura.
    usato_in: [Da Povero a Ricco, La Cerca, Il Guardiano della Soglia]
    vedi_anche: [Il Guardiano della Soglia, Il Compito Impossibile, La Prova Segreta]

  - tipo: situazione
    nome: Il Segreto Inconfessabile
    nome_en: Dark Secret / Skeleton in the Closet
    nomi_alt: [Skeleton in the Closet, Dark Secret, Lo Scheletro nell'Armadio, The Buried Truth]
    descrizione: >
      Un personaggio (PG, NPC, istituzione) nasconde un segreto terribile. Se
      viene rivelato, le conseguenze sono devastanti: perdita di status, arresto,
      guerra, vergogna. Il segreto è una bomba a orologeria narrativa — la
      tensione viene dal "quando verrà fuori?" non dal "se".
    esempi:
      - "Jon Snow è un Targaryen — Game of Thrones (segreto tenuto per decenni)"
      - "Snape ama Lily — Harry Potter (segreto rivelato post-mortem)"
      - "Il segreto di Shutter Island — film (il protagonista è un paziente)"
      - "Bruce Wayne è Batman — DC (segreto come struttura portante)"
      - "Il peccato originale della fondazione — qualsiasi istituzione corrotta"
    uso_dnd: >
      Un NPC importante (re, mentore, quest giver) ha un segreto che i PG possono
      scoprire. Il segreto cambia tutto: la guerra era ingiusta, il "mostro" era
      un figlio abbandonato, la gilda è fondata su un crimine. I PG devono
      decidere: rivelare (e affrontare il caos) o tacere (e essere complici).
      Funziona come colpo di scena a metà avventura.
    usato_in: [Il Mistero, Il Colpo di Scena, La Crisi di Successione]
    vedi_anche: [Il Colpo di Scena, L'Agnizione, Il Narratore Inaffidabile, La Masquerade]


  - tipo: tecnica
    nome: L'Ora più Buia
    nome_en: Darkest Hour / All Is Lost
    nomi_alt: [All Is Lost, Il Punto più Basso, Rock Bottom, Darkest Before the Dawn, La Notte più Lunga]
    descrizione: >
      Il momento nella storia in cui tutto sembra perduto. Gli alleati sono
      caduti, le risorse esaurite, il villain sembra aver vinto, e la speranza
      è a zero. È il punto più basso dell'arco narrativo — esiste per rendere
      la vittoria finale (se arriva) più dolce. In Vogler è lo stadio 8 (Ordeal)
      o l'ingresso nella "grotta più profonda".
    esempi:
      - "La battaglia di Helm's Deep prima dei Rohirrim — Il Signore degli Anelli"
      - "Han Solo congelato, Luke mutilato — L'Impero Colpisce Ancora"
      - "Thanos vince — Infinity War (il film finisce sull'ora più buia)"
      - "La morte di Gandalf — La Compagnia dell'Anello"
      - "The Long Night — Game of Thrones"
      - "Tutti catturati — qualsiasi avventura D&D prima del climax"
    uso_dnd: >
      Pianificare un momento nel penultimo modulo dove i PG perdono — il villain
      vince una battaglia, un NPC muore, il piano fallisce. NON è la fine: è il
      setup per il ritorno trionfale. I PG devono sentire che è finita prima di
      trovare la forza per l'ultimo tentativo. Segue quasi sempre I Rinforzi o
      una rivelazione che cambia tutto.
    rischio: >
      Se è troppo devastante i giocatori si demoralizzano davvero (meta-game,
      non in-character). Dare un segnale chiaro che "non è finita": un indizio,
      un NPC che sussurra "c'è ancora una possibilità", una risorsa nascosta.
    usato_in: [Sconfiggere il Mostro, La Cerca, L'Assedio]
    puo_aver_bisogno_di: [Il Legame (affezione), Il Legame (luogo)]
    vedi_anche: [I Rinforzi, La Vittoria di Pirro, Il Colpo di Scena, Il Legame]

  - tipo: tecnica
    nome: Il Barlume di Speranza
    nome_en: Hope Spot
    nomi_alt: [Hope Spot, False Dawn, La Falsa Speranza, Il Momento di Luce, Yank the Dog's Chain]
    descrizione: >
      Un breve momento in cui sembra che le cose stiano migliorando — il piano
      funziona, l'aiuto è in arrivo, il nemico vacilla — prima che tutto crolli
      di nuovo. È l'opposto dell'Ora più Buia: un picco di speranza PRIMA della
      caduta. Serve ad amplificare il dolore della sconfitta successiva. "Ce
      l'avevamo quasi fatta" è più devastante di "non avevamo mai avuto possibilità".
    esempi:
      - "Boromir combatte eroicamente... poi le frecce arrivano — Il Signore degli Anelli"
      - "Il piano di fuga funziona... poi la porta è chiusa — qualsiasi thriller"
      - "Ned Stark sta per essere graziato... poi Joffrey ordina l'esecuzione — GoT"
      - "La cura funziona... poi il paziente ricade — qualsiasi medical drama"
      - "Il cattivo sembra sconfitto... poi si rialza — qualsiasi boss fight"
    uso_dnd: >
      Prima di un colpo devastante, dare ai PG un momento di successo: "avete
      aperto la porta! ...dietro c'è un esercito." "L'antidoto funziona! ...ma
      ce n'è per uno solo e i malati sono tre." Il barlume rende il colpo successivo
      più pesante. Usare con parsimonia — 1 per arco, al momento giusto.
    rischio: >
      Se ogni successo è sempre seguito da un "ma...", i giocatori diventano
      cinici e smettono di gioire. Il barlume deve essere raro per funzionare.
    sottocaso_di: L'Ora più Buia
    usato_in: [Sconfiggere il Mostro, Tragedia, L'Assedio]
    vedi_anche: [L'Ora più Buia, La Vittoria di Pirro, Il Colpo di Scena]

  - tipo: tecnica
    nome: La Pausa (Il Respiro)
    nome_en: Breather Episode / Campfire Scene
    nomi_alt: [Campfire Scene, Rest Episode, Il Momento di Calma, Downtime, La Tregua Narrativa]
    descrizione: >
      Un momento deliberato di calma tra due archi intensi. I PG riposano, parlano
      tra loro, esplorano il mondo in modo rilassato, fanno shopping, scherzano.
      Non succede nulla di pericoloso. Serve a: ricaricare emotivamente i giocatori,
      approfondire i personaggi, dare contrasto che rende l'azione successiva più
      intensa.
    esempi:
      - "La Contea prima della partenza — Il Signore degli Anelli"
      - "La scena del falò — Dark Souls / qualsiasi RPG"
      - "L'episodio della spiaggia — qualsiasi anime"
      - "La festa dopo la vittoria — qualsiasi film d'avventura"
      - "Long rest nella taverna — D&D classico"
    uso_dnd: >
      Dopo un modulo intenso (boss fight, tradimento, morte NPC): pianificare
      una sessione leggera. Shopping, roleplay in taverna, backstory dei PG,
      incontri sociali innocui. Nessun combattimento. Il DM può usarla per
      seminare presagi (Il Presagio) per il prossimo arco senza pressione.
    rischio: >
      Se troppo lunga o troppo frequente, il ritmo muore. Una sessione di pausa
      ogni 3-4 sessioni intense è il ritmo ideale.
    usato_in: [La Cerca, Sconfiggere il Mostro]
    vedi_anche: [Il Legame, La Promozione, Il Presagio, La Finta Minaccia]

  - tipo: situazione
    nome: La Pedina Inconsapevole
    nome_en: Unwitting Pawn / Manipulated Hero
    nomi_alt: [Unwitting Pawn, Il Manipolato, Puppet Hero, Strumento Inconsapevole]
    descrizione: >
      I PG (o un NPC) sono stati manipolati fin dall'inizio. Ciò che credevano
      essere la missione serviva in realtà gli scopi del villain. L'eroe ha
      fatto esattamente ciò che il nemico voleva — aprire una porta, eliminare
      un rivale, raccogliere ingredienti per un rituale — senza saperlo. La
      rivelazione è devastante: "eravamo noi i cattivi?"
    esempi:
      - "I Jedi combattono la guerra dei cloni — Star Wars (servono il piano di Palpatine)"
      - "Frodo porta l'Anello a Mordor — Il Signore degli Anelli (Sauron lo vuole LÌ)"
      - "Jack in Bioshock — videogioco ('Would you kindly' = controllo mentale)"
      - "Neo è parte del sistema — The Matrix Reloaded (l'Eletto è un meccanismo di controllo)"
      - "I PG eliminano il rivale del villain pensando di fare il bene — D&D classico"
    uso_dnd: >
      La quest data dal "buon" NPC serviva in realtà al villain. I PG lo scoprono
      a metà o fine avventura. La rivelazione deve essere preparata con indizi
      (perché il quest giver sapeva dove trovare l'oggetto? perché nessun altro
      lo cercava?). Dopo la rivelazione: i PG scelgono come rimediare.
    rischio: >
      Se i PG non avevano NESSUN modo di scoprire la manipolazione prima del
      reveal, si sentono fregati dal DM. Seminare almeno 2-3 indizi che qualcosa
      non tornava — in modo che a posteriori dicano "avremmo dovuto capirlo".
    usato_in: [Il Piano Perfetto del Villain, Il Colpo di Scena, Il Falso Finale]
    vedi_anche: [Il Piano Perfetto del Villain, Il Benefattore Misterioso, Il Narratore Inaffidabile]

  - tipo: relazione
    nome: Il Piedistallo Spezzato
    nome_en: Broken Pedestal / Fallen Idol
    nomi_alt: [Fallen Idol, L'Idolo Caduto, Broken Hero, Il Mentore Corrotto, Disillusione]
    descrizione: >
      Un personaggio che i PG (o un NPC) ammiravano profondamente si rivela
      indegno — corrotto, codardo, bugiardo, o semplicemente umano e fallibile.
      L'idolo cade. La disillusione è dolorosa ma può essere il motore per
      crescere: "non posso più contare su di lui, devo farcela da solo."
    esempi:
      - "Dumbledore rivelato manipolatore — Harry Potter (Deathly Hallows)"
      - "Obi-Wan mente su Vader — Star Wars (le verità parziali del mentore)"
      - "All Might perde i poteri — My Hero Academia (l'eroe supremo è mortale)"
      - "Il re buono è corrotto — qualsiasi fantasy politico"
      - "Il maestro d'armi è un codardo — tropo D&D"
    uso_dnd: >
      Il Mentore o un NPC ammirato dai PG si rivela fallibile o disonesto. Non
      necessariamente malvagio — può essere semplicemente debole, spaventato, o
      aver commesso un errore in passato (Il Segreto Inconfessabile). La reazione
      dei PG definisce la loro maturità: perdonare, condannare, o superare.
    usato_in: [Il Colpo di Scena, La Crisi di Successione, Il Mistero]
    puo_aver_bisogno_di: [Il Legame (affezione)]
    vedi_anche: [Il Mentore, Il Segreto Inconfessabile, Il Colpo di Scena, L'Alleanza Oscillante]

  - tipo: personaggio
    nome: La Pedina del Destino (Il Prescelto Sbagliato)
    nome_en: The Poorly Chosen One / Wrong Guy for the Job
    nomi_alt: [Wrong Chosen One, L'Inadeguato, The Bumbling Hero, Il Prescelto Sbagliato]
    sottocaso_di: L'Eletto
    descrizione: >
      Come l'Eletto, ma la profezia ha scelto male — o è stata fraintesa. Il
      "prescelto" è palesemente inadeguato: codardo, incompetente, o semplicemente
      una persona normale senza qualità speciali. Deve crescere per essere
      all'altezza del ruolo, o scoprire che il vero potere non è dove credeva.
      Versione comica o umile dell'Eletto.
    esempi:
      - "Bilbo Baggins — Lo Hobbit (scelto da Gandalf, palesemente inadeguato)"
      - "Arthur Dent — Guida Galattica per Autostoppisti (l'uomo più normale dell'universo)"
      - "Neville Longbottom — Harry Potter (quasi-Eletto che diventa eroe per scelta)"
      - "Shrek — film (anti-eroe mandato a salvare la principessa)"
      - "Rincewind — Discworld (il peggior mago del mondo, sempre nel posto sbagliato)"
    uso_dnd: >
      Un PG viene scelto dalla profezia/dal destino/dal caso ma è chiaramente
      sotto-livello per il compito. La crescita del personaggio È l'avventura.
      Tono più leggero e umoristico rispetto all'Eletto classico. Funziona
      benissimo per campagne che iniziano dal livello 1.
    usato_in: [La Cerca, Da Povero a Ricco, Commedia degli Errori]
    vedi_anche: [L'Eletto, L'Eroe Riluttante, Il Branco di Disadattati]

  - tipo: situazione
    nome: Il Deus Ex Machina (L'Errore da Evitare)
    nome_en: Deus Ex Machina
    nomi_alt: [Ass Pull, Il Dio dalla Macchina, Contrived Solution, Plot Armor, Anti-Pattern Narrativo]
    descrizione: >
      Una soluzione al problema arriva dal nulla, senza preparazione né
      giustificazione narrativa. Un NPC mai visto salva la situazione, un potere
      mai menzionato risolve tutto, il DM inventa una via d'uscita perché i PG
      sono bloccati. NON è uno stereotipo da usare — è un ANTI-PATTERN da
      riconoscere ed evitare. Incluso nel database come warning.
    esempi:
      - "Le Aquile — Il Signore degli Anelli (controverso: preparato o gratuito?)"
      - "Il sonic screwdriver — Doctor Who (risolve tutto senza spiegazione)"
      - "La kryptonite trovata per caso — Superman"
      - "Il potere dell'amicizia — anime (power-up inspiegabile nel momento del bisogno)"
      - "'Rocks fall, everyone dies' — D&D (il DM forza un finale)"
    uso_dnd: >
      DA EVITARE. Se i PG sono bloccati, la soluzione deve essere: (1) già
      preparata nel mondo (I Rinforzi guadagnati, il Fucile di Čechov); (2) frutto
      dell'ingegno dei PG; (3) un compromesso doloroso (Spalle al Muro). MAI
      introdurre una soluzione dal nulla. Se serve un salvataggio, deve essere
      stato GUADAGNATO prima. L'unica eccezione accettabile: la sessione sta
      finendo male e il divertimento dei giocatori è a rischio — in quel caso,
      ammettere apertamente "ok, vi do una via d'uscita, la prossima volta
      prepariamoci meglio."
    rischio: >
      Distrugge la fiducia nella coerenza del mondo. I giocatori smettono di
      pianificare perché "tanto il DM ci salverà" o "tanto il DM ci fregherà
      comunque". È l'opposto di tutto ciò che rende D&D significativo.
    usato_in: []
    vedi_anche: [I Rinforzi, Il Fucile di Čechov, Spalle al Muro, La Pseudo-Scelta]

  - tipo: tecnica
    nome: Il Pacing (Ritmo Narrativo)
    nome_en: Pacing / Tension Curve
    nomi_alt: [Ritmo, Tension Management, Narrative Rhythm, Curva di Tensione, Flow]
    descrizione: >
      La gestione deliberata dell'alternanza tra momenti di alta tensione e
      momenti di calma. Un'avventura ben costruita non è tutta azione né tutta
      dialogo — oscilla come un'onda: tensione↑ → climax → respiro↓ → tensione↑.
      Ogni modulo ha il suo mini-arco di tensione, e l'avventura intera ha un
      arco macro. Il pacing è ciò che tiene i giocatori ingaggiati senza
      esaurirli.
    esempi:
      - "La struttura a 3 atti — qualsiasi sceneggiatura (setup → confrontation → resolution)"
      - "I 12 stadi di Vogler — The Writer's Journey (curva di tensione prescritta)"
      - "La struttura dei film Marvel — MCU (azione → humor → emozione → azione)"
      - "Dark Souls — bonfire come respiro tra boss"
      - "L'alternanza combat/roleplay — D&D ben condotto"
    uso_dnd: >
      Regola pratica: dopo un combattimento duro → scena sociale. Dopo roleplay
      lungo → un incontro d'azione. Dopo un colpo emotivo (morte NPC) → momento
      di tenerezza o humor. Mai 3 combattimenti consecutivi senza pausa. Mai
      2 ore di dialogo senza un momento di tensione. L'Incontro Filler e La Pausa
      sono strumenti di pacing.
    usato_in: []
    vedi_anche: [La Pausa, L'Incontro Filler, L'Ora più Buia, In Medias Res]

  - tipo: situazione
    nome: Il Sacrificio Volontario
    nome_en: Heroic Sacrifice / Dying Moment of Awesome
    nomi_alt: [Heroic Sacrifice, La Morte Eroica, Il Sacrificio Supremo, Greater Good Death, Noble Death]
    descrizione: >
      Un personaggio sceglie consapevolmente di morire (o di perdere qualcosa di
      irrecuperabile) per salvare gli altri. È il momento supremo di un arco
      narrativo — tutto il Legame costruito prima converge in questo istante.
      Non è una morte casuale: è una SCELTA, e deve essere gloriosa, significativa,
      e irreversibile.
    esempi:
      - "Gandalf sul ponte di Khazad-dûm — Il Signore degli Anelli ('Fly, you fools!')"
      - "Iron Man con lo Snap — Endgame"
      - "Boromir che difende Merry e Pippin — Il Signore degli Anelli"
      - "Spock nella camera di radiazione — Star Trek II"
      - "Hodor che regge la porta — Game of Thrones"
      - "Vegeta si sacrifica contro Buu — Dragon Ball Z"
    uso_dnd: >
      Per NPC: il companion o il mentore si sacrifica per permettere ai PG di
      fuggire/vincere. Deve essere preparato con Il Legame (altrimenti non colpisce).
      Per PG: solo con scelta LIBERA del giocatore, mai imposta. Il momento deve
      essere epico — dare al giocatore un'azione finale spettacolare. Se un PG
      si sacrifica, celebrarlo.
    rischio: >
      Se ogni NPC amato muore in modo sacrificale, diventa prevedibile. Il
      sacrificio funziona perché è RARO. Max 1 per campagna.
    usato_in: [Sconfiggere il Mostro, L'Ora più Buia, L'Assedio]
    puo_aver_bisogno_di: [Il Legame (affezione)]
    vedi_anche: [Il Legame, L'Ora più Buia, La Vittoria di Pirro, Spalle al Muro]


  - tipo: situazione
    nome: La Lealtà Divisa
    nome_en: Conflicting Loyalty / Torn Between Two Sides
    nomi_alt: [Torn Allegiance, Doppia Lealtà, Divided Loyalty, Il Cuore Spezzato tra Due Cause]
    descrizione: >
      Un personaggio è fedele a due parti che entrano in conflitto tra loro —
      la sua fazione e i PG, la sua famiglia e il suo dovere, il suo re e la
      sua coscienza. Deve scegliere un lato e tradire l'altro. Non è una scelta
      tra bene e male (quella è Spalle al Muro) — è una scelta tra due beni
      o due doveri legittimi.
    esempi:
      - "Boromir — Il Signore degli Anelli (leale alla Compagnia E a Gondor)"
      - "Snape — Harry Potter (servo di Dumbledore E di Voldemort, per ragioni diverse)"
      - "Jaime Lannister — Game of Thrones (giuramento ai Stark vs famiglia)"
      - "Zuko — Avatar (onore del padre vs cosa giusta)"
      - "Hector — Iliade (dovere verso Troia vs amore per la famiglia)"
      - "Aragorn — Il Signore degli Anelli (destino del re vs desiderio di libertà)"
    uso_dnd: >
      Un NPC alleato ha un'altra lealtà che i PG non conoscono (la sua gilda, la
      sua famiglia, un giuramento). Quando le due lealtà collidono, l'NPC deve
      scegliere — e i PG possono influenzare la scelta. Oppure un PG stesso
      (consenso del giocatore) ha un doppio obbligo nel background che il DM
      attiva al momento giusto.
    usato_in: [Spalle al Muro, Il Tradimento dell'Alleato, La Crisi di Successione]
    puo_aver_bisogno_di: [Il Legame (ideale)]
    vedi_anche: [Spalle al Muro, Il Tradimento dell'Alleato, Il Debito d'Onore, L'Alleato Scomodo]

  - tipo: personaggio
    nome: Il Ladro Gentiluomo
    nome_en: Gentleman Thief / Lovable Rogue
    nomi_alt: [Lovable Rogue, Robin Hood, Il Briccone Simpatico, Arsène Lupin, The Charming Thief]
    descrizione: >
      Un criminale con stile, classe e un codice morale proprio. Ruba ai ricchi
      (o ai cattivi), non fa del male agli innocenti, e ha un fascino che rende
      difficile odiarlo anche alle sue vittime. È un outsider che opera ai
      margini della legge ma dalla parte giusta della morale — secondo lui.
    esempi:
      - "Lupin III — anime/manga (ladro con onore)"
      - "Robin Hood — leggenda (ruba ai ricchi per dare ai poveri)"
      - "Danny Ocean — Ocean's Eleven (criminale carismatico)"
      - "Arsène Lupin — Leblanc (il ladro gentiluomo originale)"
      - "Han Solo — Star Wars (contrabbandiere con cuore d'oro)"
      - "Locke Lamora — The Lies of Locke Lamora (truffatore fantasy)"
    uso_dnd: >
      NPC rogue che aiuta i PG per motivi propri — in cambio di una parte del
      bottino o del piacere della sfida. Ha contatti nel sottobosco, sa entrare
      ovunque, e ha sempre un piano di fuga. Ideale come companion per moduli
      Heist. Può essere anche il background di un PG rogue.
    usato_in: [L'Infiltrazione, Commedia degli Errori, La Cerca]
    vedi_anche: [Il Trickster, L'Informatore, Il Companion Fedele]

  - tipo: situazione
    nome: La Morale Grigia
    nome_en: Grey and Gray Morality / No Clear Good Guys
    nomi_alt: [Morally Grey, Shades of Gray, Nessun Buono, No Good Guys, Ethical Ambiguity]
    descrizione: >
      Nessuna delle parti in conflitto è chiaramente "buona" o "cattiva". Tutti
      hanno ragioni, tutti commettono atrocità, tutti proteggono qualcuno. I PG
      devono scegliere un lato (o nessuno) senza la comodità di un villain
      inequivocabile. La tensione morale è il cuore dell'avventura.
    esempi:
      - "Game of Thrones — quasi tutte le fazioni sono grigie"
      - "The Witcher — i mostri a volte sono più umani degli umani"
      - "Captain America: Civil War — MCU (entrambi i lati hanno ragione)"
      - "Watchmen — Moore (nessun eroe è davvero buono)"
      - "The Last of Us Part II — videogioco (entrambe le protagoniste sono giustificate)"
      - "Avatar: The Last Airbender — la Nazione del Fuoco ha cittadini innocenti"
    uso_dnd: >
      Costruire un conflitto dove entrambe le fazioni hanno ragioni valide e
      metodi discutibili. I PG non possono "risolvere" schierandosi col buono —
      devono fare compromessi, negoziare, o accettare che la loro scelta farà
      soffrire qualcuno. Ideale per avventure politiche mature.
    rischio: >
      Se NULLA è chiaro i giocatori si paralizzano. Dare almeno un punto fermo
      morale (un innocente da proteggere, una linea da non oltrepassare) per
      ancorare le decisioni.
    usato_in: [La Crisi di Successione, La Ribellione, Lo Stallo]
    vedi_anche: [L'Anti-Villain, Spalle al Muro, Lo Stallo, La Rivalità]

  - tipo: situazione
    nome: La Truffa (The Con)
    nome_en: The Con / The Sting / The Long Con
    nomi_alt: [The Sting, La Fregatura, Long Con, Confidence Game, Il Raggiro Elaborato]
    descrizione: >
      I PG (o un NPC) organizzano un inganno elaborato contro un bersaglio —
      non un furto fisico (quello è l'Heist) ma una truffa: far credere qualcosa
      di falso al bersaglio per ottenere ciò che si vuole. Richiede preparazione,
      improvvisazione, e nervi saldi. Se il bersaglio sospetta, tutto crolla.
    esempi:
      - "The Sting — film 1973 (la truffa perfetta)"
      - "Catch Me If You Can — film (Frank Abagnale)"
      - "Ocean's Eleven — film (parte truffa, parte heist)"
      - "Locke Lamora — The Lies of Locke Lamora (truffe elaborate)"
      - "Hustle — serie TV (truffatori contro ricchi cattivi)"
      - "Il Mago di Oz — (un truffatore dietro la tenda)"
    uso_dnd: >
      I PG devono ingannare un NPC potente: fingere di essere qualcun altro,
      creare una falsa situazione, manipolare le informazioni. A differenza
      dell'Heist (rubare un oggetto), qui si ruba la fiducia/il consenso. Fase
      di pianificazione + esecuzione con tiri Inganno/Persuasione + imprevisti.
    sottocaso_di: L'Infiltrazione
    usato_in: [L'Infiltrazione, Commedia degli Errori, Il Mistero]
    vedi_anche: [L'Infiltrazione, Il Ladro Gentiluomo, L'Identità Scambiata, Il Piano Non Detto]

  - tipo: personaggio
    nome: Il Servitore Enigmatico
    nome_en: Enigmatic Minion / The Dragon with an Agenda
    nomi_alt: [The Dragon with an Agenda, L'Attendente Misterioso, Scheming Servant, Il Servitore con Piano]
    descrizione: >
      Un servitore del villain le cui vere motivazioni restano oscure. Esegue
      gli ordini... ma con un'interpretazione personale. A volte aiuta i PG in
      modo sottile, a volte li ostacola oltre il necessario. Ha chiaramente un
      piano proprio che non coincide con quello del suo padrone — ma quale?
    esempi:
      - "Severus Snape — Harry Potter (servo di Voldemort con agenda propria)"
      - "Varys — Game of Thrones (servo del trono con lealtà segreta)"
      - "Darth Vader — Star Wars (esegue ordini ma ha obiettivi personali)"
      - "Grima Wormtongue — Il Signore degli Anelli (servo che forse vuole più di ciò che ha)"
      - "Starscream — Transformers (luogotenente che vuole il posto del capo)"
    uso_dnd: >
      Un servitore del BBEG che i PG incontrano ripetutamente. Non è un semplice
      luogotenente: a volte li lascia andare, a volte dà indizi. I PG si chiedono
      se possono voltarlo dalla loro parte. Può diventare: alleato se convinto,
      il VERO villain se il BBEG cade (Falso Finale), o un aiuto nel climax.
    usato_in: [Sconfiggere il Mostro, Il Falso Finale, Il Piano Perfetto del Villain]
    vedi_anche: [Il Luogotenente, Il Mutaforma, La Talpa, Il Benefattore Misterioso]

  - tipo: relazione
    nome: Il Maestro e l'Allievo (Opposti)
    nome_en: Opposed Mentors / Student Surpasses Master
    nomi_alt: [Student vs Master, L'Allievo Supera il Maestro, Clash of Teachings, Il Parricidio Filosofico]
    descrizione: >
      Due ex-allievi dello stesso maestro, o un maestro e il suo ex-studente,
      si trovano su fronti opposti. Conoscono le tecniche l'uno dell'altro
      perfettamente. Il conflitto è personale, filosofico, e tecnico — ogni
      mossa è anticipata. L'allievo deve superare gli insegnamenti del maestro
      per vincere.
    esempi:
      - "Obi-Wan vs Anakin — Star Wars (maestro vs allievo caduto)"
      - "Dumbledore vs Grindelwald — Harry Potter (ex-amici con filosofie opposte)"
      - "Gandalf vs Saruman — Il Signore degli Anelli (colleghi dello stesso ordine)"
      - "Batman vs Ra's al Ghul — DC (addestrato dalla Lega delle Ombre)"
      - "Splinter vs Shredder — Teenage Mutant Ninja Turtles"
      - "Doctor Strange vs Mordo — MCU (stessi insegnamenti, vie opposte)"
    uso_dnd: >
      Il BBEG è l'ex-compagno di addestramento del Mentore dei PG, o l'ex-maestro
      di un PG. Si conoscono intimamente. Il villain anticipa le tattiche dei PG
      (perché conosce la scuola). La soluzione: innovare, usare qualcosa che il
      maestro non aveva insegnato. Il conflitto è personale per il Mentore.
    usato_in: [Sconfiggere il Mostro, La Rivalità, La Vendetta]
    vedi_anche: [Il Mentore, La Nemesi, Lo Specchio, Il Rivale Caduto]

  - tipo: situazione
    nome: La Guerra (Il Conflitto su Larga Scala)
    nome_en: War Arc / War Is Hell
    nomi_alt: [War Campaign, Conflitto Bellico, Wartime Adventure, Il Fronte, Theatre of War]
    descrizione: >
      I PG operano nel contesto di una guerra — non come generali ma come
      soldati, spie, o avventurieri in un mondo in fiamme. La guerra non è il
      background: è l'ambiente che influenza tutto (risorse scarse, civili in
      fuga, propaganda, atrocità da entrambi i lati). I PG non possono vincere
      la guerra da soli ma possono influenzarne l'esito con missioni specifiche.
    esempi:
      - "La Guerra dell'Anello — Il Signore degli Anelli (il conflitto è lo sfondo)"
      - "Band of Brothers — serie TV (soldati nella WWII)"
      - "Rogue One — Star Wars (missione durante la guerra)"
      - "The Witcher — saga (guerre di sfondo che influenzano tutto)"
      - "La Guerra dei Cinque Re — Game of Thrones"
      - "Saving Private Ryan — film (missione personale nel caos della guerra)"
    uso_dnd: >
      L'avventura si svolge durante un conflitto armato. Le missioni dei PG
      contribuiscono alla guerra: sabotare rifornimenti, salvare prigionieri,
      uccidere un generale, proteggere civili. L'esito delle missioni influenza
      il fronte (Il Contatore: punti vittoria). La guerra è grigia — atrocità
      da entrambi i lati. I PG possono anche cercare di FERMARE la guerra.
    usato_in: [Sconfiggere il Mostro, La Ribellione, L'Assedio]
    vedi_anche: [L'Assedio, La Ribellione, La Morale Grigia, Il Contatore, La Vittoria di Pirro]

  - tipo: situazione
    nome: La Colonia Perduta
    nome_en: Lost Colony / Isolated Community
    nomi_alt: [Lost World, La Comunità Isolata, Hidden Village, Il Villaggio Nascosto, The Settlement]
    descrizione: >
      I PG scoprono una comunità isolata dal mondo esterno — per scelta,
      catastrofe, o magia. La comunità ha sviluppato regole, cultura e credenze
      proprie. Può essere un paradiso nascosto (che custodisce un segreto) o un
      incubo (una setta, un esperimento degenerato, una civiltà stagnante). Il
      contatto con i PG rompe l'equilibrio.
    esempi:
      - "Il Villaggio — Shyamalan (comunità isolata per scelta)"
      - "Brigadoon — musical (villaggio che appare una volta ogni 100 anni)"
      - "Rapture — Bioshock (città utopica degenerata)"
      - "La Valle Nascosta — tropo fantasy (elfi/nani isolati per millenni)"
      - "Lost — serie TV (isola con comunità segreta)"
      - "Moria abbandonata — Il Signore degli Anelli (colonia nanica perduta)"
    uso_dnd: >
      I PG trovano un villaggio/città nascosta. Le regole sono diverse: la magia
      è proibita, la violenza è punita con la morte, gli stranieri non possono
      uscire. I PG devono navigare la cultura aliena (Pesce fuor d'Acqua) e
      decidere: aiutare la comunità, sfruttarla, o fuggire. Può contenere un
      MacGuffin o un alleato vitale.
    usato_in: [Viaggio e Ritorno, La Cerca, Il Mistero]
    vedi_anche: [Il Pesce fuor d'Acqua, La Zona Proibita, La Masquerade, Il Luogo Impossibile]

  - tipo: tecnica
    nome: Il Dilemma del Tram (Le Conseguenze Visibili)
    nome_en: Visible Consequences / Show Don't Tell Morality
    nomi_alt: [Trolley Problem, Show Don't Tell, Le Conseguenze delle Scelte, Choice Matters, Impact of Actions]
    descrizione: >
      Mostrare le conseguenze delle scelte dei PG nel mondo — non dirle, non
      implicarle, MOSTRARLE. Se i PG hanno salvato il villaggio, al ritorno i
      bambini giocano per strada. Se l'hanno abbandonato, trovano macerie. Le
      scelte devono avere effetti visibili e permanenti che i PG incontrano
      nuovamente. Senza questo, le scelte non hanno peso.
    esempi:
      - "Mass Effect — le scelte dei giochi precedenti cambiano il mondo del sequel"
      - "The Witcher 3 — le quest secondarie influenzano il finale"
      - "Dishonored — più uccidi, più il mondo diventa cupo"
      - "La Contea devastata — Il Signore degli Anelli (conseguenza della lunga assenza)"
      - "Fallout — i finali variano in base alle azioni del giocatore"
    uso_dnd: >
      Regola di design: per ogni scelta importante dei PG, scrivere nelle note DM
      la conseguenza visibile che incontreranno 1-3 moduli dopo. Se salvano il
      villaggio → il capo villaggio li aiuta nel modulo 4. Se non lo salvano →
      trovano un campo di rifugiati disperati. Il mondo RICORDA ciò che i PG
      hanno fatto.
    usato_in: [Il Contatore, Spalle al Muro, La Vittoria di Pirro]
    vedi_anche: [Il Contatore, Spalle al Muro, L'Orologio del Villain, Il Legame]

  - tipo: personaggio
    nome: Il Sopravvissuto (Il Testimone)
    nome_en: Sole Survivor / The Witness
    nomi_alt: [The Witness, L'Unico Sopravvissuto, Final Girl, Il Testimone Oculare, Last Man Standing]
    descrizione: >
      L'unico sopravvissuto di un evento terribile — un massacro, una
      spedizione fallita, un'apocalisse locale. Porta con sé informazioni
      vitali (cosa è successo, cosa c'è là dentro, chi è il nemico) ma anche
      trauma che lo rende inaffidabile o frammentario. È la chiave per capire
      il mistero — se i PG riescono a farlo parlare.
    esempi:
      - "Ishmael — Moby Dick ('Call me Ishmael' — l'unico sopravvissuto)"
      - "Ellen Ripley — Alien (sopravvissuta con informazioni vitali)"
      - "Il marinaio di Coleridge — The Rime of the Ancient Mariner"
      - "Il soldato traumatizzato — qualsiasi film di guerra (testimone oculare)"
      - "L'esploratore impazzito — tropo Lovecraft (sa cosa c'è nel dungeon)"
    uso_dnd: >
      NPC che i PG trovano: unico sopravvissuto di ciò che è successo nel dungeon/
      villaggio/spedizione. Ha le informazioni ma è traumatizzato (frammenta il
      racconto, omette dettagli per paura, o è parzialmente impazzito). I PG
      devono guadagnare la sua fiducia o ricostruire il racconto da pezzi.
      Combina con Il Registro dell'Apocalisse.
    usato_in: [Il Mistero, La Zona Proibita, La Pestilenza]
    vedi_anche: [Il Registro dell'Apocalisse, L'Ultimo della Sua Specie, Il Veterano Spezzato, Il Narratore Inaffidabile]

  - tipo: tecnica
    nome: La Paranoia Indotta (Escono dalle Pareti)
    nome_en: Paranoia Fuel / Everything Is Trying to Kill You
    nomi_alt: [Everything Is a Mimic, Trust No One, Non Fidarti di Nulla, Paranoia Fantasy, The Walls Have Eyes]
    descrizione: >
      Una minaccia camuffata (mimic, doppelganger, trappola nascosta) viene
      incontrata ripetutamente. I giocatori iniziano a sospettare di tutto:
      testano ogni porta, diffidano di ogni NPC, controllano ogni oggetto. La
      fiducia nel mondo di gioco crolla — tutto potrebbe essere un nemico
      travestito. Come tecnica è potente per creare tensione in ambienti
      horror/dungeon, ma se abusata diventa tediosa perché rallenta il gioco.
    esempi:
      - "Mimic — D&D (lo scrigno morde, ora ogni scrigno è sospetto)"
      - "The Thing — John Carpenter (chiunque potrebbe essere il mostro)"
      - "Among Us — videogioco (paranoia come meccanica centrale)"
      - "Doppelganger — D&D (quell'NPC è davvero lui?)"
      - "Bodysnatchers — film (nessuno è chi dice di essere)"
      - "Trappole di Grimtooth — D&D old school (tutto è letale)"
    uso_dnd: >
      Introdurre la minaccia camuffata 1-2 volte all'inizio del dungeon. Dopo,
      i PG saranno paranoici da soli — il DM non deve fare nulla, la tensione si
      automantiene. La terza volta può essere un'esca vuota (La Finta Minaccia)
      per comic relief. Funziona meglio in dungeon horror o con doppelganger in
      contesti sociali. Il punto chiave: dopo l'introduzione, la VERA minaccia
      è nella testa dei giocatori, non sulla mappa.
    rischio: >
      Se ogni porta è un mimic, ogni NPC un doppelganger, ogni scrigno una
      trappola, il gioco si ferma. Regola: max 2-3 minacce camuffate per dungeon.
      Dopo la terza, variare (la quarta è genuina) o abbandonare la tecnica.
      Mai usarla per più di un modulo consecutivo.
    usato_in: [Il Luogo Impossibile, Il Mistero, L'Infiltrazione]
    vedi_anche: [La Finta Minaccia, La Talpa, Il Presagio, Il Nemico Interiore]


  - tipo: situazione
    nome: Il Mostro è una Persona
    nome_en: Monster Is a Person / Sympathetic Monster
    nomi_alt: [Sympathetic Monster, Il Mostro Simpatico, Not So Different, My God What Have I Done]
    descrizione: >
      Il "mostro" che i PG sono stati mandati a uccidere si rivela essere una
      persona trasformata, un innocente maledetto, o una creatura senziente con
      diritti. Ucciderlo è omicidio, non eroismo. I PG devono scegliere:
      completare la missione (immorale), trovare una cura (quest aggiuntiva),
      o proteggere il mostro dagli altri (ribaltamento del ruolo).
    esempi:
      - "Il Lupo Mannaro che non vuole fare del male — tropo classico"
      - "Shrek — film (l'orco non è il mostro della storia)"
      - "Il Gigante di Ferro — film (il 'mostro' è gentile)"
      - "Il Golem di Praga — leggenda (creatura protettiva, non malvagia)"
      - "Geralt e i mostri senzienti — The Witcher (molte quest offrono questa scelta)"
      - "Frankenstein — Shelley (la creatura è la vittima, non il villain)"
    uso_dnd: >
      Il quest giver dice "uccidete il mostro nella foresta". I PG ci vanno e
      scoprono che è un druido trasformato, un bambino maledetto, o una creatura
      pacifica calunniata. La scelta morale: tornare con la testa del mostro
      (facile, ricompensa) o cercare la verità e affrontare il quest giver
      (difficile, giusto). Combina con La Morale Grigia.
    usato_in: [Il Mistero, La Morale Grigia, Spalle al Muro]
    vedi_anche: [La Morale Grigia, Il Falso Antagonista, Spalle al Muro, La Maledizione]

  - tipo: situazione
    nome: La Grazia o il Colpo di Grazia
    nome_en: Mercy Kill / To Kill or To Save
    nomi_alt: [Mercy Kill, Eutanasia Narrativa, Kill or Cure, La Scelta Compassionevole, Put Down]
    descrizione: >
      Un personaggio sofferente (maledetto, posseduto, morente senza cura,
      trasformato irreversibilmente) chiede di essere ucciso — o i PG devono
      decidere se ucciderlo è un atto di pietà o di crudeltà. Non c'è risposta
      giusta. La scelta rivela i valori del party.
    esempi:
      - "Boromir chiede di morire con onore — Il Signore degli Anelli"
      - "Of Mice and Men — Steinbeck (George e Lennie)"
      - "Logan chiede di morire — Logan/X-Men"
      - "Il cavallo con la zampa rotta — qualsiasi western"
      - "Yennefer chiede a Geralt di ucciderla se perde il controllo — The Witcher"
    uso_dnd: >
      Un NPC amato (Il Legame) è in una condizione irreversibile: posseduto,
      trasformato, sofferente. Chiede ai PG di finirla. Oppure non può chiederlo
      (è un animale, è incosciente) e i PG devono decidere per lui. La scelta
      deve avere conseguenze: gli altri NPC reagiranno diversamente a seconda
      di cosa i PG scelgono.
    usato_in: [Spalle al Muro, La Maledizione, Il Nemico Interiore]
    vedi_anche: [Spalle al Muro, La Maledizione, Il Legame, Il Sacrificio Volontario]

  - tipo: tecnica
    nome: Il Potere ha un Prezzo
    nome_en: Power at a Price / Faustian Mechanic
    nomi_alt: [Faustian Mechanic, Il Costo del Potere, Equivalent Exchange, Cast from Hit Points]
    descrizione: >
      Ogni volta che un PG usa un potere speciale, un artefatto, o una risorsa
      straordinaria, c'è un costo. Non in slot o risorse meccaniche standard —
      un costo narrativo: invecchiamento, perdita di memoria, corruzione visibile,
      debito con un'entità. Il potere è disponibile sempre, ma ogni uso avvicina
      a un punto di non ritorno.
    esempi:
      - "L'Unico Anello — Il Signore degli Anelli (usarlo ti rende visibile a Sauron)"
      - "Il lato oscuro — Star Wars (potere immediato, corruzione graduale)"
      - "La magia del sangue — Dragon Age (potere enorme, costo in vite)"
      - "Le Reliquie della Morte — Harry Potter (chi le usa tutte diventa padrone della Morte)"
      - "Frostmourne — Warcraft (ogni kill nutre la spada e consuma l'anima)"
      - "One For All — My Hero Academia (il corpo si spezza ad ogni uso)"
    uso_dnd: >
      Un artefatto/potere disponibile ai PG con costo narrativo legato al
      Contatore. Ogni uso: +1 corruzione, -1 anno di vita, 1 ricordo perso, un
      legame spezzato. Il PG sceglie se e quando usarlo. A soglia X: conseguenze
      irreversibili. È la Tentazione resa meccanica.
    usato_in: [La Tentazione, Il Patto col Diavolo, Il Contatore]
    vedi_anche: [La Tentazione, Il Contatore, Il Patto col Diavolo, Il Tesoro Maledetto]

  - tipo: situazione
    nome: Il Labirinto (Senza Via d'Uscita Ovvia)
    nome_en: The Maze / No Clear Exit
    nomi_alt: [The Maze, Il Dungeon Puzzle, Shifting Dungeon, Il Dedalo, Labyrinth]
    descrizione: >
      I PG sono intrappolati in un ambiente che cambia, confonde, o non ha
      un'uscita lineare. Non è solo un dungeon con molte stanze — è un posto
      dove perdersi è il pericolo principale. La soluzione non è combattere
      ma navigare, osservare pattern, o risolvere la logica del labirinto.
    esempi:
      - "Il Labirinto del Minotauro — mitologia greca (filo di Arianna)"
      - "Il Labirinto — film 1986 (regole illogiche, tempo che scorre)"
      - "The Shining — Kubrick (l'hotel come labirinto psicologico)"
      - "Cube — film (stanze che si spostano, pattern da decifrare)"
      - "Pac-Man — videogioco (il labirinto come campo di gioco)"
      - "Hogwarts scale mobili — Harry Potter (il castello cambia)"
    uso_dnd: >
      Un dungeon dove la mappa non basta: le stanze ruotano, i corridoi cambiano,
      tornare indietro porta altrove. I PG devono osservare un pattern (le porte
      rosse portano avanti, il muschio cresce verso l'uscita, la statua punta
      sempre nord). Il labirinto è un puzzle, non un combattimento. Può contenere
      un nemico che conosce le regole e i PG no.
    sottocaso_di: Il Luogo Impossibile
    usato_in: [La Cerca, Viaggio e Ritorno]
    vedi_anche: [Il Luogo Impossibile, La Zona Proibita, Il Compito Impossibile]

  - tipo: situazione
    nome: Il Lieto Fine Guadagnato
    nome_en: Earn Your Happy Ending
    nomi_alt: [Earned Happy Ending, Il Finale Meritato, Hard-Won Victory, Catharsis]
    descrizione: >
      Dopo tutte le sofferenze, i tradimenti, le perdite e le scelte impossibili,
      l'avventura si conclude BENE. Ma il lieto fine non è gratuito — è stato
      guadagnato col sangue, col sacrificio, e con le scelte giuste fatte sotto
      pressione. Il contrasto con le difficoltà precedenti rende la gioia finale
      più intensa. Non è un Deus Ex Machina — è il payoff di tutto il lavoro.
    esempi:
      - "Il Ritorno del Re — Il Signore degli Anelli (dopo tutto, Aragorn è re e il mondo è salvo)"
      - "Endgame — MCU (vincono, ma hanno perso Tony e Natasha)"
      - "Avatar: The Last Airbender — finale (Aang vince senza uccidere)"
      - "Shawshank Redemption — film (dopo 20 anni di prigione, la libertà)"
      - "Rocky — film (perde il match ma ha vinto la dignità)"
    uso_dnd: >
      Il finale dell'avventura è positivo MA riflette le scelte dei PG: se hanno
      sacrificato, il mondo ricorda; se hanno protetto, gli NPC sono vivi; se
      hanno corso rischi, hanno cicatrici. Il lieto fine non è automatico — se i
      PG hanno fatto scelte egoiste, il finale è amaro (Vittoria di Pirro). Il
      lieto fine è la ricompensa per aver giocato bene.
    usato_in: [Sconfiggere il Mostro, La Cerca, Rinascita]
    vedi_anche: [La Vittoria di Pirro, Il Sacrificio Volontario, Il Legame, Il Contatore]

  - tipo: personaggio
    nome: Il Profeta Ignorato
    nome_en: Cassandra Truth / The Prophet Nobody Believes
    nomi_alt: [Cassandra, Il Profeta Inascoltato, Nobody Believes Me, The Warning Ignored]
    descrizione: >
      Un personaggio che dice la verità — spesso una verità terribile e urgente —
      ma nessuno gli crede. Può essere un pazzo, un emarginato, un bambino, o
      qualcuno che ha già sbagliato in passato e ha perso credibilità. I PG
      possono essere quelli che finalmente lo ascoltano — o quelli che lo ignorano
      fino a che è troppo tardi.
    esempi:
      - "Cassandra — mitologia greca (maledetta a dire la verità senza essere creduta)"
      - "Il bambino che grida 'al lupo!' — fiaba (credibilità persa, poi ha ragione)"
      - "Il dottor Semmelweis — storia (lavatevi le mani! Nessuno ascolta)"
      - "Chicken Little — fiaba (il cielo sta cadendo! ...e poi cade davvero)"
      - "Gandalf avverte del pericolo — Il Signore degli Anelli (ignorato dal Consiglio)"
    uso_dnd: >
      Un NPC avverte i PG di un pericolo ma nessuno in città gli crede (è un
      ubriacone, un ex-criminale, un bambino). Se i PG lo ascoltano, hanno un
      vantaggio. Se lo ignorano, il pericolo li coglie di sorpresa. Funziona come
      indizio facoltativo: i PG attenti vengono premiati.
    usato_in: [Il Mistero, Il Male Sigillato, La Pestilenza]
    vedi_anche: [Il Presagio, La Regola dei Tre Indizi, Il Sopravvissuto]

  - tipo: relazione
    nome: L'Eredità Pesante
    nome_en: Legacy of the Chosen / Sins of the Father
    nomi_alt: [Sins of the Father, Le Colpe dei Padri, Legacy Burden, Il Peso del Cognome]
    descrizione: >
      Un personaggio porta il peso delle azioni di un predecessore — un genitore,
      un maestro, un eroe del passato. Il mondo lo giudica (bene o male) per ciò
      che qualcun altro ha fatto. Deve decidere se abbracciare l'eredità,
      rifiutarla, o riscriverla. Non ha scelto di portare questo peso.
    esempi:
      - "Aragorn — Il Signore degli Anelli (erede di Isildur che ha fallito)"
      - "Harry Potter — HP (figlio dei genitori che hanno sfidato Voldemort)"
      - "Kylo Ren — Star Wars (nipote di Vader, schiacciato dall'eredità)"
      - "Tyrion Lannister — Game of Thrones (il nome Lannister è un fardello)"
      - "Simba — Il Re Leone (l'ombra del padre)"
      - "Draco Malfoy — Harry Potter (il figlio paga per il padre)"
    uso_dnd: >
      Un PG è il figlio/allievo/erede di qualcuno di famoso (nel bene o nel male).
      Gli NPC reagiscono al NOME, non alla persona. Se l'antenato era un eroe:
      aspettative impossibili. Se era un villain: sospetto e ostilità. Il PG
      deve costruire la propria identità indipendente dal predecessore.
    usato_in: [L'Eletto, La Vendetta, L'Agnizione]
    vedi_anche: [L'Eletto, L'Agnizione, Lo Specchio, Il Segreto Inconfessabile]

  - tipo: situazione
    nome: Il Falso Rifugio
    nome_en: False Safe Haven / Sanctuary Betrayed
    nomi_alt: [False Sanctuary, La Trappola Accogliente, Safe Haven Betrayed, Il Nido del Serpente]
    descrizione: >
      I PG trovano un luogo sicuro — una taverna accogliente, un villaggio
      pacifico, una fortezza alleata — che si rivela essere una trappola, un
      luogo corrotto, o un inganno del villain. La sicurezza era un'illusione.
      Il tradimento del rifugio è più destabilizzante di un attacco in campo
      aperto perché viola il concetto stesso di "zona sicura".
    esempi:
      - "Lothlórien sospettata — Il Signore degli Anelli (in realtà sicura, ma il dubbio c'è)"
      - "L'Hotel Overlook — The Shining (sembra un rifugio, è una prigione)"
      - "Il villaggio di Midsommar — film (comunità accogliente = culto)"
      - "Rapture — Bioshock (utopia sottomarina degenerata)"
      - "La locanda con il padrone werewolf — tropo D&D classico"
      - "Il Truman Show — film (il mondo sicuro è una prigione)"
    uso_dnd: >
      I PG si fermano per un long rest in un posto che sembra sicuro. Durante
      la notte (o dopo un paio di giorni di comfort) la verità emerge: il
      taverniere è un cultista, il villaggio sacrifica i viaggiatori, la
      fortezza è sotto il controllo del nemico. Funziona meglio se i PG hanno
      abbassato la guardia (dopo La Pausa).
    usato_in: [Il Mistero, La Paranoia Indotta, Il Colpo di Scena]
    vedi_anche: [La Paranoia Indotta, Il Colpo di Scena, La Colonia Perduta, La Masquerade]

  - tipo: tecnica
    nome: La Scelta Retroattiva
    nome_en: Retroactive Choice / Past Comes Back
    nomi_alt: [Past Comes Back, Il Passato Ritorna, Consequences of Old Choices, Callback]
    descrizione: >
      Una decisione apparentemente minore fatta dai PG in un modulo precedente
      si rivela avere conseguenze enormi molto dopo. I PG non sapevano che quella
      scelta era importante quando l'hanno fatta — ma il DM sì. Il mondo ricorda
      e reagisce. È il Fucile di Čechov applicato alle SCELTE anziché agli oggetti.
    esempi:
      - "Mass Effect — le scelte di ME1 influenzano ME3 (anni dopo)"
      - "The Witcher 3 — salvare o no un NPC nel prologo cambia un'intera quest 30h dopo"
      - "Dishonored — uccidere i guard nel livello 1 produce più ratti nel livello 5"
      - "Undertale — ogni creatura uccisa o risparmiata cambia il finale"
      - "Baldur's Gate 3 — scelte dell'atto 1 che tornano nell'atto 3"
    uso_dnd: >
      Il DM annota ogni scelta 'grigia' dei PG (hanno ucciso il goblin che si
      arrendeva? hanno rubato dal mercante? hanno mentito al re?). 2-3 moduli
      dopo, la conseguenza arriva: il fratello del goblin li cerca, il mercante
      li ha denunciati, il re ha scoperto la bugia. I PG non possono prevedere
      quali scelte torneranno — tutte sono potenzialmente importanti.
    usato_in: [Il Contatore, Il Dilemma del Tram, La Morale Grigia]
    puo_aver_bisogno_di: [Il Fucile di Čechov]
    vedi_anche: [Il Contatore, Il Fucile di Čechov, Il Dilemma del Tram, L'Orologio del Villain]

  - tipo: situazione
    nome: Il Nemico del Mio Nemico
    nome_en: Enemy of My Enemy / Temporary Alliance of Convenience
    nomi_alt: [Enemy of My Enemy, Alleanza di Convenienza, Temporary Truce, Il Patto Temporaneo]
    sottocaso_di: L'Alleanza col Nemico
    descrizione: >
      Due o più fazioni normalmente ostili tra loro si alleano temporaneamente
      contro una minaccia comune più grande. L'alleanza è fragile, motivata
      solo dalla necessità, e destinata a dissolversi non appena la minaccia
      comune è eliminata. Tutti sanno che torneranno a combattersi — ma prima
      devono sopravvivere.
    esempi:
      - "URSS e USA vs Nazi — WWII (alleati per necessità, poi Guerra Fredda)"
      - "Elfi, Nani e Uomini vs Sauron — Il Signore degli Anelli"
      - "Avengers vs Thanos — MCU (fazioni diverse unite per una battaglia)"
      - "La Battaglia dei Cinque Eserciti — Lo Hobbit (si alleano vs orchi)"
      - "Goku e Freezer vs Jiren — Dragon Ball Super"
    uso_dnd: >
      Il villain principale è così potente che i PG devono allearsi con un nemico
      secondario. L'alleanza ha regole: "dopo, ognuno per la sua strada." La
      tensione viene dal sapere che l'alleato di oggi sarà il nemico di domani —
      e dal chiedersi se tradirà prima del previsto.
    usato_in: [Sconfiggere il Mostro, L'Assedio, La Guerra]
    vedi_anche: [L'Alleanza col Nemico, Lo Stallo, L'Alleato Scomodo]


  - tipo: tecnica
    nome: La Terza Via (Tagliare il Nodo)
    nome_en: Take a Third Option / Cutting the Knot
    nomi_alt: [Cutting the Knot, Il Nodo di Gordio, Third Option, Lateral Thinking, La Soluzione Creativa]
    descrizione: >
      Di fronte a un dilemma apparentemente binario (Spalle al Muro), i PG
      trovano una soluzione creativa che nessuno aveva previsto — né il DM, né
      il villain, né la narrazione. Rifiutano le opzioni presentate e ne inventano
      una nuova. In narrativa è il momento in cui l'eroe rompe le regole del
      gioco. In D&D è il momento in cui i giocatori sorprendono il DM.
    esempi:
      - "Alessandro Magno e il Nodo Gordiano — storia (lo taglia con la spada)"
      - "Kirk e il Kobayashi Maru — Star Trek (riprogramma il test)"
      - "Aang rifiuta di uccidere Ozai — Avatar (toglie i poteri anziché uccidere)"
      - "Indiana Jones spara al duellante — (rifiuta il duello, risolve diversamente)"
      - "Ender's Game — il bambino vince rompendo le regole del gioco"
    uso_dnd: >
      Come DM: quando presenti Spalle al Muro, NON prevedere una terza via —
      ma se i PG ne inventano una credibile, PREMIARLA. La terza via non va
      scritta nel modulo (altrimenti non è creatività dei PG, è un'opzione
      nascosta). Va accettata e improvvisata quando emerge. È il motivo per
      cui D&D è diverso da un videogioco.
    rischio: >
      Se il DM blocca sempre le soluzioni creative ("no, non puoi fare così"),
      i giocatori smettono di provare. Se le accetta sempre, i dilemmi perdono
      peso. Bilanciare: la terza via deve costare qualcosa (tempo, risorse,
      un rischio) ma deve essere possibile.
    usato_in: [Spalle al Muro, Il Compito Impossibile, Lo Stallo]
    vedi_anche: [Spalle al Muro, Il Compito Impossibile, La Pseudo-Scelta]

  - tipo: situazione
    nome: La Profezia Autoavverante
    nome_en: Self-Fulfilling Prophecy / Prophecy Twist
    nomi_alt: [Self-Fulfilling Prophecy, Il Paradosso Temporale, Destino Circolare, Because Destiny Says So]
    sottocaso_di: La Profezia
    descrizione: >
      La profezia si avvera PERCHÉ qualcuno tenta di evitarla. Le azioni prese
      per prevenire il destino sono esattamente ciò che lo causa. Oppure: la
      profezia si avvera in modo letterale ma con un significato completamente
      diverso da quello atteso (il "quibble" — gioco di parole nella profezia).
    esempi:
      - "Edipo — Sofocle (il padre lo abbandona per evitare la profezia, causandola)"
      - "Macbeth — Shakespeare ('nessun uomo nato da donna' — Macduff è nato da cesareo)"
      - "Star Wars prequel — Anakin crea ciò che teme per paura della profezia"
      - "Harry Potter — Voldemort 'marca' Harry tentando di ucciderlo, creando il suo nemico"
      - "Terminator — mandare il T-800 indietro crea la tecnologia che genera Skynet"
    uso_dnd: >
      Il villain conosce una profezia e agisce per impedirla — ma le sue azioni
      sono esattamente ciò che la rende vera. I PG possono scoprirlo e usarlo
      a loro vantaggio. Oppure: la profezia dice "la lama del figlio spezzerà
      il trono" — sembra violenta, ma il "figlio" è una montagna e la "lama"
      è un fiume. Formulare le profezie in modo ambiguo nel modulo 1, rivelare
      il vero significato nel modulo finale.
    usato_in: [La Profezia, Tragedia, Il Colpo di Scena]
    vedi_anche: [La Profezia, L'Ironia Drammatica, Il Colpo di Scena, L'Eletto]

  - tipo: tecnica
    nome: La Frase Bomba
    nome_en: Wham Line
    nomi_alt: [Wham Line, La Battuta Shock, The Reveal Line, Il Colpo di Dialogo, Mic Drop]
    descrizione: >
      Una singola frase pronunciata da un NPC (o letta in un documento) che
      ribalta tutto ciò che i PG credevano di sapere. Non è una scena elaborata —
      è una riga. Il silenzio al tavolo dopo è il segnale che ha funzionato.
      Prepara il terreno per un intero arco successivo in pochi secondi.
    esempi:
      - "'No, I am your father.' — Star Wars"
      - "'He was dead the whole time.' — The Sixth Sense"
      - "'The calls are coming from inside the house.' — horror classico"
      - "'Would you kindly?' — Bioshock"
      - "'Hodor... Hold the door...' — Game of Thrones"
      - "'Dumbledore aveva pianificato la propria morte.' — Harry Potter"
    uso_dnd: >
      Preparare UNA frase che un NPC dirà al momento giusto e che cambia tutto.
      Non spiegarla — lasciarla sospesa. I PG devono processarla. Esempi:
      "Il vostro mentore non è mai esistito." / "La principessa che cercate...
      è morta da dieci anni." / "Il mostro nel dungeon... siete voi."
      Una per avventura, al momento di massima tensione.
    rischio: >
      Se la frase non è preparata da indizi precedenti, sembra random. Se è
      troppo criptica, i PG non la capiscono. Dev'essere chiara e devastante.
    usato_in: [Il Colpo di Scena, L'Agnizione, Il Falso Finale]
    vedi_anche: [Il Colpo di Scena, L'Agnizione, Il Presagio, L'Ora più Buia]

  - tipo: situazione
    nome: Il Prezzo della Vittoria
    nome_en: Pyrrhic Choice / Victory Requires Sacrifice
    nomi_alt: [Victory Requires Sacrifice, Il Costo della Vittoria, No Free Wins, Bittersweet Victory]
    descrizione: >
      I PG possono vincere — ma solo se accettano un costo terribile PRIMA
      della battaglia, non dopo. Non è la Vittoria di Pirro (dove il costo si
      rivela dopo). Qui i PG SANNO il prezzo in anticipo e devono decidere se
      pagarlo. L'arma funziona solo col sangue di un alleato, il portale si
      chiude solo dall'interno, il rituale richiede un sacrificio volontario.
    esempi:
      - "Distruggere l'Anello richiede andare a Mordor (e forse morirci) — Il Signore degli Anelli"
      - "Il sacrificio di Iron Man — Endgame (sa che morirà usando le gemme)"
      - "Spock nella camera di radiazione — Star Trek II (sceglie prima)"
      - "Il prezzo dell'incantesimo di Doctor Strange — MCU (milioni di futuri)"
      - "Rogue One — l'intera squadra sa che è una missione suicida"
    uso_dnd: >
      Prima del climax, il DM presenta il costo: "Potete chiudere il portale, ma
      qualcuno deve restare dall'altra parte per attivare il sigillo." La scelta
      è dei PG. Chi si sacrifica? Un NPC? Un PG (con consenso)? Nessuno, e si
      cerca un'altra via? Il momento di decisione È il climax emotivo, più della
      battaglia che segue.
    usato_in: [Sconfiggere il Mostro, L'Ora più Buia, Il Sacrificio Volontario]
    puo_aver_bisogno_di: [Il Legame]
    vedi_anche: [Il Sacrificio Volontario, Spalle al Muro, La Vittoria di Pirro, L'Ora più Buia]

  - tipo: personaggio
    nome: Il Guardiano del Sapere
    nome_en: The Keeper / Loremaster / Living Library
    nomi_alt: [Loremaster, Il Custode, The Librarian, Living Encyclopedia, L'Archivista]
    descrizione: >
      Un personaggio che custodisce una conoscenza enorme — storia, magia,
      segreti del mondo. Non è un mentore (non insegna attivamente) né un
      informatore (non vende). È un custode: protegge il sapere e lo condivide
      solo con chi dimostra di meritarlo o di averne bisogno urgente. Spesso
      fisicamente legato al luogo del sapere (biblioteca, tempio, torre).
    esempi:
      - "Il Bibliotecario — Discworld/Indiana Jones (custode del sapere)"
      - "Elrond — Il Signore degli Anelli (la memoria vivente degli Elfi)"
      - "L'Oracolo — The Matrix (sa tutto, dice il minimo necessario)"
      - "Maester Aemon — Game of Thrones (vecchio, cieco, sa tutto)"
      - "Il Custode dei Registri — qualsiasi avventura D&D"
      - "Deckard Cain — Diablo ('Stay a while and listen')"
    uso_dnd: >
      NPC fisso in una location (biblioteca, tempio, rovine) che i PG possono
      consultare per informazioni sulla lore, sul villain, sugli artefatti. Non
      dà tutto gratis — chiede una prova, un favore, o una risposta in cambio.
      È il punto dove i PG vanno quando sono bloccati. Diverso dall'Informatore
      (che è mercenario) — il Guardiano è principiato.
    usato_in: [Il Mistero, La Cerca, Il Male Sigillato]
    vedi_anche: [Il Mentore, L'Informatore, Il Guardiano della Soglia]

  - tipo: situazione
    nome: L'Informazione che Nessuno Vuole
    nome_en: Forbidden Knowledge / Things Man Was Not Meant to Know
    nomi_alt: [Forbidden Knowledge, La Verità Pericolosa, Dangerous Truth, Ignorance Is Bliss]
    descrizione: >
      I PG scoprono qualcosa che avrebbero preferito non sapere — una verità che
      cambia la loro visione del mondo, li mette in pericolo per il solo fatto
      di saperla, o li carica di una responsabilità enorme. La conoscenza stessa
      è il peso. Non possono "dis-sapere" — devono decidere cosa fare con
      l'informazione.
    esempi:
      - "Neo scopre la verità sulla Matrix — (il mondo è una bugia)"
      - "La verità sulle origini dei Titani — Attack on Titan"
      - "Truman scopre che il suo mondo è uno show — The Truman Show"
      - "I libri proibiti di Lovecraft — (la conoscenza porta alla follia)"
      - "'Soylent Green is people!' — film"
      - "La verità sul Muro — Game of Thrones"
    uso_dnd: >
      I PG scoprono qualcosa di devastante: il re è un impostore, gli dei sono
      morti, la barriera che protegge il mondo si sta spegnendo, la loro missione
      era una bugia. Ora hanno un'informazione pericolosa: se la condividono
      scoppia il panico, se la nascondono sono complici. La scoperta apre un
      nuovo arco narrativo.
    usato_in: [Il Mistero, La Masquerade, Il Colpo di Scena, Il Male Sigillato]
    vedi_anche: [La Masquerade, Il Segreto Inconfessabile, Il Colpo di Scena, La Frase Bomba]

  - tipo: relazione
    nome: Il Nemico Creato
    nome_en: Create Your Own Villain / Blowback
    nomi_alt: [Blowback, Nice Job Breaking It Hero, Il Mostro che Hai Creato, Consequences]
    descrizione: >
      Il villain esiste a causa delle azioni passate dei PG (o del loro
      predecessore/fazione). L'orfano che non hanno salvato è cresciuto con odio.
      Il soldato che hanno umiliato è tornato potente. La creatura che hanno
      liberato per sbaglio è diventata una minaccia. Il nemico è una conseguenza
      diretta delle loro scelte — e lo sa.
    esempi:
      - "Magneto creato dall'Olocausto — X-Men (l'umanità ha creato il suo nemico)"
      - "Killmonger creato dall'abbandono — Black Panther"
      - "Il Goblin creato da Spider-Man — Spider-Man (l'attenzione verso Peter crea nemici)"
      - "Davy Jones creato dalla Dea del Mare — Pirati dei Caraibi"
      - "Voldemort creato dall'orfanotrofio — Harry Potter (la società lo ha ignorato)"
      - "Il mostro di Frankenstein creato dal dottore — Shelley"
    uso_dnd: >
      Un villain del modulo 3 è qualcuno che i PG hanno incontrato (e ignorato/
      danneggiato) nel modulo 1. La rivelazione è devastante: "siete stati voi a
      crearmi." I PG devono affrontare le conseguenze delle proprie scelte. È la
      Scelta Retroattiva portata all'estremo — e funziona meglio se i PG ricordano
      l'incontro originale.
    usato_in: [La Vendetta, La Scelta Retroattiva, Tragedia]
    vedi_anche: [La Scelta Retroattiva, La Nemesi, Lo Specchio, Il Dilemma del Tram]

  - tipo: situazione
    nome: Il Debriefing (Il Ritorno a Casa)
    nome_en: Denouement / Return with the Elixir
    nomi_alt: [Denouement, Return with the Elixir, L'Epilogo, Il Ritorno, Wrap-Up]
    descrizione: >
      Dopo il climax, i PG tornano "a casa" (fisica o metaforica). Il mondo
      è cambiato — e loro anche. Il debriefing è il momento in cui si vedono le
      conseguenze di tutto: chi è sopravvissuto, cosa è cambiato, come il mondo
      reagisce alla vittoria (o alla sconfitta). In Vogler è lo stadio 12. Non
      è facoltativo — senza debriefing l'avventura finisce nel vuoto.
    esempi:
      - "La Contea dopo la guerra — Il Signore degli Anelli (il ritorno è amaro)"
      - "La cerimonia delle medaglie — Star Wars (celebrazione della vittoria)"
      - "Il funerale di Tony — Endgame (chiusura emotiva)"
      - "L'epilogo — qualsiasi RPG con finali multipli"
      - "La festa al villaggio salvato — D&D classico (i PG sono eroi)"
    uso_dnd: >
      Dopo il boss fight: dedicare almeno 20-30 minuti al "dopo". Cosa succede
      al villaggio? Come reagiscono gli NPC sopravvissuti? Cosa fanno i PG ora?
      Chiudere gli archi aperti. Mostrare le conseguenze (Il Dilemma del Tram).
      Se è una saga: seminare il gancio per la prossima avventura. Il debriefing
      è dove le scelte dei PG diventano PERMANENTI nel mondo.
    usato_in: [Sconfiggere il Mostro, La Cerca, La Vendetta]
    puo_aver_bisogno_di: [La Resa dei Conti]
    vedi_anche: [Il Lieto Fine Guadagnato, La Vittoria di Pirro, Il Dilemma del Tram, La Pausa]

  - tipo: situazione
    nome: La Ritirata Strategica
    nome_en: Strategic Retreat / Know When to Run
    nomi_alt: [Run Away!, La Fuga Strategica, Know When to Fold, Tactical Withdrawal, Scappare per Vincere]
    descrizione: >
      I PG affrontano qualcosa di troppo potente e devono scegliere di fuggire
      anziché combattere fino alla morte. Scappare non è perdere — è sopravvivere
      per combattere un altro giorno. Richiede che il DM segnali chiaramente
      "questo è troppo per voi ORA" e che la fuga sia un'opzione meccanicamente
      possibile (non bloccati in una stanza).
    esempi:
      - "La Compagnia fugge dal Balrog — Il Signore degli Anelli (Gandalf copre la fuga)"
      - "La fuga da Hoth — Star Wars (ritirata tattica)"
      - "Run away! — Monty Python (versione comica)"
      - "La ritirata di Dunkirk — storia/film (sopravvivere è la vittoria)"
      - "Dark Souls — fuggire da un boss troppo forte per tornare dopo"
    uso_dnd: >
      Il DM presenta un nemico chiaramente troppo forte (il CR è visibilmente
      superiore). I PG intelligenti fuggono. La fuga deve essere: (1) segnalata
      ("vedete creature enormi, sentite un potere schiacciante"); (2) possibile
      (non chiusi in una stanza); (3) non punita (non è un fallimento — è
      tattica). Il nemico torna come boss finale quando i PG sono pronti.
    usato_in: [Sconfiggere il Mostro, L'Ora più Buia, La Cerca]
    vedi_anche: [L'Ora più Buia, In Medias Res, Il Pacing]

  - tipo: tecnica
    nome: Il Cambio di Genere
    nome_en: Genre Shift / Tone Shift
    nomi_alt: [Genre Shift, Cambio di Tono, Tonal Whiplash, From Comedy to Horror, Mood Switch]
    descrizione: >
      L'avventura cambia genere/tono deliberatamente a metà — da fantasy
      eroico a horror, da investigazione a guerra, da commedia a tragedia. Il
      cambio è volontario e segnalato (non accidentale). Serve a sorprendere,
      rinfrescare, e mostrare che il mondo non è monodimensionale.
    esempi:
      - "Psycho — Hitchcock (da thriller romantico a horror in una scena)"
      - "Full Metal Jacket — Kubrick (da commedia militare a orrore di guerra)"
      - "Undertale — da RPG carino a horror psicologico (rotta genocidio)"
      - "Game of Thrones S1→S8 — da intrigo politico a fantasy epico a horror"
      - "Dusk Till Dawn — Tarantino (da crime a vampiri a metà film)"
      - "Baldur's Gate 3 Atto 3 — tono diverso dagli atti precedenti"
    uso_dnd: >
      Il modulo 1-2 è un'indagine urbana. Il modulo 3 diventa survival horror
      nel dungeon. Il modulo 4 è una battaglia campale. Ogni cambio di genere
      rinfresca il gioco e usa abilità diverse dei PG. Segnalare il cambio
      con il tono della narrazione — non spiegarlo meta, farlo sentire.
    rischio: >
      Se il cambio è troppo brusco i giocatori si sentono disorientati. Se è
      troppo graduale non si nota. Ideale: un evento chiarno segna il confine
      (la porta del dungeon si chiude, il sole tramonta, il villain appare).
    usato_in: [La Cerca, Sconfiggere il Mostro]
    vedi_anche: [Il Pacing, La Pausa, L'Ora più Buia, Il Luogo Impossibile]
  - tipo: situazione
    nome: La Trattativa con il Mostro
    nome_en: Talking the Monster Down / Diplomacy with the Dragon
    nomi_alt: [Talk Down the Boss, Diplomazia col Drago, Pacifist Route, Il Mostro Ragionevole]
    descrizione: >
      Il "boss fight" si risolve non combattendo ma parlando. Il mostro/villain
      può essere ragionato, convinto, impietosito, ingannato, o semplicemente
      non è interessato a combattere se gli si offre un'alternativa. Ribalta
      le aspettative del combattimento finale e premia i PG diplomatici.
    esempi:
      - "Bilbo parla con Smaug — Lo Hobbit (non combatte, negozia)"
      - "Aang parla con Ozai (prima del combattimento) — Avatar"
      - "Undertale — il pacifista che parla con ogni nemico"
      - "Gandalf parla col Balrog — Il Signore degli Anelli (non per negoziare ma per intimidire)"
      - "La regina degli Alien in Aliens — Ripley minaccia le uova"
      - "Diplomazia con il drago — tropo D&D classico"
    uso_dnd: >
      Il boss ha un obiettivo che non richiede necessariamente la morte dei PG.
      Se i PG capiscono cosa vuole e lo offrono (o lo convincono che combattere
      non conviene), il combattimento non avviene. Documentare nelle note DM:
      "il drago vuole X. Se i PG offrono X o un'alternativa credibile, non
      combatte." Premiare la creatività almeno quanto la forza.
    rischio: >
      Se il "boss talk-down" è troppo facile, i giocatori si sentono privati
      del combattimento epico. Offrire entrambe le opzioni: la diplomazia è
      possibile MA più difficile del combattimento (CD alte, informazioni da
      avere prima, rischio se fallisce).
    usato_in: [Sconfiggere il Mostro, Lo Stallo, La Morale Grigia]
    vedi_anche: [La Morale Grigia, Lo Stallo, L'Anti-Villain, Il Nemico Onorevole]

  - tipo: situazione
    nome: Il Conto alla Rovescia Pubblico
    nome_en: Visible Countdown / Ticking Clock on Display
    nomi_alt: [Ticking Clock, Timer Visibile, Real-Time Countdown, Il Countdown Fisico]
    sottocaso_di: La Corsa Contro il Tempo
    descrizione: >
      A differenza della Corsa Contro il Tempo (dove il DM tiene il conto),
      qui il countdown è VISIBILE ai giocatori — un timer reale sul tavolo, un
      numero di turni dichiarato, candele che si consumano. La pressione è
      tangibile e costante. I giocatori vedono il tempo scorrere e devono
      decidere in fretta.
    esempi:
      - "La bomba con il timer — qualsiasi film d'azione (lo vedono)"
      - "Majora's Mask — il timer dei 3 giorni è sullo schermo"
      - "Space Alert — boardgame (timer reale di 10 minuti)"
      - "24 — serie (l'orologio digitale è sempre visibile)"
      - "Escape room — il timer sul muro"
    uso_dnd: >
      Dichiarare ai giocatori: "Avete 10 turni. Poi il portale si chiude."
      Oppure: mettere un timer reale sul tavolo (20 minuti). La pressione
      temporale REALE costringe decisioni veloci e crea adrenalina. Usare per
      scene di fuga, rituali da interrompere, o bombe da disinnescare. Non
      per tutto il dungeon — solo per il climax.
    usato_in: [La Corsa Contro il Tempo, L'Assedio, L'Infiltrazione]
    vedi_anche: [La Corsa Contro il Tempo, Il Contatore, L'Ora più Buia]

  - tipo: personaggio
    nome: Il Mercante Ambiguo
    nome_en: Shady Merchant / The Fence
    nomi_alt: [The Fence, Il Ricettatore, Shady Dealer, Black Market Vendor, Il Mercante Grigio]
    descrizione: >
      Un mercante che vende oggetti utili ma la cui moralità è discutibile —
      merce rubata, artefatti maledetti senza avvertimento, informazioni a
      chiunque paghi, veleni accanto alle pozioni. Non è un nemico, non è un
      alleato. È un servizio con un prezzo e zero giudizio. La sua presenza
      implica che i PG sono nel mondo grigio.
    esempi:
      - "Il mercante di Resident Evil 4 ('What are ya buyin'?')"
      - "Il Mercante Ambulante — D&D (compare in posti impossibili)"
      - "Tom Bombadil in versione mercante — neutral, fuori dalla storia"
      - "Watto — Star Wars (vende tutto, zero morale)"
      - "Patches — Dark Souls/Elden Ring (mercante-traditore ricorrente)"
      - "Il rigattiere che vende il MacGuffin senza saperlo — tropo classico"
    uso_dnd: >
      NPC ricorrente che appare nei posti più improbabili e vende di tutto.
      Non chiede perché i PG vogliono veleno, non giudica se comprano oggetti
      proibiti. Ma se i PG lo tradiscono o non pagano, ha "amici" pericolosi.
      Può essere fonte di informazioni collaterali ("ho venduto la stessa cosa
      a un tizio con un mantello nero la settimana scorsa").
    usato_in: [La Cerca, L'Infiltrazione, Commedia degli Errori]
    vedi_anche: [L'Informatore, Il Trickster, Il Ladro Gentiluomo]

  - tipo: personaggio
    nome: Il Fanatico (Il Crociato Cieco)
    nome_en: The Zealot / True Believer / Fanatic
    nomi_alt: [The Zealot, True Believer, Il Crociato, Blind Fanatic, L'Estremista]
    descrizione: >
      Un personaggio devoto alla sua causa fino all'autodistruzione. Non è
      malvagio nel senso classico — crede genuinamente di avere ragione, e
      questa certezza assoluta lo rende pericoloso. Non negozia, non dubita,
      non si ferma. Può essere un alleato terrificante o un nemico impossibile
      da ragionare.
    esempi:
      - "Frollo — Il Gobbo di Notre-Dame (fanatico religioso convinto di servire Dio)"
      - "Stannis Baratheon — Game of Thrones (brucia la figlia per il dovere)"
      - "Thanos — MCU (certezza assoluta nella sua missione)"
      - "I Flagellanti — storia medievale (fede attraverso l'autolesionismo)"
      - "Colonel Kurtz — Apocalypse Now (la missione diventa ossessione)"
      - "Daenerys S8 — Game of Thrones (la liberatrice diventa conquistatrice)"
    uso_dnd: >
      NPC alleato che porta avanti la missione con metodi inaccettabili. Oppure
      nemico impossibile da negoziare: non vuole oro, non ha paura della morte,
      non ascolta ragioni. L'unico modo per fermarlo è la forza O distruggere
      la sua fede (mostrargli che la sua causa è basata su una menzogna). Se la
      sua fede è legittima, diventa un dilemma morale.
    rischio: >
      Se è solo "pazzo religioso", è piatto. Dargli una ragione comprensibile:
      ha visto qualcosa, ha perso qualcuno, ha ricevuto una visione vera. I PG
      devono chiedersi "ha ragione lui?"
    usato_in: [La Ribellione, Sconfiggere il Mostro, La Guerra]
    vedi_anche: [L'Anti-Villain, Il Signore Oscuro, Il Corruttore, L'Alleato Scomodo]

  - tipo: personaggio
    nome: Il Falso Eroe (L'Impostore)
    nome_en: False Hero / Glory Hound / The Fraud
    nomi_alt: [False Hero, The Fraud, Il Millantatore, Glory Thief, L'Eroe di Cartapesta]
    descrizione: >
      Un personaggio che si prende il merito delle azioni altrui, che mente
      sulle proprie imprese, o che ha una reputazione immeritata. In Propp è
      il "falso eroe" che cerca di rubare il posto del vero protagonista. Può
      essere un avversario (ruba la gloria ai PG) o un NPC da smascherare.
    esempi:
      - "Gilderoy Lockhart — Harry Potter (finge le imprese degli altri)"
      - "Gaston — La Bella e la Bestia (eroe del villaggio, in realtà un bullo)"
      - "Il falso eroe — Propp (tenta di sposare la principessa spacciandosi per l'eroe)"
      - "Zapp Brannigan — Futurama (incompetente con reputazione di eroe)"
      - "Captain Hammer — Dr. Horrible (eroe di facciata, egoista)"
      - "Syndrome — Gli Incredibili (vuole essere un eroe senza esserlo)"
    uso_dnd: >
      Un NPC celebrato come eroe è in realtà un impostore. I PG scoprono la
      verità — ma nessuno gli crede perché l'impostore è amato. Devono trovare
      prove concrete. Oppure: l'impostore ruba il merito ai PG stessi (dopo
      una quest, il nobile si prende il credito). Variante Propp: un rivale
      cerca di arrivare prima al re per prendersi la ricompensa.
    rischio: >
      Se l'impostore è troppo ovviamente falso, non c'è tensione. Deve avere
      carisma, fan, e una versione dei fatti credibile. Lo smascheramento deve
      richiedere lavoro.
    usato_in: [Commedia degli Errori, Il Mistero, La Rivalità]
    vedi_anche: [Il Trickster, L'Identità Scambiata, Il Capro Espiatorio, La Nemesi]

  - tipo: personaggio
    nome: Il Tiranno Locale (Il Piccolo Re)
    nome_en: The Petty Tyrant / Local Despot
    nomi_alt: [Petty Tyrant, Il Signorotto, Small-Town Bully, Il Despota Locale, The Sheriff of Nottingham]
    sottocaso_di: Il Signore Oscuro
    descrizione: >
      Un oppressore di scala ridotta — non un Dark Lord cosmico, ma un
      borgomastro corrotto, un capogilda abusivo, un nobile che terrorizza il
      suo feudo. Il suo potere è locale ma assoluto per chi ci vive sotto.
      Più odiabile del villain epico perché più reale e quotidiano.
    esempi:
      - "Lo Sceriffo di Nottingham — Robin Hood (il tiranno locale per eccellenza)"
      - "Dolores Umbridge — Harry Potter (tiranno burocratico più odiata di Voldemort)"
      - "Joffrey Baratheon — Game of Thrones (potere assoluto, zero competenza)"
      - "Negan — The Walking Dead (tiranno della comunità)"
      - "Il Commissario Politico — qualsiasi film di guerra (potere burocratico crudele)"
      - "Don Rodrigo — I Promessi Sposi (il signorotto che abusa del suo rango)"
    uso_dnd: >
      Il villain del modulo 1-2: non il BBEG finale, ma l'oppressore che i PG
      incontrano prima. Rendere la sua rimozione soddisfacente: la gente
      festeggia, le vittime ringraziano. Può essere collegato al villain
      principale (un sottoposto) o indipendente (puro ostacolo locale). I PG
      possono rimuoverlo con la forza, l'inganno, o smascherandolo davanti ai
      suoi superiori.
    rischio: >
      Se è troppo potente per i PG (circondato da guardie), è frustrante. Se è
      troppo debole, non è una minaccia. Deve essere potente nel suo contesto
      ma vulnerabile alla creatività dei PG.
    usato_in: [La Ribellione, Da Povero a Ricco, Commedia degli Errori]
    vedi_anche: [Il Signore Oscuro, Il Luogotenente, La Corte Decadente, La Ribellione]

  - tipo: personaggio
    nome: La Voce della Ragione (Il Pragmatico)
    nome_en: The Pragmatist / Voice of Reason / The Realist
    nomi_alt: [Voice of Reason, Il Cinico, The Realist, Il Pragmatico, The Skeptic]
    descrizione: >
      Un NPC che offre il punto di vista razionale, cinico, e spesso scomodo.
      Non è un nemico — è quello che dice la verità che nessuno vuole sentire.
      "Non possiamo salvare tutti." "Il piano è folle." "Avete pensato alle
      conseguenze?" Può avere ragione (e i PG devono decidere se ascoltare) o
      torto (e la sua cautela è l'ostacolo da superare).
    esempi:
      - "Samwise Gamgee — Il Signore degli Anelli (la voce pratica accanto al visionario)"
      - "Han Solo — Star Wars ('Non dirmi le probabilità'... ma le calcola)"
      - "Hermione — Harry Potter (la voce della logica nel trio)"
      - "Alfred — Batman (il pragmatico che frena l'idealista)"
      - "Tyrion — Game of Thrones (il consigliere cinico ma lucido)"
      - "Dr. McCoy — Star Trek ('Sono un dottore, non un...')"
    uso_dnd: >
      NPC consigliere che presenta l'opzione prudente/cinica. Non un codardo:
      un realista. Funziona come specchio per le scelte dei PG: se lo ignorano
      e va male, "ve l'avevo detto"; se lo ignorano e va bene, il coraggio
      ha vinto. Può evolvere: se i PG dimostrano che l'audacia paga, diventa
      più coraggioso. Se falliscono, diventa più cauto.
    usato_in: [La Cerca, Sconfiggere il Mostro, L'Assedio]
    vedi_anche: [Il Mentore, Il Companion Fedele, L'Alleato Scomodo, Il Profeta Ignorato]

  - tipo: personaggio
    nome: Il Costruttore (L'Artefice)
    nome_en: The Artificer / The Craftsman / Q
    nomi_alt: [The Artificer, Q, Il Fabbro Magico, The Gadgeteer, L'Inventore]
    descrizione: >
      Il personaggio che crea gli strumenti: armi, pozioni, congegni, incantesimi
      su commissione. Non combatte (o non in prima linea) — il suo valore è in
      ciò che produce. I PG vanno da lui quando hanno bisogno di qualcosa di
      specifico. Può essere eccentrico, esigente, o nascondere segreti nelle
      sue creazioni.
    esempi:
      - "Q — James Bond (fornisce i gadget, spiega come funzionano)"
      - "Hephaestus — mitologia greca (il fabbro degli dèi)"
      - "Tony Stark/Iron Man — Marvel (l'eroe CHE costruisce)"
      - "Ollivander — Harry Potter (il creatore di bacchette)"
      - "Elrond/i Nani di Erebor — Tolkien (i forgiatori)"
      - "Doc Brown — Ritorno al Futuro (l'inventore eccentrico)"
    uso_dnd: >
      NPC a cui i PG commissionano oggetti: richiede materiali rari (quest!),
      tempo, e spesso un prezzo non monetario ("portami la scaglia del drago e
      ti forgerò la spada"). Può rifiutarsi se disapprova l'uso. Variante: il
      costruttore ha creato l'arma del villain e se ne pente. O: il costruttore
      mette trappole segrete nelle sue creazioni "per sicurezza".
    usato_in: [La Cerca, Sconfiggere il Mostro, La Radunata]
    vedi_anche: [Il Mentore, Il Benefattore Misterioso, L'Oggetto Senziente, Il Mercante Ambiguo]

  - tipo: personaggio
    nome: Il Ricattato (Il Burattino Involontario)
    nome_en: The Blackmailed / Reluctant Villain / Coerced Agent
    nomi_alt: [Reluctant Villain, The Blackmailed, Il Servo Riluttante, Coerced Minion, Under Duress]
    descrizione: >
      Un personaggio che serve il villain non per scelta ma per costrizione:
      la sua famiglia è in ostaggio, ha un segreto ricattabile, è sotto un
      incantesimo, o ha un debito impossibile. Non è malvagio — è intrappolato.
      Se i PG trovano il modo di liberarlo dalla costrizione, diventa un alleato.
      Se lo uccidono senza sapere, è una tragedia.
    esempi:
      - "Lando sotto Vader — Star Wars (collabora per salvare la sua città)"
      - "Severus Snape — Harry Potter (agente doppio per debito d'amore)"
      - "Théoden sotto Saruman — Il Signore degli Anelli (controllo mentale)"
      - "Il banchiere col figlio in ostaggio — qualsiasi heist movie"
      - "Jessica Jones sotto Kilgrave — Marvel (controllo mentale)"
      - "Draco Malfoy — Harry Potter (costretto dalla famiglia e da Voldemort)"
    uso_dnd: >
      Un NPC che ostacola i PG (chiude la porta, dà informazioni false, attacca)
      ma mostra segni di conflitto interiore. Se i PG indagano anziché uccidere,
      scoprono la costrizione. Liberarlo = alleato + informazioni sul villain.
      Ucciderlo = rimorso quando scoprono la verità dopo. Seminare indizi:
      tremori, sguardi disperati, frasi a doppio senso.
    rischio: >
      Se il ricatto è troppo nascosto, i PG lo uccidono e basta. Se è troppo
      ovvio, non c'è tensione. Ideale: 1-2 indizi sottili nel primo incontro,
      rivelazione piena nel secondo.
    usato_in: [Il Mistero, Sconfiggere il Mostro, La Ribellione]
    vedi_anche: [La Talpa, Il Luogotenente, Il Redento, La Pedina Inconsapevole]

  - tipo: personaggio
    nome: Il Sopravvissuto (L'Ultimo Testimone)
    nome_en: The Sole Survivor / Last Witness
    nomi_alt: [Sole Survivor, L'Unico Superstite, Last Man Standing, Il Testimone Unico, Final Girl]
    descrizione: >
      Unico sopravvissuto di un evento catastrofico — massacro, spedizione
      fallita, villaggio distrutto, naufragio. Porta con sé informazioni vitali
      e traumi profondi. La sua testimonianza è l'unico indizio su cosa è
      successo, ma può essere inaffidabile (shock, sensi di colpa, memoria
      frammentata). Qualcuno potrebbe volerlo morto per impedire che parli.
    esempi:
      - "Ishmael — Moby Dick ('Call me Ishmael' — unico superstite del Pequod)"
      - "Ripley — Alien (unica sopravvissuta della Nostromo)"
      - "Il sopravvissuto del villaggio bruciato — qualsiasi D&D (hook classico)"
      - "Sole Survivor — Fallout 4 (unico sopravvissuto del Vault)"
      - "La Principessa Leia con il messaggio — Star Wars (porta le informazioni vitali)"
      - "Jonah — Tomb Raider reboot (unico sopravvissuto dell'equipaggio precedente)"
    uso_dnd: >
      Hook immediato: un NPC traumatizzato arriva barcollando con informazioni
      frammentarie su cosa è successo. I PG devono proteggere il testimone
      (qualcuno lo cerca), decifrare il suo racconto incoerente, e investigare
      il luogo del disastro. Il sopravvissuto può anche essere un PG (background
      concordato col giocatore). Variante oscura: il sopravvissuto è il colpevole
      che finge di essere vittima.
    rischio: >
      Se il sopravvissuto sa tutto e lo racconta subito, non serve un'avventura.
      Le informazioni devono essere incomplete, confuse, o deliberatamente
      nascoste. Se invece non sa nulla di utile, è un NPC inutile.
    usato_in: [Il Mistero, La Vendetta, Sconfiggere il Mostro]
    vedi_anche: [La Casa Distrutta, Il Registro dell'Apocalisse, L'Informatore, Il Narratore Inaffidabile]

  - tipo: personaggio
    nome: Il Doppio (Il Sostituto)
    nome_en: The Impostor / Body Double / Changeling
    nomi_alt: [The Impostor, Changeling, Body Double, Il Sosia, La Sostituzione]
    descrizione: >
      Qualcuno sta impersonando fisicamente un altro personaggio — per magia
      (polyjuice, alter self, changeling), chirurgia, o somiglianza naturale.
      L'originale può essere morto, prigioniero, o ignaro della sostituzione.
      Il conflitto nasce dallo smascheramento: chi è il vero? Come provarlo?
      A differenza dello Specchio (doppio filosofico), qui la sostituzione è
      fisica e letterale.
    esempi:
      - "I Doppelgänger — D&D Monster Manual (changelings infiltrati)"
      - "Polyjuice Potion — Harry Potter (Barty Crouch Jr. come Moody per un anno)"
      - "The Thing — film (chi è stato sostituito?)"
      - "Arya con i volti — Game of Thrones (cambio fisico volontario)"
      - "Invasion of the Body Snatchers — film (sostituzione di massa)"
      - "Prince and the Pauper — Twain (sosia naturale)"
    uso_dnd: >
      Un NPC importante è stato sostituito da un changeling/doppelgänger. I PG
      notano sottili differenze nel comportamento. L'indagine richiede: trovare
      prove della sostituzione, localizzare l'originale (vivo? morto?),
      smascherare l'impostore senza allarmarlo. Variante: un PG viene sostituito
      (concordato col giocatore che interpreta il sostituto per una sessione).
    rischio: >
      Se non ci sono indizi percepibili, i PG non possono scoprirlo e si
      sentono ingannati dal DM. Seminare almeno 3 differenze comportamentali
      notabili (il sostituto non conosce un'informazione privata, reagisce
      diversamente a un trigger emotivo, ha un tic assente nell'originale).
    usato_in: [Il Mistero, L'Infiltrazione, Il Colpo di Scena]
    vedi_anche: [Lo Specchio, La Talpa, L'Identità Scambiata, Il Mutaforma]

  - tipo: situazione
    nome: L'Alleato Inaspettato
    nome_en: Unexpected Ally / Surprise Reinforcement
    nomi_alt: [Surprise Ally, L'Aiuto Inatteso, Cavalry from Nowhere, Il Soccorso Imprevisto]
    descrizione: >
      Qualcuno che i PG non consideravano un alleato (o che pensavano nemico)
      interviene a loro favore in un momento critico. A differenza dei Rinforzi
      (che sono alleati noti che arrivano), qui l'aiuto viene da una direzione
      inattesa: il nemico ha un motivo personale per aiutarli ORA, il figurante
      si rivela competente, la creatura che avevano risparmiato torna il favore.
    esempi:
      - "Gollum distrugge l'Anello (involontariamente) — Il Signore degli Anelli"
      - "Han Solo torna — Star Wars (se ne era andato)"
      - "Snape protegge Harry — Harry Potter (nemico apparente che salva)"
      - "Il cane randagio che avevi sfamato torna per aiutarti — tropo fiabe"
      - "Vegeta aiuta Goku vs Freezer — Dragon Ball (il rivale interviene)"
    uso_dnd: >
      Legare alla Scelta Retroattiva: un NPC/creatura che i PG hanno trattato
      bene (o risparmiato) torna nel momento del bisogno. NON è un deus ex
      machina se è stato preparato — i PG hanno GUADAGNATO l'aiuto con le loro
      azioni passate. Se non avevano risparmiato/aiutato, l'alleato non appare.
    sottocaso_di: I Rinforzi
    usato_in: [L'Ora più Buia, Sconfiggere il Mostro, L'Assedio]
    puo_aver_bisogno_di: [Il Fucile di Čechov]
    vedi_anche: [I Rinforzi, La Scelta Retroattiva, Il Debito di Vita, La Promozione]

  - tipo: situazione
    nome: Lo Specchio Interiore (La Virtù Fatale)
    nome_en: Fatal Flaw / Virtue Turned Weapon
    nomi_alt: [Fatal Flaw, Hamartia, Virtue Is Weakness, La Virtù Avvelenata, Il Dono Maledetto]
    descrizione: >
      Una caratteristica positiva del personaggio — il suo coraggio, la sua
      lealtà, la sua generosità, la sua fiducia — diventa l'arma che lo
      distrugge. Non è un difetto nascosto: è la stessa qualità che lo rende
      eroico, spinta troppo oltre o sfruttata da altri. Il personaggio fa la
      cosa "giusta" e proprio per questo si condanna. La tragedia nasce dal
      fatto che non può smettere di essere sé stesso.
    esempi:
      - "Ned Stark — Game of Thrones (l'onore lo porta alla decapitazione)"
      - "Boromir — Il Signore degli Anelli (l'amore per il suo popolo lo corrompe)"
      - "Otello — Shakespeare (la passione per Desdemona diventa gelosia mortale)"
      - "Spider-Man — Marvel (il senso di responsabilità lo isola e lo distrugge)"
      - "Anakin Skywalker — Star Wars (l'amore per Padmé lo porta al Lato Oscuro)"
      - "Superman — DC (la compassione lo rende manipolabile tramite ostaggi)"
    uso_dnd: >
      La lealtà di un PG verso un NPC viene sfruttata dal villain per tendergli
      una trappola. Il coraggio di un PG lo spinge in uno scontro che non può
      vincere. La generosità di un PG viene abusata da un impostore. Il DM
      identifica la virtù dominante del PG e crea situazioni dove quella virtù
      ha un costo. NON è una punizione — è dramma. Il PG deve scegliere: restare
      fedele a sé stesso (e pagarne il prezzo) o tradire la propria natura.
    rischio: >
      Se il giocatore sente che il DM "punisce" il suo personaggio per essere
      buono, la fiducia al tavolo crolla. La virtù deve avere successo IL PIÙ
      DELLE VOLTE — solo in momenti chiave il costo diventa alto. Il giocatore
      deve sentire che la scelta è sua, non una trappola.
    usato_in: [La Tentazione, L'Ora più Buia, La Scelta Impossibile]
    vedi_anche: [La Tentazione, Il Nemico Interiore, L'Anello al Dito, La Fiducia Tradita]

  - tipo: situazione
    nome: La Rincorsa (L'Inseguimento)
    nome_en: The Chase / Pursuit Sequence
    nomi_alt: [Chase Scene, L'Inseguimento, Hot Pursuit, Corsa Contro il Tempo, The Hunt]
    descrizione: >
      Una sequenza ad alta energia in cui i PG inseguono (o sono inseguiti da)
      qualcuno o qualcosa. Può essere a piedi per vicoli, a cavallo in campo
      aperto, su carri in una città in fiamme, o su navi tra gli scogli. Il
      ritmo è frenetico, le decisioni sono istantanee, e l'ambiente è un
      ostacolo tanto quanto il bersaglio. Non è un combattimento — è movimento,
      ostacoli, scelte tattiche rapide.
    esempi:
      - "L'inseguimento in moto — Terminator 2 (iconico, ostacoli urbani)"
      - "La corsa sulle bighe — Ben-Hur (arena, sabotaggio, terreno)"
      - "Il treno — Indiana Jones (combattimento sul tetto di un veicolo in movimento)"
      - "Minas Tirith — Il Signore degli Anelli (i Nazgûl inseguono Gandalf a cavallo)"
      - "Fuga da Moria — Il Signore degli Anelli (inseguiti dai goblin nel dungeon)"
      - "Millennium Falcon nel campo di asteroidi — Star Wars (veicolo + ostacoli)"
    uso_dnd: >
      Meccanicamente: turni brevi, prove di Atletica/Acrobatica, ostacoli che
      richiedono scelte (salto rischioso = scorciatoia, percorso sicuro = perdita
      di distanza). L'inseguito può lasciare trappole o ostacoli. L'inseguitore
      può tentare azioni creative. L'ambiente cambia ogni round (mercato →
      tetti → canali → mura). Inserire un timer: X round prima che il bersaglio
      raggiunga il rifugio/la nave/il portale. Varianti: PG inseguono, PG sono
      inseguiti, PG inseguono E sono inseguiti da terzi.
    rischio: >
      Se diventa una serie di tiri di dado senza scelte, è noioso. Ogni round
      deve offrire un bivio (via sicura vs rischiosa), un ostacolo narrativo
      (il carro che taglia la strada, il ponte che crolla), o un'opportunità
      (il gancio, la corda, il passaggio segreto). Mai più di 4-5 round.
    usato_in: [La Fuga, Da Povero a Ricco, Il Colpo]
    vedi_anche: [La Fuga, Il Pacing, La Corsa Contro il Tempo, Il Terreno come Arma]

  - tipo: situazione
    nome: L'Amnesia (L'Identità Perduta)
    nome_en: Amnesia / Lost Memory / Identity Quest
    nomi_alt: [Lost Memory, Tabula Rasa, "Who Am I?", La Memoria Cancellata, Bourne Identity]
    descrizione: >
      Un personaggio (PG o NPC chiave) ha perso la memoria. Non sa chi è, cosa
      ha fatto, o perché si trova dove si trova. Ricostruire il passato diventa
      l'obiettivo — ma ogni frammento recuperato rivela qualcosa di scomodo o
      pericoloso. Il personaggio potrebbe scoprire di essere stato il villain,
      o che qualcuno ha cancellato la sua memoria per proteggerlo.
    esempi:
      - "Jason Bourne — film (assassino che non ricorda di esserlo)"
      - "Memento — Nolan (non può formare nuovi ricordi)"
      - "Planescape: Torment — videogioco (il Nameless One si risveglia senza memoria)"
      - "Total Recall — film (memoria impiantata, qual è il vero io?)"
      - "Dark — serie TV (personaggi che dimenticano ciò che hanno fatto in altri cicli)"
      - "Wolverine — X-Men (il passato cancellato dal programma Weapon X)"
    uso_dnd: >
      Un PG si risveglia senza ricordi (background concordato col giocatore). Ogni
      modulo rivela un pezzo del passato — tramite NPC che lo riconoscono, luoghi
      familiari, flashback attivati da trigger. Il twist: il PG potrebbe scoprire
      di essere stato un villain, un traditore, o che la sua memoria è stata
      cancellata per proteggere un segreto. Anche applicabile a un NPC chiave che
      i PG devono aiutare a ricordare.
    rischio: >
      Se il giocatore non ha voce nella rivelazione finale ("eri un assassino!"),
      si sente derubato della propria agency. Concordare i paletti a inizio
      campagna. Per NPC: se i PG non hanno modo di scoprire la verità, è frustrante.
    usato_in: [Il Mistero, Viaggio e Ritorno, La Cerca]
    vedi_anche: [L'Identità Scambiata, Il Nemico Interiore, Il Segreto Inconfessabile]

  - tipo: situazione
    nome: Il Naufragio (La Sopravvivenza)
    nome_en: Stranded / Survival Scenario / Shipwreck
    nomi_alt: [Survival Horror, Castaway, Don't Eat the Purple Ones, Naufraghi, Robinson Crusoe]
    descrizione: >
      I PG si ritrovano bloccati in un luogo ostile senza risorse, equipaggiamento,
      o via d'uscita immediata. Devono sopravvivere (cibo, riparo, pericoli
      ambientali) e contemporaneamente trovare un modo per andarsene. Il nemico
      principale è l'ambiente stesso, non un villain.
    esempi:
      - "Robinson Crusoe — Defoe (l'archetipo)"
      - "Cast Away — film (sopravvivenza su un'isola)"
      - "The Martian — film/libro (sopravvivenza su Marte con le risorse disponibili)"
      - "Lost — serie TV (naufraghi su un'isola misteriosa)"
      - "Subnautica — videogioco (naufragio alieno, crafting per sopravvivere)"
      - "Lord of the Flies — Golding (la società crolla senza struttura)"
    uso_dnd: >
      La nave dei PG naufraga su un'isola/piano sconosciuto. Niente equipaggiamento
      (o quasi). Prove di Sopravvivenza per cibo/acqua, Natura per orientarsi,
      pericoli ambientali come incontri casuali. Il modulo termina quando trovano
      una via d'uscita (nave, portale, segnale). Variante: i PG sono i soccorritori
      che cercano dei naufraghi.
    rischio: >
      Se i PG non hanno scelte significative (solo tiri di sopravvivenza), diventa
      noioso. Inserire dilemmi: dividere le risorse con altri naufraghi? Esplorare
      la zona pericolosa per una possibile uscita? Fidarsi del locale misterioso?
    usato_in: [Viaggio e Ritorno, La Cerca, La Fuga]
    vedi_anche: [Il Luogo Impossibile, La Zona Proibita, Il Pesce fuor d'Acqua, La Separazione del Gruppo]

  - tipo: situazione
    nome: Il Processo (Il Giudizio)
    nome_en: The Trial / Courtroom Drama
    nomi_alt: [Trial by Court, Il Tribunale, Courtroom Episode, La Difesa, Judgment Day]
    descrizione: >
      I PG (o un loro alleato) sono accusati di un crimine e devono difendersi
      davanti a un tribunale, concilio, assemblea, o giuria. Le armi non servono:
      servono prove, testimoni, eloquenza, e a volte sotterfugi. Il verdetto ha
      conseguenze reali (esilio, esecuzione, perdita di status).
    esempi:
      - "Il Processo — Kafka (accusato senza sapere di cosa)"
      - "To Kill a Mockingbird — Lee (difesa in un sistema ingiusto)"
      - "A Few Good Men — film ('You can't handle the truth!')"
      - "Ace Attorney — videogioco (investigazione + processo)"
      - "Il processo di Tyrion — Game of Thrones (sistema corrotto, trial by combat)"
      - "Twelve Angry Men — film (la giuria delibera)"
    uso_dnd: >
      I PG sono accusati (a torto o a ragione) e devono raccogliere prove e
      testimoni prima del processo. Al tavolo: fase investigativa (trovare prove),
      poi scena del processo (Persuasione, Inganno, Intuizione per leggere la
      giuria). Varianti: il sistema è corrotto (devono anche smascherare il
      giudice), trial by combat (un PG combatte per provare l'innocenza),
      processo a un NPC che i PG difendono.
    rischio: >
      Se il processo è solo una serie di tiri di Persuasione, è piatto. Dare
      scelte: corrompere un testimone (illegale ma efficace)? Rivelare un
      segreto che danneggia un alleato? Il processo deve avere conseguenze
      qualunque sia l'esito.
    usato_in: [Il Mistero, Commedia degli Errori, La Ribellione]
    vedi_anche: [Il Mistero, La Prova Segreta, Lo Stallo, L'Identità Scambiata]

  - tipo: situazione
    nome: La Gestione del Territorio (Il Dominio)
    nome_en: Domain Management / Good Housekeeping
    nomi_alt: [Good Housekeeping, Domain Play, Il Feudo, Stronghold Management, Il Regno da Gestire]
    descrizione: >
      I PG ricevono (o conquistano) la responsabilità di un luogo: una baronia,
      una gilda, una nave, un avamposto. Devono farlo funzionare: gestire risorse,
      risolvere dispute tra abitanti, difenderlo da minacce, e prosperare. Il
      conflitto è organizzativo e politico, non solo di combattimento.
    esempi:
      - "SimCity / Civilization — videogiochi (gestione risorse e popolazione)"
      - "Suikoden — videogioco (il castello da costruire e popolare)"
      - "Game of Thrones — politica dei regni (governare è più difficile che conquistare)"
      - "Pathfinder: Kingmaker — videogioco/AP (costruire un regno)"
      - "Stardew Valley — videogioco (gestione fattoria)"
      - "Il ritorno ad Itaca — Odissea (riprendere il controllo del proprio dominio)"
    uso_dnd: >
      I PG ottengono un forte, un villaggio, o una gilda come ricompensa. Ora
      devono gestirlo: tasse, difese, morale della popolazione, minacce esterne.
      Moduli strutturati come "questa settimana: banditi, carestia, delegazione
      diplomatica". Funziona come frame per una campagna sandbox. Ogni decisione
      ha conseguenze a lungo termine.
    rischio: >
      Se diventa solo contabilità (quanti GP entrano, quanti escono), è noioso.
      Ogni problema gestionale deve avere una faccia umana (l'NPC che protesta,
      il traditore nell'amministrazione, la famiglia da sfamare). La gestione
      è il pretesto per storie, non il fine.
    usato_in: [Da Povero a Ricco, La Ribellione, La Crisi di Successione]
    vedi_anche: [La Crisi di Successione, La Corte Decadente, La Guerra, Il Branco di Disadattati]

  - tipo: situazione
    nome: Il Dirottamento (L'Emergenza a Bordo)
    nome_en: Hijack / Die Hard on a X
    nomi_alt: [Die Hard Scenario, Hijack, Hostage on a Vehicle, Take Us to Memphis, L'Assalto al Mezzo]
    sottocaso_di: L'Assedio
    descrizione: >
      Un mezzo di trasporto o una struttura chiusa (nave, treno, torre, portale
      volante) viene preso da forze ostili mentre i PG sono a bordo. Sono
      intrappolati dentro con i nemici, civili da proteggere, e risorse limitate.
      Devono riprendere il controllo dall'interno senza far crollare/affondare/
      schiantare il tutto.
    esempi:
      - "Die Hard — film (grattacielo preso da terroristi)"
      - "Speed — film (autobus che non può rallentare)"
      - "Under Siege — film (nave da guerra dirottata)"
      - "Snowpiercer — film (treno come microcosmo sociale)"
      - "Alien — film (creatura a bordo di una nave, spazio chiuso)"
      - "Il dirottamento del treno 123 — film (presa di ostaggi su un mezzo)"
    uso_dnd: >
      La nave su cui viaggiano i PG viene presa da pirati/mutinari/un mostro.
      Non possono scappare (mare aperto, cielo, piano astrale). Devono eliminare
      i nemici stanza per stanza, liberare ostaggi, e mantenere il mezzo
      funzionante. Mappa chiusa + risorse limitate + timer (la nave affonda tra
      X round). Combina bene con L'Infiltrazione al contrario.
    rischio: >
      Se lo spazio è troppo piccolo, diventa solo combattimento sequenziale. Dare
      obiettivi multipli: liberare la sala motori, proteggere i civili, impedire
      al capo di fuggire con la scialuppa. Ramificare le scelte.
    usato_in: [La Fuga dalla Prigione, Spalle al Muro, L'Assedio]
    vedi_anche: [L'Assedio, Spalle al Muro, La Fuga dalla Prigione, La Corsa Contro il Tempo]

  - tipo: situazione
    nome: L'Esplorazione (Dungeon Crawl)
    nome_en: Dungeon Crawl / Delver's Delight
    nomi_alt: [Dungeon Crawl, Delver's Delight, Clearing the Hex, Tomb Raider, La Spedizione]
    descrizione: >
      I PG entrano in un luogo pericoloso e sconosciuto (dungeon, rovina, grotta,
      relitto) ed esplorano stanza per stanza. La ricompensa è dentro — tesori,
      conoscenza, un artefatto — ma il luogo stesso è il nemico: trappole, mostri,
      enigmi, risorse che si esauriscono. Non c'è un villain con un piano: c'è un
      ecosistema ostile da navigare.
    esempi:
      - "Moria — Il Signore degli Anelli (dungeon classico con bilancio risorse)"
      - "Tomb Raider — videogioco (esplorazione di rovine con trappole)"
      - "Indiana Jones e il Tempio Maledetto — film"
      - "Darkest Dungeon — videogioco (stress + risorse + esplorazione)"
      - "Diablo — videogioco (scendere di livello in livello)"
      - "Curse of Strahd: Death House — D&D (dungeon come introduzione)"
    uso_dnd: >
      La struttura più classica del D&D. Stanza dopo stanza: descrizione, pericolo,
      ricompensa. La gestione delle risorse (slot incantesimi, HP, torce, razioni)
      crea tensione crescente. Il ritmo: 2-3 stanze di esplorazione, 1 combattimento,
      1 enigma/trappola, 1 stanza di riposo/rifugio. Il dungeon deve avere una
      ragione per esistere (chi lo ha costruito? perché?).
    rischio: >
      Se ogni stanza è "mostro + tesoro" diventa un videogioco noioso. Variare:
      stanze vuote ma atmosferiche, puzzle ambientali, NPC intrappolati, scelte
      (porta A o porta B?), e una ragione narrativa per il dungeon.
    usato_in: [La Cerca, Sconfiggere il Mostro, Viaggio e Ritorno]
    vedi_anche: [La Zona Proibita, Il Labirinto, Il Luogo Impossibile, Il Naufragio]

  - tipo: situazione
    nome: La Caccia (Il Predatore)
    nome_en: The Hunt / Monster Hunt / Safari
    nomi_alt: [Monster Hunt, Safari, The Witcher Contract, La Battuta di Caccia, Tracking the Beast]
    descrizione: >
      I PG devono trovare e abbattere (o catturare) una creatura specifica nel suo
      ambiente naturale. Non è un combattimento frontale: è tracciamento, studio
      delle abitudini della preda, preparazione del terreno, e infine lo scontro
      alle condizioni dei cacciatori. La preda è intelligente, pericolosa, e nel
      suo elemento.
    esempi:
      - "Moby Dick — Melville (l'ossessione della caccia)"
      - "Jaws — film (lo squalo nel suo territorio)"
      - "The Witcher — videogioco/libri (contratti per uccidere mostri specifici)"
      - "Predator — film (cacciatore che diventa preda)"
      - "Monster Hunter — videogioco (preparazione + caccia + ricompensa)"
      - "Jurassic Park — film (i dinosauri cacciano VOI)"
    uso_dnd: >
      Un mostro terrorizza la regione. I PG devono: (1) raccogliere indizi sulla
      creatura (tipo, abitudini, debolezze), (2) prepararsi (armi, trappole,
      esche), (3) trovarlo nel suo territorio, (4) affrontarlo in condizioni
      favorevoli. Se saltano la preparazione, il combattimento è DEADLY. Se
      preparano bene, è HARD ma gestibile. Ricompensa: taglia + parti del mostro.
    rischio: >
      Se i PG trovano subito il mostro e lo ammazzano, non c'è storia. La fase
      di tracciamento e preparazione è il cuore — almeno metà del modulo. Il
      mostro deve avere un'abitudine sfruttabile e una che lo rende pericoloso.
    usato_in: [Sconfiggere il Mostro, La Cerca, Il Mistero]
    vedi_anche: [Sconfiggere il Mostro, La Sorveglianza, Il Terreno come Arma, La Corsa Contro il Tempo]

  - tipo: situazione
    nome: L'Imboscata (La Trappola Preparata)
    nome_en: The Ambush / Prepared Trap
    nomi_alt: [Ambush, La Trappola, Killbox, L'Agguato, Spring the Trap]
    descrizione: >
      Una delle parti (i PG o i nemici) prepara deliberatamente una trappola e
      attende che il bersaglio ci cada dentro. A differenza di un combattimento
      normale, l'imboscata è asimmetrica by design: chi l'ha preparata ha
      vantaggio di terreno, sorpresa, e posizionamento. La tensione sta nel
      piano che funziona (o fallisce).
    esempi:
      - "L'imboscata dei Vietcong — film di guerra (terreno + sorpresa)"
      - "Il Fosso di Helm — Il Signore degli Anelli (difensori preparati)"
      - "Home Alone — film (trappole elaborate contro intrusi)"
      - "Predator — film (sia cacciatore che preda preparano trappole)"
      - "Die Hard — film (McClane prepara trappole improvvisate)"
      - "La Palude dei Morti — D&D (terreno che intrappola)"
    uso_dnd: >
      Due usi: (1) I PG preparano l'imboscata — devono scegliere il terreno,
      piazzare trappole, coordinare le posizioni. La ricompensa: surprise round +
      vantaggio. (2) I PG cadono in un'imboscata — devono reagire rapidamente,
      trovare copertura, ribaltare la situazione. Usare la mappa come strumento:
      coperture, punti sopraelevati, vie di fuga bloccate.
    rischio: >
      Se l'imboscata è troppo efficace (TPK al primo round), è frustrante. Dare
      sempre una via di reazione: un PG con Percezione alta nota qualcosa, un
      nemico si muove troppo presto, un elemento del terreno offre copertura.
    usato_in: [La Guerra, Sconfiggere il Mostro, La Caccia]
    vedi_anche: [La Caccia, Il Terreno come Arma, Il Piano Non Detto, L'Infiltrazione]

  - tipo: situazione
    nome: La Radunata (Assemblare la Squadra)
    nome_en: Assemble the Team / Gathering of Allies
    nomi_alt: [Assembling the Team, Gathering Allies, Recruitment Arc, La Chiamata degli Eroi, Band of Brothers]
    descrizione: >
      Prima della missione principale, i PG devono raccogliere alleati, specialisti,
      risorse, o informazioni. Ogni reclutamento è una mini-avventura: lo specialista
      ha un prezzo, l'alleato è in prigione, l'informazione è custodita, la risorsa
      è in territorio nemico. La struttura è episodica ma converge verso un obiettivo.
    esempi:
      - "Ocean's Eleven — film (reclutare ogni specialista con la sua mini-missione)"
      - "I Sette Samurai — Kurosawa (radunare guerrieri per difendere il villaggio)"
      - "Mass Effect 2 — videogioco (reclutare e fidelizzare la squadra)"
      - "I Magnifici Sette — film (variante western dei Sette Samurai)"
      - "Suicide Squad — DC (assemblare i cattivi per una missione)"
      - "The Dirty Dozen — film (reclutare condannati per una missione suicida)"
    uso_dnd: >
      I moduli 1-3 sono reclutamento: ogni alleato/risorsa richiede una quest
      (liberare il guerriero dalla prigione, convincere il mago riluttante,
      rubare l'artefatto dalla torre). Il modulo finale è la missione vera con
      tutti gli alleati raccolti. Il numero di alleati reclutati determina la
      difficoltà del finale. Chi mancano? Quanto è più duro senza di loro?
    rischio: >
      Se ogni reclutamento è uguale (vai dal tipo, fai la quest, torna), è
      ripetitivo. Variare: uno si unisce gratis ma ha un segreto, uno chiede
      un prezzo inaccettabile, uno tradirà, uno è già morto e va resuscitato.
    usato_in: [Sconfiggere il Mostro, L'Assedio, La Guerra]
    vedi_anche: [Il Branco di Disadattati, L'Assedio, La Guerra, I Rinforzi]

  - tipo: situazione
    nome: Il Capro Espiatorio (L'Accusato Innocente)
    nome_en: Framed / Scapegoat / Wrong Man
    nomi_alt: [Framed, The Fall Guy, Il Colpevole Sbagliato, Wrongly Accused, L'Incastrato]
    descrizione: >
      Qualcuno (i PG stessi o un NPC a cui tengono) viene accusato ingiustamente
      di un crimine. Le prove sono schiaccianti, i testimoni concordano, e il
      sistema vuole un colpevole. I PG devono smascherare il vero responsabile
      prima che la sentenza cada — o fuggire e provare l'innocenza da latitanti.
    esempi:
      - "Il Fuggiasco — film (Harrison Ford accusato di omicidio, fugge per provare l'innocenza)"
      - "The Shawshank Redemption — film (condannato innocente)"
      - "North by Northwest — Hitchcock (scambiato per una spia, braccato)"
      - "Ace Attorney — videogioco (difendere clienti incastrati)"
      - "Il Conte di Montecristo — Dumas (tradito e imprigionato da innocente)"
      - "Making a Murderer — documentario (il sistema contro l'individuo)"
    uso_dnd: >
      I PG si svegliano accanto a un cadavere, con l'arma del delitto in mano
      e le guardie che bussano. Devono fuggire O restare e investigare. Il vero
      colpevole ha pianificato tutto. Combina bene con Il Processo (se restano)
      o La Fuga (se scappano). L'orologio ticchetta: se non trovano il vero
      colpevole in X giorni, vengono condannati.
    rischio: >
      Se i PG non hanno strumenti per investigare (nessun indizio, nessun alleato),
      è un vicolo cieco. Applicare la Regola dei Tre Indizi: almeno 3 modi per
      trovare la verità, anche da latitanti.
    usato_in: [Il Mistero, La Fuga dalla Prigione, Commedia degli Errori]
    vedi_anche: [Il Processo, Il Mistero, La Fuga dalla Prigione, L'Identità Scambiata, La Regola dei Tre Indizi]

  - tipo: situazione
    nome: L'Anello al Dito (Il Potere che Consuma)
    nome_en: The One Ring / Corrupting Artifact / Power at a Price
    nomi_alt: [Corrupting Artifact, The One Ring, Monkey's Paw, L'Artefatto Corruttore, Addictive Power]
    sottocaso_di: La Tentazione
    descrizione: >
      Un oggetto o potere dà benefici reali e tangibili — ma ogni uso ha un
      costo nascosto che cresce. Il personaggio diventa dipendente dai vantaggi,
      e quando il prezzo diventa chiaro è troppo tardi per smettere senza
      sacrificio. L'oggetto non è maledetto nel senso classico: funziona
      BENISSIMO. È il prezzo che è il problema.
    esempi:
      - "L'Unico Anello — Il Signore degli Anelli (potere + invisibilità, ma corrompe)"
      - "Il Death Note — manga (potere assoluto, ma perde l'umanità)"
      - "La Zampa di Scimmia — W.W. Jacobs (3 desideri, tutti con un costo)"
      - "Frostmourne — Warcraft (arma potente che ruba l'anima)"
      - "Il simbionte Venom — Marvel (potere + aggressività crescente)"
      - "L'Anello della Strega — qualsiasi D&D (bonus stats, malus roleplay)"
    uso_dnd: >
      Un artefatto che dà un bonus meccanico reale (+2 attacco, slot extra, ecc.)
      ma ogni uso aggiunge 1 al Contatore di corruzione. A soglia 3: incubi. A
      soglia 5: cambiamento d'aspetto. A soglia 8: il DM controlla il PG per 1
      round. A soglia 10: perdita dell'oggetto = perdita permanente. Il giocatore
      sa le regole fin dall'inizio — la scelta è sua.
    rischio: >
      Se il PG non può scegliere di smettere, è una punizione. Se può smettere
      senza conseguenze, non ha peso. Il prezzo dello smettere deve essere alto
      ma possibile (un rituale, un sacrificio, distruggere l'oggetto).
    usato_in: [La Tentazione, La Cerca, Sconfiggere il Mostro]
    puo_aver_bisogno_di: [Il Legame (oggetto)]
    vedi_anche: [La Tentazione, Il Contatore, Il Potere ha un Prezzo, Lo Specchio Interiore]

  - tipo: situazione
    nome: L'Oggetto Senziente (L'Arma con Volontà)
    nome_en: Sentient Item / Talking Sword / Artifact with Agency
    nomi_alt: [Talking Sword, Sentient Weapon, Intelligent Item, L'Arma Parlante, The Artifact with a Mind]
    descrizione: >
      Un oggetto magico ha una personalità, una volontà, e obiettivi propri. Non
      è un semplice strumento: è un NPC incorporato nell'equipaggiamento. Può
      consigliare, insultare, rifiutarsi di funzionare, o tentare di prendere il
      controllo. La relazione tra il portatore e l'oggetto è una dinamica
      narrativa a sé.
    esempi:
      - "Excalibur / la Spada nella Roccia — mitologia arturiana (sceglie il degno)"
      - "Stormbringer — Elric di Melniboné (spada che beve anime)"
      - "La Master Sword — Zelda (guida l'eroe)"
      - "Il Cappello Parlante — Harry Potter (smista, consiglia)"
      - "Lilarcor — Baldur's Gate (spada irritante e comica)"
      - "Needful Things — Stephen King (oggetti con volontà malvagia)"
    uso_dnd: >
      RAW in D&D 5e (DMG p.214): gli oggetti senzienti hanno punteggi mentali,
      allineamento, e possono entrare in conflitto col portatore. Usare come NPC
      costante: commenta, giudica, ha opinioni sui nemici. Può rifiutarsi di
      funzionare se il portatore agisce contro i suoi valori. In caso estremo:
      contest Carisma per il controllo. Dare all'oggetto un obiettivo proprio
      che può allinearsi o confliggere con la quest.
    rischio: >
      Se l'oggetto parla troppo diventa fastidioso. Se ha troppo potere sul PG,
      il giocatore perde agency. Regola: l'oggetto può suggerire e commentare
      liberamente, ma il contest per il controllo va usato max 1 volta per arco.
    usato_in: [La Cerca, La Tentazione, Sconfiggere il Mostro]
    vedi_anche: [L'Anello al Dito, Il Companion Fedele, Il Potere ha un Prezzo, Il Benefattore Misterioso]

  - tipo: situazione
    nome: Lo Shock Culturale (La Missione Diplomatica)
    nome_en: Culture Clash / Diplomatic Mission Gone Wrong
    nomi_alt: [Culture Clash, Fish out of Water Diplomacy, Long or Short Fork, La Gaffe Diplomatica, Stranger Etiquette]
    descrizione: >
      I PG sono inviati (o finiscono) presso una cultura con usi e costumi
      radicalmente diversi dai loro. Devono navigare regole sociali sconosciute
      senza offendere nessuno, mentre compiono una missione (trattativa, alleanza,
      commercio). Ogni errore ha conseguenze diplomatiche — dal ridicolo alla
      guerra.
    esempi:
      - "Star Trek — qualsiasi episodio di primo contatto"
      - "Dune — Paul tra i Fremen (deve imparare i loro modi o morire)"
      - "Avatar — Jake tra i Na'vi (il corpo è diverso, le regole anche)"
      - "The Witcher — Geralt ai banchetti nobiliari (pesce fuor d'acqua sociale)"
      - "Crocodile Dundee — film (cultura australiana vs New York)"
      - "Shogun — Clavell (europeo nel Giappone feudale)"
    uso_dnd: >
      I PG devono negoziare con elfi/nani/giganti/fey con protocolli rigidi:
      non guardare negli occhi il capo, non toccare il cibo col ferro, parlare
      solo quando interrogati. Le informazioni che hanno sono incomplete o
      sbagliate (un NPC li ha mal consigliati). Ogni gaffe = test di reazione.
      3 gaffe = incidente diplomatico. I PG che si informano prima (La
      Sorveglianza) hanno vantaggio.
    rischio: >
      Se è solo "non fare X" ripetuto, è frustrante. Dare ai PG modi per
      rimediare (un rituale di scuse, un dono appropriato, un campione che li
      difende). La cultura deve essere affascinante, non solo un campo minato.
    usato_in: [Viaggio e Ritorno, La Cerca, Commedia degli Errori]
    vedi_anche: [Il Pesce fuor d'Acqua, La Masquerade, Commedia degli Errori, La Sorveglianza]

  - tipo: situazione
    nome: La Gara (La Competizione Non Letale)
    nome_en: The Race / Competition for the Prize
    nomi_alt: [The Race, How Much for the Dingus, Corsa al Tesoro, Treasure Race, Competition Arc]
    sottocaso_di: La Rivalità
    descrizione: >
      I PG e uno o più gruppi rivali competono per lo stesso obiettivo (un
      artefatto, un contratto, un titolo, un territorio) in tempo reale. Non è
      un combattimento diretto (quello è La Rivalità o L'Arena) — è una corsa
      parallela dove vince chi arriva primo, chi è più furbo, o chi sabota meglio
      l'altro senza farsi beccare.
    esempi:
      - "Indiana Jones vs i nazisti — franchise (stessi artefatti, chi arriva primo)"
      - "Wacky Races — animazione (gara con sabotaggio)"
      - "The Amazing Race — reality (competizione a tappe)"
      - "One Piece — manga (tutti vogliono il tesoro di Roger)"
      - "It's a Mad Mad Mad Mad World — film (tutti inseguono lo stesso tesoro)"
      - "Cannonball Run — film (gara illegale coast-to-coast)"
    uso_dnd: >
      Un artefatto è stato localizzato. I PG partono, ma un altro gruppo (rivali
      amichevoli o mercenari) parte contemporaneamente. Moduli paralleli: ogni
      scelta (via rapida ma pericolosa vs via sicura ma lenta) determina chi
      arriva primo. I rivali possono sabotare (bloccare un ponte, corrompere
      una guida) e i PG possono fare lo stesso. Chi arriva secondo non perde
      tutto — può negoziare, rubare, o accettare.
    rischio: >
      Se i rivali sono invisibili (agiscono off-screen), non c'è tensione. I PG
      devono VEDERE i rivali: incrociarli ai bivi, trovare i loro segni, sentire
      che sono "un giorno avanti". La competizione deve essere percepita.
    usato_in: [La Cerca, Da Povero a Ricco, La Rivalità]
    vedi_anche: [La Rivalità, La Rincorsa, La Corsa Contro il Tempo, Il Branco di Disadattati]

  - tipo: situazione
    nome: La Base Segreta (Il Nido di Vespe)
    nome_en: Hidden Base / Hornet's Nest
    nomi_alt: [Hidden Base, Evil Lair, Il Covo del Nemico, Hornet's Nest, The Villain's Hideout]
    descrizione: >
      I PG scoprono (per caso o per indagine) il quartier generale segreto del
      nemico — dove prepara i suoi piani, addestra i suoi uomini, nasconde il
      bottino. La scelta: infiltrarsi da soli, avvertire le autorità (e rischiare
      che il nemico venga avvertito), o attaccare direttamente (e affrontare una
      fortezza). La scoperta è solo l'inizio — agire è il problema.
    esempi:
      - "La Morte Nera — Star Wars (base segreta con un punto debole)"
      - "La Batcaverna scoperta — Batman (quando il nemico trova la tua base)"
      - "Isengard — Il Signore degli Anelli (scoprire la fabbrica di Uruk-hai)"
      - "SPECTRE island — James Bond (infiltrare il covo del villain)"
      - "Il laboratorio segreto — qualsiasi film sci-fi/horror"
      - "La base nel vulcano — tropo James Bond"
    uso_dnd: >
      I PG trovano il covo: una mappa, un prigioniero che parla, un indizio
      durante l'indagine. Ora hanno 3 opzioni: (1) infiltrazione furtiva (pochi
      PG, alto rischio, alta ricompensa), (2) assalto frontale (tutto il party,
      scontro duro), (3) avvertire e aspettare rinforzi (rischio che il nemico
      fugga). La base ha una mappa dettagliata: sentinelle, trappole, via di
      fuga del villain, prigionieri da liberare.
    rischio: >
      Se la base è troppo grande diventa un dungeon crawl generico. Dare un
      obiettivo specifico dentro la base (il prigioniero, il piano, il
      dispositivo) e un timer (il villain parte domani all'alba).
    usato_in: [L'Infiltrazione, Sconfiggere il Mostro, L'Indagine sulla Cospirazione]
    vedi_anche: [L'Infiltrazione, L'Esplorazione, La Sorveglianza, L'Assedio]

  - tipo: situazione
    nome: La Prevenzione (Fermare Prima che Accada)
    nome_en: Ounces of Prevention / Preemptive Strike
    nomi_alt: [Preemptive Strike, Ounces of Prevention, Fermare il Piano, Stop the Ritual, La Corsa Preventiva]
    descrizione: >
      I PG sanno (o sospettano) che il villain sta per fare qualcosa di terribile
      e devono agire PRIMA che accada. Non è una reazione a un evento (quello è
      La Corsa Contro il Tempo dopo l'innesco) — è un'azione preventiva basata
      su intelligence. Il dilemma: le prove sono sufficienti per agire? E se
      l'intelligence è sbagliata?
    esempi:
      - "Minority Report — film (punire il crimine prima che avvenga)"
      - "Mission: Impossible — franchise (fermare il piano prima dell'esecuzione)"
      - "Captain America: The Winter Soldier — film (fermare il lancio delle Helicarrier)"
      - "Harry Potter e l'Ordine della Fenice — (prevenire il ritorno di Voldemort, ignorati)"
      - "24 — serie TV (fermare l'attacco terroristico prima del timer)"
    uso_dnd: >
      I PG scoprono che il villain completerà il rituale tra 3 giorni. Devono:
      (1) confermare l'intelligence, (2) trovare il luogo, (3) arrivare in
      tempo, (4) fermare il rituale. Se agiscono senza confermare, potrebbero
      attaccare un innocente (red herring). Se aspettano troppo per confermare,
      il rituale si completa. Il dilemma tra certezza e velocità è il cuore.
    rischio: >
      Se i PG hanno informazione perfetta ("il villain è lì, fate X"), non c'è
      tensione. L'intelligence deve essere parziale, ambigua, o con una fonte
      inaffidabile. Il dubbio ("e se sbagliamo?") rende la scelta significativa.
    usato_in: [L'Indagine sulla Cospirazione, Il Mistero, Sconfiggere il Mostro]
    vedi_anche: [La Corsa Contro il Tempo, Il Mistero, La Sorveglianza, La Regola dei Tre Indizi]

  - tipo: situazione
    nome: Il Vaso di Pandora (La Breccia Aperta)
    nome_en: Pandora's Box / Unleashed Evil
    nomi_alt: [Pandora's Box, Unleashed Evil, La Breccia, The Breach, Il Genio dalla Bottiglia]
    sottocaso_di: Il Male Sigillato
    descrizione: >
      Qualcuno (il villain, un NPC imprudente, o i PG stessi) ha aperto
      qualcosa che non doveva essere aperto — un portale, un sigillo, un
      contenitore. Il male/caos/pericolo si è riversato nel mondo. Prima di
      poter chiudere la fonte, i PG devono gestire le conseguenze già liberate.
      È una catastrofe a cascata.
    esempi:
      - "Pandora — mitologia greca (il vaso aperto libera tutti i mali)"
      - "Ghostbusters — film (il contenitore esplode, fantasmi ovunque)"
      - "Jurassic Park — film (i dinosauri sono liberi)"
      - "Cabin in the Woods — film (tutti i mostri liberati simultaneamente)"
      - "Il Portale dell'Oblivion — Elder Scrolls (la breccia tra i piani)"
      - "Stranger Things — serie (il Gate aperto verso il Sottosopra)"
    uso_dnd: >
      Il sigillo si è rotto: demoni/non-morti/aberrazioni escono a ondate. I
      PG devono: (1) gestire l'emergenza immediata (proteggere i civili,
      combattere le prime ondate), (2) trovare come chiudere la fonte (un
      rituale, un artefatto, un sacrificio), (3) chiudere la fonte mentre le
      ondate continuano. Struttura a escalation: ogni round/ora che passa, la
      situazione peggiora. Timer implicito: se non chiudono la fonte, il mondo
      viene sommerso.
    rischio: >
      Se le ondate sono solo combattimento ripetitivo ("altri 6 demoni"),
      diventa noioso. Ogni ondata deve porre un problema diverso: la prima è
      combattimento, la seconda è un puzzle, la terza costringe a una scelta
      (chiudere il portale O salvare gli intrappolati dall'altra parte).
    usato_in: [Il Male Sigillato, Sconfiggere il Mostro, L'Apocalisse in Corso]
    vedi_anche: [Il Male Sigillato, L'Apocalisse in Corso, La Corsa Contro il Tempo, La Pestilenza]

  - tipo: situazione
    nome: L'Eredità Inattesa (Il Lascito Scomodo)
    nome_en: Unexpected Inheritance / Poisoned Gift
    nomi_alt: [Unexpected Inheritance, Poisoned Legacy, Il Dono Avvelenato, Strings Attached, Il Lascito Maledetto]
    descrizione: >
      I PG ricevono qualcosa di apparentemente prezioso — un titolo nobiliare,
      una proprietà, un'organizzazione, un artefatto — da un benefattore morto
      o scomparso. Ma il "regalo" porta con sé problemi nascosti: debiti, nemici
      del precedente proprietario, obblighi feudali, una maledizione, o
      semplicemente responsabilità che nessuno voleva.
    esempi:
      - "Lo zio morto lascia il castello infestato — tropo horror"
      - "Il padrino lascia il 'business' — Il Padrino III"
      - "Harry eredita Grimmauld Place — Harry Potter (casa piena di ricordi oscuri)"
      - "Bilbo eredita l'Anello — Il Signore degli Anelli (il regalo più scomodo della storia)"
      - "Stardew Valley — videogioco (erediti la fattoria dello zio, tutta da ricostruire)"
      - "Un PG eredita un debito con un drago — classico D&D"
    uso_dnd: >
      Hook perfetto per inizio avventura: un NPC mai conosciuto lascia ai PG
      qualcosa in eredità. Il "regalo" è il punto di partenza dell'avventura:
      il castello ha un dungeon sotto, il titolo ha un nemico ereditario, la
      gilda ha debiti con la mafia locale. Combina bene con La Gestione del
      Territorio (se l'eredità è un luogo) o con La Cerca (se bisogna trovare
      qualcosa per risolvere i problemi dell'eredità).
    rischio: >
      Se il regalo è SOLO problemi, i giocatori lo rifiutano. Deve avere anche
      vantaggi reali (una base, risorse, informazioni, un oggetto utile) che
      motivino i PG a tenerselo nonostante i guai.
    usato_in: [Da Povero a Ricco, La Gestione del Territorio, Il Mistero]
    vedi_anche: [La Gestione del Territorio, La Crisi di Successione, L'Anello al Dito, La Maledizione]

  - tipo: situazione
    nome: La Quarantena (Il Lockdown)
    nome_en: Lockdown / Quarantine / Sealed Zone
    nomi_alt: [Lockdown, La Zona Sigillata, Sealed Inside, Nessuno Entra Nessuno Esce, Containment]
    descrizione: >
      Un'area viene sigillata — per magia, ordine delle autorità, o calamità —
      e i PG sono intrappolati dentro con il pericolo. Nessuno entra e nessuno
      esce. Le risorse sono limitate, la tensione sale, e bisogna risolvere il
      problema dall'interno prima che la situazione degeneri. A differenza
      dell'Assedio (nemici fuori), qui il nemico è DENTRO con i PG.
    esempi:
      - "The Thing — film (base antartica isolata, il nemico è dentro)"
      - "Alien — film (Nostromo sigillata, il mostro è a bordo)"
      - "Dredd — film (il palazzo viene sigillato, i PG devono risalire)"
      - "Resident Evil — videogioco (la villa è chiusa, i PG cercano l'uscita)"
      - "Under the Dome — King (cupola invisibile isola un'intera città)"
      - "Lockdown di Hogwarts — Harry Potter (il castello si sigilla)"
    uso_dnd: >
      Il quartiere/dungeon/nave viene magicamente sigillato (rituale, barriera,
      crollo). I PG devono: (1) identificare la minaccia interna, (2) gestire
      il panico degli NPC intrappolati, (3) trovare il modo di rompere il
      sigillo o neutralizzare il pericolo. Le risorse si esauriscono (pozioni,
      slot incantesimi, cibo). Combina bene con Il Mostro è una Persona
      (chi è infetto?) e La Paranoia Indotta.
    rischio: >
      Se i PG si sentono completamente impotenti senza via d'uscita, è
      frustrante. Dare almeno 2-3 approcci possibili per rompere il
      contenimento o risolvere dall'interno. Il timer deve essere percepibile
      ma non schiacciante.
    usato_in: [L'Assedio, Il Mistero, La Corsa Contro il Tempo]
    vedi_anche: [L'Assedio, La Paranoia Indotta, Il Mostro è una Persona, La Pestilenza]

  - tipo: situazione
    nome: Il Dilemma del Carrello (La Scelta Impossibile)
    nome_en: Trolley Problem / Sadistic Choice / No-Win Scenario
    nomi_alt: [Trolley Problem, Sadistic Choice, La Scelta di Sophie, No-Win Scenario, Il Bivio Mortale]
    descrizione: >
      I PG sono costretti a scegliere tra due esiti negativi — salvare A o
      salvare B, dove non salvarli entrambi è la regola. Non c'è una terza
      opzione (o se c'è, richiede un sacrificio personale estremo). Il villain
      spesso orchestra la scelta per spezzare l'eroe moralmente. A differenza
      di Spalle al Muro (pressione generica), qui la scelta è binaria e
      deliberata, progettata per essere dolorosa.
    esempi:
      - "Spider-Man — Mary Jane o il tram pieno di bambini (Green Goblin forza la scelta)"
      - "The Dark Knight — Harvey Dent o Rachel (il Joker forza la scelta)"
      - "Sophie's Choice — film (scegliere quale figlio sopravvive)"
      - "Mass Effect — distruggere i Geth o i Quarian (una razza muore)"
      - "Witcher 3 — la maggior parte delle quest principali (scelte con perdite da entrambi i lati)"
      - "Il dilemma del tram — filosofia morale (il modello originale)"
    uso_dnd: >
      Il villain pone un ultimatum: "la principessa o il villaggio" — i PG
      devono scegliere chi salvare (non c'è tempo per entrambi). Oppure: due
      rituali si completano simultaneamente in luoghi diversi, il party può
      fermare solo uno. La chiave è che la scelta abbia conseguenze PERMANENTI
      nel mondo — il villaggio bruciato resta bruciato. Una terza via è
      possibile ma costosissima (sacrificio di un PG, perdita di un artefatto).
    rischio: >
      Se una scelta è chiaramente migliore dell'altra, non è un vero dilemma.
      Entrambe le perdite devono avere peso narrativo equivalente. Se i PG
      trovano una soluzione creativa che salva entrambi, premiarli — ma non
      renderla ovvia.
    usato_in: [Spalle al Muro, Tragedia, Sconfiggere il Mostro]
    puo_aver_bisogno_di: [Il Legame]
    vedi_anche: [Spalle al Muro, La Morale Grigia, Il Prezzo della Vittoria, Il Dilemma del Prigioniero]

  - tipo: situazione
    nome: La Falsa Pace (La Quiete Prima della Tempesta)
    nome_en: Calm Before the Storm / False Sense of Security
    nomi_alt: [Calm Before the Storm, False Security, La Quiete, Breathing Room Trap, Il Silenzio Sospetto]
    descrizione: >
      Un periodo di apparente tranquillità che precede un disastro. Tutto sembra
      andare bene: il villain è silenzioso, i problemi si risolvono, la gente
      sorride. Ma la calma È il segnale — il nemico si sta preparando, il
      rituale avanza in segreto, l'esercito marcia sottoterra. A differenza
      della Pausa (respiro intenzionale del DM), qui la calma è narrativamente
      ingannevole e carica di presagi.
    esempi:
      - "La Contea all'inizio — Il Signore degli Anelli (pace idilliaca, Sauron cresce)"
      - "L'inizio di qualsiasi film horror — la famiglia si trasferisce nella casa perfetta"
      - "Pre-Red Wedding — Game of Thrones (la festa è troppo bella)"
      - "L'inizio di Jurassic Park — film (il parco funziona, tutto è sotto controllo)"
      - "La prima ora di Titanic — film (lusso e ottimismo prima dell'iceberg)"
    uso_dnd: >
      Una sessione 0.5 o prima metà del modulo dove tutto è bello: festa al
      villaggio, missione facile, NPC gentili. Il DM semina presagi sottili
      (Il Presagio): uccelli che fuggono, silenzio innaturale, un NPC che dice
      "non è mai stato così tranquillo". I giocatori esperti capiranno che
      qualcosa arriva — la tensione è nell'attesa, non nell'evento.
    rischio: >
      Se troppo lunga i giocatori si annoiano. Se troppo corta il contrasto
      non funziona. Ideale: 20-30 minuti di calma apparente prima che esploda.
      I presagi devono essere sufficienti che a posteriori dicano "avremmo
      dovuto capirlo".
    usato_in: [Tragedia, Sconfiggere il Mostro, La Festa Interrotta]
    vedi_anche: [La Pausa, Il Presagio, La Festa Interrotta, L'Ora più Buia]

  - tipo: situazione
    nome: La Mutazione (Il Contagio Trasformante)
    nome_en: Transformation Plague / Body Horror / Corruption Spread
    nomi_alt: [Transformation Plague, Body Horror, Il Contagio, The Spread, La Piaga Mutante]
    descrizione: >
      Qualcosa sta trasformando le persone in altro — non-morti, aberrazioni,
      licantropi, schiavi mentali, creature vegetali. Il contagio si diffonde
      e i PG devono fermarlo prima che raggiunga massa critica. L'orrore è
      doppio: il nemico cresce esponenzialmente, E le vittime sono persone che
      i PG conoscevano. A differenza della Pestilenza (che uccide), qui la
      malattia CAMBIA — e le vittime possono essere ancora coscienti dentro.
    esempi:
      - "The Last of Us — videogioco/serie (cordyceps trasforma in clicker)"
      - "28 Days Later — film (rage virus trasforma in berserker)"
      - "Invasion of the Body Snatchers — film (sostituzione silenziosa)"
      - "La licantropia — D&D/folklore (il morso trasforma)"
      - "I Borg — Star Trek (assimilazione, 'resistance is futile')"
      - "Resident Evil — videogioco (T-virus trasforma in zombie)"
    uso_dnd: >
      Un villaggio inizia a mostrare segni: NPC familiari si comportano in modo
      strano, spariscono di notte, tornano "diversi". I PG devono: identificare
      il vettore di contagio, trovare la fonte (paziente zero, artefatto
      corrotto, rituale attivo), e decidere se le vittime sono ancora
      salvabili o se serve il fuoco purificatore. Timer implicito: ogni
      long rest il contagio si diffonde a 1d4 nuovi NPC.
    rischio: >
      Se i PG vengono infettati senza possibilità di cura, perdono l'agency.
      Prevedere sempre una finestra di cura (rimuovi maledizione, erba rara,
      distruggere la fonte). Se un PG viene infettato: dargli 2-3 sessioni
      prima della trasformazione completa, con effetti graduali giocabili.
    usato_in: [La Pestilenza, Sconfiggere il Mostro, La Corsa Contro il Tempo]
    vedi_anche: [La Pestilenza, Il Mostro è una Persona, La Quarantena, Il Ritorno Sbagliato]

  - tipo: situazione
    nome: La Resa dei Conti (Il Boss Fight)
    nome_en: Final Showdown / The Boss Fight / Climactic Battle
    nomi_alt: [Boss Fight, Final Showdown, Lo Scontro Finale, Climactic Battle, The Last Stand]
    descrizione: >
      Il confronto finale con l'antagonista — il momento verso cui tutta
      l'avventura converge. Non è un combattimento qualsiasi: è lo scontro
      che risolve il conflitto centrale. Ha regole proprie: l'ambiente è
      significativo (la tana del drago, la torre del lich, il vulcano), il
      villain ha preparativi e fasi, e la posta in gioco è massima. Tutto
      ciò che i PG hanno imparato e raccolto durante l'avventura serve ORA.
    esempi:
      - "Luke vs Vader nella Morte Nera II — Star Wars"
      - "La battaglia alla Montagna del Fato — Il Signore degli Anelli"
      - "Harry vs Voldemort a Hogwarts — Harry Potter"
      - "Il Drago nella montagna — Lo Hobbit"
      - "Neo vs Agent Smith — The Matrix"
      - "Ogni boss fight di Dark Souls — il pattern è: arena + fasi + meccaniche uniche"
    uso_dnd: >
      La boss fight deve essere: (1) preparata — il villain è stato costruito
      per moduli, i PG lo conoscono e lo temono; (2) multi-fase — non un
      singolo sacco di HP, ma fasi con cambi di tattica/forma/arena;
      (3) ambientale — l'arena ha elementi interattivi (pilastri che crollano,
      lava, macchinari); (4) personale — almeno un PG ha un conto aperto col
      villain. L'esito della battaglia deve cambiare il mondo in modo
      permanente. Dopo la Resa dei Conti viene Il Debriefing.
    rischio: >
      Se il boss muore in 2 round per una combo fortunata, è anticlimax. Se è
      troppo forte e TPK, è frustrante. Prevedere meccaniche anti-climax:
      reazioni leggendarie, fasi, alleati del boss. E avere un piano B se il
      boss scende troppo in fretta (fase 2, trasformazione).
    usato_in: [Sconfiggere il Mostro, La Vendetta, La Cerca]
    puo_aver_bisogno_di: [La Costruzione dell'Odio, Il Legame (affezione)]
    vedi_anche: [L'Ora più Buia, Il Debriefing, Il Falso Finale, Il Sacrificio Volontario]


  - tipo: relazione
    nome: Il Rivale Rispettoso che Diventa Alleato
    nome_en: Rival Becomes Ally / Fire-Forged Friends
    nomi_alt: [Fire-Forged Friends, Amici per Forza, Da Nemici ad Amici, Respect Through Combat]
    sottocaso_di: L'Alleanza col Nemico
    descrizione: >
      Un rivale o nemico iniziale che, dopo aver combattuto a fianco dei PG
      contro una minaccia comune, sviluppa un rispetto genuino e diventa un
      alleato permanente. Non è un'alleanza di convenienza (quella finisce) —
      è una trasformazione reale del rapporto. L'esperienza condivisa ha creato
      un legame che supera l'inimicizia originale.
    esempi:
      - "Vegeta — Dragon Ball Z (rivale → alleato → amico attraverso battaglie condivise)"
      - "Legolas e Gimli — Il Signore degli Anelli (pregiudizio → amicizia in guerra)"
      - "Zuko si unisce al Team Avatar — Avatar (nemico → membro del party)"
      - "Jaime e Brienne — Game of Thrones (dal disprezzo al rispetto in viaggio)"
      - "Piccolo e Gohan — Dragon Ball (il nemico allena il figlio del rivale)"
    uso_dnd: >
      Un NPC nemico ricorrente (La Nemesi o Il Nemico Onorevole) che dopo
      un'Alleanza col Nemico decide di restare. La transizione deve essere
      graduale: rispetto → aiuto occasionale → alleanza formale. I PG
      dovrebbero poter influenzare la transizione con le loro azioni.
    usato_in: [L'Alleanza col Nemico, La Rivalità, Sconfiggere il Mostro]
    vedi_anche: [L'Alleanza col Nemico, La Nemesi, Il Nemico Onorevole, La Rivalità Amichevole]

  - tipo: relazione
    nome: La Fiducia Tradita (Il Pugnale nella Schiena)
    nome_en: Betrayal of Trust / Backstab
    nomi_alt: [Backstab, Broken Trust, Il Tradimento Intimo, Stab in the Back, La Pugnalata alle Spalle]
    sottocaso_di: Il Tradimento dell'Alleato
    descrizione: >
      Un personaggio in cui il protagonista aveva riposto fiducia genuina lo
      tradisce deliberatamente. Non è un nemico mascherato da alleato (quella è
      La Talpa): è qualcuno che ERA davvero un alleato, ma ha scelto di tradire
      per motivi propri. Il tradimento è più doloroso perché la fiducia era
      meritata — fino a quel momento.
    esempi:
      - "Lando tradisce Han — Star Wars (costretto, ma tradisce)"
      - "Boromir tenta di prendere l'Anello — Il Signore degli Anelli (la debolezza vince)"
      - "Brutus pugnala Cesare — Shakespeare ('Et tu, Brute?')"
      - "Cypher tradisce Morpheus — The Matrix (per tornare nella simulazione)"
      - "Saruman tradisce il Concilio Bianco — Il Signore degli Anelli"
      - "Griffith tradisce la Band of the Hawk — Berserk (per il suo sogno)"
    uso_dnd: >
      Un NPC alleato stretto (il quest giver, il companion, il patron) tradisce
      i PG per motivi comprensibili: è stato ricattato, ha una famiglia in
      ostaggio, crede sinceramente di fare la cosa giusta, o semplicemente
      l'offerta era troppo buona. La differenza con La Talpa: la talpa non è
      mai stata alleata davvero. Qui il tradimento è un CAMBIO di lealtà, non
      un inganno originario. I PG devono decidere: vendetta o perdono?
    rischio: >
      Se succede troppo spesso i giocatori non si fideranno mai di nessun NPC.
      Max 1 tradimento per campagna. L'NPC deve aver dato VERO aiuto prima —
      altrimenti non fa male. Il tradimento deve avere una ragione che i PG
      possono comprendere (anche se non perdonare).
    usato_in: [Tragedia, L'Ora più Buia, La Vendetta]
    puo_aver_bisogno_di: [Il Legame (affezione)]
    vedi_anche: [Il Tradimento dell'Alleato, La Talpa, L'Amico Velenoso, Lo Specchio Interiore]

  - tipo: relazione
    nome: La Coppia Forzata (Il Buddy Cop)
    nome_en: Odd Couple / Buddy Cop / Chained Together
    nomi_alt: [Buddy Cop, Odd Couple, Chained Together, Compagni Forzati, Vitriolic Best Buds]
    sottocaso_di: L'Alleato Scomodo
    descrizione: >
      Due personaggi che non si sopportano (personalità opposte, valori in
      conflitto, storia personale ostile) sono costretti a collaborare da
      circostanze esterne: incatenati insieme, stesso obiettivo, ordine del
      patron, magia vincolante. La tensione comica/drammatica viene dallo
      scontro continuo — e dalla graduale, riluttante crescita del rispetto.
    esempi:
      - "Legolas e Gimli — Il Signore degli Anelli (odio razziale → amicizia)"
      - "Riggs e Murtaugh — Lethal Weapon (folle + prudente)"
      - "Shrek e Ciuchino — Shrek (introverso + estroverso)"
      - "Geralt e Jaskier — The Witcher (misantropo + bardo)"
      - "Jake e Rosa / Jake e Charles — Brooklyn Nine-Nine"
      - "Il Defiant Ones — film 1958 (due prigionieri incatenati, uno bianco uno nero)"
    uso_dnd: >
      Due PG o un PG e un NPC sono costretti a collaborare: stessa missione da
      patron diversi, maledizione che li lega, inseguiti dallo stesso nemico.
      Non possono separarsi (vincolo meccanico o narrativo). La tensione si
      scioglie gradualmente man mano che si salvano a vicenda. Ideale per
      coppie di giocatori con PG in conflitto — dà struttura al conflitto.
    rischio: >
      Se il conflitto è reale (i giocatori si infastidiscono, non i PG), è
      tossico. Funziona solo se entrambi i giocatori sono d'accordo e si
      divertono. L'arco deve avere una risoluzione: o diventano amici, o si
      separano con rispetto, mai stallo infinito.
    usato_in: [Commedia degli Errori, La Cerca, La Scorta]
    vedi_anche: [Il Branco di Disadattati, L'Alleato Scomodo, La Rivalità Amichevole, Il Rivale Rispettoso che Diventa Alleato]

  - tipo: relazione
    nome: Il Maestro Caduto (Il Mentore Corrotto)
    nome_en: Fallen Mentor / Corrupted Master
    nomi_alt: [Fallen Mentor, Corrupted Teacher, Il Maestro Tradito, The Dark Mentor, Da Guida a Nemico]
    sottocaso_di: Il Maestro e l'Allievo (Opposti)
    descrizione: >
      L'ex mentore dei PG (o di un NPC importante) è diventato un avversario —
      corrotto dal potere, tradito dalle istituzioni, o semplicemente convinto
      che la via oscura sia necessaria. A differenza del Maestro e l'Allievo
      (Opposti) generico, qui il rapporto era genuinamente buono prima: il
      mentore ha insegnato tutto ciò che i PG sanno, e ora usa quelle stesse
      conoscenze contro di loro. Il conflitto è personale e doloroso.
    esempi:
      - "Saruman — Il Signore degli Anelli (saggio corrotto dal potere)"
      - "Count Dooku — Star Wars (ex Jedi passato al Lato Oscuro)"
      - "Ra's al Ghul per Batman — DC (il maestro che Batman deve fermare)"
      - "Mordo — Doctor Strange (compagno di studi diventato nemico)"
      - "Walter White per Jesse — Breaking Bad (il mentore diventa il mostro)"
      - "Anakin per Ahsoka — Star Wars (il maestro che cade)"
    uso_dnd: >
      Il patron/mentore dei PG (quello che dava le quest) è diventato il villain
      del secondo arco. Conosce le debolezze dei PG, le loro tattiche, i loro
      segreti. I PG devono superare gli insegnamenti ricevuti per batterlo.
      Il conflitto emotivo: possono provare a redimerlo (difficile, richiede
      sacrifici) o fermarlo (doloroso ma necessario). L'ex-mentore ha
      ragioni comprensibili per la sua caduta (Anti-Villain).
    rischio: >
      Se il mentore era poco sviluppato prima della caduta, il tradimento non
      colpisce. Investire almeno 2-3 sessioni dove il mentore è genuinamente
      utile e paterno. Se la caduta è improvvisa senza presagi, sembra
      arbitraria. Seminare crepe: dubbi, metodi discutibili, segreti.
    usato_in: [Sconfiggere il Mostro, Tragedia, La Vendetta]
    puo_aver_bisogno_di: [Il Legame (affezione)]
    vedi_anche: [Il Maestro e l'Allievo (Opposti), Il Mentore, L'Anti-Villain, Il Piedistallo Spezzato]


  - tipo: tecnica
    nome: I Segreti Flottanti (Secrets & Clues Astratti)
    nome_en: Floating Secrets / Abstract Clues (Sly Flourish)
    nomi_alt: [Floating Clues, Indizi Mobili, Portable Secrets, Clue Without a Home]
    descrizione: >
      Preparare 10 segreti/indizi per sessione come frasi singole SENZA
      assegnarli a un luogo o NPC specifico. Durante il gioco, il DM li "sgancia"
      dove ha senso in base a dove i PG vanno e cosa fanno. Un segreto preparato
      per la biblioteca può essere scoperto nella taverna se i PG non vanno mai
      in biblioteca. È il principio di separare il CONTENUTO dal CONTENITORE.
    esempi:
      - "Sly Flourish — Return of the Lazy Dungeon Master (il principio fondamentale)"
      - "GUMSHOE system — Trail of Cthulhu (indizi dati automaticamente se si va nel posto giusto)"
      - "Powered by the Apocalypse — i fronts avanzano dove i PG guardano"
    uso_dnd: >
      Prima della sessione scrivi 10 frasi: "Il mercante è stato avvelenato dal
      figlio", "La gilda dei ladri conosce l'ingresso segreto", "Il drago
      dormiente si sta svegliando". NON decidere dove i PG li scopriranno.
      Durante il gioco: se i PG parlano col barista, il barista sa del veleno.
      Se esplorano la fogna, trovano tracce della gilda. L'informazione trova
      i PG, non viceversa.
    rischio: >
      Se si abusa, il mondo sembra "troppo comodo" — ogni NPC sa esattamente ciò
      che serve. Bilanciare: non tutti gli NPC sanno tutto. Alcuni segreti
      richiedono luoghi specifici. Ma il principio evita che i PG perdano
      informazioni critiche perché hanno scelto la strada sbagliata.
    usato_in: [Il Mistero, Plot Concatenati, La Cerca]
    vedi_anche: [La Regola dei Tre Indizi, Bella Idea, Il Presagio]

  - tipo: tecnica
    nome: Le Location Fantastiche (Tre Aspetti)
    nome_en: Fantastic Locations / Three Aspects (Sly Flourish)
    nomi_alt: [Three Aspects, Location Design, Titolo + 3 Dettagli, Evocative Locations]
    descrizione: >
      Per ogni luogo importante, preparare: un titolo evocativo breve + 3
      dettagli fantastici che lo rendono memorabile. Non una descrizione lunga —
      tre immagini potenti che il DM può usare al volo. Il luogo diventa
      istantaneamente vivido con il minimo sforzo di prep.
    esempi:
      - "Sly Flourish — 'The Sunspire': raggio di luce accecante, fossato di lava, glifi elfi giganti"
      - "Dark Souls — ogni area è ricordabile per 2-3 dettagli visivi"
      - "Zelda — ogni dungeon ha un tema visivo immediato (acqua, fuoco, ombra)"
    uso_dnd: >
      Per ogni stanza/area del dungeon, scrivere solo: Nome + 3 aspetti. Esempio:
      "La Sala dei Sussurri — (1) Mille bocche scolpite nelle pareti che
      mormorano, (2) Pavimento di vetro nero che mostra l'abisso sotto, (3)
      Trono di ossa al centro con una corona che brilla". Il DM ha tutto ciò
      che serve per descrivere la scena e i PG hanno 3 cose con cui interagire.
    rischio: >
      Se i 3 aspetti sono solo estetici e non interagibili, il luogo è bello
      ma morto. Almeno 1 dei 3 aspetti deve essere qualcosa con cui i PG possono
      FARE qualcosa (tirare una leva, salire su un pilastro, rompere un sigillo).
    usato_in: [La Cerca, Il Luogo Impossibile, La Zona Proibita]
    vedi_anche: [In Medias Res, Il Presagio, Il Pacing]

  - tipo: tecnica
    nome: La Campagna a Spirale
    nome_en: Spiral Campaign Development (Sly Flourish)
    nomi_alt: [Spiral Development, Costruzione dal Centro, Outward Expansion, Lazy Worldbuilding]
    descrizione: >
      Costruire il mondo della campagna partendo dal centro (i PG, il villaggio
      iniziale) e spiralando verso l'esterno man mano che i PG esplorano. Non
      preparare il mondo intero all'inizio — preparare solo ciò che è visibile
      e adiacente. Il resto si sviluppa quando serve. Il mondo cresce con i PG.
    esempi:
      - "Sly Flourish — Spiral Campaign Development (il metodo)"
      - "West Marches — Ben Robbins (il mondo si rivela con l'esplorazione)"
      - "Sandbox D&D classico — solo la mappa locale è dettagliata"
      - "Breath of the Wild — Zelda (il mondo si rivela dall'altopiano iniziale)"
    uso_dnd: >
      Sessione 1: il villaggio e 3 location adiacenti. Sessione 2-3: si rivela
      una regione più ampia. Sessione 5+: il continente ha forma. Non serve una
      mappa del mondo prima di giocare — serve un villaggio, un problema, e tre
      direzioni possibili. Il DM prepara "il prossimo anello" della spirale
      tra una sessione e l'altra.
    rischio: >
      Se il DM non tiene traccia di ciò che ha già stabilito, il mondo diventa
      incoerente. Tenere un documento "Verità Stabilite" aggiornato sessione
      per sessione. Tutto ciò che i PG hanno VISTO è canonico.
    usato_in: [La Cerca, Il Viaggio dell'Esilio]
    vedi_anche: [Plot Concatenati, L'Orologio del Villain, Bella Idea]
    nome_en: Reconnaissance / Look Don't Touch / Stakeout
    nomi_alt: [Stakeout, Recon Mission, Look Don't Touch, L'Appostamento, Pedinamento]
    descrizione: >
      I PG devono osservare, spiare, o raccogliere informazioni su un bersaglio
      SENZA farsi scoprire e SENZA intervenire. La tensione nasce dal vincolo:
      vedono qualcosa di ingiusto/pericoloso ma non possono agire, pena il
      fallimento della missione. Ogni errore rischia di compromettere l'intera
      operazione.
    esempi:
      - "Qualsiasi film di spionaggio — la fase di sorveglianza prima del colpo"
      - "Rear Window — Hitchcock (osservare un crimine senza poter intervenire)"
      - "The Wire — serie TV (intercettazioni, appostamenti, pazienza)"
      - "Metal Gear Solid — videogioco (stealth puro, osservare i pattern)"
      - "Tinker Tailor Soldier Spy — Le Carré (intelligence passiva)"
    uso_dnd: >
      I PG devono sorvegliare un NPC sospetto per 3 giorni, annotare i suoi
      contatti, scoprire dove va di notte. Se vengono scoperti, il bersaglio
      fugge e l'intera operazione fallisce. Meccaniche: Furtività, Percezione,
      Inganno (per giustificare la propria presenza). Inserire momenti di
      tensione: il bersaglio si volta, un passante li riconosce, il bersaglio
      fa qualcosa di orribile e i PG devono trattenersi.
    rischio: >
      Se è solo "tiri Furtività ogni ora", è noioso. Dare scelte: il bersaglio
      sta per uccidere qualcuno, intervenite (rompendo la copertura) o lasciate
      accadere? Un PG viene riconosciuto, cosa inventa? La missione si
      complica e i vincoli si stringono.
    usato_in: [Il Mistero, L'Infiltrazione, L'Indagine sulla Cospirazione]
    vedi_anche: [L'Infiltrazione, Il Mistero, Il Piano Non Detto, La Sorveglianza]


  - tipo: tecnica
    nome: La Sorveglianza (Osservare senza Agire)
    nome_en: Stakeout / Recon / Look Don't Touch
    nomi_alt: [Stakeout, Recon Phase, Look Don't Touch, Osservazione Passiva, Intelligence Gathering]
    descrizione: >
      I PG devono osservare un bersaglio (luogo, NPC, evento) senza farsi
      notare e senza agire. Raccolgono informazioni per un'azione futura:
      le ronde delle guardie, le abitudini del bersaglio, i punti deboli
      della fortezza. La tensione è nella pazienza e nel rischio di essere
      scoperti. È la fase preparatoria di un'Infiltrazione o di un Colpo.
    esempi:
      - "Qualsiasi film di spionaggio — la fase di sorveglianza prima del colpo"
      - "Ocean's Eleven — film (studiare il casinò per settimane)"
      - "Stakeout — poliziesco classico (appostamento noioso ma necessario)"
      - "The Wire — serie (intercettazioni e osservazione)"
      - "Metal Gear Solid — videogioco (fase stealth = osservare le pattern)"
    uso_dnd: >
      I PG devono osservare prima di agire: contare le guardie, mappare le
      ronde, identificare i punti deboli. Meccanica: tiri Percezione/
      Stealth a intervalli. Ogni successo dà un'informazione utile. Ogni
      fallimento rischia di allertare il bersaglio. La sorveglianza PREMIA
      la pazienza: chi la fa bene ha vantaggio nell'infiltrazione successiva.
    rischio: >
      Se diventa solo una serie di tiri senza narrazione, è noioso. Dare
      eventi durante l'osservazione: un imprevisto che quasi li scopre, un
      dettaglio inaspettato, un'opportunità fugace.
    usato_in: [L'Infiltrazione, Il Mistero, Il Piano Non Detto]
    vedi_anche: [L'Infiltrazione, Il Mistero, Il Piano Non Detto, La Sorveglianza]

  - tipo: tecnica
    nome: L'Addestramento (Il Montage)
    nome_en: Training Montage / Preparation Sequence
    nomi_alt: [Training Montage, Preparation Arc, Leveling Up, Il Potenziamento, Time Skip Training]
    descrizione: >
      Una sequenza compressa nel tempo in cui i PG (o un NPC) si preparano per
      una sfida futura: allenamento con un maestro, studio di un tomo, forgiatura
      di un'arma, costruzione di difese. Il tempo passa veloce, la narrazione
      mostra solo i momenti salienti. Il risultato è un bonus meccanico o
      narrativo per la sfida che segue.
    esempi:
      - "Rocky — film (il montage di allenamento più iconico)"
      - "Star Wars — Luke si allena con Yoda su Dagobah"
      - "Kill Bill — film (l'addestramento col maestro Pai Mei)"
      - "Mulan — film Disney (il montage dell'esercito)"
      - "Karate Kid — film (wax on, wax off)"
      - "Avatar — Aang impara i 4 elementi (arco di addestramento)"
    uso_dnd: >
      Tra un modulo e l'altro, i PG hanno tempo per prepararsi. Gestire come
      una scena narrativa breve: il DM chiede "come ti prepari?" e il PG
      descrive. Meccanicamente: vantaggio al primo tiro rilevante, competenza
      temporanea in un tool, ispirazione. Oppure: il montage È il modulo (i PG
      addestrano un villaggio a difendersi). Ogni scelta di addestramento
      determina cosa saranno pronti ad affrontare.
    rischio: >
      Se è solo "passa il tempo, hai +1", non ha peso narrativo. Dare una
      scelta: puoi allenarti nella spada O studiare il rituale, ma non entrambi.
      Il tempo è limitato e le priorità contano.
    usato_in: [Sconfiggere il Mostro, L'Assedio, La Radunata]
    vedi_anche: [La Radunata, Il Pacing, La Pausa, Il Mentore]


  - tipo: tecnica
    nome: Il Terreno come Arma (La Mappa Tattica)
    nome_en: Terrain as Weapon / Environmental Hazards
    nomi_alt: [Environmental Hazards, Tactical Terrain, La Mappa Tattica, Battlefield Control, Dynamic Battlefield]
    descrizione: >
      L'ambiente non è solo lo sfondo del combattimento: è un'arma attiva che
      entrambe le parti possono sfruttare. Coperture, dislivelli, terreno
      difficile, pericoli ambientali (lava, acqua, crolli) trasformano uno
      scontro piatto in un puzzle tattico. Chi controlla il terreno controlla
      il combattimento.
    esempi:
      - "Obi-Wan ha l'high ground — Star Wars ('It's over, Anakin!')"
      - "Il ponte di Khazad-dûm — Il Signore degli Anelli (chokepoint tattico)"
      - "Il Fosso di Helm — Il Signore degli Anelli (difesa su terreno favorevole)"
      - "John Wick — film (usa ogni elemento dell'ambiente come arma)"
      - "Dark Souls — videogioco (ogni boss arena ha pericoli ambientali)"
      - "XCOM — videogioco (coperture, altezze, distruttibilità)"
    uso_dnd: >
      Ogni mappa di combattimento deve avere almeno 3 elementi interattivi:
      copertura (mezza/totale), terreno difficile, dislivello, pericolo
      ambientale (fuoco, acqua profonda, ghiaccio), oggetti distruttibili o
      spostabili. I nemici USANO il terreno (arcieri in alto, bruti che spingono
      nel burrone). I PG creativi possono ribaltare il terreno a loro vantaggio.
    rischio: >
      Se il terreno è troppo complesso, rallenta il combattimento. 3-4 elementi
      interattivi bastano. Se il terreno è troppo letale (lava ovunque), i PG
      non si muovono. Bilanciare: il terreno offre sia rischio che opportunità.
    usato_in: [L'Assedio, L'Imboscata, Sconfiggere il Mostro]
    vedi_anche: [L'Imboscata, La Caccia, Il Pacing, Le Location Fantastiche]

  - tipo: tecnica
    nome: Il Flashback (La Rivelazione del Passato)
    nome_en: Flashback / Diegetic Retrospection
    nomi_alt: [Flashback, Analepsi, Reveal Through Memory, La Scena del Passato, Retrospezione Diegetica]
    descrizione: >
      Informazioni sul passato vengono rivelate ai PG durante il gioco. A
      differenza del cinema (dove il flashback è una convenzione: lo spettatore
      vede), nel GDR non esiste uno spettatore esterno — i giocatori SONO i
      personaggi. Quindi il flashback deve sempre avere una giustificazione
      diegetica: un motivo nel mondo di gioco per cui i PG ottengono quelle
      informazioni. Senza giustificazione è una cutscene che rompe l'immersione.
    esempi:
      - "Legend Lore / Speak with Dead — D&D (incantesimi che rivelano il passato)"
      - "Il Pensatoio — Harry Potter (artefatto che permette di vivere i ricordi altrui)"
      - "Assassin's Creed — videogioco (l'Animus giustifica il rivivere il passato)"
      - "Blades in the Dark — GDR (flashback come meccanica: 'l'avevo già preparato')"
      - "Diario/lettera del morto — qualsiasi mystery (il documento come veicolo)"
      - "La Forza mostra visioni — Star Wars (Rey tocca la spada di Luke e vede il passato)"
    uso_dnd: >
      Veicoli diegetici per rivelare il passato: (1) racconto di un NPC
      testimone; (2) diario, lettera, iscrizione trovata; (3) incantesimo
      (Legend Lore, Speak with Dead, Commune, Scrying su oggetto); (4)
      artefatto che mostra visioni (specchio, pozzo, cristallo); (5) sogno
      mandato da un dio o patrono; (6) memoria propria del PG (concordata
      col giocatore). Player-driven (stile Blades): il PG spende Ispirazione
      e dichiara "avevo già preparato questo" — si gioca la scena retroattiva.
    rischio: >
      Se il DM fa una "cutscene" dove i PG vedono cose senza giustificazione
      ("vedete il villain 100 anni fa..."), rompe l'immersione — perché lo
      sanno? Ogni flashback deve rispondere alla domanda: "attraverso quale
      mezzo il PG ottiene questa informazione?". Max 1 per sessione.
    usato_in: [Il Mistero, La Tentazione, L'Indagine sulla Cospirazione]
    vedi_anche: [In Medias Res, Il Presagio, Il Narratore Inaffidabile, Il Flash Forward, La Rivelazione Ambientale]

  - tipo: tecnica
    nome: Il Flash Forward (L'Anticipazione del Futuro)
    nome_en: Flash Forward / Prolepsis / Diegetic Foresight
    nomi_alt: [Flash Forward, Prolepsi, Vision of Things to Come, L'Anticipo, Visione Profetica]
    descrizione: >
      Informazioni sul futuro vengono mostrate ai PG. Come per il Flashback,
      in un GDR non esiste lo "spettatore" separato — i giocatori sono gli
      attori. Quindi il flash forward deve avere una giustificazione diegetica:
      un motivo nel mondo per cui i PG VEDONO il futuro. Non basta che il DM
      dica "vedete cosa accadrà" — serve un veicolo: visione divina, sogno
      profetico, artefatto di divinazione, effetto di un incantesimo,
      allucinazione indotta. Il futuro visto può essere immutabile (destino)
      o evitabile (ammonimento).
    esempi:
      - "Il Pensatoio di Silente / la Profezia — Harry Potter (artefatto + oracolo)"
      - "A Christmas Carol — Dickens (lo Spirito del Natale Futuro è il veicolo)"
      - "Final Destination — film (la visione è il trigger soprannaturale)"
      - "La Forza mostra il futuro — Star Wars (Luke vede gli amici soffrire su Bespin)"
      - "Divination — D&D (incantesimo che fornisce profezia criptica)"
      - "Augury / Commune — D&D (risposte sì/no sul futuro prossimo)"
    uso_dnd: >
      Veicoli diegetici per mostrare il futuro: (1) sogno mandato da un dio/
      patrono (il PG si sveglia con la visione); (2) artefatto di divinazione
      (specchio, pozza, sfera di cristallo — il PG guarda dentro); (3)
      incantesimo (Divination, Commune, Augury — con limiti meccanici);
      (4) NPC oracolo/veggente che descrive ciò che ha visto; (5) luogo
      sacro dove il velo del tempo è sottile (il PG ha una visione entrando).
      Il futuro mostrato deve essere azionabile: i PG possono agire per
      evitarlo o prepararsi.
    rischio: >
      Se il futuro mostrato è troppo specifico e immutabile, è railroad. Se
      il DM mostra il futuro senza veicolo diegetico ("vedete il villain che
      vince tra 3 giorni"), rompe l'immersione — perché lo vedono? Inoltre:
      se i PG vedono il futuro e poi esso cambia senza motivo, perdono
      fiducia nel DM. Il futuro mostrato deve essere coerente con le azioni
      successive.
    usato_in: [La Corsa Contro il Tempo, La Profezia, Il Mistero]
    vedi_anche: [Il Flashback, La Profezia, Il Presagio, La Profezia Autoavverante, L'Ironia Drammatica]

  - tipo: tecnica
    nome: Il Cliffhanger (La Sospensione)
    nome_en: Cliffhanger / End-of-Session Hook
    nomi_alt: [Cliffhanger, Session Ender, La Sospensione, End on a Bang, To Be Continued]
    descrizione: >
      Interrompere la sessione (o il modulo) nel momento di massima tensione:
      il villain appare, la porta si apre su qualcosa di terribile, un alleato
      cade, una rivelazione cambia tutto. I giocatori restano col fiato sospeso
      fino alla prossima sessione. È la tecnica seriale per eccellenza.
    esempi:
      - "Ogni finale di episodio di serie TV ('previously on...')"
      - "The Empire Strikes Back — 'I am your father' (fine del secondo atto)"
      - "Game of Thrones — Red Wedding (chiude l'episodio sullo shock)"
      - "Breaking Bad — ogni metà stagione finisce su un cliffhanger"
      - "1001 Notti — Sheherazade interrompe al momento chiave"
    uso_dnd: >
      Pianificare il finale della sessione: quando il timer reale dice "mancano
      15 minuti", accelerare verso un momento di rottura. Tipi efficaci: (1) il
      nemico appare per la prima volta, (2) un alleato fa qualcosa di inaspettato,
      (3) una porta/scatola/lettera viene aperta ma non letta, (4) "Roll
      initiative" → e ci vediamo la prossima settimana.
    rischio: >
      Se ogni sessione finisce su un cliffhanger, perde effetto. Alternare:
      sessioni che chiudono un arco (soddisfazione) con sessioni che aprono
      (tensione). Non lasciare un cliffhanger irrisolto per troppe sessioni.
    usato_in: [Il Pacing, Plot Concatenati, La Campagna a Spirale]
    vedi_anche: [Il Pacing, In Medias Res, L'Ora più Buia, Il Colpo di Scena]

  - tipo: tecnica
    nome: Il Red Herring (La Falsa Pista)
    nome_en: Red Herring / False Lead / Misdirection
    nomi_alt: [Red Herring, False Lead, La Pista Sbagliata, Misdirection, Il Depistaggio]
    descrizione: >
      Un indizio, un NPC, o un'intera sotto-trama deliberatamente piazzati per
      deviare l'attenzione dalla verità. Il red herring fa sembrare colpevole
      l'innocente, importante l'irrilevante, o pericoloso l'innocuo. È lo
      strumento fondamentale del mystery: senza false piste, l'indagine è
      troppo lineare. Deve essere plausibile (altrimenti non inganna) ma
      distinguibile a posteriori (altrimenti è barare).
    esempi:
      - "Il Professore Piton — Harry Potter (sembra il cattivo in ogni libro, non lo è mai)"
      - "Ogni episodio di Scooby-Doo (il primo sospettato non è mai il colpevole)"
      - "Il marito geloso — qualsiasi giallo (sospetto ovvio che devia dall'assassino vero)"
      - "La valigetta in Pulp Fiction — film (sembra importante, non lo è)"
      - "Sirius Black — Harry Potter e il Prigioniero (sembra il traditore)"
      - "Le aringhe rosse letterali — origine del termine (usate per confondere i cani da caccia)"
    uso_dnd: >
      In un'indagine: piazzare 1-2 NPC che sembrano colpevoli (hanno movente,
      opportunità, e si comportano in modo sospetto) ma non lo sono. Le prove
      contro di loro devono essere spiegabili innocentemente se i PG scavano
      più a fondo. Regola: per ogni red herring, fornire almeno 1 indizio che
      lo scagiona E almeno 1 indizio che punta al vero colpevole. Il red herring
      non deve essere un vicolo cieco totale — i PG devono poterne uscire.
    rischio: >
      Se ci sono troppe false piste, i PG si perdono e si frustrano. Se il red
      herring è troppo convincente e non smontabile, i PG puniscono un innocente
      (che può essere un twist intenzionale). Max 1-2 red herring per mistero.
      Usare la Three Clue Rule: 3 indizi verso il vero colpevole compensano
      le false piste.
    usato_in: [Il Mistero, L'Indagine sulla Cospirazione, Il Colpo di Scena]
    vedi_anche: [Il Mistero, Il Falso Antagonista, La Three Clue Rule, Il Narratore Inaffidabile]

  - tipo: tecnica
    nome: La Rivelazione Ambientale (Lo Show Don't Tell)
    nome_en: Environmental Storytelling / Show Don't Tell
    nomi_alt: [Environmental Storytelling, Show Don't Tell, Narrazione Ambientale, Visual Storytelling, Il Dettaglio Parlante]
    descrizione: >
      La storia viene raccontata attraverso dettagli dell'ambiente — non
      attraverso dialoghi o esposizione. Un cadavere con le mani artigliate
      verso la porta racconta una storia. Un villaggio vuoto con i piatti
      ancora a tavola racconta un'altra. Scheletri incatenati, graffiti sul
      muro, oggetti fuori posto, segni di lotta — tutto comunica COSA È
      SUCCESSO senza che nessuno lo dica esplicitamente. I giocatori devono
      ricostruire.
    esempi:
      - "Dark Souls — ogni area racconta la sua storia attraverso posizionamento oggetti e cadaveri"
      - "Fallout — i terminali e gli scheletri raccontano le ultime ore"
      - "Gone Home — videogioco (tutta la storia è nell'ambiente)"
      - "Bioshock — i diari audio + l'ambiente degradato di Rapture"
      - "Alien — film (la scena del facehugger morto e il buco nell'armatura)"
      - "Pompeii — storia reale (i corpi congelati nel tempo raccontano l'ultimo istante)"
    uso_dnd: >
      Invece di far dire a un NPC "qui è successo X", MOSTRARE: descrivere
      la stanza con dettagli che i giocatori interpretano. "Il tavolo è
      rovesciato. Tre sedie sono ancora in piedi, una è in frantumi. Sul muro
      c'è una macchia scura all'altezza di una persona. La porta è stata
      sbarrata DALL'INTERNO." I PG deducono cosa è successo. Più coinvolgente
      dell'esposizione e premia l'attenzione. Combinare con tiri Investigazione/
      Percezione per dettagli aggiuntivi.
    rischio: >
      Se i dettagli sono troppo criptici, i PG non capiscono e chiedono "ok
      ma cosa è successo?". Bilanciare: i dettagli ovvi raccontano il cosa,
      quelli sottili il perché. Se i PG non colgono, un tiro abilità può
      fornire l'interpretazione ("con un 15+ in Investigazione, deduci che...").
    usato_in: [Il Mistero, Viaggio e Ritorno, La Cerca]
    vedi_anche: [Il Registro dell'Apocalisse, Il Fucile di Čechov, Il Presagio, I Segreti Flottanti]

  - tipo: tecnica
    nome: L'Escalation (Il Crescendo della Posta)
    nome_en: Escalation / Raising the Stakes / Power Creep Narrativo
    nomi_alt: [Raising the Stakes, Escalation, Il Crescendo, Power Creep Narrativo, Upping the Ante]
    descrizione: >
      Ogni modulo/arco alza la posta rispetto al precedente. Le minacce sono
      più grandi, le perdite più pesanti, le scelte più costose. Non è solo
      "nemici più forti" (quello è power creep meccanico) — è la posta
      NARRATIVA che cresce: prima rischi la vita, poi rischi gli amici, poi
      rischi il mondo. L'escalation dà direzione alla campagna e impedisce
      che i moduli sembrino scollegati.
    esempi:
      - "Harry Potter — saga (da 'salva la pietra' a 'salva il mondo magico')"
      - "MCU — da 'salva un quartiere' a 'salva l'universo' (Fase 1→3)"
      - "Breaking Bad — da 'pagare le cure' a 'impero criminale' (la posta sale ogni stagione)"
      - "Il Signore degli Anelli — da 'lascia la Contea' a 'il destino del mondo'"
      - "D&D livelli 1→20 — la scala naturale della campagna"
    uso_dnd: >
      Pianificare la posta per arco: Arco 1 (lv1-4) = minaccia locale
      (villaggio, gilda); Arco 2 (lv5-10) = minaccia regionale (regno,
      fazione); Arco 3 (lv11-16) = minaccia continentale; Arco 4 (lv17-20)
      = minaccia cosmica/mondiale. Ogni arco deve anche alzare la posta
      EMOTIVA: prima sono in pericolo gli NPC secondari, poi i companion amati,
      poi i PG stessi, poi tutto ciò che amano.
    rischio: >
      Se la posta sale troppo in fretta, non c'è spazio per crescere (inflation).
      Se ogni modulo è "il mondo sta finendo", niente è speciale. Regola:
      la posta personale (Il Legame) pesa più della posta cosmica. Un NPC
      amato in pericolo è più potente di "il continente è minacciato".
    puo_aver_bisogno_di: [Il Legame, Il Pacing]
    usato_in: [Sconfiggere il Mostro, La Cerca, La Vendetta]
    vedi_anche: [Il Pacing, Il Legame, La Costruzione dell'Odio, La Campagna a Spirale]

  - tipo: tecnica
    nome: La Callback (Il Richiamo)
    nome_en: Callback / Payoff / Bookend
    nomi_alt: [Callback, Payoff, Bookend, Il Richiamo, Il Ritorno del Motivo]
    descrizione: >
      Un elemento introdotto nei primi moduli (una frase, un oggetto, un NPC,
      un luogo) ritorna nel finale con un significato nuovo o amplificato.
      A differenza del Fucile di Čechov (che è un setup intenzionale per un
      payoff meccanico), la callback è emotiva: il ritorno dell'elemento dà
      CHIUSURA e connette l'inizio alla fine. Fa sentire la storia come un
      cerchio, non una linea.
    esempi:
      - "'I am Iron Man' — MCU (prima e ultima frase di Tony)"
      - "La Contea alla fine — Il Signore degli Anelli (tornare dove tutto è iniziato, cambiati)"
      - "'After all this time?' 'Always.' — Harry Potter (la callback di Snape)"
      - "Il tema musicale del primo episodio che torna nel finale — qualsiasi serie"
      - "'Non sono in pericolo. IO sono il pericolo.' — Breaking Bad (callback della paura iniziale)"
    uso_dnd: >
      Nel modulo finale, riprendere deliberatamente un elemento del modulo 1:
      la taverna dove tutto è iniziato, la frase dell'NPC che li ha mandati
      in missione, l'oggetto insignificante del primo incontro. Ora ha peso
      nuovo. Tecniche: (1) stessa location, situazione diversa; (2) stessa
      frase detta da persona diversa o con significato diverso; (3) l'oggetto
      del primo modulo diventa la chiave dell'ultimo. Pianificare a inizio
      campagna: annotare 2-3 elementi che torneranno.
    rischio: >
      Se forzata, la callback è kitsch. Se i giocatori non ricordano
      l'elemento originale, cade nel vuoto. Usare solo per elementi che i
      giocatori hanno NOTATO e apprezzato. Se necessario, ricordarglielo
      in modo naturale ("questo posto vi sembra familiare...").
    puo_aver_bisogno_di: [Il Fucile di Čechov]
    usato_in: [La Cerca, Sconfiggere il Mostro, Rinascita]
    vedi_anche: [Il Fucile di Čechov, Il Legame, Il Debriefing, La Campagna a Spirale]

  - tipo: tecnica
    nome: La Scelta Significativa (Le Conseguenze Permanenti)
    nome_en: Meaningful Choice / Consequences Matter / Player Agency
    nomi_alt: [Meaningful Choice, Player Agency, Conseguenze Permanenti, Choices Matter, No Take-Backs]
    descrizione: >
      Ogni scelta dei PG deve produrre conseguenze VISIBILI e PERMANENTI nel
      mondo. Se i PG scelgono di salvare il villaggio A e abbandonare il
      villaggio B, il villaggio B è distrutto — per sempre. Il mondo reagisce.
      Le scelte non sono test con risposta giusta: sono bivi reali dove ogni
      direzione ha un prezzo. Questo principio è ciò che distingue il GDR
      dalla narrativa passiva: i giocatori INFLUENZANO la storia.
    esempi:
      - "The Witcher 3 — videogioco (le scelte cambiano regioni intere, NPC vivono o muoiono)"
      - "Mass Effect — saga (le scelte del primo gioco influenzano il terzo)"
      - "Telltale Games — 'X will remember that' (le relazioni cambiano)"
      - "Baldur's Gate 3 — le quest hanno esiti multipli permanenti"
      - "Game of Thrones — serie (ogni scelta ha conseguenze brutali e permanenti)"
    uso_dnd: >
      Regole per il DM: (1) Mai invalidare una scelta dei PG — se hanno scelto
      di lasciar morire un NPC, l'NPC è morto; (2) Mostrare le conseguenze —
      nel modulo successivo il mondo è DIVERSO in base alla scelta; (3) Non
      giudicare — non c'è scelta "sbagliata", solo scelte con prezzi diversi;
      (4) Foreshadow le conseguenze — prima della scelta, far capire ai PG
      cosa è in gioco ("se andate a nord, il villaggio sud sarà indifeso").
      Le conseguenze migliori sono quelle che i PG scoprono 2-3 moduli dopo.
    rischio: >
      Se le conseguenze sono troppo punitive, i PG smettono di scegliere (paralisi).
      Se le conseguenze sono invisibili, le scelte non contano. Bilanciare:
      ogni scelta ha un costo E un beneficio. I PG devono sentire che hanno
      GUADAGNATO qualcosa dalla scelta, anche se hanno perso altro.
    usato_in: [Spalle al Muro, Tragedia, La Morale Grigia]
    vedi_anche: [Il Dilemma del Carrello, La Scelta Retroattiva, Il Dilemma del Tram, Il Contatore]


  - tipo: situazione
    nome: Lo Scambio (La Trattativa Rischiosa)
    nome_en: The Exchange / Hostage Trade / The Drop
    nomi_alt: [The Exchange, Hostage Trade, The Drop, Lo Scambio di Ostaggi, La Consegna Simultanea]
    descrizione: >
      I PG devono consegnare qualcosa (oggetto, prigioniero, informazione)
      per ottenere qualcosa in cambio (ostaggio, artefatto, salvacondotto).
      Lo scambio avviene in un luogo concordato, con regole stabilite —
      ma entrambe le parti pianificano il doppio gioco. La tensione è nel
      momento dello scambio: chi sgancia per primo? L'altra parte rispetterà
      il patto? C'è un tiratore appostato?
    esempi:
      - "Lo scambio sul ponte — qualsiasi film di spionaggio della Guerra Fredda"
      - "Il drop — Breaking Bad (scambio droga/denaro con tensione massima)"
      - "Lo scambio ostaggi — Die Hard (il villain chiede qualcosa in cambio)"
      - "Il mercato nero — qualsiasi noir (lo scambio in vicolo)"
      - "Jabba's Palace — Star Wars (Han in cambio di... niente, era una trappola)"
      - "Il Ponte delle Spie — film (scambio prigionieri USA/URSS)"
    uso_dnd: >
      I PG devono scambiare un prigioniero/oggetto con il villain per riavere
      un alleato/artefatto. Struttura: (1) negoziazione delle condizioni
      (luogo, regole, garanzie); (2) preparazione (piano B, tiratori, vie di
      fuga); (3) lo scambio — momento di tensione massima; (4) inevitabile
      complicazione (tradimento, terzi incomodi, oggetto falso). I PG
      possono essere quelli che tradiscono O quelli traditi.
    rischio: >
      Se lo scambio va liscio, non c'è storia. Prevedere SEMPRE una
      complicazione — ma non sempre il tradimento del villain (diventa
      prevedibile). Varianti: terzi che interrompono, l'ostaggio fugge da
      solo, l'oggetto è un falso, le autorità intervengono.
    usato_in: [Lo Stallo, Il Mistero, L'Alleanza col Nemico]
    vedi_anche: [Lo Stallo, Il Dilemma del Prigioniero, L'Alleanza col Nemico, La Corsa Contro il Tempo]

  - tipo: situazione
    nome: L'Ultimatum (La Richiesta Non Negoziabile)
    nome_en: The Ultimatum / Villain's Demand / Comply or Die
    nomi_alt: [The Ultimatum, Villain's Demand, La Minaccia Condizionata, Comply or Else, Il Ricatto del Villain]
    descrizione: >
      Il villain (o una forza superiore) pone condizioni: "fate X entro Y
      oppure Z accadrà". Le condizioni sono inaccettabili, il tempo è poco,
      e Z è devastante. I PG devono scegliere: obbedire (tradendo i propri
      principi), rifiutare (subendo Z), o trovare una terza via (neutralizzare
      la minaccia prima della scadenza). L'ultimatum forza l'azione e
      comprime i tempi.
    esempi:
      - "Consegnate l'Anello o Minas Tirith brucerà — Il Signore degli Anelli (implicito)"
      - "'Bring me the head of the Batman' — The Dark Knight"
      - "Thanos: 'la gemma o la testa del fratello' — Infinity War"
      - "Il countdown della bomba nucleare — 24 / qualsiasi action"
      - "'Arrenditi o distruggo il villaggio' — D&D classico"
      - "Surrender Dorothy — Il Mago di Oz"
    uso_dnd: >
      Il villain manda un messaggero con le condizioni: "consegnate l'artefatto
      entro 3 giorni o distruggo il ponte che collega i due regni". I PG
      hanno 3 opzioni strutturali: (1) obbedire (con twist — il villain
      non mantiene la parola); (2) rifiutare e prepararsi a Z; (3) usare
      il tempo per neutralizzare la minaccia (trovare il villain, disattivare
      la bomba, evacuare il bersaglio). L'opzione 3 è la più D&D.
    rischio: >
      Se Z non è credibile, l'ultimatum è vuoto. Se Z è inevitabile qualunque
      cosa facciano i PG, è railroad. Z deve essere evitabile MA solo con
      azione decisa entro il tempo dato. Se i PG ignorano l'ultimatum,
      Z DEVE accadere — altrimenti il mondo perde peso.
    puo_aver_bisogno_di: [Il Legame (luogo), La Costruzione dell'Odio]
    usato_in: [La Corsa Contro il Tempo, Sconfiggere il Mostro, Spalle al Muro]
    vedi_anche: [La Corsa Contro il Tempo, Spalle al Muro, Lo Scambio, Il Contatore]

  - tipo: situazione
    nome: La Consegna (Il Corriere)
    nome_en: The Delivery / Courier Run / Escort the Package
    nomi_alt: [Courier Run, The Delivery, Escort the Package, Il Corriere, La Spedizione Pericolosa]
    descrizione: >
      I PG devono trasportare un oggetto prezioso/pericoloso/fragile da un
      punto A a un punto B, attraverso territorio ostile. A differenza della
      Scorta (proteggere una persona), qui l'obiettivo è un OGGETTO — e
      l'oggetto può avere proprietà che complicano il trasporto (è fragile,
      è maledetto, attira mostri, ha una scadenza, è illegale). Il conflitto
      viene dalla strada, non dalla destinazione.
    esempi:
      - "Portare l'Anello a Mordor — Il Signore degli Anelli (la consegna definitiva)"
      - "Trasportare nitroglicerina — Il Salario della Paura (oggetto fragile e mortale)"
      - "Portare i piani alla base ribelle — Star Wars (corriere spaziale)"
      - "Consegnare il pacco — qualsiasi quest FedEx di videogioco"
      - "Mad Max: Fury Road — film (la cisterna d'acqua attraverso il deserto)"
      - "Il Corriere — Fallout New Vegas (il gioco inizia con una consegna fallita)"
    uso_dnd: >
      I PG devono portare X da A a B. Complicazioni lungo la strada: (1) il
      percorso è pericoloso (mostri, banditi, ambiente ostile); (2) qualcuno
      li insegue per rubare X; (3) X stesso è problematico (emette luce,
      attira non-morti, parla, pesa troppo); (4) il tempo stringe (la pozione
      scade, il rituale ha una finestra). Ogni modulo è una tappa del viaggio
      con il suo ostacolo specifico.
    rischio: >
      Se è solo "camminate e combattete random encounter", è noioso. Ogni
      tappa deve avere una SCELTA (via sicura ma lunga vs scorciatoia
      pericolosa) e un dilemma (aiutare il villaggio rallenta, ignorarlo
      pesa sulla coscienza).
    usato_in: [La Cerca, La Corsa Contro il Tempo, La Scorta]
    vedi_anche: [La Scorta, La Cerca, La Corsa Contro il Tempo, La Pergamena, L'Artefatto]

  - tipo: situazione
    nome: Il Porto Sicuro (Il Falso Rifugio)
    nome_en: Safe Haven / The Sanctuary That Isn't
    nomi_alt: [False Sanctuary, Il Rifugio Insicuro, Trojan Sanctuary, La Tana del Lupo, Safe House Compromised]
    sottocaso_di: Il Falso Rifugio
    descrizione: >
      I PG trovano (o vengono indirizzati verso) un luogo apparentemente
      sicuro — una taverna accogliente, un monastero ospitale, un campo
      alleato, una città neutrale. Ma il rifugio nasconde un pericolo:
      è una trappola del villain, è controllato dal nemico, gli abitanti
      hanno secondi fini, o il luogo stesso è maledetto. La sicurezza
      percepita rende il tradimento più efficace.
    esempi:
      - "La locanda di Bree → in realtà sorvegliata dai Nazgûl — Il Signore degli Anelli"
      - "L'Hotel Overlook — Shining (il rifugio È il pericolo)"
      - "Il villaggio ospitale che sacrifica gli stranieri — tropo horror"
      - "La base alleata infiltrata — qualsiasi spy thriller"
      - "Rivendell → sicura davvero — Il Signore degli Anelli (il contrasto funziona perché non tutte le soste sono trappole)"
    uso_dnd: >
      Dopo un modulo intenso, i PG cercano riposo. Trovano un luogo
      apparentemente perfetto. Il DM costruisce la sicurezza (NPC gentili,
      cibo caldo, letti puliti) — poi la rovescia. Funziona meglio se
      NON tutti i rifugi sono falsi: i PG devono poter abbassare la guardia
      a volte, così quando il rifugio è falso li coglie di sorpresa.
    rischio: >
      Se ogni rifugio è una trappola, i PG non si fidano mai e il gioco
      diventa paranoico (a meno che quello non sia il tono voluto). Regola:
      max 1 falso rifugio per avventura. Gli altri rifugi devono essere
      genuini per costruire il contrasto.
    usato_in: [Il Mistero, La Cerca, Viaggio e Ritorno]
    vedi_anche: [Il Falso Rifugio, La Paranoia Indotta, La Festa Interrotta, La Quarantena]

  - tipo: situazione
    nome: La Trappola Evidente (La Bocca del Lupo)
    nome_en: The Obvious Trap / Walking Into the Lion's Den
    nomi_alt: [Obvious Trap, Walking Into Danger, La Bocca del Lupo, It's a Trap!, Knowingly Into Peril]
    descrizione: >
      I PG SANNO che è una trappola — ma devono andarci lo stesso. L'ostaggio
      è lì, il villain li aspetta, è l'unico modo per raggiungere l'obiettivo.
      La tensione non è nella sorpresa (non c'è) ma nella PREPARAZIONE: come
      minimizzare il danno sapendo che il nemico li aspetta? È il contrario
      del twist — qui tutti sanno cosa sta per succedere, e la domanda è
      "come ne usciamo vivi?".
    esempi:
      - "'It's a trap!' — Ammiraglio Ackbar, Star Wars (lo sanno, ci vanno)"
      - "Cloud City — Star Wars (Luke sa che è una trappola di Vader, ci va per salvare gli amici)"
      - "L'invito del villain — qualsiasi Bond (il cattivo invita 007 a cena)"
      - "Helm's Deep — Il Signore degli Anelli (sanno che l'esercito arriva, si preparano)"
      - "John Wick alla Continental — film (sa che lo aspettano)"
    uso_dnd: >
      Il villain invita i PG ("venite alla mia torre, soli, o l'ostaggio muore")
      oppure i PG deducono che il luogo è una trappola ma l'obiettivo è lì.
      La sessione diventa: (1) fase preparazione — i PG pianificano contromisure
      (La Sorveglianza, Il Piano Non Detto); (2) l'ingresso — la trappola
      scatta ma i PG hanno preparativi; (3) l'imprevisto — qualcosa che non
      avevano previsto (perché il villain è furbo quanto loro).
    rischio: >
      Se la trappola è esattamente come previsto e i PG la disinnescano senza
      problemi, è anticlimactico. Se è impossibile nonostante la preparazione,
      è frustrante. L'imprevisto deve essere UNO — non tutto il piano salta.
    puo_aver_bisogno_di: [La Costruzione dell'Odio]
    usato_in: [Sconfiggere il Mostro, La Resa dei Conti, L'Assedio]
    vedi_anche: [L'Assedio, La Sorveglianza, Lo Scambio, Il Piano Non Detto, La Corsa Contro il Tempo]

  - tipo: personaggio
    nome: Il Messaggero (L'Araldo)
    nome_en: The Herald / The Messenger / Harbinger
    nomi_alt: [The Herald, Harbinger, L'Araldo, Il Portatore di Notizie, The Envoy]
    descrizione: >
      Chi porta notizie che cambiano tutto — buone o cattive. Il Messaggero
      non è importante per chi è, ma per ciò che porta. Il suo arrivo segna
      un punto di svolta: la guerra è iniziata, il re è morto, il villain
      ha posto l'ultimatum, i rinforzi arrivano, la cura esiste. In Vogler
      è la "Chiamata all'Avventura" incarnata in una persona. Dopo il suo
      messaggio, nulla può restare com'era.
    esempi:
      - "Gandalf a Bag End — Il Signore degli Anelli (porta la notizia dell'Anello)"
      - "Il corvo di Game of Thrones (il mezzo è il messaggero)"
      - "R2-D2 con il messaggio di Leia — Star Wars"
      - "Il soldato ferito che barcolla nel campo — qualsiasi film di guerra"
      - "Hermes/Mercury — mitologia (il dio messaggero per eccellenza)"
      - "Il cavaliere nero che porta l'ultimatum — D&D classico"
    uso_dnd: >
      Hook di inizio modulo: un NPC arriva con notizie urgenti che lanciano
      l'azione. Il Messaggero può essere: (1) un NPC usa-e-getta (arriva,
      parla, muore/parte); (2) un NPC ricorrente (il corvo, il mercante che
      porta sempre guai); (3) un oggetto (la lettera, il segnale di fumo,
      l'incantesimo Sending). Importante: uccidere il messaggero prima che
      parli è un hook DIVERSO (i PG devono scoprire cosa voleva dire).
    usato_in: [La Cerca, Sconfiggere il Mostro, La Corsa Contro il Tempo]
    vedi_anche: [Il Sopravvissuto, L'Ultimatum, La Pergamena, In Medias Res]

  - tipo: personaggio
    nome: Il Parassita (L'Attaccabottoni)
    nome_en: The Hanger-On / The Leech / Tag-Along
    nomi_alt: [The Leech, Tag-Along, L'Attaccabottoni, The Mooch, Il Sanguisuga]
    descrizione: >
      Un NPC che si attacca ai PG per interesse personale — protezione,
      denaro, fama riflessa, o semplicemente perché non sa dove altro andare.
      Non è un companion (non è utile in combattimento), non è un quest giver
      (non ha autorità), non è un villain (non ha piani malvagi). È un peso
      — ma un peso con personalità, che può diventare fonte di informazioni
      inaspettate, comic relief, o persino eroismo nel momento meno previsto.
    esempi:
      - "Jar Jar Binks — Star Wars (il parassita per eccellenza, controverso)"
      - "Il bardo fastidioso — tropo D&D (segue il party per scrivere la loro storia)"
      - "Gurgi — Le Cronache di Prydain (codardo che si attacca agli eroi)"
      - "Navi — Zelda ('Hey! Listen!' — utile ma insopportabile)"
      - "Il giornalista embedded — qualsiasi film di guerra (segue, non combatte)"
      - "Donkey — Shrek (si attacca a Shrek, non se ne va, alla fine è utile)"
    uso_dnd: >
      Un NPC si unisce al party senza essere invitato. Non combatte (o male),
      consuma risorse, parla troppo, fa rumore durante lo stealth. MA: (1)
      conosce gossip utili; (2) ha accesso a luoghi/persone dove i PG no;
      (3) può sacrificarsi inaspettatamente; (4) i giocatori ci si affezionano.
      Il DM lo usa come valvola di sfogo comica e come sorpresa narrativa
      quando serve.
    rischio: >
      Se è SOLO fastidioso senza utilità, i giocatori lo uccidono o lo
      abbandonano. Deve avere almeno 1 momento utile ogni 2-3 sessioni per
      giustificare la sua presenza. Se diventa troppo amato, è La Promozione.
    usato_in: [Commedia degli Errori, La Cerca, La Scorta]
    vedi_anche: [Il Companion Fedele, L'Alleato Scomodo, Il Trickster, La Promozione]


  - tipo: situazione
    nome: L'Agnizione Genealogica (Il Legame di Sangue)
    nome_en: Genealogical Reveal / Luke I Am Your Father / Blood Ties
    nomi_alt: [I Am Your Father, Blood Ties Reveal, Il Segreto di Famiglia, Genealogical Twist, La Parentela Nascosta]
    sottocaso_di: L'Agnizione
    descrizione: >
      Un legame di sangue nascosto viene rivelato — "sono tuo padre", "siamo
      fratelli", "sei il figlio del villain", "la principessa è tua sorella".
      Il twist non è solo informativo ma RIDEFINISCE tutte le relazioni
      precedenti. Il nemico diventa famiglia, l'alleato diventa parente, il
      passato acquisisce un significato nuovo. È una variante dell'Agnizione
      talmente ricorrente nel genere avventura da costituire un pattern a sé.
    esempi:
      - "'I am your father' — Star Wars (il twist più famoso della storia del cinema)"
      - "Luke e Leia sono fratelli — Star Wars (retroattivo ma funzionale)"
      - "Voldemort e Harry condividono un legame magico-genealogico — Harry Potter"
      - "Jon Snow è un Targaryen — Game of Thrones"
      - "Rapunzel è la principessa perduta — Tangled/Disney"
      - "Darth Revan è il giocatore — Knights of the Old Republic"
    uso_dnd: >
      Un PG (concordato col giocatore!) o un NPC scopre di essere parente del
      villain, del re, del mentore, o di un altro PG. La rivelazione deve:
      (1) essere stata seminata con presagi (somiglianze, oggetti di famiglia,
      lacune nel passato); (2) cambiare qualcosa meccanicamente (il villain
      non può più essere ucciso senza conseguenze morali, l'NPC acquisisce
      diritti di successione); (3) creare un dilemma (il sangue implica un
      dovere?). Funziona meglio se il legame è col VILLAIN — trasforma lo
      scontro in dilemma morale.
    rischio: >
      Se non è seminato è un deus ex machina. Se non cambia nulla ("sei mio
      figlio" → "ok, ti uccido lo stesso") è irrilevante. Il twist deve
      RENDERE IMPOSSIBILE la soluzione semplice (non puoi più solo uccidere
      il villain — è tuo padre).
    puo_aver_bisogno_di: [Il Presagio, Il Legame (affezione)]
    usato_in: [Il Colpo di Scena, Sconfiggere il Mostro, Tragedia]
    vedi_anche: [L'Agnizione, Lo Specchio, Il Colpo di Scena, La Nemesi]


  - tipo: situazione
    nome: La Vittoria per Grazia (L'Eucatastrophe)
    nome_en: Eucatastrophe / Victory by Grace / Virtue Rewarded
    nomi_alt: [Eucatastrophe, Victory by Grace, La Grazia Narrativa, Virtue Pays Off, Il Caso Meritato]
    descrizione: >
      L'eroe fallisce nel momento decisivo, ma una scelta morale precedente
      (pietà, generosità, perdono) crea le condizioni affinché un evento
      apparentemente casuale risolva la quest. Non è un Deus Ex Machina
      perché la causa è rintracciabile (la scelta passata). Non è la Terza
      Via perché l'eroe non la trova consapevolmente. È la grazia narrativa:
      la virtù precedente paga in modo inaspettato.
    esempi:
      - "Gollum cade nel fuoco con l'Anello — LotR (Frodo aveva risparmiato Gollum)"
      - "Il cane randagio sfamato che torna per salvare l'eroe — fiabe classiche"
      - "Dobby salva Harry — HP (Harry lo aveva liberato)"
      - "Han Solo torna a Yavin — SW (Luke lo aveva lasciato andare senza rancori)"
      - "La freccia che manca il bersaglio per un'armatura data in dono — miti"
    uso_dnd: >
      Se i PG hanno mostrato virtù (pietà, generosità, scelta morale costosa),
      il DM può usare quella scelta come via d'uscita quando falliscono al
      climax. Regola: funziona SOLO se la scelta originale era un SACRIFICIO
      REALE (non una banalità). Il collegamento causale deve essere chiaro a
      posteriori. Non usare più di 1 volta per campagna.
    rischio: >
      Se la connessione non è chiara, è un Deus Ex Machina. Se il "caso"
      risolve tutto senza che i PG abbiano fatto nulla di virtuoso prima,
      è barare. La Grazia richiede la Pietà prima.
    puo_aver_bisogno_di: [Il Legame, Il Fucile di Čechov]
    usato_in: [Sconfiggere il Mostro, La Cerca, Rinascita]
    vedi_anche: [La Terza Via, L'Alleato Inaspettato, La Scelta Retroattiva]

  - tipo: situazione
    nome: La Distrazione Eroica (Il Sacrificio Tattico)
    nome_en: Heroic Distraction / Diversionary Sacrifice / Hold the Line
    nomi_alt: [Heroic Distraction, Hold the Line, La Diversione Suicida, Covering Fire, Il Fronte Finto]
    descrizione: >
      Un intero GRUPPO marcia deliberatamente verso la morte per distrarre il
      nemico dal gruppo che compie la vera quest. Non è un sacrificio singolo
      ma un sacrificio COLLETTIVO tattico. Chi si sacrifica affronta il pericolo
      maggiore, chi compie la quest ha il compito più importante ma meno
      spettacolare. La posta è asimmetrica e la tensione doppia.
    esempi:
      - "La marcia sul Cancello Nero — LotR (distrazione per Frodo e Sam)"
      - "Rogue One — Star Wars (la squadra muore per trasmettere i piani)"
      - "La carica di Pickett — Gettysburg (diversione frontale)"
      - "Helm's Deep come diversione da Isengard — LotR (Gandalf porta i Rohirrim)"
    uso_dnd: >
      Climax di campagna: il party si divide in 'esca' e 'operativi'. L'esca
      affronta il boss/esercito apertamente (combat intenso). Gli operativi
      completano l'obiettivo (stealth/puzzle). Alternare scene dei 2 gruppi.
      L'esca non è condannata — può sopravvivere se l'obiettivo è raggiunto
      in tempo (Il Contatore come timer condiviso).
    puo_aver_bisogno_di: [Il Legame (affezione), La Separazione del Gruppo]
    usato_in: [L'Assedio, Sconfiggere il Mostro, La Corsa Contro il Tempo]
    vedi_anche: [Il Sacrificio Volontario, La Separazione del Gruppo, La Corsa Contro il Tempo, La Trappola Evidente]

  - tipo: personaggio
    nome: Il Portatore (Il Veicolo Riluttante)
    nome_en: The Bearer / Ring-Bearer / Reluctant Vessel
    nomi_alt: [Ring-Bearer, The Vessel, Il Corriere Maledetto, Reluctant Carrier, Il Trasportatore]
    descrizione: >
      Un personaggio la cui funzione è TRASPORTARE un oggetto pericoloso fino
      alla destinazione — non usarlo, non combattere con esso, ma resistergli.
      È scelto PERCHÉ è ordinario — la sua semplicità è la sua resistenza.
      È l'anti-eroe per eccellenza: non vince combattendo ma resistendo alla
      corruzione. Gli altri lo proteggono fisicamente, lui resiste spiritualmente.
    esempi:
      - "Frodo — LotR (porta l'Anello, non lo usa, resiste alla corruzione)"
      - "Il Corriere — Fallout New Vegas (porta un oggetto, viene quasi ucciso per esso)"
      - "Bilbo — Lo Hobbit (il 'ladro' scelto per umiltà)"
      - "Il bambino con il messaggio — tropo fiabe/spy (troppo innocente per essere sospettato)"
    uso_dnd: >
      Un PG viene designato portatore di un artefatto maledetto. Non è il
      combattente — è quello che deve resistere (tiri Saggezza, corruzione
      crescente via Contatore). Il party lo protegge, lui protegge il mondo
      dall'oggetto. L'arco è: resistenza → cedimento → possibile redenzione.
      Funziona meglio se il giocatore è d'accordo (concordato in session zero).
    vedi_anche: [L'Eroe Riluttante, L'Anello al Dito, La Consegna, Il Contatore]

  - tipo: tecnica
    nome: Lo Splitting Narrativo (La Campagna Intrecciata)
    nome_en: Structural Party Split / Braided Narrative / Multi-Thread Campaign
    nomi_alt: [Braided Campaign, Multi-Thread, Campagna Intrecciata, Parallel Plotlines, Narrativa a Treccia]
    sottocaso_di: La Separazione del Gruppo
    descrizione: >
      A differenza della Separazione del Gruppo (evento singolo di 1-2 scene),
      lo Splitting Narrativo è una STRUTTURA: il party si divide per un intero
      arco e ogni sotto-party ha la propria quest, tono, e climax. Le linee si
      influenzano a distanza e convergono nel climax finale. È la differenza
      tra "ci siamo separati in una stanza" e "siamo su continenti diversi per
      3 sessioni".
    esempi:
      - "Le Due Torri / Il Ritorno del Re — LotR (3 linee per 2 film)"
      - "Game of Thrones — decine di linee parallele per stagioni intere"
      - "The Wire — serie (linee tematiche parallele che convergono)"
      - "Baldur's Gate 3 Atto 2 — i companion hanno quest separate"
    uso_dnd: >
      Per campagne con 5+ PG: dividere il party per 2-3 sessioni con quest
      parallele. Alternare scene (20-30 min per gruppo). Le azioni di un
      gruppo influenzano le condizioni dell'altro (il Contatore condiviso).
      La riunione al climax è il payoff emotivo. Richiede: motivo diegetico
      forte per la separazione, gestione attenta del tempo al tavolo.
    rischio: >
      Alcuni giocatori restano inattivi troppo a lungo. Regola: mai più di
      30 minuti senza far agire un sotto-gruppo. Se il tavolo ha meno di 5
      PG, lo splitting strutturale è rischioso.
    puo_aver_bisogno_di: [Il Legame (affezione)]
    usato_in: [La Cerca, L'Assedio, Sconfiggere il Mostro]
    vedi_anche: [La Separazione del Gruppo, Plot Concatenati, Il Pacing, La Campagna a Spirale]


  - tipo: plot
    nome: La Picaresca (Il Viaggio del Mascalzone)
    nome_en: Picaresque / Rogue's Journey / Episodic Misadventure
    nomi_alt: [Picaresque, Rogue's Journey, Il Viaggio del Furfante, Episodic Misadventure, Campagna Orizzontale]
    descrizione: >
      Viaggio episodico di un antieroe di bassa estrazione attraverso una
      serie di disavventure senza un grande arco di escalation. Non c'è un
      BBEG da sconfiggere, non c'è un mondo da salvare — c'è un mascalzone
      che cerca di sopravvivere e magari arricchirsi, fallendo ripetutamente
      in modo comico. La struttura è ORIZZONTALE (episodi equivalenti) non
      verticale (escalation). Il tono è satirico: il mondo è assurdo, i
      potenti sono idioti, i deboli sopravvivono con l'astuzia.
    esempi:
      - "L'Armata Brancaleone — Monicelli (il picaresco italiano per eccellenza)"
      - "Don Chisciotte — Cervantes (episodi comici lungo la strada)"
      - "Gil Blas — Lesage (picaresco francese)"
      - "Monkey Island — videogioco (pirata incompetente in avventure episodiche)"
      - "Lazzarillo de Tormes — anonimo (l'archetipo del genere picaresco)"
      - "Discworld / Rincewind — Pratchett (mago incompetente che sopravvive per caso)"
    uso_dnd: >
      Campagna senza BBEG: i PG sono mascalzoni/disperati che viaggiano di
      città in città cercando lavoro, soldi, cibo. Ogni sessione è un episodio
      autoconcluso. Non c'è escalation — il mondo resta uguale, sono i PG che
      (forse) crescono. Tono: comico/satirico. Funziona benissimo per gruppi
      casual o sessioni one-shot collegate.
    rischio: >
      Senza escalation i giocatori possono annoiarsi dopo 5-6 sessioni.
      Inserire un filo conduttore leggero che emerga gradualmente (una
      reputazione che cresce, un nemico ricorrente comico, un obiettivo
      assurdo a lungo termine).
    usato_in: []
    vedi_anche: [Commedia degli Errori, La Cerca, Da Povero a Ricco, Il Branco di Disadattati]

  - tipo: situazione
    nome: La Millanteria (L'Eroe di Cartone)
    nome_en: Miles Gloriosus / The Braggart / Fake Reputation
    nomi_alt: [Miles Gloriosus, The Braggart, Il Fanfarone, Fake Glory, L'Eroe per Finta]
    descrizione: >
      Un personaggio racconta imprese mai compiute e vive di una reputazione
      falsa. La tensione comica (o drammatica) sta nello scarto tra ciò che
      dice di essere e ciò che è davvero — e nella costante minaccia di essere
      smascherato. Può essere un PG (millanta per sopravvivere) o un NPC
      (il "grande eroe" che è un codardo).
    esempi:
      - "Brancaleone — L'Armata Brancaleone (cavaliere autoproclamato, miserabile)"
      - "Capitan Fracassa — commedia dell'arte (il soldato fanfarone)"
      - "Zapp Brannigan — Futurama (generale incompetente con ego enorme)"
      - "Gilderoy Lockhart — Harry Potter (eroe falso che ruba le imprese altrui)"
      - "Sir Robin — Monty Python (il coraggioso Sir Robin che fuggì)"
      - "Il Barone di Münchhausen — letteratura (millanteria elevata ad arte)"
    uso_dnd: >
      Un PG ha una reputazione falsa (millanta imprese nel background). Ogni
      modulo rischia lo smascheramento: qualcuno che c'era davvero, una prova
      che non sa superare, un NPC che lo riconosce. L'arco: o costruisce la
      competenza reale per sostenere la fama, o crolla spettacolarmente.
      Per NPC: il "grande eroe" assoldato è un codardo — i PG devono fare
      il lavoro al suo posto.
    usato_in: [Commedia degli Errori, La Picaresca, Da Povero a Ricco]
    vedi_anche: [Il Falso Eroe, Il Parassita, Il Trickster, Commedia degli Errori]

  - tipo: situazione
    nome: La Vittoria Accidentale (Il Successo Immeritato)
    nome_en: Accidental Victory / Bumbling Success / Failing Upward
    nomi_alt: [Accidental Victory, Failing Upward, Il Successo per Caso, Bumbling Hero, Dumb Luck]
    descrizione: >
      I PG vincono non per bravura ma per caso, per incompetenza del nemico,
      o per effetti collaterali del caos che loro stessi hanno creato. La
      vittoria è reale ma immeritata — e tutti lo sanno (o no, creando una
      reputazione falsa). Può essere comica (lo scemo ha fortuna) o ironica
      (il piano sbagliato funziona per motivi sbagliati).
    esempi:
      - "Brancaleone conquista il feudo — L'Armata Brancaleone (per eliminazione dei rivali)"
      - "Mr. Bean in qualsiasi situazione — il caos che lui crea risolve il problema"
      - "Forrest Gump — film (riesce in tutto per caso/purezza)"
      - "Inspector Clouseau — La Pantera Rosa (incompetente che risolve per caso)"
      - "I PG che lanciano tutti 20 — D&D (la meccanica che crea successo immeritato)"
    uso_dnd: >
      In campagne comiche: permettere che il caos dei PG produca vittorie
      non previste. Il piano è sbagliato ma funziona lo stesso perché il
      villain è ancora più incompetente, o perché il caos genera un effetto
      collaterale utile. Non pianificare come DM — lasciare che il fallimento
      dei PG produca risultati inaspettati. Complementare alla Regola del Cool.
    rischio: >
      Se ogni vittoria è accidentale, i PG non si sentono mai competenti.
      Alternare con vittorie meritate. Funziona in campagne picareesche,
      NON in campagne eroiche.
    usato_in: [La Picaresca, Commedia degli Errori]
    vedi_anche: [Commedia degli Errori, La Picaresca, Il Fail Forward, La Regola del Cool]

  - tipo: tecnica
    nome: La Colpa Fondativa (L'Errore che Crea l'Eroe)
    nome_en: Foundational Guilt / Origin Sin / The Mistake That Made the Hero
    nomi_alt: [Origin Sin, Foundational Guilt, L'Errore Originale, The Guilt Engine, Il Peccato d'Origine]
    descrizione: >
      Il PG diventa eroe non per vocazione o destino, ma per un suo errore
      o inazione che ha causato una tragedia. Non è Il Redento (quello era
      consapevolmente malvagio), non è La Casa Distrutta (quella è subita
      dall'esterno), non è Il Nemico Creato (quello produce un antagonista).
      È più intimo: "è colpa MIA che zio Ben è morto, DEVO rimediare".
      L'eroismo è espiazione permanente.
    esempi:
      - "Spider-Man — lascia fuggire il rapinatore → zio Ben muore"
      - "Batman — 'se non avessi insistito per il cinema, i miei genitori...' (variante)"
      - "Schindler's List — 'avrei potuto salvarne di più' (la colpa del sopravvissuto)"
      - "Doctor Strange — la guida irresponsabile causa l'incidente → cerca redenzione"
      - "Un PG il cui villaggio è stato distrutto perché lui era assente — D&D"
    uso_dnd: >
      Background del PG (concordato col giocatore): un evento nel passato dove
      la sua inazione/errore ha causato una perdita. Il PG è eroe per DOVERE
      verso la colpa, non per eroismo. L'arco: la colpa guida → diventa ossessione
      → il PG deve perdonare sé stesso per essere davvero libero. L'errore
      originale può tornare come La Scelta Retroattiva nel finale.
    puo_aver_bisogno_di: [Il Legame (affezione)]
    usato_in: [Da Povero a Ricco, La Vendetta, Sconfiggere il Mostro]
    vedi_anche: [Il Redento, La Casa Distrutta, Il Nemico Creato, Il Debito d'Onore, La Scelta Retroattiva]



  - tipo: tecnica
    nome: Il Comic Relief
    nome_en: Comic Relief
    nomi_alt: [Il Sollievo Comico, La Linea Comica, Comedic Relief, La Valvola di Sfogo, Il Respiro Comico]
    descrizione: >
      Un momento o un elemento di leggerezza inserito in una storia
      prevalentemente seria o drammatica, per dare respiro tra i picchi di
      tensione e rendere il dramma più forte per contrasto. Non tradisce il
      tono drammatico: lo rinforza. Il comico e il tragico si potenziano a
      vicenda. Può incarnarsi in un personaggio (l'NPC spiritoso), in una
      situazione (una scena buffa tra due scene cupe) o in una singola battuta
      che spezza un momento di tensione. Sotto la risata migliore c'è quasi
      sempre un fondo di sincerità o di malinconia.
    esempi:
      - "Sam e i due hobbit — Il Signore degli Anelli (leggerezza nel viaggio cupo)"
      - "Mercuzio — Romeo e Giulietta (comico finché muore, e la sua morte gira la tragedia)"
      - "I becchini — Amleto (la scena comica prima del finale tragico)"
      - "Groot e Rocket — Guardiani della Galassia (comico su fondo di perdita)"
      - "Gimli — Il Signore degli Anelli film (le battute che alleggeriscono la guerra)"
    uso_dnd: >
      Anche nell'avventura più drammatica, prevedere una linea comica: un NPC
      companion spiritoso, un oste buffo, un famiglio impertinente, una
      situazione grottesca in una taverna. Dosaggio: nel dramma il comico è
      sale, non pietanza (1-2 momenti per arco). Regola d'oro: ride il
      personaggio, non la minaccia. Il comic relief non deve mai disinnescare
      la posta drammatica né rendere ridicolo il villain (a meno che non sia
      un villain comico per scelta). Ottimo prima di un picco drammatico
      (vedi La Scena di Respiro nella grammatica) o subito dopo, per far
      rifiatare i giocatori.
    rischio: >
      Troppo comico e il dramma non ha peso (vedi anti-pattern La Parodia
      Totale). Comico nel momento sbagliato (durante la morte di un NPC amato,
      durante il climax emotivo) e si rovina la scena. Il comic relief che
      sminuisce la minaccia principale la rende innocua. Mai usarlo per
      sabotare la tensione che si è costruita con fatica.
    usato_in: [Tragedia, Sconfiggere il Mostro, La Cerca, Commedia]
    vedi_anche: [Il Trickster, Il Cattivo Simpatico, La Coppia Litigiosa, La Finta Minaccia, Il Mentore Sboccato]

  - tipo: situazione
    nome: La Scena Comica
    nome_en: The Comic Scene / Comic Interlude
    nomi_alt: [L'Intermezzo Comico, La Gag, La Scena di Sollievo, Comic Beat]
    descrizione: >
      Una singola scena giocata per la leggerezza dentro una storia seria: un
      matrimonio caotico, una rissa da taverna innocua, un negoziato che
      degenera nel grottesco, un NPC che fraintende tutto. Ha una funzione di
      ritmo (dare respiro) e di contrasto (rendere più cupo ciò che viene
      dopo). È la forma "situazione" del Comic Relief.
    esempi:
      - "Il matrimonio all'Orco che Rutta — LoScettroDiTyr (rissa dal menu, lo zio ubriaco)"
      - "La taverna di Brancaleone — le millanterie che finiscono in disastro"
      - "L'osteria di Bree — Il Signore degli Anelli (prima che il tono si incupisca)"
    uso_dnd: >
      Inserire una scena comica come respiro tra due archi drammatici, o come
      epilogo leggero dopo un climax pesante (il matrimonio dopo la battaglia).
      Può contenere mini-conflitti a bassa posta (una rissa dove nessuno muore,
      un dilemma sociale buffo). Funziona bene come chiusura di un modulo teso.
    rischio: >
      Se dura troppo diventa riempitivo. Se la posta cresce sul serio dentro
      la scena comica, il tono si confonde. Tenerla breve e a bassa posta.
    usato_in: [Tragedia, Commedia, Da Povero a Ricco]
    vedi_anche: [Il Comic Relief, La Scena di Respiro, La Coppia Litigiosa]
