# Analisi: L'Armata Brancaleone + Brancaleone alle Crociate (come campagna D&D comica a 2 archi)
# Data: 2026-08-29
# Esito: completa
# Note: Duologia di Mario Monicelli (1966, 1970). Analisi focalizzata sulla
#   struttura COMICA/PICARESCA come modello per campagne D&D non-eroiche.
#   PG: Brancaleone da Norcia (cavaliere incompetente, antieroe picaresco)
#   NPC: Abacuc, Pecoro, Teodora, il monaco Zenone, Teofilatto, la Morte, vari villain episodici
#   Tono: commedia medievale con momenti drammatici. Satira del genere cavalleresco.

opera:
  titolo: "L'Armata Brancaleone / Brancaleone alle Crociate"
  tipo: film (duologia)
  epoca: 1966-1970
  autore: Mario Monicelli
  genere_dnd_compatibile: true
  note: >
    Campagna comica a 2 archi con party di incompetenti. Perfettamente
    compatibile con D&D: quest episodiche, party di disadattati, viaggio con
    tappe, fallimenti comici che si trasformano in successi accidentali.
    Dimostra che D&D non deve essere eroico per funzionare — il tono picaresco
    (avventure di mascalzoni) è altrettanto valido e coinvolgente.
    Struttura: La Cerca declinata in chiave comica. Ogni tappa è un disastro
    che il party sopravvive per fortuna, incompetenza altrui, o astuzia da
    strada. Il genere cavalleresco viene sistematicamente sovvertito.

# ============================================================
# TESI CENTRALE: LA COMMEDIA COME STRUTTURA D&D
# ============================================================

tesi:
  - nome: "Il picaresco è D&D puro"
    argomento: >
      La struttura picaresca (viaggio episodico di un mascalzone) è la struttura
      naturale di una campagna D&D: un protagonista senza risorse attraversa
      situazioni pericolose usando astuzia, fortuna e una banda di disperati.
      Brancaleone è il PG di livello 1 che finge di essere livello 10.

  - nome: "L'incompetenza genera storia"
    argomento: >
      I fallimenti dei PG sono più interessanti dei successi. Brancaleone fallisce
      quasi tutto ciò che tenta — ma ogni fallimento genera la situazione
      successiva. In D&D: i tiri falliti non devono terminare la storia, devono
      complicarla in modo produttivo e divertente.

  - nome: "La satira del genere è un genere"
    argomento: >
      Monicelli sovverte ogni convenzione cavalleresca: il duello è ridicolo,
      la dama è più forte del cavaliere, la crociata è una truffa, il santo
      è un ciarlatano. In D&D: una campagna che prende in giro i tropi del
      fantasy (il Prescelto è un idiota, il MacGuffin non vale nulla, il BBEG
      è patetico) è un genere legittimo e molto divertente al tavolo.

  - nome: "Il Trickster come protagonista"
    argomento: >
      Brancaleone non è un eroe — è un sopravvissuto. Il suo archetipo dominante
      è Il Trickster + Il Parassita: vive di espedienti, mente costantemente,
      e la sua unica vera competenza è non morire. In D&D questo corrisponde al
      Rogue/Bard di livello basso che bluffa tutto.

# ============================================================
# STRUTTURA GLOBALE
# ============================================================

struttura:
  plot_principale: La Cerca
  plot_secondari:
    - Commedia degli Errori
    - Il Viaggio dell'Esilio
    - La Rivalità
  meta_plot: "La sopravvivenza di un impostore in un mondo che lo supera costantemente"
  tono: "Commedia picaresca con punte di dramma (la morte è reale, il mondo è crudele)"

  archi:
    # ============================================================
    # ARCO 1: L'Armata Brancaleone (1966)
    # Il party si forma, viaggio verso un feudo inesistente
    # Livello D&D equivalente: 1-3 (e ci resta)
    # ============================================================

    - nome: "Arco 1 — L'Armata Brancaleone: La Consegna Impossibile"
      film: "L'Armata Brancaleone (1966)"
      plot_arco: [La Cerca, Commedia degli Errori, Da Povero a Ricco]
      escalation: "Nessuna escalation reale — ogni tappa è un disastro equivalente"
      posta_in_gioco: "Ottenere il feudo di Aurocastro (macro) + non morire di fame (micro)"
      struttura_episodica: >
        A differenza delle campagne eroiche (escalation lineare), la struttura
        è PICARESCA: episodi di pari intensità, collegati dal viaggio. Ogni
        tappa è un microcosmo autocontenuto. Non c'è un BBEG — il nemico è
        il mondo stesso, l'incompetenza del party, e la sfortuna.

      situazioni:
        - Il Branco di Disadattati
        - La Cerca
        - Il Pesce fuor d'Acqua
        - Commedia degli Errori
        - L'Identità Scambiata
        - La Finta Minaccia (Anticlimax)
        - L'Arena (Il Combattimento Forzato)
        - La Scorta
        - La Truffa (The Con)
        - Il Naufragio (La Sopravvivenza)
        - Il Falso Rifugio
        - La Vittoria di Pirro

      personaggi:
        - nome: Brancaleone da Norcia
          archetipo: [Il Trickster, La Pedina del Destino (Il Prescelto Sbagliato), L'Eroe Riluttante]
          funzione: >
            PG principale. Cavaliere autoproclamato, incompetente ma tenace.
            La sua unica vera abilità è la sopravvivenza. Mente su tutto:
            titoli, imprese, capacità. Ma ha un codice d'onore tragicomico
            che emerge nei momenti critici.
          note: >
            Archetipo dominante: il Trickster come protagonista (non come NPC).
            Sovversione del cavaliere: non ha cavallo (un mulo), non ha armatura
            vera, non sa combattere bene. Ma ha carisma e faccia tosta.
            In D&D: Rogue/Bard multiclasse con Carisma alto e tutto il resto basso.

        - nome: Abacuc
          archetipo: [Il Companion Fedele, La Voce della Ragione]
          funzione: >
            Il braccio destro involontario. Segue Brancaleone per mancanza di
            alternative migliori. Commenta, dubita, protesta — ma resta.
            È la spalla comica che dice ciò che il pubblico pensa.
          note: "Sam Gamgee in versione cinica e medievale."

        - nome: Pecoro
          archetipo: L'Innocente (La Vittima da Proteggere)
          funzione: >
            Il membro più patetico del party. Funge da comic relief estremo e
            da bersaglio della crudeltà del mondo. La sua incompetenza supera
            persino quella di Brancaleone.
          note: "L'equivalente del personaggio con tutti gli attributi a 8."

        - nome: Teodora
          archetipo: [Il Companion Fedele, Il Guardiano della Soglia]
          funzione: >
            La donna del party — più competente e determinata di tutti gli uomini
            messi insieme. Sovversione del tropo della dama in pericolo: è lei
            che salva gli altri. Funziona come ancora di pragmatismo.
          note: >
            Sovversione piena del genere cavalleresco: la 'dama' è più
            combattente del 'cavaliere'. In D&D: il Fighter del party in una
            campagna dove il 'leader' è un Bard che bluffa.

        - nome: Teofilatto
          archetipo: [Il Parassita, L'Alleato Scomodo]
          funzione: >
            Il ragazzino nobile che il party deve scortare. Arrogante, inutile,
            e convinto di essere superiore. Il MacGuffin vivente che rende la
            quest legittima (è il titolare del feudo).
          note: "L'NPC scomodo da proteggere: genera conflitto interno al party."

        - nome: Monaco Zenone
          archetipo: [Il Fanatico, Il Corruttore]
          funzione: >
            Monaco fanatico e ipocrita. Rappresenta la Chiesa come istituzione
            corrotta. Predica la penitenza mentre si abbuffa. Aggiunge
            conflitto religioso (la superstizione come ostacolo).
          note: "Satira del Fanatico: il suo fanatismo è solo di facciata."

      tecniche:
        - nome: La Finta Minaccia (Anticlimax)
          applicazione: >
            Quasi ogni conflitto dell'armata si risolve in anticlimax: il nemico
            terrificante è un vecchio debole, il duello è una farsa, la battaglia
            è vinta per caso. L'aspettativa eroica viene sistematicamente tradita.
        - nome: Il Pacing
          applicazione: >
            Struttura episodica a tappe: ogni episodio ha un micro-arco
            (arrivo → problema → tentativo → disastro comico → fuga/risoluzione).
            Il ritmo è veloce perché nessuna situazione si prolunga.
        - nome: Il Narratore Inaffidabile
          applicazione: >
            Brancaleone stesso è il narratore inaffidabile della propria vita:
            racconta imprese inesistenti, titoli inventati, glorie false.
            Il party (e il pubblico) sa che mente, ma lo segue lo stesso.
        - nome: In Medias Res
          applicazione: "Il film inizia col party già in movimento — nessuna origin story elaborata."

      relazioni:
        - tipo: La Rivalità Amichevole
          tra: [Brancaleone, Abacuc]
          nota: "Si insultano costantemente ma dipendono l'uno dall'altro."
        - tipo: Il Protetto Riluttante
          tra: [Il party, Teofilatto]
          nota: "Devono scortare il ragazzino odioso perché è la loro unica legittimità."
        - tipo: Il Branco di Disadattati
          tra: [tutti]
          nota: >
            Il party è tenuto insieme dalla fame e dalla mancanza di alternative.
            Non c'è amicizia — c'è co-dipendenza. L'affetto nasce dopo, come
            effetto collaterale della sopravvivenza condivisa.

      anti_pattern_sovvertiti:
        - nome: "L'Escalation Piatta come FEATURE, non bug"
          nota: >
            Nella campagna picaresca, l'escalation piatta è intenzionale. Ogni
            tappa ha la stessa posta (sopravvivere, mangiare, non essere uccisi).
            La storia non scala perché il party non scala — resta disperato.
            Questo è un genere, non un errore di design.
        - nome: "Il Boss Anticlimactico come punchline"
          nota: >
            Ogni 'boss' è deliberatamente patetico — il duello è una farsa,
            il signore locale è debole. L'anticlimax è la battuta, non il difetto.

    # ============================================================
    # ARCO 2: Brancaleone alle Crociate (1970)
    # Il party parte per la crociata, trova solo disastri
    # Livello D&D equivalente: 3-5 (nominalmente. In pratica sempre 1)
    # ============================================================

    - nome: "Arco 2 — Brancaleone alle Crociate: La Falsa Redenzione"
      film: "Brancaleone alle Crociate (1970)"
      plot_arco: [La Cerca, Viaggio e Ritorno, Il Viaggio dell'Esilio]
      escalation: "Dalla forca alla Terra Santa — escalation di SCALA geografica, non di competenza"
      posta_in_gioco: "Raggiungere la Terra Santa per salvarsi l'anima (macro) + non morire PRIMA di arrivarci (micro)"
      struttura_episodica: >
        Come il primo film: struttura a tappe picaresche. La crociata è il
        pretesto (MacGuffin astratto) — il viaggio è il contenuto. Tono più
        scuro del primo: la morte è più presente, la satira più amara.

      situazioni:
        - La Cerca
        - Il Branco di Disadattati
        - Il Patto col Diavolo
        - Commedia degli Errori
        - La Corte Decadente
        - Il Pesce fuor d'Acqua
        - Lo Shock Culturale (La Missione Diplomatica)
        - La Fuga dalla Prigione
        - L'Identità Scambiata
        - La Scorta
        - Il Falso Rifugio
        - La Vittoria di Pirro
        - Il Sacrificio Volontario
        - La Trattativa con il Mostro

      personaggi:
        - nome: Brancaleone da Norcia
          archetipo: [Il Trickster, L'Eroe Riluttante, Il Redento (fallito)]
          funzione: >
            Stesso PG, stessa incompetenza, ma con un arco aggiuntivo: il
            tentativo di redenzione (andare in Terra Santa per salvarsi l'anima).
            La redenzione fallisce perché Brancaleone non riesce a cambiare
            davvero — ma ci prova, e questo gli dà dignità.
          note: >
            Arco sottile: dal puro parassita del primo film a qualcosa che
            somiglia vagamente a un eroe — senza mai diventarlo davvero.
            È il Redento che non si redime ma guadagna un briciolo di umanità.

        - nome: La Morte (personificata)
          archetipo: [La Nemesi, Il Dio Indifferente (versione comica)]
          funzione: >
            La Morte appare come personaggio fisico che insegue Brancaleone.
            È la nemesi definitiva: non può essere sconfitta, solo rimandata.
            Versione comica del Destino inesorabile.
          note: >
            Elemento meta-narrativo geniale: la Morte come NPC ricorrente che
            il PG tenta di evitare. In D&D: un timer narrativo personificato.
            Perfetto per campagne con tono dark comedy.

        - nome: Strega/Maga
          archetipo: [Il Corruttore, Il Patto col Diavolo]
          funzione: >
            Offre a Brancaleone una via d'uscita dalla morte — ma a un prezzo.
            Il patto demoniaco in chiave comica: Brancaleone accetta tutto
            perché non ha alternative, poi cerca di sfuggire ai termini.
          note: "Il Patto col Diavolo dove il contraente è troppo disperato per negoziare."

        - nome: Teodora (nel secondo film)
          archetipo: [Il Companion Fedele, La Voce della Ragione]
          funzione: "Ritorna come ancora emotiva. Più stanca, più cinica, sempre più competente di tutti."

      tecniche:
        - nome: Il Contatore
          applicazione: >
            La Morte che si avvicina = un countdown personificato. Ogni disastro
            la avvicina, ogni fuga la rimanda. Il contatore è VISIBILE (la Morte
            appare fisicamente) e il party lo sa.
        - nome: La Costruzione dell'Odio (invertita)
          applicazione: >
            Nessun villain da odiare — il nemico è la condizione umana stessa.
            La satira colpisce tutti: la Chiesa, la nobiltà, i saraceni, i
            crociati. Nessuno è peggio degli altri — tutti sono ugualmente
            corrotti o stupidi.
        - nome: Il Cambio di Genere
          applicazione: >
            Il secondo film è più scuro del primo: la morte è presente, il
            tono si sposta verso il dark comedy. Le risate non coprono più
            completamente la crudeltà del mondo medievale.
        - nome: La Morale Grigia
          applicazione: >
            La crociata stessa è moralmente grigia: Brancaleone ci va per
            egoismo (salvarsi l'anima), non per fede. I crociati sono predoni.
            I saraceni non sono peggio dei cristiani. Nessun 'lato buono'.

      relazioni:
        - tipo: La Nemesi
          tra: [Brancaleone, La Morte]
          nota: >
            La relazione centrale del secondo film: Brancaleone scappa dalla
            Morte per l'intero arco. La Morte è paziente, ironica, inevitabile.
            Non è un nemico da sconfiggere — è la realtà da rimandare.
        - tipo: Il Branco di Disadattati
          tra: [il party ricostituito]
          nota: "Nuovi membri, stessa dinamica: co-dipendenza disperata."

